 increases detrusor contractility and facilitates voiding. Bethanechol is contraindicated in overflow from urethral obstruction (BPH) because increased detrusor force cannot overcome the blockage and causes painful spasms, and it is also contraindicated when the detrusor is already overactive (hyperreflexia, UTI).","src":"Babbini & Thomas — Cholinergic Drugs Q21"},{"q":"A 47-year-old man was admitted to the emergency department because of extreme muscle weakness, ptosis, diplopia, and difficulty in swallowing, speaking, and breathing. The man, recently diagnosed with severe myasthenia gravis, had been receiving neostigmine for the past 3 months. Which of the following responses to 2 mg of intravenous edrophonium would indicate a cholinergic crisis?","o":["No fasciculations, increased muscle strength","Fasciculations, decreased muscle strength","No fasciculations, no change in muscle strength","No fasciculations, decreased muscle strength","Fasciculations, increased muscle strength"],"a":1,"ex":"Myasthenic patients on cholinesterase inhibitors may weaken from cholinergic crisis (depolarizing Nm block from excess acetylcholine) or from myasthenic crisis (disease flare). Edrophonium worsens a cholinergic crisis (decreased strength) and is accompanied by fasciculations (brief Nm activation before paralysis). In myasthenic crisis, strength increases and fasciculations are absent.","src":"Babbini & Thomas — Cholinergic Drugs Q22"},{"q":"A 60-year-old male patient presented for routine ophthalmic examination. Tonometry measured an intraocular pressure of 28 mm Hg in both eyes (normal 10–20 mm Hg). The patient had been suffering from complete atrioventricular (AV) block for 2 years. The ophthalmologist prescribed appropriate eye drops. Which of the following drugs was most likely included in the treatment?","o":["Timolol","Prazosin","Isoproterenol","Pilocarpine","Albuterol","Homatropine"],"a":3,"ex":"The patient has open-angle glaucoma. β-blockers are first-line but are contraindicated here because even topical timolol can be absorbed and, by blocking ventricular β receptors, can slow the already-low escape rhythm of complete AV block. Pilocarpine is an alternative when β-blockers are contraindicated; in complete AV block, AV conduction is already absent and ventricular parasympathetic innervation is negligible, so pilocarpine is not dangerous. Prazosin, isoproterenol, albuterol, and homatropine are not used to treat glaucoma (homatropine can raise IOP).","src":"Babbini & Thomas — Cholinergic Drugs Q23"},{"q":"A 3-year-old boy was rushed to the emergency department with mental confusion, restlessness, incoherence, and hallucinatory behavior. His mother stated that the child had eaten several black berries of a wild plant while playing with friends in the woods. Physical examination revealed mydriasis; dry, hot, and scarlet skin; and a distended abdomen with no bowel sounds. Vital signs were temperature 104.5°F (40.3°C), heart rate 145 bpm, blood pressure 105/60 mm Hg. Which of the following drugs would antagonize most of the symptoms exhibited by the patient?","o":["Neostigmine","Albuterol","Physostigmine","Epinephrine","Prazosin","Phenylephrine"],"a":2,"ex":"Black berries of deadly nightshade (Atropa belladonna) contain antimuscarinic alkaloids (atropine, scopolamine). Physostigmine, a tertiary anticholinesterase, raises acetylcholine in both CNS and periphery and is used when hyperthermia or severe tachycardia is dangerous. Neostigmine is quaternary and cannot reverse central effects. Adrenergic drugs are useless or harmful.","src":"Babbini & Thomas — Cholinergic Drugs Q24"},{"q":"A high dose of nicotine was administered intravenously to dogs in a laboratory experiment. An initial increase in blood pressure was soon followed by a profound decrease of blood pressure. Which of the following molecular mechanisms most likely mediated the decrease in blood pressure?","o":["Long-lasting activation of nicotinic neuronal receptors","Long-lasting blockade of muscarinic M2 receptors","Long-lasting blockade of muscarinic M1 receptors","Prevention of acetylcholine release from presynaptic terminals","Prevention of catecholamine release from chromaffin cells"],"a":0,"ex":"Prolonged nicotinic-receptor activation persistently depolarizes the postjunctional membrane so it cannot return to rest; the depolarized membrane is inexcitable (depolarization blockade). Impaired transmission in sympathetic ganglia lowers sympathetic tone and blood pressure. Ganglionic M1/M2 potentials are not required for the action potential; nicotine does not prevent acetylcholine or catecholamine release.","src":"Babbini & Thomas — Cholinergic Drugs Q25"},{"q":"A 55-year-old woman presented to a clinic because of a gradual onset of a scratchy sensation on both eyes and extreme dryness of the mouth and lips. Lab tests showed elevated levels of antibodies against gamma globulin. A diagnosis of Sjögren syndrome was made, and a drug was prescribed to relieve the patient’s xerostomia. Which of the following drugs was most likely administered?","o":["Acetylcholine","Phenylephrine","Prazosin","Donepezil","Pilocarpine"],"a":4,"ex":"In Sjögren syndrome lymphocytic infiltration atrophies salivary glands, causing extreme xerostomia. If residual gland remains, pilocarpine stimulates salivary production. Acetylcholine is not used systemically because of its ultrashort action. Phenylephrine, prazosin, and donepezil have little effect on salivation.","src":"Babbini & Thomas — Cholinergic Drugs Q26"},{"q":"A 59-year-old man underwent surgery to remove a colon carcinoma. Three days after surgery, he developed fever (103°F, 39.4°C), abdominal distention, and vomiting. Palpation showed tenderness over the entire abdomen, and auscultation revealed no bowel sounds. Which of the following therapeutic measures would be absolutely contraindicated in this case?","o":["Parenteral administration of an antipyretic","Nasogastric intubation and suction","Parenteral antibiotic therapy","Subcutaneous administration of neostigmine","Intravenous administration of fluid and electrolytes"],"a":3,"ex":"High fever plus silent, tender, distended abdomen indicates adynamic ileus from intraperitoneal infection, not simple postoperative neurogenic ileus. When gut paralysis is due to obstruction or inflammation, cholinergic drugs are absolutely contraindicated: increasing motility can worsen inflammation and cause perforation. Antipyretics, NG suction, antibiotics, and IV fluids are indicated.","src":"Babbini & Thomas — Cholinergic Drugs Q27"},{"q":"A 6-year-old boy, on vacation with his parents in Mexico, was brought unconscious to the emergency department. His parents reported that the boy had eaten an apple bought from a local vendor 2 hours earlier. Physical examination showed that the boy was salivating profusely and was incontinent with regard to both urine and feces. He had pinpoint pupils, moist skin, and shallow respiration. A diagnosis was made, and two appropriate drugs were administered intravenously. Which of the following pairs of drugs were most likely given?","o":["Physostigmine and atropine","Physostigmine and pralidoxime","Physostigmine and propranolol","Pralidoxime and propranolol","Atropine and propranolol","Atropine and pralidoxime"],"a":5,"ex":"The cholinergic toxidrome after eating unwashed produce in a region where organophosphate pesticides are still used is organophosphate poisoning. First-line treatment is atropine (to block muscarinic, including CNS, effects) plus a cholinesterase reactivator such as pralidoxime. Pralidoxime does not appreciably cross the blood–brain barrier, so atropine is essential for central muscarinic effects.","src":"Babbini & Thomas — Cholinergic Drugs Q28"},{"q":"A 13-year-old boy started smoking his first cigarette. Which of the following effects was most likely elicited by nicotine soon after smoking?","o":["Bronchodilation","Dilation of the skin and splanchnic vessels","Increased epinephrine secretion from the adrenal medulla","Inhibition of gastrointestinal secretions","Relaxation of the detrusor muscle"],"a":2,"ex":"By activating nicotinic neuronal receptors, nicotine increases epinephrine release from adrenal chromaffin cells — the only peripheral organ that synthesizes epinephrine. Nicotine causes the opposite of the other listed effects (bronchoconstriction, splanchnic/skin vasoconstriction, increased GI secretions, detrusor contraction).","src":"Babbini & Thomas — Cholinergic Drugs Q29"},{"q":"A 12-year-old girl started smoking her first cigarette. A few minutes later, she had two episodes of nausea and vomiting. Activation of receptors located in which of the following sites most likely mediated this adverse effect of nicotine?","o":["Sympathetic ganglia","Chemoreceptor trigger zone","Locus ceruleus","Adrenal medulla","Vestibular nuclei"],"a":1,"ex":"Nicotine directly stimulates the chemoreceptor trigger zone, the main mechanism of nicotine-induced nausea and vomiting; afferent input from tongue and lung sensory receptors also contributes. Actions at sympathetic ganglia, locus ceruleus, or adrenal medulla do not mediate emesis. Nicotine does not significantly affect vestibular function.","src":"Babbini & Thomas — Cholinergic Drugs Q30"}],

b_antichol: [{"q":"This drug is currently used in bronchospastic disorders.","o":["Atropine","Benztropine","Darifenacin","Glycopyrrolate","Homatropine","Ipratropium","Mecamylamine","Scopolamine"],"a":5,"ex":"Ipratropium is a quaternary antimuscarinic given by inhalation for asthma and COPD; unlike most antimuscarinics it has negligible effects on bronchial secretions and mucociliary clearance.","src":"Babbini & Thomas — Anticholinergic Drugs Q1"},{"q":"This drug almost exclusively blocks muscarinic M3 receptors.","o":["Atropine","Benztropine","Darifenacin","Glycopyrrolate","Homatropine","Ipratropium","Mecamylamine","Scopolamine"],"a":2,"ex":"Darifenacin is a selective M3 antagonist used for urge incontinence/overactive bladder.","src":"Babbini & Thomas — Anticholinergic Drugs Q2"},{"q":"This drug is mainly used in parkinsonism.","o":["Atropine","Benztropine","Darifenacin","Glycopyrrolate","Homatropine","Ipratropium","Mecamylamine","Scopolamine"],"a":1,"ex":"Benztropine is a centrally acting antimuscarinic used for Parkinson disease and drug-induced extrapyramidal symptoms.","src":"Babbini & Thomas — Anticholinergic Drugs Q3"},{"q":"This drug can block only nicotinic neuronal receptors.","o":["Atropine","Benztropine","Darifenacin","Glycopyrrolate","Homatropine","Ipratropium","Mecamylamine","Scopolamine"],"a":6,"ex":"Mecamylamine is a ganglionic blocker that selectively antagonizes nicotinic neuronal (Nn) receptors, with no useful muscarinic blockade.","src":"Babbini & Thomas — Anticholinergic Drugs Q4"},{"q":"This drug is used almost exclusively to diagnose or treat eye disorders.","o":["Atropine","Benztropine","Darifenacin","Glycopyrrolate","Homatropine","Ipratropium","Mecamylamine","Scopolamine"],"a":4,"ex":"Homatropine is a topical antimuscarinic used almost exclusively for ophthalmologic diagnosis and treatment (mydriasis and cycloplegia).","src":"Babbini & Thomas — Anticholinergic Drugs Q5"},{"q":"A 25-year-old man experienced severe motion sickness whenever he traveled by air or sea. He felt much better after using a transdermal patch to apply a drug before traveling. Blockade of which of the following receptors most likely mediated the therapeutic effect of the drug in the patient’s disorder?","o":["H1 histaminergic","β2 adrenergic","D2 dopaminergic","5-HT3 serotoninergic","M1 cholinergic","Nn cholinergic"],"a":4,"ex":"The only anti–motion-sickness drug available as a transdermal patch is scopolamine. Antimuscarinics used for motion sickness and Ménière disease act mainly by blocking M1 receptors in vestibular nuclei, the chemoreceptor trigger zone, and the nucleus of the solitary tract, reducing drive to the vomiting center.","src":"Babbini & Thomas — Anticholinergic Drugs Q6"},{"q":"A 33-year-old woman suffering from irritable bowel syndrome was prescribed glycopyrrolate. Blockade of which of the following pairs of receptors most likely mediated the therapeutic effect of the drug in the patient’s disease?","o":["β2 and Nm","M2 and Nn","M3 and Nn","α1 and M2","M1 and M3"],"a":2,"ex":"Glycopyrrolate is a quaternary ammonium antimuscarinic used in IBS during diarrheal periods to relax intestinal smooth muscle. These agents mainly block muscarinic receptors but also have significant Nn (ganglionic) blocking activity. Both M3 blockade on gut muscle and Nn blockade in myenteric/submucosal plexuses contribute to smooth-muscle relaxation.","src":"Babbini & Thomas — Anticholinergic Drugs Q7"},{"q":"A 62-year-old woman who was on vacation in Guatemala presented to the local hospital with nausea, vomiting, and profuse, watery diarrhea. The symptoms had appeared after eating raw oysters. She was prescribed atropine, which relieved her diarrhea. Which of the following molecular actions most likely mediated the therapeutic effect of atropine in the patient’s disorder?","o":["Inhibition of histamine secretion by gastric cells","Decreased cytosolic Ca2+ in smooth muscle cells","Opening of Na+ channels in smooth muscle cells","Increased firing discharge of the vagus nerve","Activation of presynaptic cholinergic autoreceptors"],"a":1,"ex":"Traveler’s diarrhea is driven in part by increased parasympathetic activity. Acetylcholine at M3 receptors raises IP3/DAG and cytosolic Ca2+ for muscle contraction; atropine blocks M3 receptors, preventing that Ca2+ rise and relieving diarrhea. Atropine does not inhibit gastric histamine release, open Na+ channels, or increase vagal firing. Blocking presynaptic M2 autoreceptors would increase acetylcholine release and worsen diarrhea.","src":"Babbini & Thomas — Anticholinergic Drugs Q8"},{"q":"A 42-year-old man was hospitalized with the admitting diagnosis of myocardial infarction. Vital signs were blood pressure 100/60 mm Hg, heart rate 40 bpm, respirations 12/min. The bradycardia disappeared after an intramuscular injection of atropine. The increased heart rate was most likely due to counteraction by atropine of which of the following acetylcholine-induced actions?","o":["Release of nitric oxide","Opening of K+ channels in sinoatrial node","Decrease in cardiac contractility","Opening of Na+ channels in ganglionic neurons","Activation of cardiac presynaptic autoreceptors"],"a":1,"ex":"M2 activation opens K+ channels in the SA node, increasing outward K+ current and hyperpolarizing the membrane so firing slows. Antimuscarinics block this, raising SA-node firing and heart rate. Counteracting NO-mediated vasodilation would, if anything, slow the heart (less reflex tachycardia). Contractility changes do not explain rate. Nn-mediated ganglionic Na+ currents are not blocked by atropine. Blocking presynaptic autoreceptors would increase acetylcholine release and slow the heart.","src":"Babbini & Thomas — Anticholinergic Drugs Q9"},{"q":"A 5-year-old girl who was on vacation in Venezuela with her parents was admitted to the local hospital with fever (103.7°F, 39.8°C), mental confusion, restlessness, and hallucinatory behavior. History revealed that the girl had eaten some honey bought from a local vendor. Physical examination revealed mydriasis; dry, hot, and red skin; and a distended abdomen. A diagnosis of atropine poisoning was made, and an appropriate therapy was started. Which of the following molecular actions most likely contributed to the atropine-induced hyperthermia in this patient?","o":["Skin vasoconstriction","Blockade of prostaglandin synthesis in the hypothalamus","Uncoupling of oxidative phosphorylation in skeletal muscle","Blockade of muscarinic receptors in the hypothalamus","Blockade of muscarinic receptors of sweat glands"],"a":4,"ex":"Atropine poisoning can follow honey made from nightshade pollen. Blocking M3 receptors on sweat glands reduces sweating enough to raise body temperature, especially in children. Toxic antimuscarinic doses cause skin vasodilation, not constriction. Blocking hypothalamic prostaglandin synthesis is antipyretic. Uncoupling of oxidative phosphorylation is not an atropine action (it is seen with dinitrophenol/salicylates). Hypothalamic thermoregulatory receptors remain uncertain.","src":"Babbini & Thomas — Anticholinergic Drugs Q10"},{"q":"A 54-year-old man, recently diagnosed with chronic obstructive pulmonary disease, started a therapy with ipratropium bromide using a metered-dose inhaler. Which of the following statements best explains why drugs from the ipratropium class are the only antimuscarinic drugs used to treat bronchospastic disorders?","o":["They are more potent than other antimuscarinic drugs.","They have an oral bioavailability higher than that of other antimuscarinic drugs.","They have excellent inhalatory bioavailability.","They have negligible effects on bronchial secretions and mucociliary clearance.","They have negligible effects on the central nervous system."],"a":3,"ex":"Most antimuscarinics thicken bronchial secretions and impair mucociliary clearance, obstructing airflow, so they are contraindicated in respiratory disease. Ipratropium and tiotropium, for unknown reasons, spare secretions and mucociliary clearance, so their bronchodilating anticholinergic effect can be used safely. Potency is not the reason for the choice. These quaternary compounds have very low oral (and systemic inhalational) bioavailability; negligible CNS effects are true but not the reason they are preferred in bronchospasm.","src":"Babbini & Thomas — Anticholinergic Drugs Q11"},{"q":"A 25-year-old man went to his ophthalmologist’s office for a routine visit. He received one drop of homatropine in the conjunctival sac to prepare the eye for examination. Which of the following sets of effects did the drug most likely cause in the patient’s eye, a few minutes after the administration? (+ = increased; − = decreased; 0 = negligible effect)","o":["↑ pupillary diameter; ↓ lens curvature; ↓ intraocular pressure","↑ pupillary diameter; 0 lens curvature; 0 intraocular pressure","0 pupillary diameter; ↓ lens curvature; 0 intraocular pressure","↓ pupillary diameter; 0 lens curvature; ↓ intraocular pressure","↑ pupillary diameter; ↓ lens curvature; ↑ intraocular pressure"],"a":4,"ex":"Homatropine blocks M3 receptors on the iris sphincter (mydriasis, facilitating fundus inspection) and on the ciliary muscle. Ciliary relaxation stretches zonular fibers, flattening the lens (↓ curvature, cycloplegia) and closing trabecular spaces, which decreases aqueous outflow and raises intraocular pressure.","src":"Babbini & Thomas — Anticholinergic Drugs Q12","table":{"headers":["","Pupillary diameter","Lens curvature","Intraocular pressure"],"rows":[["A","+","−","−"],["B","+","0","0"],["C","0","−","0"],["D","−","0","−"],["E","+","−","+"]]}},{"q":"A 77-year-old woman was found to have elevated intraocular pressure during a routine eye examination. History indicated that she had recently been taking several antimuscarinic medications to treat her bladder hyperreflexia. The ophthalmologist told her that he believed the increased intraocular pressure was an adverse effect of those medications. Which of the following ocular actions most likely mediated this adverse effect?","o":["Relaxation of the ciliary muscle","Increased aqueous humor production","Dilation of ciliary body vessels","Relaxation of the radial muscle of the iris","Decreased episcleral aqueous humor outflow","Relaxation of the tarsal muscle"],"a":0,"ex":"Antimuscarinics relax the ciliary muscle, compressing trabecular meshwork and Schlemm’s canal, decreasing aqueous outflow and raising IOP. Aqueous production, ciliary-body vessel tone, and the iris radial muscle are primarily sympathetic. Episcleral outflow is mainly prostaglandin-controlled. The tarsal (palpebral) muscle has nothing to do with IOP.","src":"Babbini & Thomas — Anticholinergic Drugs Q13"},{"q":"An 85-year-old male resident of a nursing facility complained of frequent urinary urges that often resulted in urine leakage. Darifenacin was prescribed to manage the patient’s incontinence. Which of the following actions most likely mediate the therapeutic effect of the drug?","o":["Decreased bladder internal sphincter tone","Relaxation of the prostate capsule","Contraction of the detrusor muscle","Decreased diuresis","Increased compliance of the bladder"],"a":4,"ex":"Urge incontinence is the most common incontinence of the elderly. Darifenacin, a selective M3 antagonist, relaxes bladder smooth muscle, increasing compliance (ease of distention) so the bladder can hold more urine before urgency. Decreased internal-sphincter tone and prostate-capsule relaxation are α1-blockade effects. Detrusor contraction is M3 activation. Diuresis is not M3-controlled.","src":"Babbini & Thomas — Anticholinergic Drugs Q14"},{"q":"A 77-year-old man suffering from chronic obstructive pulmonary disease had been taking ipratropium by inhalation. Shortly after inadvertently spraying the medication on his face, which of the following effects did the patient most likely experience?","o":["Urge incontinence","Drowsiness","Salivation","Atrioventricular (AV) block","Difficulty in near vision","Hallucinations"],"a":4,"ex":"Ipratropium is a quaternary antimuscarinic. Facial spray can block M3 receptors on the ciliary muscle, causing cycloplegia and loss of accommodation for near vision. Systemic effects are unlikely; urge incontinence would require detrusor contraction (antimuscarinics relax it). Quaternary agents do not cross the blood–brain barrier (no drowsiness/hallucinations). They cause dry mouth, not salivation, and would increase (not block) AV conduction.","src":"Babbini & Thomas — Anticholinergic Drugs Q15"},{"q":"An 8-year-old boy was in an ophthalmologist’s office for the first time and received ophthalmic drops of a drug to prepare his eyes for measurement of refractive errors. A half hour later, he showed mental confusion, restlessness, incoherence, and hallucinatory behavior. His pulse rate was 120 bpm. Which of the following drugs most likely caused the patient’s adverse effects?","o":["Phenylephrine","Epinephrine","Atropine","Timolol","Pilocarpine"],"a":2,"ex":"Antimuscarinics are used to prepare the eye for refraction. Topical atropine can drain via the nasolacrimal duct and be absorbed from nasal mucosa. Children are especially sensitive and may show classic central and cardiovascular atropine overdose (confusion, hallucinations, tachycardia). Phenylephrine and epinephrine might raise heart rate transiently but do not enter the brain. Timolol and pilocarpine would slow, not raise, heart rate.","src":"Babbini & Thomas — Anticholinergic Drugs Q16"},{"q":"A 73-year-old man with atrial fibrillation presented to the clinic because of dizziness, palpitations, dyspnea, and an urgent need to urinate. The man was on vacation in Mexico, and the symptoms started 1 hour after taking an over-the-counter preparation bought at a local pharmacy to treat diarrhea. Which of the following drugs most likely caused the patient’s symptoms?","o":["Phenylephrine","Epinephrine","Atropine","Propranolol","Albuterol"],"a":2,"ex":"Atropine is still a component of many OTC antidiarrheals outside the United States. Blocking cardiac M2 receptors increases AV conduction; in atrial fibrillation more atrial impulses reach the ventricle (tachycardia, palpitations, dyspnea), which also releases ANP and creates urinary urgency. Atropine simultaneously relaxes the detrusor, so the urge to void is accompanied by difficulty doing so. None of the other listed drugs is used for diarrhea.","src":"Babbini & Thomas — Anticholinergic Drugs Q17"},{"q":"A 23-year-old man was admitted to the emergency department with palpitations, restlessness, and hallucinatory behavior. He admitted that he was a heroin addict and that 1 hour earlier he had self-injected his usual dose of “smack,” bought from a new vendor. Physical examination showed a distressed man with blood pressure 160/80 mm Hg, pulse 135, dilated pupils, hot and dry skin, and decreased bowel sounds. Which of the following drugs most likely caused the patient’s signs and symptoms?","o":["Nicotine","Bethanechol","Scopolamine","Pralidoxime","Neostigmine"],"a":2,"ex":"The antimuscarinic toxidrome (tachycardia, mild hypertension, mydriasis, hot dry skin, quiet bowel) after heroin from a new dealer is scopolamine adulteration of heroin, a well-described epidemic pattern. Nicotine, bethanechol, pralidoxime, and neostigmine do not produce this picture.","src":"Babbini & Thomas — Anticholinergic Drugs Q18"},{"q":"A 67-year-old man recently diagnosed with benign prostatic hyperplasia was scheduled for surgery. Which of the following drug classes would be absolutely contraindicated in this patient?","o":["Alpha-1 blockers","Antimuscarinics","Beta blockers","Alpha-2 agonists","Beta-1 agonists"],"a":1,"ex":"Antimuscarinics relax the detrusor, making voiding more difficult. In BPH, where the urethra is already narrowed, they can precipitate acute urinary retention and are contraindicated. α1 blockers are indicated (they relax the internal sphincter). β-blockers have little effect on nonvascular smooth muscle; α2 agonists may decrease sphincter contractility; β1 agonists do not affect smooth-muscle contractility.","src":"Babbini & Thomas — Anticholinergic Drugs Q19"},{"q":"A 55-year-old woman was admitted to the hospital with shallow breathing, wheezing, profuse rhinorrhea, lacrimation, ocular pain, and diminished vision. She reported that the symptoms started when she was in her garden spraying flowers with an insecticide containing carbaryl, a reversible cholinesterase inhibitor. Which of the following drugs would be appropriate to treat this patient’s disorder?","o":["Pralidoxime","Terbutaline","Epinephrine","Glycopyrrolate","Atropine"],"a":4,"ex":"Atropine is always used for cholinesterase-inhibitor poisoning because it counters both central and peripheral muscarinic effects of acetylcholine excess. Pralidoxime is for organophosphates and is contraindicated in carbamate (reversible) poisoning: it cannot regenerate carbamylated enzyme and itself has weak anticholinesterase activity. Terbutaline and epinephrine are useless. Glycopyrrolate is quaternary and would not reverse central effects.","src":"Babbini & Thomas — Anticholinergic Drugs Q20"},{"q":"A 64-year-old man complained to his physician of a recent onset of diarrhea. The physician believed the diarrhea was related to aspirin and misoprostol that the patient had started taking 1 week earlier for the treatment of joint pain due to osteoarthritis. Which of the following drugs would be most appropriate to treat the patient’s diarrhea?","o":["Phenylephrine","Ipratropium","Propranolol","Glycopyrrolate","Prazosin","Donepezil"],"a":3,"ex":"Antimuscarinics treat various diarrheas, including drug-induced. Quaternary agents such as glycopyrrolate are sometimes preferred because they also block Nn receptors in enteric plexuses (greater effect on GI activity) and, given orally, stay concentrated in the gut wall (low bioavailability). Ipratropium is inhaled only. Sympathetic agonists/antagonists have little GI effect. Donepezil, a cholinesterase inhibitor, would worsen diarrhea.","src":"Babbini & Thomas — Anticholinergic Drugs Q21"},{"q":"A 63-year-old man underwent surgery to remove a laryngeal carcinoma. Before surgery, the anesthesiologist administered a drug intramuscularly to decrease bronchial secretions and to prevent bradycardia due to manipulation of the vagus nerve. Which of the following drugs would be most appropriate in this situation?","o":["Ipratropium","Dopamine","Atropine","Isoproterenol","Epinephrine"],"a":2,"ex":"Atropine is used to dry secretions and to prevent vagal reflexes when surgery is near the vagus, as in laryngeal operations. Ipratropium is an antimuscarinic but is used only by inhalation for bronchospasm. Dopamine, isoproterenol, and epinephrine can raise heart rate, but atropine is far more effective when bradycardia is due to parasympathetic activation.","src":"Babbini & Thomas — Anticholinergic Drugs Q22"},{"q":"A 44-year-old man collapsed at work and was found to be unresponsive. When the paramedics arrived, he had ventricular fibrillation and was cardioverted successfully. He was admitted to the coronary unit, but shortly thereafter he developed asystole. Cardiopulmonary resuscitation was started, and escalating doses of epinephrine were given without success. Which of the following drugs would be most appropriately administered at this point?","o":["Neostigmine","Norepinephrine","Dopamine","Atropine","Ipratropium"],"a":3,"ex":"Asystole is complete electrical silence and carries a grave prognosis. Epinephrine is the initial agent to try to generate a rhythm. Enhanced parasympathetic tone (including from chest compression) may suppress pacemakers, so atropine is tried when epinephrine fails. Neostigmine would increase cholinergic activity and is contraindicated. Switching to other sympathomimetics after epinephrine has failed is irrational. Ipratropium is for inhaled use in bronchospasm only.","src":"Babbini & Thomas — Anticholinergic Drugs Q23"},{"q":"In a laboratory experiment, a mecamylamine pretreatment was given intramuscularly to several dogs. One hour later, each dog received an autonomic drug, and the effect of that drug was recorded. Which of the following expected drug-induced effects was most likely best counteracted by mecamylamine pretreatment?","o":["Neostigmine-induced increase in intestinal peristalsis","Nicotine-induced contraction of skeletal muscle","Norepinephrine-induced bradycardia","Epinephrine-induced tachycardia","Propranolol-induced hypotension"],"a":2,"ex":"Norepinephrine raises mean pressure, stimulating baroreceptors; the resulting vagal discharge overcomes NE’s direct β1 tachycardia, so heart rate falls. Ganglionic blockers such as mecamylamine interrupt that reflex and abolish the bradycardia. Neostigmine still activates gut M3 receptors, so peristalsis is only partly reduced. Nicotine contracts skeletal muscle via Nm receptors, which ganglionic blockers barely affect. Epinephrine tachycardia is direct β1/β2. Ganglionic blockers themselves cause hypotension, so they would enhance, not prevent, propranolol-induced hypotension.","src":"Babbini & Thomas — Anticholinergic Drugs Q24"},{"q":"A 43-year-old man came to the hospital for a radiologic examination of the colon. Before starting the exam, he received an intramuscular injection of scopolamine to relax the intestine. Which of the following adverse effects did the patient most likely experience a few minutes after the administration?","o":["Salivation","Abdominal pain","Palpitations","Painful erection","Urge urinary incontinence"],"a":2,"ex":"By blocking cardiac M2 receptors, antimuscarinics withdraw vagal control of the SA and AV nodes, raising heart rate and producing palpitations. Muscarinic blockade causes the opposite of salivation, abdominal cramping, erection, and urge incontinence.","src":"Babbini & Thomas — Anticholinergic Drugs Q25"},{"q":"Atropine was given intramuscularly to several dogs during a laboratory experiment. One hour later each dog received an intramuscular injection of an autonomic drug, and the effects of that drug were recorded. Which of the following expected drug-induced effects was most likely best antagonized by atropine pretreatment?","o":["Physostigmine-induced sweating","Epinephrine-induced hypertension","Nicotine-induced skin vasoconstriction","Prazosin-induced reflex tachycardia","Glycopyrrolate-induced bronchodilation"],"a":0,"ex":"Physostigmine raises acetylcholine at neuroeffector junctions; M3 activation in sweat glands causes sweating, which atropine blocks. Epinephrine hypertension is α1/β1. Nicotine’s cutaneous vasoconstriction is ganglionic Nn. Atropine itself causes tachycardia and would add to, not oppose, prazosin’s reflex tachycardia, and it would add to glycopyrrolate’s M3-blockade bronchodilation.","src":"Babbini & Thomas — Anticholinergic Drugs Q26"},{"q":"A 23-year-old man complained to his physician of photophobia and difficulty in reading the newspaper. A few days earlier, the man had started using a nasal spray of ipratropium to manage profuse rhinorrhea associated with a cold. Which of the following molecular actions most likely mediated the adverse effects of the drug?","o":["Blockade of M3 muscarinic receptors","Activation of M3 muscarinic receptors","Blockade of β2 adrenoceptors","Activation of β2 adrenoceptors","Blockade of α1 adrenoceptors","Activation of α1 adrenoceptors"],"a":0,"ex":"Ipratropium nasal spray, used for rhinorrhea, can produce ocular antimuscarinic effects. M3 blockade on the iris sphincter causes mydriasis (photophobia); M3 blockade on the ciliary muscle causes cycloplegia (impaired near vision). Ipratropium blocks, rather than activates, M3 receptors and has no effect on adrenoceptors.","src":"Babbini & Thomas — Anticholinergic Drugs Q27"},{"q":"A 55-year-old man was admitted to the coronary unit following a myocardial infarction. Four hours after admission, the electrocardiogram indicated bradycardia that disappeared after an intramuscular injection of atropine. Which of the following actions most likely mediated the therapeutic effect of atropine in the patient’s disorder?","o":["Dilation of capacitance vessels","Increased heart contractility","Decreased blood pressure","Increased atrioventricular (AV) conduction","Constriction of resistance vessels","Increased heart refractoriness"],"a":3,"ex":"Post-MI bradycardia is often due to AV block from increased parasympathetic tone and usually responds to atropine, which increases AV conduction. Atropine is given when the rate is too low for adequate cardiac output. The other listed vascular and inotropic actions do not explain resolution of the block.","src":"Babbini & Thomas — Anticholinergic Drugs Q28"},{"q":"A 25-year-old woman complained to her physician of excessive axillary sweating and a sweaty forehead, primarily when she was anxious or excited. The woman stated that the symptoms were very disturbing and asked for a treatment. The physician prescribed glycopyrrolate cream, to apply to the affected areas. Blockade of which of the following receptors most likely mediated the therapeutic effect of the drug in the patient’s disorder?","o":["β2 adrenergic","Nn cholinergic","D1 dopaminergic","α2 adrenergic","M3 muscarinic"],"a":4,"ex":"Topical glycopyrrolate, a quaternary antimuscarinic, blocks M3 receptors on sweat glands and thereby reduces hyperhidrosis (relief is often incomplete because apocrine glands, which may be adrenergic, are also involved). Given locally the drug reaches dermal sweat glands but not paravertebral sympathetic ganglia, so Nn blockade does not explain the topical effect. β2, D1, and α2 receptors do not mediate sweating.","src":"Babbini & Thomas — Anticholinergic Drugs Q29"},{"q":"In a clinical experimental setting, a 33-year-old healthy man received an intramuscular injection of a ganglionic blocker with a fast onset of action. A few minutes after the injection, which of the following heart rates, in beats per minute (bpm), was most likely observed in the man?","o":["70","50","100","130","150"],"a":2,"ex":"Ganglionic blockers interrupt Nn transmission in both sympathetic and parasympathetic ganglia. The heart is therefore no longer under autonomic control and reverts to its intrinsic rate of approximately 100 bpm (parasympathetic tone normally holds resting rate near 70).","src":"Babbini & Thomas — Anticholinergic Drugs Q30"}]
