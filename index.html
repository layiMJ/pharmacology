/* ---------- Utility ---------- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function fmtTime(sec){
  sec = Math.max(0,Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
}
const LETTERS = ["A","B","C","D","E","F","G","H","I","J","K","L"];
function esc(s){
  const a = "&";
  return String(s==null?"":s)
    .replace(/&/g, a+"amp;")
    .replace(/</g, a+"lt;")
    .replace(/>/g, a+"gt;")
    .replace(/"/g, a+"quot;");
}

/* Shuffle option order for topic-bank questions (the correct index is remapped).
   Older questions keep their fixed order because some say "all of the above" or are matching sets. */
function prep(q){
  const base = q.base || q;
  if(!base.shuf) return base;
  const perm = shuffle(base.o.map((_,i)=>i));
  return Object.assign({}, base, {o:perm.map(i=>base.o[i]), a:perm.indexOf(base.a), base:base});
}
function dedupe(list){
  const seen = {}, out = [];
  list.forEach(q=>{ const k = normKey(q); if(!seen[k]){ seen[k] = 1; out.push(q); } });
  return out;
}
function poolFor(sel){
  let all = [];
  sel.forEach(id=>{
    const cats = GROUPS[id] ? GROUPS[id].cats : [id];
    cats.forEach(c=>{ all = all.concat(POOL[c]||[]); });
  });
  return dedupe(all);
}
function accOf(q){
  const m = MEM[q.key];
  return m && m[1] ? m[0]/m[1] : null;
}

/* ---------- Progress statistics ---------- */
function statFor(cats){
  let c=0, n=0, seen=0;
  cats.forEach(cat=>{ (POOL[cat]||[]).forEach(q=>{ const m = MEM[q.key]; if(m){ c+=m[0]; n+=m[1]; seen++; } }); });
  return {c:c, n:n, seen:seen, pct:n ? Math.round(100*c/n) : null};
}
function legacyPct(cats){
  const v = cats.map(k=>HIST[k]).filter(x=>x && typeof x.pct==="number");
  return v.length ? Math.round(v.reduce((s,x)=>s+x.pct,0)/v.length) : null;
}
/* cumulative accuracy when recorded, otherwise the last-attempt score from the earlier version */
function shownPct(cats){
  const s = statFor(cats);
  return s.n ? s.pct : legacyPct(cats);
}

/* =========================================================
   Figures: original drawings, computed from the data in each question.
   Curves are calculated rather than traced. Captions never say which
   option is right, and every label is sized to stay legible on a phone.
   ========================================================= */
const FW = 300;
const FDASH = [null, "7 4", "1.5 5", "11 4 2 4", null];
const FCOL = ["var(--f1)","var(--f2)","var(--f3)","var(--f4)","var(--f5)"];
const MINUS = "−";

function fr(n){ return Math.round(n*10)/10; }
function fsvg(h, label, inner){
  return '<svg class="qsvg" viewBox="0 0 '+FW+' '+h+'" role="img" aria-label="'+esc(label)+'">'+inner+'</svg>';
}
function mkPlot(o){
  const P = {W:FW, H:o.h, L:o.l, R:o.r, T:o.t, B:o.b};
  P.pw = P.W-P.L-P.R;
  P.ph = P.H-P.T-P.B;
  P.x = v => P.L + (v-o.x0)/(o.x1-o.x0)*P.pw;
  P.y = v => P.T + P.ph*(1-(v-o.y0)/(o.y1-o.y0));
  return P;
}
function figAxes(P, o){
  let s = "";
  (o.yt||[]).forEach(t=>{ s += '<line class="grid" x1="'+P.L+'" x2="'+(P.W-P.R)+'" y1="'+fr(P.y(t.v))+'" y2="'+fr(P.y(t.v))+'"/>'; });
  if(o.xgrid) (o.xt||[]).forEach(t=>{ s += '<line class="grid" x1="'+fr(P.x(t.v))+'" x2="'+fr(P.x(t.v))+'" y1="'+P.T+'" y2="'+(P.H-P.B)+'"/>'; });
  if(!o.noX) s += '<line class="axis" x1="'+P.L+'" y1="'+(P.H-P.B)+'" x2="'+(P.W-P.R)+'" y2="'+(P.H-P.B)+'"/>';
  s += '<line class="axis" x1="'+P.L+'" y1="'+P.T+'" x2="'+P.L+'" y2="'+(P.H-P.B)+'"/>';
  (o.yt||[]).forEach(t=>{ if(t.l) s += '<text class="tk" x="'+(P.L-6)+'" y="'+fr(P.y(t.v)+4)+'" text-anchor="end">'+t.l+'</text>'; });
  (o.xt||[]).forEach(t=>{
    if(!o.noX) s += '<line class="axis" x1="'+fr(P.x(t.v))+'" x2="'+fr(P.x(t.v))+'" y1="'+(P.H-P.B)+'" y2="'+(P.H-P.B+4)+'"/>';
    if(t.l) s += '<text class="tk" x="'+fr(P.x(t.v))+'" y="'+(P.H-P.B+17)+'" text-anchor="middle">'+t.l+'</text>';
  });
  if(o.xl) s += '<text class="ax" x="'+fr(P.L+P.pw/2)+'" y="'+(P.H-7)+'" text-anchor="middle">'+o.xl+'</text>';
  if(o.yl) s += '<text class="ax" transform="rotate(-90)" x="'+fr(-(P.T+P.ph/2))+'" y="13" text-anchor="middle">'+o.yl+'</text>';
  return s;
}
function figCurve(P, f, a, b, col, dash, w){
  const n = 100, pts = [];
  for(let i=0;i<=n;i++){ const x = a+(b-a)*i/n; pts.push(fr(P.x(x))+","+fr(P.y(f(x)))); }
  return '<polyline class="crv" points="'+pts.join(" ")+'" style="stroke:'+col+(dash?';stroke-dasharray:'+dash:'')+(w?';stroke-width:'+w:'')+'"/>';
}
function figText(x, y, t, anchor, col){
  return '<text class="lb halo" x="'+fr(x)+'" y="'+fr(y)+'" text-anchor="'+(anchor||"middle")+'" style="fill:'+(col||"var(--ink)")+'">'+t+'</text>';
}
function figBadge(x, y, t, col){
  return '<circle class="bdg" cx="'+fr(x)+'" cy="'+fr(y)+'" r="9" style="stroke:'+(col||"var(--ink)")+'"/>'+
    '<text class="bt" x="'+fr(x)+'" y="'+fr(y+4.3)+'" text-anchor="middle">'+t+'</text>';
}
function figLeader(x1, y1, x2, y2){
  return '<line class="ldr" x1="'+fr(x1)+'" y1="'+fr(y1)+'" x2="'+fr(x2)+'" y2="'+fr(y2)+'"/>'+
         '<circle class="ldd" cx="'+fr(x2)+'" cy="'+fr(y2)+'" r="2.4"/>';
}
const lgt = (x, m, e) => e/(1+Math.pow(10, m-x));          // rising logistic: e / (1 + 10^(m - x))

/* ---------- Dose-response, two drugs, same Emax (pd-12) ---------- */
function doseResponseSVG(){
  const P = mkPlot({h:200,l:44,r:14,t:14,b:40,x0:-3,x1:3,y0:0,y1:100});
  const f1 = x=>lgt(x,-0.8,100), f2 = x=>lgt(x,0.7,100);
  return fsvg(200, "Log dose-response curves for Drug 1 and Drug 2",
    figAxes(P,{yt:[{v:0,l:"0"},{v:50,l:"50"},{v:100,l:"100"}],xl:"Log dose",yl:"Effect (% of maximum)"})+
    figCurve(P,f1,-3,3,FCOL[0])+figCurve(P,f2,-3,3,FCOL[1],FDASH[1])+
    figText(P.x(-0.32)-9,P.y(75)+4,"Drug 1","end",FCOL[0])+
    figText(P.x(0.43)+9,P.y(35)+4,"Drug 2","start",FCOL[1]));
}

/* ---------- Novexum: log concentration against time (k1-8) ---------- */
function novexumSVG(){
  const P = mkPlot({h:212,l:44,r:16,t:14,b:42,x0:0,x1:8,y0:1,y1:5.2});
  const ly = v=>Math.log(v)/Math.LN2;
  const yt = [2,4,8,16,32].map(v=>({v:ly(v),l:String(v)}));
  const xt = [0,1,2,3,4,5,6,7,8].map(v=>({v:v,l:String(v)}));
  const pts = [[1,16],[4,8],[7,4]];
  let s = figAxes(P,{yt:yt,xt:xt,xgrid:true,xl:"Time (h)",yl:"Plasma level (log scale)"});
  s += '<polyline class="crv" points="'+pts.map(p=>fr(P.x(p[0]))+","+fr(P.y(ly(p[1])))).join(" ")+'" style="stroke:'+FCOL[0]+'"/>';
  pts.forEach(p=>{ s += '<circle class="dot" cx="'+fr(P.x(p[0]))+'" cy="'+fr(P.y(ly(p[1])))+'" r="4.6" style="stroke:'+FCOL[0]+'"/>'; });
  return fsvg(212, "Plasma level of Novexum on a logarithmic axis against time in hours", s);
}

/* ---------- Cardiac output against log dose, drugs A, B, C (k2-2) ---------- */
function inotropeSVG(){
  const P = mkPlot({h:216,l:44,r:14,t:14,b:40,x0:-3,x1:3,y0:0,y1:100});
  const A = x=>lgt(x,-0.9,55), B = x=>lgt(x,0,100), C = x=>lgt(x,0.9,100);
  const yt = [0,25,50,75,100].map(v=>({v:v,l:""}));

    figBadge(P.x(1.7),P.y(A(1.7)),"A",FCOL[0])+

/* ---------- Five curves, partial agonist against a full agonist (k2-7, k2-8, k2-9) ----------
   Curve 1: effect of a large dose of full agonist as partial agonist rises (falls to the partial agonist's maximum)
   Curve 2: rises to 100%, left of curve 4
   Curve 3: rises to 100%, right of curve 4 (binding when spare receptors are present)
   Curve 4: effect of the partial agonist (plateau below 100%)
   Curve 5: binding of the full agonist (falls to zero)                                              */
function spareCurvesSVG(){
  const PE = 50;
  const P = mkPlot({h:250,l:44,r:14,t:14,b:44,x0:-3,x1:3,y0:0,y1:100});
  const C = {
    1: x=>PE+(100-PE)/(1+Math.pow(10,x-1.9)),
    2: x=>lgt(x,-1.4,100),
    3: x=>lgt(x,0.8,100),
    4: x=>lgt(x,-0.3,PE),
    5: x=>100/(1+Math.pow(10,x-0.8))
  };
  const at = {1:2.1, 2:-1.3, 3:1.2, 4:1.8, 5:2.7};
  const order = [1,2,3,4,5];
  let s = figAxes(P,{yt:[{v:0,l:"0"},{v:50,l:"50"},{v:100,l:"100"}],xl:"Log concentration of partial agonist",yl:"% of maximum"});
  order.forEach((k,i)=>{ s += figCurve(P,C[k],-3,3,FCOL[i],FDASH[i]); });
  order.forEach((k,i)=>{ s += figBadge(P.x(at[k]),P.y(C[k](at[k])),String(k),FCOL[i]); });
  return fsvg(250, "Five curves numbered 1 to 5 showing percentage of maximum against log concentration of a partial agonist", s);
}

/* ---------- Bar charts of heart-rate change (k8-4, k10-5) ---------- */
function barFig(title, cats, vals, label){
  const n = cats.length;
  const P = mkPlot({h:226,l:46,r:12,t:28,b:62,x0:0,x1:n,y0:-60,y1:60});
  const yt = [-60,-40,-20,0,20,40,60].map(v=>({v:v,l:(v>0?"+":(v<0?MINUS:""))+Math.abs(v)}));
  let s = figAxes(P,{yt:yt,noX:true,yl:"Change in heart rate (%)"});
  s += '<text class="ax" x="'+fr(P.L+P.pw/2)+'" y="15" text-anchor="middle" style="font-weight:700;fill:var(--ink)">'+title+'</text>';
  const slot = P.pw/n, bw = Math.min(46, slot*0.56), zy = P.y(0);
  vals.forEach((v,i)=>{
    const cx = P.L + slot*(i+0.5), top = v>=0 ? P.y(v) : zy, h = Math.abs(P.y(v)-zy);
    const col = v>=0 ? FCOL[0] : FCOL[1];
    s += '<rect class="fbar" x="'+fr(cx-bw/2)+'" y="'+fr(top)+'" width="'+fr(bw)+'" height="'+fr(Math.max(h,1.5))+'" rx="3" style="fill:'+col+'"/>';
    s += '<text class="vl" x="'+fr(cx)+'" y="'+fr(v>=0 ? top-6 : top+h+15)+'" text-anchor="middle">'+(v>0?"+":(v<0?MINUS:""))+Math.abs(v)+'%</text>';
    cats[i].forEach((ln,j)=>{ s += '<text class="cl" x="'+fr(cx)+'" y="'+(P.H-P.B+18+j*13)+'" text-anchor="middle">'+ln+'</text>'; });
  });
  s += '<line class="zero" x1="'+P.L+'" x2="'+(P.W-P.R)+'" y1="'+fr(zy)+'" y2="'+fr(zy)+'"/>';
  return fsvg(226, label, s);
}

/* ---------- Blood pressure after IV boluses of drugs X and Y (k9-7, k9-8) ---------- */
function bpxySVG(){
  const h = 216, L = 50, R = 8, T = 30, B = 40, gap = 14;
  const pw = (FW-L-R-gap)/2, ph = h-T-B, y0 = 20, y1 = 180, t0 = 0.3;
  const Y = v=>T+ph*(1-(v-y0)/(y1-y0));
  const ramp = (a,b,t)=> t<t0 ? a : a+(b-a)*(1-Math.exp(-(t-t0)/0.17));
  const panels = [
    {name:"Drug X", s:[120,132], d:[80,52]},
    {name:"Drug Y", s:[120,158], d:[80,118]}
  ];
  let s = '';
  [40,80,120,160].forEach(v=>{ s += '<line class="grid" x1="'+L+'" x2="'+(FW-R)+'" y1="'+fr(Y(v))+'" y2="'+fr(Y(v))+'"/><text class="tk" x="'+(L-6)+'" y="'+fr(Y(v)+4)+'" text-anchor="end">'+v+'</text>'; });
  s += '<text class="ax" transform="rotate(-90)" x="'+fr(-(T+ph/2))+'" y="13" text-anchor="middle">Blood pressure (mm Hg)</text>';
  panels.forEach((p,i)=>{
    const x0 = L+i*(pw+gap), X = t=>x0+t*pw;
    s += '<line class="axis" x1="'+x0+'" y1="'+(T+ph)+'" x2="'+fr(x0+pw)+'" y2="'+(T+ph)+'"/>';
    if(i===0) s += '<line class="axis" x1="'+x0+'" y1="'+T+'" x2="'+x0+'" y2="'+(T+ph)+'"/>';
    s += '<text class="ax" x="'+fr(x0+pw/2)+'" y="18" text-anchor="middle" style="font-weight:700;fill:var(--ink)">'+p.name+'</text>';
    const tr = (a,b,col,dash)=>{ const pts=[]; for(let k=0;k<=80;k++){ const t=k/80; pts.push(fr(X(t))+","+fr(Y(ramp(a,b,t)))); } return '<polyline class="crv" points="'+pts.join(" ")+'" style="stroke:'+col+(dash?';stroke-dasharray:'+dash:'')+'"/>'; };
    s += tr(p.s[0],p.s[1],FCOL[0]) + tr(p.d[0],p.d[1],FCOL[1],FDASH[1]);
    s += figText(X(0.66), Y(ramp(p.s[0],p.s[1],0.9))-7, "Systolic","middle",FCOL[0]);
    s += figText(X(0.66), Y(ramp(p.d[0],p.d[1],0.9))+21, "Diastolic","middle",FCOL[1]);
    s += '<path class="mk" d="M'+fr(X(t0))+' '+(T+ph+3)+' l-5 8 h10 z"/>';
    s += '<text class="tk" x="'+fr(X(t0))+'" y="'+(T+ph+24)+'" text-anchor="middle">IV bolus</text>';
  });
  return fsvg(h, "Systolic and diastolic blood pressure traces before and after an IV bolus of drug X and of drug Y", s);
}

/* ---------- Epinephrine before and after a new drug (k10-9) ----------
   BP and cardiac force both rise with the first dose of epinephrine; after the new drug the same dose changes neither. */
function epiSVG(){
  const h = 240, L = 16, R = 10, W = FW-L-R;
  const evE1 = 72, evD = 152, evE2 = 232;
  const pulse = u => u<0 ? 0 : (1-Math.exp(-u/5))*Math.exp(-u/30);
  let mx = 0; for(let u=0;u<200;u+=0.5) mx = Math.max(mx,pulse(u));
  const g = u => pulse(u)/mx;
  const step = (t0,k)=> t=> t<t0 ? 0 : (1-Math.exp(-(t-t0)/k));
  const bp = t => 0.60 + 0.30*g(t-evE1) - 0.12*step(evD,14)(t);
  const fo = t => 0.44 + 0.40*g(t-evE1) - 0.04*step(evD,14)(t);
  const panels = [
    {top:34,  hh:78, f:bp, col:FCOL[0], name:"Blood pressure"},
    {top:134, hh:78, f:fo, col:FCOL[1], name:"Cardiac force"}
  ];
  let s = '';
  [[evE1,"Epi"],[evD,"New drug"],[evE2,"Epi"]].forEach(e=>{
    s += '<line class="evl" x1="'+(L+e[0])+'" x2="'+(L+e[0])+'" y1="22" y2="'+(panels[1].top+panels[1].hh)+'"/>';
    s += '<text class="lb" x="'+(L+e[0])+'" y="15" text-anchor="middle" style="fill:var(--ink)">'+e[1]+'</text>';
  });
  panels.forEach(p=>{
    const Y = v=>p.top+p.hh*(1-v);
    s += '<line class="axis" x1="'+L+'" y1="'+Y(0)+'" x2="'+(L+W)+'" y2="'+Y(0)+'"/>';
    s += '<line class="axis" x1="'+L+'" y1="'+p.top+'" x2="'+L+'" y2="'+Y(0)+'"/>';
    s += '<text class="ax halo" x="'+(L+W-4)+'" y="'+(p.top+12)+'" text-anchor="end">'+p.name+'</text>';
    const pts = []; for(let t=0;t<=W;t+=2) pts.push(fr(L+t)+","+fr(Y(p.f(t))));
    s += '<polyline class="crv" points="'+pts.join(" ")+'" style="stroke:'+p.col+'"/>';
  });
  s += '<text class="ax" x="'+(L+W)+'" y="'+(h-6)+'" text-anchor="end">Time →</text>';
  return fsvg(h, "Blood pressure and cardiac force traces: epinephrine given, then a new drug, then epinephrine again", s);
}

/* ---------- Pharmacokinetic figures (Babbini and Thomas items) ---------- */
function pk10SVG(){   /* four oral formulations, same drug and dose (b_pk-9) */
  const P = mkPlot({h:204,l:44,r:14,t:14,b:40,x0:0,x1:14,y0:0,y1:100});
  const ka = 1.2, ke = 0.3, tmax = Math.log(ka/ke)/(ka-ke);
  const sh = t=>Math.exp(-ke*t)-Math.exp(-ka*t), norm = 88/sh(tmax);
  const F = [1,0.7,0.48,0.3], N = ["W","X","Y","Z"];
  let s = figAxes(P,{yt:[0,25,50,75,100].map(v=>({v:v,l:""})),xl:"Time",yl:"Plasma concentration"});
  F.forEach((f,i)=>{ s += figCurve(P,t=>f*norm*sh(t),0,14,FCOL[i],FDASH[i]); });
  F.forEach((f,i)=>{ s += figBadge(P.x(3),P.y(f*norm*sh(3)),N[i],FCOL[i]); });
  return fsvg(204, "Plasma concentration against time for four oral formulations W, X, Y and Z", s);
}
function pk32SVG(){   /* five drugs, equal IV doses, log concentration against time (b_pk-31) */
  const P = mkPlot({h:206,l:48,r:14,t:14,b:42,x0:0,x1:12,y0:-1,y1:1.35});
  const C0 = [10,5,2.9,1.67,0.83], K = [0.20,0.17,0.14,0.115,0.09], N = ["P","Q","R","S","T"];
  const lg10 = v=>Math.log(v)/Math.LN10;
  let s = figAxes(P,{yt:[-1,0,1].map(v=>({v:v,l:""})),xt:[0,3,6,9,12].map(v=>({v:v,l:String(v)})),xl:"Time (h)",yl:"Plasma concentration (log)"});
  C0.forEach((c,i)=>{ s += figCurve(P,t=>lg10(c)-K[i]*t/Math.LN10,0,12,FCOL[i],FDASH[i]); });
  C0.forEach((c,i)=>{ s += figText(P.L-7,P.y(lg10(c))+4,N[i],"end",FCOL[i]); });
  return fsvg(206, "Log plasma concentration against time for five drugs P, Q, R, S and T given as equal IV doses", s);
}
function pk36SVG(){   /* four IV infusions approaching different steady states (b_pk-35) */
  const P = mkPlot({h:206,l:44,r:30,t:14,b:42,x0:0,x1:10,y0:0,y1:45});
  const CSS = [40,30,20,10], T12 = [2,1,2,2], N = ["W","X","Y","Z"];
  const f = i => t=>CSS[i]*(1-Math.pow(2,-t/T12[i]));
  let s = figAxes(P,{yt:[0,10,20,30,40].map(v=>({v:v,l:String(v)})),xt:[0,2,4,6,8,10].map(v=>({v:v,l:String(v)})),xl:"Time (h)",yl:"Plasma concentration"});
  CSS.forEach((c,i)=>{ s += figCurve(P,f(i),0,10,FCOL[i],FDASH[i]); });
  CSS.forEach((c,i)=>{ s += figText(P.W-P.R+6,P.y(f(i)(10))+4,N[i],"start",FCOL[i]); });
  return fsvg(206, "Plasma concentration against time for four IV infusions W, X, Y and Z", s);
}
function pk37SVG(){   /* IV infusion at 30 mg/h (b_pk-36); steady state 3 mg/L */
  const P = mkPlot({h:200,l:44,r:14,t:14,b:42,x0:0,x1:20,y0:0,y1:4});
  const f = t=>3*(1-Math.exp(-0.21*t));
  return fsvg(200, "Plasma concentration in mg per litre against time in hours during an IV infusion",
    figAxes(P,{yt:[0,1,2,3,4].map(v=>({v:v,l:String(v)})),xt:[0,4,8,12,16,20].map(v=>({v:v,l:String(v)})),xl:"Time (h)",yl:"Plasma conc. (mg/L)"})+
    figCurve(P,f,0,20,FCOL[0]));
}
function pk39SVG(){   /* straight-line fall on arithmetic axes (b_pk-38) */
  const P = mkPlot({h:200,l:44,r:14,t:14,b:42,x0:0,x1:12,y0:0,y1:11});
  return fsvg(200, "Plasma concentration in micrograms per millilitre against time in hours after an IV dose",
    figAxes(P,{yt:[0,2,4,6,8,10].map(v=>({v:v,l:String(v)})),xt:[0,3,6,9,12].map(v=>({v:v,l:String(v)})),xl:"Time (h)",yl:"Plasma conc. (µg/mL)"})+
    figCurve(P,t=>10-t*10/12,0,12,FCOL[0]));
}

}

/* Update the builder in place (no re-render), so typing in the custom box never loses focus */
function syncBuilder(fromInput){
  const b = state.build;
  const pool = poolFor(b.sel).length;
  const eff = b.size ? Math.min(b.size, pool) : pool;
  document.querySelectorAll("[data-chip]").forEach(el=>{
    el.setAttribute("aria-pressed", String(b.sel.indexOf(el.getAttribute("data-chip"))>=0));
  });
  document.querySelectorAll("[data-size]").forEach(el=>{
    el.setAttribute("aria-pressed", String(parseInt(el.getAttribute("data-size"),10)===b.size));
  });
  const cu = document.getElementById("bCustom");
  const custom = [0,10,20,40].indexOf(b.size)<0;
  if(cu){
    cu.max = pool;
    cu.className = "num-in"+(custom?" active":"");
    if(!fromInput) cu.value = custom ? b.size : "";
  }
  const wk = document.getElementById("bWeak");
  if(wk) wk.setAttribute("aria-pressed", String(b.weak));
  const sum = document.getElementById("bSummary");
  if(sum){
    sum.textContent = pool
      ? "Session: "+eff+" of "+pool+" question"+(pool===1?"":"s")+" · "+(b.weak?"weakest first":"random order")
      : "Pick at least one topic to build a session.";
  }
  const st = document.getElementById("bStart");
  if(st) st.disabled = !pool;
}

function bindBuilder(){
  const b = state.build;
  document.querySelectorAll("[data-chip]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const id = el.getAttribute("data-chip"), i = b.sel.indexOf(id);
      if(i>=0) b.sel.splice(i,1); else b.sel.push(id);
      savePrefs(); syncBuilder();
    });
  });
  document.querySelectorAll("[data-bsel]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const m = el.getAttribute("data-bsel");
      b.sel = m==="all" ? BUILD_IDS.slice() : (m==="bank" ? LEC_ORDER.slice() : []);
      savePrefs(); syncBuilder();
    });
  });
  document.querySelectorAll("[data-size]").forEach(el=>{
    el.addEventListener("click", ()=>{
      b.size = parseInt(el.getAttribute("data-size"),10);
      savePrefs(); syncBuilder();
    });
  });
  const cu = document.getElementById("bCustom");
  if(cu){
    cu.addEventListener("input", ()=>{
      const v = cu.value.trim();
      if(v==="") { syncBuilder(true); return; }
      const n = Math.floor(Number(v));
      if(isFinite(n) && n>=0){ b.size = Math.min(n, 99999); savePrefs(); syncBuilder(true); }
    });
    cu.addEventListener("change", ()=>{
      if(cu.value.trim()===""){ syncBuilder(); return; }
      const pool = poolFor(b.sel).length;
      let n = Math.floor(Number(cu.value));
      if(!isFinite(n) || n<0) n = b.size;
      if(pool && n>pool) n = pool;
      b.size = n;
      savePrefs(); syncBuilder();
    });
  }
  const wk = document.getElementById("bWeak");
  if(wk) wk.addEventListener("click", ()=>{ b.weak = !b.weak; savePrefs(); syncBuilder(); });
  const st = document.getElementById("bStart");
  if(st) st.addEventListener("click", startCustom);
  syncBuilder();
}

/* ---------- Starting sessions ---------- */
function startList(list, meta, replace){
  state.session = {catKey:meta.catKey, list:list, title:meta.title, color:meta.color, partial:!!meta.partial};
  state.idx = 0;
  state.answers = {};
  state.flags = {};
  state.paletteOpen = false;
  state.elapsed = 0;
  state.leaving = false;
  if(state.pace){
    state.totalTime = state.pace * list.length;
    state.timeLeft = state.totalTime;
  } else {
    state.totalTime = 0;
    state.timeLeft = 0;
  }
  if(replace) nav.replace("quiz"); else nav.push("quiz");
  state.view = "quiz";
  render();
  window.scrollTo(0,0);
  startTimer();
}

function startSession(catKey){
  let list, title, color;
  if(catKey==="mock"){
    list = dedupe(shuffle(ALL)).slice(0, 50);
    title = "Full Mock Exam";
    color = "var(--c-mock)";
  } else {
    list = POOL[catKey].slice();
    if(LEC_ORDER.indexOf(catKey)>=0) list = shuffle(list);   // topic bank: new order every time
    title = CATEGORIES[catKey].name;
    color = CATEGORIES[catKey].color;
  }
  startList(list.map(prep), {catKey:catKey, title:title, color:color});
}

function startCustom(){
  const b = state.build;
  const pool = poolFor(b.sel);
  if(!pool.length){ alert("Select at least one topic."); return; }
  let list = shuffle(pool);
  if(b.weak){
    list.sort((x,y)=>{
      const ax = accOf(x), ay = accOf(y);
      return (ax===null?0.5:ax) - (ay===null?0.5:ay);
    });
  }
  const n = b.size ? Math.min(b.size, list.length) : list.length;
  list = list.slice(0, n);
  startList(list.map(prep), {catKey:"custom", title:"Custom session"+(b.weak?" · weakest first":""), color:"var(--c-mock)"});
}

function weakCandidates(){
  const cand = dedupe(ALL).filter(q=>{ const m = MEM[q.key]; return m && m[1] && m[0]<m[1]; });
  cand.sort((x,y)=> (accOf(x)-accOf(y)) || (MEM[y.key][1]-MEM[x.key][1]));
  return cand;
}
function startDrill(){
  const list = weakCandidates().slice(0,20);
  if(!list.length) return;
  startList(shuffle(list).map(prep), {catKey:"drill", title:"Drill — my weakest questions", color:"var(--c-mock)"});
}

function startTimer(){
  clearInterval(state.timerHandle);
  state.timerHandle = setInterval(()=>{
    state.elapsed += 1;
    if(state.pace){
      state.timeLeft -= 1;
      if(state.timeLeft <= 0){
        state.timeLeft = 0;
        updateTimerDom();
        clearInterval(state.timerHandle);
        finishSession();
        return;
      }
    }
    updateTimerDom();
  }, 1000);
}

function updateTimerDom(){
  const timerEl = document.getElementById("timerText");
  const barEl = document.getElementById("timeBarFill");
  const barWrap = document.getElementById("timeBarWrap");
  if(!timerEl) return;
  if(state.pace){
    timerEl.textContent = fmtTime(state.timeLeft);
    const frac = state.timeLeft / state.totalTime;
    barEl.style.width = Math.max(0,frac*100)+"%";
    let cls = "";
    if(frac < 0.1) cls = "crit"; else if(frac < 0.25) cls = "warn";
    timerEl.className = "timer "+cls;
    barWrap.className = "bar time-bar "+cls;
  } else {
    timerEl.textContent = fmtTime(state.elapsed);
    barEl.style.width = "100%";
    timerEl.className = "timer";
    barWrap.className = "bar time-bar";
  }
}

    '<div class="timer-row">'+
      '<span class="timer" id="timerText">'+(state.pace?fmtTime(state.timeLeft):fmtTime(state.elapsed))+'</span>'+

      '<button class="palette-toggle" id="paletteToggle">'+answeredCount+'/'+total+' ▾</button>'+
    '</div>'+
    '<div class="palette'+(state.paletteOpen?' open':'')+'" id="paletteBox">'+paletteHtml+'</div>'+
  '</div>'+
  '<div class="qcard">'+
    '<div class="bar" style="margin-bottom:10px"><i style="width:'+((state.idx+1)/total*100)+'%;background:'+s.color+'"></i></div>'+
    '<div class="qstem-box">'+
      (svgHtml(q)+tableHtml(q))+
      '<p class="qstem">'+esc(q.q)+'</p>'+
      fbHtml+
      '<ul class="options'+(q.o.length>8?" compact":"")+'">'+optsHtml+'</ul>'+
      '<div class="qflag-row"><button class="flag-btn" id="flagBtn" aria-pressed="'+(!!state.flags[q.id])+'">'+(state.flags[q.id]?"⚑ Flagged":"⚐ Flag for review")+'</button></div>'+
      '<p class="qsrc">Source: '+esc(q.src)+'</p>'+
    '</div>'+
  '</div>'+
  '<div class="qnav"><div class="qnav-inner">'+
    '<button class="btn ghost" id="prevBtn" '+(state.idx===0?"disabled":"")+'>Previous</button>'+
    '<button class="btn" id="nextBtn">'+nextLabel+'</button>'+
  '</div></div>';

  document.getElementById("exitBtn").addEventListener("click", exitSession);
  document.getElementById("paletteToggle").addEventListener("click", ()=>{ state.paletteOpen = !state.paletteOpen; render(); });
  document.querySelectorAll("[data-jump]").forEach(b=>{
    b.addEventListener("click", ()=>{ state.idx = parseInt(b.getAttribute("data-jump"),10); render(); window.scrollTo(0,0); });
  });
  document.querySelectorAll("[data-opt]").forEach(b=>{
    b.addEventListener("click", ()=>{

      state.answers[q.id] = parseInt(b.getAttribute("data-opt"),10);
      render();
      if(state.instant){

      }

  });

      const unanswered = total - Object.keys(state.answers).length;
      if(unanswered>0){
        const ok = confirm(unanswered+" question(s) are unanswered. Submit anyway?");
        if(!ok) return;
      }
      finishSession();
    } else {
      state.idx++; render(); window.scrollTo(0,0);
    }
  });
}

function leaveQuizCleanup(){
  clearInterval(state.timerHandle);
  state.session = null;
}
function exitSession(){
  const touched = Object.keys(state.answers).length>0 || Object.keys(state.flags).some(k=>state.flags[k]);
  if(touched && !confirm("Exit this session? Your progress in this attempt will be lost.")) return;
  if(nav.i>0 && history.state && history.state.v==="quiz"){
    state.leaving = true;      // the popstate handler finishes the job
    history.back();
  } else {
    leaveQuizCleanup();
    setView("home");
  }
}

function finishSession(){
  clearInterval(state.timerHandle);
  const s = state.session;
  if(!s) return;
  let correct = 0, wrong = 0, blank = 0;
  const perCat = {};
  s.list.forEach(q=>{
    const a = state.answers[q.id];
    if(!perCat[q.cat]) perCat[q.cat] = {correct:0,total:0};
    perCat[q.cat].total++;
    if(a===undefined) blank++;
    else if(a===q.a){ correct++; perCat[q.cat].correct++; }
    else wrong++;
  });
  const pct = Math.round((correct/s.list.length)*100);

  /* per-question record (answered questions only) and session log */
  s.list.forEach(q=>{
    const a = state.answers[q.id];
    if(a===undefined) return;
    const m = MEM[q.key] || [0,0];
    MEM[q.key] = [m[0] + (a===q.a ? 1 : 0), m[1] + 1];
  });
  const prev = SESS.length ? SESS[SESS.length-1] : null;
  SESS.push({d:Date.now(), title:s.title, c:correct, n:s.list.length, p:pct, t:state.elapsed, k:s.catKey});
  if(SESS.length>200) SESS.splice(0, SESS.length-200);
  lsSet("pharmQuizMem", MEM);
  lsSet("pharmQuizSessions", SESS);

  const result = {
    title:s.title, catKey:s.catKey, list:s.list, partial:s.partial,
    correct:correct, wrong:wrong, blank:blank, total:s.list.length, pct:pct,
    timeUsed: state.elapsed, perCat:perCat, color:s.color,
    prevP: prev ? prev.p : null
  };
  state.lastResult = result;
  state.reviewOpen = false;
  state.reviewMissed = false;
  if(s.catKey!=="custom" && s.catKey!=="drill" && !s.partial){
    saveHistoryEntry(s.catKey, {
      pct:pct,
      date:new Date().toLocaleDateString(undefined,{month:"short",day:"numeric"})
    });
  }
  state.view = "results";
  nav.replace("results");
  render();
  window.scrollTo(0,0);
}

/* ---------- Results ---------- */
function tipsHtml(r){
  const rows = Object.keys(r.perCat).map(cat=>{
    const c = r.perCat[cat];
    return {cat:cat, n:c.total, p:Math.round(100*c.correct/c.total)};
  });
  const multi = rows.length>1;
  const use = rows.filter(x=>!multi || x.n>=3).sort((a,b)=>a.p-b.p).slice(0,4);
  const tips = [];
  use.forEach(x=>{
    const name = esc((CATEGORIES[x.cat]||{name:x.cat}).name);
    if(x.p<50) tips.push('<b>'+name+'</b> ('+x.p+'%): relearn this from your lecture notes and textbook, then redo it on its own.');
    else if(x.p<80) tips.push('<b>'+name+'</b> ('+x.p+'%): read the explanations for the ones you missed and retest within 48 hours.');
  });
  if(!tips.length) tips.push('Strong session. Try the mock exam or a longer custom session to test wider coverage.');
  if(r.prevP!==null && r.prevP!==undefined){
    if(r.pct>r.prevP) tips.push('Up '+(r.pct-r.prevP)+' points from your last session.');
    else if(r.pct<r.prevP) tips.push('Down '+(r.prevP-r.pct)+' points from your last session. Read every option fully before choosing.');
    else tips.push('Same score as your last session.');
  }
  tips.push('Switch on “Weakest questions first” in Build a session, or use the drill on the progress page, to work on what you keep missing.');
  return '<div class="panel tips" style="margin-top:16px"><h3>How to improve</h3>'+tips.map(t=>'<p>'+t+'</p>').join("")+'</div>';
}

function renderResults(){
  const r = state.lastResult;
  let bdHtml = "";
  Object.keys(r.perCat).forEach(cat=>{
    const c = r.perCat[cat];
    const p = c.total ? (c.correct/c.total*100) : 0;
    const meta = CATEGORIES[cat] || {name:cat, short:cat, color:"var(--primary)"};
    bdHtml += '<div class="bd-row">'+
      '<span class="bd-name">'+meta.short+'</span>'+
      '<span class="bd-bar"><i style="width:'+p+'%;background:'+meta.color+'"></i></span>'+
      '<span class="bd-frac">'+c.correct+'/'+c.total+'</span>'+
    '</div>';
  });

  let reviewHtml = "";
  let shown = 0;
  r.list.forEach((q,i)=>{
    const picked = state.answers[q.id];
    const isCorrect = picked===q.a;
    const isBlank = picked===undefined;
    if(state.reviewMissed && isCorrect) return;
    shown++;
    const cls = isBlank ? "blank" : (isCorrect ? "correct" : "wrong");
    const badge = isBlank ? "Unanswered" : (isCorrect ? "Correct" : "Incorrect");
    let optsHtml = "";
    q.o.forEach((opt,oi)=>{
      let ocls = "rev-opt";
      if(oi===q.a) ocls += " right";
      else if(oi===picked) ocls += " pick";
      optsHtml += '<li class="'+ocls+'"><span class="oletter">'+LETTERS[oi]+'</span><span>'+esc(opt)+'</span></li>';
    });
    reviewHtml += '<div class="rev-item '+cls+'">'+
      '<div class="rev-head"><span class="rev-num">Question '+(i+1)+'</span><span class="rev-badge '+cls+'">'+badge+'</span></div>'+
      '<p class="rev-q">'+esc(q.q)+'</p>'+
      (svgHtml(q)+tableHtml(q))+
      '<ul class="rev-opts">'+optsHtml+'</ul>'+
      '<div class="note">'+esc(q.ex)+'</div>'+
      '<p class="rev-src">Source: '+esc(q.src)+'</p>'+
    '</div>';
  });
  if(!shown) reviewHtml = '<p class="empty-msg">Nothing to show here.</p>';

  const missedN = r.wrong + r.blank;
  const avg = r.total ? r.timeUsed / r.total : 0;

  app.innerHTML =
  topbarHtml()+
  '<div class="wrap">'+
    '<h2 class="section-title" style="margin-top:22px">'+esc(r.title)+' — results</h2>'+
    '<div class="score-hero">'+
      '<div class="score-big" id="scoreBig">0%</div>'+
      '<div class="score-sub">'+r.correct+' correct out of '+r.total+'</div>'+
      '<div class="score-meta">'+
        '<div><b>'+r.correct+'</b><span>Correct</span></div>'+
        '<div><b>'+r.wrong+'</b><span>Incorrect</span></div>'+
        '<div><b>'+r.blank+'</b><span>Unanswered</span></div>'+
        '<div><b>'+fmtTime(r.timeUsed)+'</b><span>Time used</span></div>'+
        '<div><b>'+fmtTime(avg)+'</b><span>Per question</span></div>'+
      '</div>'+
      (Object.keys(r.perCat).length>1 ? '<div class="breakdown">'+bdHtml+'</div>' : '')+
    '</div>'+
    tipsHtml(r)+
    '<div class="result-actions">'+
      '<button class="btn" id="retakeAllBtn">Retake this session</button>'+
      (missedN>0 ? '<button class="btn ghost" id="retakeMissedBtn">Retake missed only ('+missedN+')</button>' : '')+
      '<button class="btn ghost" id="reviewToggleBtn">'+(state.reviewOpen && !state.reviewMissed?"Hide review":"Review all answers")+'</button>'+
      (missedN>0 ? '<button class="btn ghost" id="reviewMissedBtn">'+(state.reviewOpen && state.reviewMissed?"Hide missed":"Review missed only")+'</button>' : '')+
      '<button class="btn ghost" id="homeBtn">Back to topics</button>'+
    '</div>'+
    '<div class="review-list'+(state.reviewOpen?' open':'')+'" id="reviewList">'+reviewHtml+'</div>'+
  '</div>';

  // animate score count-up (single orchestrated moment)
  const scoreEl = document.getElementById("scoreBig");
  let cur = 0;
  const target = r.pct;
  const step = Math.max(1, Math.round(target/24));
  const anim = setInterval(()=>{
    cur += step;
    if(cur>=target){ cur = target; clearInterval(anim); }
    scoreEl.textContent = cur+"%";
  }, 16);

  document.getElementById("retakeAllBtn").addEventListener("click", ()=>{
    startList(r.list.map(prep), {catKey:r.catKey, title:r.title, color:r.color, partial:r.partial}, true);
  });
  const missedBtn = document.getElementById("retakeMissedBtn");
  if(missedBtn){
    missedBtn.addEventListener("click", ()=>{
      const missed = r.list.filter(q=>{
        const a = state.answers[q.id];
        return a===undefined || a!==q.a;
      });
      startList(missed.map(prep), {catKey:r.catKey, title:r.title.replace(/ — missed only$/,"")+" — missed only", color:r.color, partial:true}, true);
    });
  }
  document.getElementById("reviewToggleBtn").addEventListener("click", ()=>{
    const hide = state.reviewOpen && !state.reviewMissed;
    state.reviewOpen = !hide; state.reviewMissed = false; render();
  });
  const rm = document.getElementById("reviewMissedBtn");
  if(rm) rm.addEventListener("click", ()=>{
    const hide = state.reviewOpen && state.reviewMissed;
    state.reviewOpen = !hide; state.reviewMissed = true; render();
  });
  document.getElementById("homeBtn").addEventListener("click", ()=>{ nav.home(); });
}

/* ---------- Progress ---------- */
function trendSVG(rows){
  const W = 440, H = 160, L = 34, R = 12, T = 12, B = 24;
  const w = W-L-R, h = H-T-B;
  const x = i => rows.length===1 ? L+w/2 : L + w*i/(rows.length-1);
  const y = p => T + h*(1-p/100);
  let s = '<svg class="trend" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Scores of your last '+rows.length+' sessions">';
  [0,50,80,100].forEach(g=>{
    s += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(g)+'" y2="'+y(g)+'" style="stroke:var(--rule-strong);stroke-width:1'+(g===80?';stroke-dasharray:4 3':'')+'"/>'+
         '<text x="'+(L-6)+'" y="'+(y(g)+3.5)+'" text-anchor="end" style="fill:var(--ink-faint);font:10px var(--mono)">'+g+'</text>';
  });
  if(rows.length>1){
    s += '<polyline points="'+rows.map((r,i)=>x(i).toFixed(1)+","+y(r.p).toFixed(1)).join(" ")+'" style="fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round"/>';
  }
  rows.forEach((r,i)=>{
    s += '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(r.p).toFixed(1)+'" r="3.5" style="fill:var(--paper);stroke:var(--accent);stroke-width:2"><title>'+esc(r.title)+': '+r.p+'%</title></circle>';
  });
  s += '<text x="'+L+'" y="'+(H-6)+'" style="fill:var(--ink-faint);font:10px var(--mono)">older</text>'+
       '<text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end" style="fill:var(--ink-faint);font:10px var(--mono)">latest</text>';
  return s+'</svg>';
}

function fmtWhen(ts){
  try{
    const d = new Date(ts);
    return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})+" · "+d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
  }catch(e){ return ""; }
}

function renderProgress(){
  const ov = statFor(CAT_ORDER);
  const cand = weakCandidates();
  const stats = CAT_ORDER.map(cat=>({cat:cat, s:statFor([cat])})).filter(x=>x.s.n>=5);
  const weakList = stats.filter(x=>x.s.pct<80).sort((a,b)=>a.s.pct-b.s.pct).slice(0,3);
  const strongList = stats.filter(x=>x.s.pct>=80).sort((a,b)=>b.s.pct-a.s.pct).slice(0,3);
  const crow = x => '<div class="crow"><span>'+esc(CATEGORIES[x.cat].name)+'</span><b>'+x.s.pct+'%</b></div>';

  function groupHtml(title, cats){
    let rows = "";
    cats.forEach(cat=>{
      const meta = CATEGORIES[cat], st = statFor([cat]);
      if(st.n){
        rows += pbRow(meta.short, st.pct, meta.color, ' <small>'+st.n+'</small>');
      } else if(HIST[cat] && typeof HIST[cat].pct==="number"){
        rows += pbRow(meta.short, HIST[cat].pct, meta.color, ' <small>last</small>');
      } else {
        rows += '<div class="progress-topic"><span class="pt-name">'+esc(meta.short)+'</span><span class="pt-bar"></span><span class="pt-pct">—</span></div>';
      }
    });
    return '<div class="pv-group"><h3>'+esc(title)+'</h3><div class="progress-topics wide">'+rows+'</div></div>';
  }

  const last = SESS.slice(-20);
  const recent = SESS.slice(-15).reverse();
  const sessHtml = recent.length
    ? recent.map(h=>'<div class="sess-row"><div class="st"><b>'+esc(h.title)+'</b><span>'+fmtWhen(h.d)+'</span></div><div class="sc">'+h.c+'/'+h.n+' ('+h.p+'%)'+(h.t?'<br>'+fmtTime(h.t):'')+'</div></div>').join("")
    : '<p class="progress-empty">No sessions yet.</p>';

  app.innerHTML =
  topbarHtml()+
  '<div class="wrap">'+
    '<div class="pv-head"><button class="pv-back" id="pvBack" aria-label="Back to topics">←</button><h1>My progress</h1></div>'+
    '<div class="stat-row">'+
      '<div class="stat"><b>'+(ov.n?ov.pct+'%':'—')+'</b><span>Overall accuracy</span></div>'+
      '<div class="stat"><b>'+ov.seen+'/'+ALL.length+'</b><span>Questions seen</span></div>'+
      '<div class="stat"><b>'+ov.n+'</b><span>Answers recorded</span></div>'+
      '<div class="stat"><b>'+SESS.length+'</b><span>Sessions</span></div>'+
    '</div>'+
    '<div class="callouts">'+
      '<div class="panel callout weak"><h3>Needs work</h3>'+(weakList.length?weakList.map(crow).join(""):'<p class="none">Answer at least 5 questions in a topic to see where you are weakest.</p>')+'</div>'+
      '<div class="panel callout strong"><h3>Strongest</h3>'+(strongList.length?strongList.map(crow).join(""):'<p class="none">Topics at 80% or better (with 5+ answers) will show here.</p>')+'</div>'+
    '</div>'+
    '<div class="panel-actions">'+
      '<button class="btn" id="drillBtn"'+(cand.length?'':' disabled')+'>'+(cand.length?'Drill my weakest '+Math.min(20,cand.length)+' questions':'No missed questions to drill yet')+'</button>'+
    '</div>'+
    '<h2 class="section-title">Score trend</h2>'+
    '<div class="panel">'+(last.length?trendSVG(last)+'<p class="trend-cap">Last '+last.length+' session'+(last.length===1?'':'s')+'. Dashed line marks 80%.</p>':'<p class="progress-empty">Finish a session to start your trend line.</p>')+'</div>'+
    '<h2 class="section-title">Accuracy by topic</h2>'+
    '<div class="panel">'+
      groupHtml("Topic bank", LEC_ORDER)+
      groupHtml("Past-question topics", TOPIC_ORDER)+
      groupHtml("Katzung chapters", KATZUNG_ORDER)+
      groupHtml("USMLE-style (Babbini)", BABBINI_ORDER)+
      '<p class="trend-cap" style="margin-top:14px">Bars show cumulative accuracy over every answer recorded; the small number is how many answers it is based on.</p>'+
    '</div>'+
    '<h2 class="section-title">Recent sessions</h2>'+
    '<div class="panel">'+sessHtml+'</div>'+
    '<div class="result-actions" style="margin-top:22px">'+
      '<button class="btn ghost" id="pvHome">Back to topics</button>'+
      '<button class="btn danger-o" id="resetBtn">Reset progress</button>'+
    '</div>'+
  '</div>';

  document.getElementById("pvBack").addEventListener("click", ()=>nav.home());
  document.getElementById("pvHome").addEventListener("click", ()=>nav.home());
  const dr = document.getElementById("drillBtn");
  if(dr) dr.addEventListener("click", startDrill);
  document.getElementById("resetBtn").addEventListener("click", ()=>{
    if(!confirm("Erase all saved progress: per-question records, session history and last-attempt scores? This cannot be undone.")) return;
    MEM = {}; SESS = []; HIST = {};
    lsSet("pharmQuizMem", MEM); lsSet("pharmQuizSessions", SESS); lsSet("pharmQuizHistory", HIST);
    render();
  });
}

/* ---------- System back button / swipe-back ---------- */
window.addEventListener("popstate", function(e){
  const st = e.state || {v:"home", i:0};
  nav.i = st.i || 0;
  let v = st.v || "home";
  if(state.view==="quiz" && v!=="quiz"){
    const touched = Object.keys(state.answers).length>0;
    if(touched && !state.leaving && !confirm("Leave this session? Your answers in this attempt will be lost.")){
      nav.i = (st.i||0)+1;
      try{ history.pushState({v:"quiz", i:nav.i}, ""); }catch(err){}
      return;
    }
    state.leaving = false;
    leaveQuizCleanup();
  } else if(v==="quiz"){
    /* a finished or abandoned session can't be resumed from history */
    v = "home";
    try{ history.replaceState({v:"home", i:st.i||0}, ""); }catch(err){}
  }
  if(v==="results" && !state.lastResult) v = "home";
  state.view = v;
  render();
  window.scrollTo(0,0);
});

/* ---------- Keyboard support during quiz ---------- */
document.addEventListener("keydown",(e)=>{
  if(state.view!=="quiz") return;
  const s = state.session; if(!s) return;
  const q = s.list[state.idx];
  if(["1","2","3","4","5","6","7","8","9"].includes(e.key)){
    const i = parseInt(e.key,10)-1;
    if(i < q.o.length && !(state.instant && state.answers[q.id]!==undefined)){ state.answers[q.id]=i; render(); }
  } else if(e.key.length===1 && /[a-l]/i.test(e.key) && !["f"].includes(e.key.toLowerCase())){
    const i = e.key.toUpperCase().charCodeAt(0)-65;
    if(i < q.o.length && !(state.instant && state.answers[q.id]!==undefined)){ state.answers[q.id]=i; render(); }
  } else if(e.key==="ArrowRight" || e.key==="Enter"){
    const btn = document.getElementById("nextBtn");
    if(btn) btn.click();
  } else if(e.key==="ArrowLeft"){
    const btn = document.getElementById("prevBtn");
    if(btn && !btn.disabled) btn.click();
  } else if(e.key.toLowerCase()==="f"){
    const btn = document.getElementById("flagBtn");
    if(btn) btn.click();
  }
});

nav.init();
render();


</script>
