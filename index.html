/* ---------- CLI 414 topic bank (8 lecture topics, 50 each) ---------- */
lb1: [
 {"q":"Digoxin is obtained from which plant?","o":["Cinchona bark", "Foxglove (Digitalis)", "Opium poppy", "Rauwolfia"],"a":1,"ex":"Digitalis lanata and purpurea. Quinine: Cinchona. Morphine: Papaver somniferum. Reserpine: Rauwolfia serpentina.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"Penicillin was first isolated from a mould of the genus:","o":["Streptomyces", "Penicillium", "Aspergillus", "Cephalosporium"],"a":1,"ex":"Fleming (1928) observed Penicillium notatum; Florey and Chain purified it. Streptomycin comes from Streptomyces griseus.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"Human insulin is manufactured commercially by:","o":["Extraction from porcine pancreas", "Recombinant DNA technology", "Total chemical synthesis", "Extraction from bovine pancreas"],"a":1,"ex":"Recombinant DNA in E. coli or yeast. Animal insulins are largely replaced; analogues are made by modifying the gene.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"Vincristine and vinblastine are obtained from:","o":["Taxus brevifolia", "Catharanthus roseus", "Podophyllum", "Digitalis"],"a":1,"ex":"Madagascar periwinkle. Paclitaxel: Taxus. Etoposide: Podophyllum derivative.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"Which plant-drug pairing is correct?","o":["Quinine: Rauwolfia", "Morphine: Papaver somniferum", "Reserpine: Cinchona", "Digoxin: Atropa belladonna"],"a":1,"ex":"Quinine: Cinchona. Reserpine: Rauwolfia. Atropine: Atropa belladonna. Digoxin: Digitalis.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"Artemisinin, used against Plasmodium falciparum, is derived from:","o":["Artemisia annua", "Cinchona", "Taxus", "Salix"],"a":0,"ex":"Sweet wormwood (Qinghaosu). Quinine is from Cinchona; aspirin's precursor salicin is from willow (Salix).","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"Which drug originated from willow bark salicin?","o":["Paracetamol", "Aspirin", "Ibuprofen", "Diclofenac"],"a":1,"ex":"Acetylsalicylic acid was synthesised from salicylic acid, itself derived from salicin.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"Heparin is commercially extracted mainly from:","o":["Porcine intestinal mucosa", "Horse serum", "Human urine", "Bovine thyroid"],"a":0,"ex":"Unfractionated heparin comes from porcine intestinal mucosa (or bovine lung); LMWHs are made from it.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"Snake antivenom is produced from:","o":["Hyperimmunised animal serum", "Recombinant yeast culture", "Pooled human plasma extract", "Synthetic peptide library"],"a":0,"ex":"Animals are immunised with venom; IgG or Fab fragments are purified. Serum sickness and anaphylaxis can occur.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"Which drug has an inorganic (mineral) origin?","o":["Insulin", "Lithium carbonate", "Digoxin", "Morphine"],"a":1,"ex":"Lithium salts are inorganic. Other mineral-source agents: magnesium sulfate, kaolin, iron salts.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"The suffix -tinib denotes:","o":["Kinase inhibitors", "Proton pump inhibitors", "Monoclonal antibodies", "Antivirals"],"a":0,"ex":"Imatinib, erlotinib. Common stems: -mab (antibody), -vir (antiviral), -prazole (PPI), -pril (ACE inhibitor), -sartan (ARB), -olol (beta-blocker), -statin.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"The suffix -prazole denotes:","o":["H2 antagonists", "Proton pump inhibitors", "ACE inhibitors", "Statins"],"a":1,"ex":"Omeprazole, pantoprazole. H2 blockers end in -tidine.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"The suffix -mab denotes:","o":["Monoclonal antibodies", "Antifungals", "Statins", "Kinase inhibitors"],"a":0,"ex":"E.g., trastuzumab, infliximab. -zumab: humanised; -ximab: chimeric; -umab: fully human.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"Generic (nonproprietary) drug names are assigned through the:","o":["The manufacturer's board", "WHO INN programme", "FDA review only", "The pharmacists' council"],"a":1,"ex":"INNs are globally unique and public, so they are the same worldwide.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"Which type of drug name differs between manufacturers of the same drug?","o":["Chemical name", "INN", "Brand name", "Pharmacopoeial name"],"a":2,"ex":"Brand (proprietary) names are trademarked and company-specific. The chemical name describes structure (IUPAC).","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"Which name describes a drug's molecular structure?","o":["Generic name", "Brand name", "Chemical name", "Trade name"],"a":2,"ex":"The chemical (IUPAC) name gives the exact structure; it is rarely used in prescribing.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"Enalapril is best described as a:","o":["Prodrug split by esterases", "Active when given orally", "Metabolite of lisinopril", "Direct renin inhibitor"],"a":0,"ex":"Enalapril is hydrolysed to enalaprilat. Captopril and lisinopril are active as given. Other prodrugs: levodopa, clopidogrel, codeine.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"Esomeprazole is:","o":["A prodrug of omeprazole", "The S-enantiomer of omeprazole", "A salt of lansoprazole", "A metabolite of pantoprazole"],"a":1,"ex":"Single-enantiomer formulations (esomeprazole, levocetirizine) can offer better PK or fewer effects than the racemate.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"A pharmacopoeia is:","o":["A prescribers' therapeutics textbook", "Official compendium of drug standards", "A catalogue of drug reactions", "A register of pharmacists"],"a":1,"ex":"Examples: British Pharmacopoeia, USP, International Pharmacopoeia.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"The WHO concept of essential medicines refers to drugs that:","o":["Are the newest available", "Are the cheapest, whatever the efficacy", "Meet priority health needs of the population", "Are sold without a prescription"],"a":2,"ex":"Selected on public health relevance, efficacy, safety and cost-effectiveness; the model list is updated every two years.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"Enteric-coated tablets are designed to:","o":["Dissolve quickly in stomach", "Resist acid, release in gut", "Release drug over 24 hours", "Be absorbed under the tongue"],"a":1,"ex":"They protect acid-labile drugs (e.g., erythromycin) or protect the stomach (aspirin, diclofenac).","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"Which dosage form should NOT be crushed?","o":["Dispersible tablet", "Modified-release tablet", "Syrup", "Effervescent tablet"],"a":1,"ex":"Crushing destroys the release mechanism and causes dose dumping, risking toxicity.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"Which drug is commonly given by transdermal patch for motion sickness?","o":["Hyoscine", "Promethazine", "Atropine", "Ondansetron"],"a":0,"ex":"Transdermal patches give steady levels and bypass first pass. Others: fentanyl, GTN, nicotine, estradiol.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"An elixir is:","o":["An oil-in-water emulsion", "A suspension of solid particles", "A sweetened hydroalcoholic solution", "A solid powder for dilution"],"a":2,"ex":"Elixirs use alcohol-water vehicles for drugs poorly soluble in water. Linctuses are viscous cough preparations.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"The rectal route partly avoids first-pass metabolism because:","o":["Absorption occurs via lymphatics", "Lower veins bypass the portal vein", "The mucosa lacks enzymes entirely", "The rectum has poor blood supply"],"a":1,"ex":"Only the superior rectal vein drains to the portal system, so about half the dose bypasses the liver.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"Which route gives 100% bioavailability by definition?","o":["Oral", "Intramuscular", "Intravenous", "Subcutaneous"],"a":2,"ex":"No absorption step: the full dose enters the circulation directly.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"Which preparation must NOT be given intravenously?","o":["Benzathine penicillin G", "Ampicillin", "Gentamicin", "Ceftriaxone"],"a":0,"ex":"It is a depot suspension for deep IM use only; IV injection can cause embolism or cardiac arrest.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"Adding adrenaline to lignocaine for infiltration anaesthesia:","o":["Shortens its duration of action", "Prolongs action by vasoconstriction", "Increases its systemic absorption", "Reduces its anaesthetic potency"],"a":1,"ex":"Slower washout prolongs effect, reduces systemic toxicity and bleeding. Avoid in end-arteries (fingers, penis).","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"Which drug is given sublingually for an acute angina attack?","o":["Isosorbide mononitrate", "Glyceryl trinitrate", "Amlodipine", "Atenolol"],"a":1,"ex":"GTN has extensive first pass if swallowed, so sublingual gives rapid onset. Isosorbide mononitrate is oral for prophylaxis.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"The main advantage of an inhaled bronchodilator is:","o":["Higher systemic exposure", "High lung dose, low systemic", "Slower onset of action", "Greater first-pass metabolism"],"a":1,"ex":"Direct delivery gives rapid effect at small doses (e.g., salbutamol, ipratropium).","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"Which route delivers drug directly into CSF, as with spinal anaesthesia or methotrexate for meningeal leukaemia?","o":["Epidural", "Intrathecal", "Intramuscular", "Intradermal"],"a":1,"ex":"Intrathecal injection bypasses the blood-brain barrier. Epidural acts on nerve roots outside the dura.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"Why is insulin NOT given orally?","o":["It is too lipophilic", "GI proteases degrade it", "It is excreted unchanged in bile", "It is not absorbed in the colon"],"a":1,"ex":"Peptides are digested and poorly absorbed; insulin is given subcutaneously (IV in emergencies).","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"Which is required before first-in-human studies?","o":["Phase II data", "Toxicity studies in animals", "Post-marketing surveillance", "Bioequivalence study"],"a":1,"ex":"Preclinical work: in vitro pharmacology, ADME, acute and chronic toxicity (usually two species, one non-rodent), plus genotoxicity and reproductive toxicity.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"Phase I trials of cytotoxic anticancer drugs usually enrol:","o":["Healthy volunteers", "Patients with cancer", "Children", "Pregnant women"],"a":1,"ex":"These drugs are too toxic to give to healthy people, so patients are used.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"Which phase provides the pivotal data for marketing authorisation?","o":["Phase I", "Phase II", "Phase III", "Phase IV"],"a":2,"ex":"Large randomised, controlled, multicentre trials comparing the drug with placebo or standard therapy; basis of the new drug application.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"Which phase detects rare adverse effects (e.g., 1 in 10,000 patients)?","o":["Phase I", "Phase II", "Phase III", "Phase IV"],"a":3,"ex":"Phase IV is post-marketing surveillance in the general population; rare events are missed by smaller pre-approval trials.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"Phase 0 (exploratory) trials involve:","o":["Large efficacy trials in patients", "Sub-therapeutic microdoses for early PK", "Post-marketing safety surveillance", "Bioequivalence testing of generics"],"a":1,"ex":"Microdosing gives early human PK data without pharmacological effects.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"The main purpose of randomisation in a trial is to:","o":["Reduces observer bias in scoring", "Balances known and unknown confounders", "Guarantees a placebo response", "Increases the effective sample size"],"a":1,"ex":"It limits selection bias. Blinding reduces observer and participant bias.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"A washout period between treatments is essential in a:","o":["Parallel-group trial", "Crossover trial", "Case-control study", "Cohort study"],"a":1,"ex":"Each subject receives both treatments in sequence, so carry-over must be avoided.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"In a double-blind trial:","o":["Only participants know allocation", "Neither side knows allocation", "Only investigators know allocation", "Everyone knows the allocation"],"a":1,"ex":"Double-blinding reduces bias in assessing outcomes.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"Which document is the principal ethical guidance for human medical research?","o":["Declaration of Helsinki", "Hippocratic Oath", "Geneva Convention", "Alma-Ata Declaration"],"a":0,"ex":"It requires informed consent, ethical review and favourable risk-benefit balance; it followed the Nuremberg Code.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"Which agency regulates drug registration in Nigeria?","o":["NAFDAC", "MDCN", "PCN", "NMCN"],"a":0,"ex":"NAFDAC registers and regulates drugs and food. MDCN: doctors; PCN: pharmacists; NMCN: nurses and midwives.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"The thalidomide tragedy led to:","o":["Stricter pre-marketing drug testing", "A worldwide ban on sedative drugs", "Abolition of Phase IV surveillance", "Creation of the WHO in 1948"],"a":0,"ex":"Thalidomide caused phocomelia. It prompted stricter regulation (e.g., Kefauver-Harris amendments 1962) and teratogenicity testing.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"An orphan drug is one developed for:","o":["Drugs without a patent", "Drugs for rare diseases", "Drugs sold over the counter", "Drugs licensed for animals only"],"a":1,"ex":"Incentives such as market exclusivity and tax credits encourage development.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"Spontaneous ADR reporting schemes (e.g., Yellow Card) mainly detect:","o":["Drug efficacy in trials", "Rare and new adverse reactions", "Oral bioavailability of drugs", "Cost-effectiveness of therapy"],"a":1,"ex":"They generate signals but under-report and give no incidence rates.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"A drug textbook such as Katzung is which type of information source?","o":["Primary", "Secondary", "Tertiary", "Quaternary"],"a":2,"ex":"Primary: original journal articles. Secondary: indexing and abstract services (PubMed, MEDLINE). Tertiary: textbooks, formularies and reviews.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"Which is a secondary source of drug information?","o":["Report of a randomised trial", "Textbook chapter", "PubMed index", "Case report"],"a":2,"ex":"Secondary sources help locate primary literature.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"Which is the highest level of evidence?","o":["Meta-analysis of RCTs", "A single case report", "Expert committee opinion", "A large cohort study"],"a":0,"ex":"Hierarchy: expert opinion, case reports, case-control, cohort, RCT, then systematic reviews of RCTs.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"Which phase of clinical drug evaluation first tests efficacy in patients with the target disease?","o":["Phase 0", "Phase I", "Phase II", "Phase IV"],"a":2,"ex":"Phase I: safety, tolerability and PK (usually healthy volunteers). Phase II: first efficacy and dose-finding in patients. Phase III: large confirmatory trials. Phase IV: post-marketing surveillance.","src":"CLI 414 topic bank — Introduction & Drug Development"},
 {"q":"Which route of administration avoids hepatic first-pass metabolism entirely?","o":["Oral", "Intragastric tube", "Sublingual", "Intraperitoneal"],"a":2,"ex":"Sublingual veins drain to the SVC, bypassing the portal circulation. Oral, gastric tube and intraperitoneal absorption all drain into the portal vein.","src":"CLI 414 topic bank — Introduction & Drug Development"}
],

lb2: [
 {"q":"Most drugs cross biological membranes mainly by:","o":["Passive diffusion of the non-ionised form", "Carrier-mediated active transport", "Facilitated diffusion through channels", "Pinocytosis into vesicles"],"a":0,"ex":"Lipid-soluble, non-ionised molecules diffuse down their gradient; the process is not saturable and needs no energy.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Two oral products are bioequivalent when they have similar:","o":["Cmax, tmax and AUC", "Tablet colour and shape", "Molecular weight", "Excipient composition"],"a":0,"ex":"Rate (Cmax, tmax) and extent (AUC) of absorption are compared at the same molar dose.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Which feature distinguishes active transport from passive diffusion?","o":["Saturable and uses energy against a gradient", "Non-saturable and driven by the gradient", "Carrier-free and independent of energy", "Restricted to highly lipid-soluble drugs"],"a":0,"ex":"Carriers can be saturated and inhibited competitively, and they can move drug uphill.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Aspirin (pKa about 3.5) in gastric fluid at pH 2 is mostly:","o":["Ionised", "Half ionised", "Non-ionised", "Precipitated"],"a":2,"ex":"When pH is below pKa, a weak acid is mainly non-ionised. Ionised fraction rises as pH exceeds pKa.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Most oral drugs, even weak acids, are mainly absorbed from the:","o":["Stomach", "Small intestine", "Oesophagus", "Colon"],"a":1,"ex":"Huge surface area (villi, microvilli) and rich blood flow outweigh pH effects.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"P-glycoprotein in the intestinal wall:","o":["Pumps substrates back into the lumen", "Increases uptake into enterocytes", "Metabolises substrates in the mucosa", "Binds substrates in plasma"],"a":0,"ex":"The efflux pump lowers oral bioavailability of substrates such as digoxin. Rifampicin induces it; verapamil and quinidine inhibit it.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Digoxin levels rise when verapamil or quinidine is added, mainly due to:","o":["P-glycoprotein inhibition", "CYP3A4 induction", "Faster gastric emptying", "Albumin displacement"],"a":0,"ex":"Reduced efflux increases absorption and lowers renal and biliary clearance of digoxin.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Which drug speeds absorption of oral paracetamol?","o":["Atropine", "Morphine", "Metoclopramide", "Propantheline"],"a":2,"ex":"Faster gastric emptying delivers drug to the intestine sooner. Antimuscarinics and opioids delay emptying.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Absorption of which drug is reduced by milk or antacids?","o":["Paracetamol", "Metformin", "Tetracycline", "Amoxicillin"],"a":2,"ex":"Divalent and trivalent cations (Ca, Mg, Al, Fe) chelate tetracyclines and fluoroquinolones into insoluble complexes.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Absorption of griseofulvin is improved by:","o":["Fasting", "Antacids", "Cholestyramine", "A fatty meal"],"a":3,"ex":"Fat aids dissolution of this lipophilic drug.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Oral bioavailability is the:","o":["Fraction of dose reaching the systemic circulation", "Fraction of dose absorbed across the gut wall", "Fraction of dose excreted unchanged in urine", "Fraction of dose bound to plasma proteins"],"a":0,"ex":"It is the product of fraction absorbed, gut-wall escape and hepatic escape.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Absolute bioavailability is obtained by comparing oral AUC with the AUC after:","o":["Sublingual dosing", "Intramuscular dosing", "Intravenous dosing", "Another oral brand"],"a":2,"ex":"IV is 100% by definition. A different oral brand gives relative bioavailability.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"IV dose 50 mg gives AUC 100 mg.h/L. Oral 100 mg gives AUC 100 mg.h/L. Oral bioavailability is:","o":["0.25", "0.50", "1.0", "2.0"],"a":1,"ex":"F = (AUC oral x Dose IV) / (AUC IV x Dose oral) = (100 x 50) / (100 x 100) = 0.5.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"A drug has oral F = 0.2. The oral dose giving the same exposure as 10 mg IV is:","o":["20 mg", "50 mg", "100 mg", "200 mg"],"a":1,"ex":"Oral dose = IV dose / F = 10 / 0.2 = 50 mg.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Which parameter best reflects the rate of absorption?","o":["AUC", "Cmax", "Clearance", "Half-life"],"a":1,"ex":"Cmax and tmax reflect rate; AUC reflects extent.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"In flip-flop kinetics, the terminal half-life reflects:","o":["Elimination", "Distribution", "Absorption", "Metabolism"],"a":2,"ex":"Absorption is slower than elimination (e.g., sustained-release products), so it becomes rate-limiting.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Which drug is largely confined to plasma (Vd about 0.05 L/kg)?","o":["Chloroquine", "Digoxin", "Heparin", "Amiodarone"],"a":2,"ex":"Large, highly bound, polar molecules stay intravascular. Chloroquine, digoxin and amiodarone are widely tissue-bound.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Which drug has a very large Vd because of tissue sequestration?","o":["Warfarin", "Heparin", "Gentamicin", "Chloroquine"],"a":3,"ex":"Extensive tissue binding leaves little in plasma, so Vd far exceeds body volume. Dialysis is ineffective.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Acidic drugs such as warfarin bind chiefly to:","o":["Albumin", "Alpha-1 acid glycoprotein", "Transferrin", "Globulins"],"a":0,"ex":"Albumin is the main binder of acidic drugs.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Basic drugs such as propranolol and lidocaine bind chiefly to:","o":["Albumin", "Fibrinogen", "Alpha-1 acid glycoprotein", "Transferrin"],"a":2,"ex":"AAG is an acute-phase protein, so binding rises after surgery and in inflammation.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"In hypoalbuminaemia, the free fraction of phenytoin:","o":["Increases", "Decreases", "Is unchanged", "Falls to zero"],"a":0,"ex":"Less binding capacity means more free drug and toxicity risk at a normal total level.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Displacement from protein binding is clinically important mainly for drugs with:","o":["High binding and small Vd", "Low binding and large Vd", "Low binding and small Vd", "High binding and large Vd"],"a":0,"ex":"A small Vd keeps displaced drug in plasma (e.g., warfarin with sulfonamides). A large Vd dilutes the effect.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Which property favours entry of a drug into the CNS?","o":["High polarity", "High lipid solubility", "High ionisation", "Large molecular size"],"a":1,"ex":"The BBB has tight junctions and efflux pumps, so only lipophilic, non-ionised, small molecules pass easily.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Which drug type crosses the placenta most readily?","o":["Large and polar", "Highly ionised", "Highly protein-bound", "Small and lipophilic"],"a":3,"ex":"Placental transfer is mainly by passive diffusion.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"The brief action of IV thiopentone is due to:","o":["Redistribution to muscle and fat", "Rapid hepatic metabolism", "Excretion unchanged in urine", "Hydrolysis by plasma esterases"],"a":0,"ex":"Initial brain uptake is fast, then drug moves to less perfused tissues so brain level falls.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"A drug whose Vd is about 14 L in a 70 kg adult is distributed mainly in:","o":["Plasma", "Extracellular fluid", "Total body water", "Body fat"],"a":1,"ex":"Plasma about 3 L, ECF about 14 L, total body water about 42 L.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"A 500 mg IV bolus gives an extrapolated initial concentration of 10 mg/L. Vd is:","o":["5 L", "20 L", "50 L", "500 L"],"a":2,"ex":"Vd = Dose / C0 = 500 / 10 = 50 L.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Which of these are phase I reactions?","o":["Oxidation, reduction, hydrolysis", "Glucuronidation or sulfation", "Acetylation or methylation", "Glutathione conjugation"],"a":0,"ex":"Phase I adds or exposes a functional group; phase II conjugates it.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Which CYP isoform metabolises the largest share of drugs?","o":["CYP2E1", "CYP1A2", "CYP2B6", "CYP3A4"],"a":3,"ex":"CYP3A4 is abundant in liver and gut and handles about half of marketed drugs.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"A CYP2D6 poor metaboliser given codeine will most likely have:","o":["Poor analgesia", "Morphine toxicity", "Faster onset", "Marked sedation"],"a":0,"ex":"Codeine needs CYP2D6 conversion to morphine. Ultra-rapid metabolisers risk toxicity.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Reduced clopidogrel efficacy is linked to loss-of-function variants of:","o":["CYP2D6", "CYP2C19", "CYP1A2", "CYP3A5"],"a":1,"ex":"Clopidogrel is a prodrug activated mainly by CYP2C19.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Grapefruit juice raises the bioavailability of:","o":["Amoxicillin", "Metformin", "Simvastatin", "Atenolol"],"a":2,"ex":"It inhibits intestinal CYP3A4, increasing exposure and myopathy risk with simvastatin.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Which pair of drugs are both enzyme inducers?","o":["Phenytoin and carbamazepine", "Erythromycin and ketoconazole", "Cimetidine and ciprofloxacin", "Valproate and fluconazole"],"a":0,"ex":"Other inducers: rifampicin, phenobarbital, St John's wort. The other pairs inhibit CYPs.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Rifampicin can cause oral contraceptive failure through:","o":["Reduced gut absorption by chelation", "Competition for protein binding", "Induction of oestrogen metabolism", "Increased renal excretion"],"a":2,"ex":"Induced CYP3A4 and UGT lower hormone levels, so advise alternative contraception.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Which of these is a phase II (conjugation) reaction?","o":["Oxidation", "Hydrolysis", "Glucuronidation", "Reduction"],"a":2,"ex":"Phase II conjugates with glucuronide, sulfate, acetyl or glutathione, making drugs more polar.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Chloramphenicol causes grey baby syndrome due to immature:","o":["Glucuronyl transferase", "Alcohol dehydrogenase", "Pseudocholinesterase", "Acetyltransferase"],"a":0,"ex":"Neonates conjugate poorly, so the drug accumulates.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"The hepatotoxic metabolite of paracetamol is:","o":["Glucuronide", "NAPQI", "Sulfate conjugate", "Paraminophenol"],"a":1,"ex":"Excess NAPQI depletes glutathione. N-acetylcysteine replenishes it.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Which of these is a prodrug?","o":["Digoxin", "Atenolol", "Levodopa", "Gentamicin"],"a":2,"ex":"Levodopa is decarboxylated to dopamine. Other prodrugs: enalapril, codeine, clopidogrel.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Which drug has high hepatic extraction and low oral bioavailability?","o":["Diazepam", "Theophylline", "Phenobarbital", "Propranolol"],"a":3,"ex":"Lidocaine, GTN, morphine and propranolol are largely removed on first pass.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Hepatic clearance of a high-extraction drug depends mainly on:","o":["Hepatic blood flow", "Enzyme activity", "Plasma protein binding", "Renal function"],"a":0,"ex":"Flow-limited clearance: propranolol, lidocaine. Low-extraction drugs depend on enzyme activity and binding.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Heart failure lowers lidocaine clearance chiefly by:","o":["Enzyme induction", "Reduced hepatic blood flow", "Raised albumin levels", "Increased renal blood flow"],"a":1,"ex":"Lidocaine is flow-limited, so the infusion rate must be reduced.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Clearance is defined as the:","o":["Volume of plasma cleared per unit time", "Amount of drug eliminated per hour", "Fraction of dose excreted in urine", "Concentration divided by dose given"],"a":0,"ex":"CL = rate of elimination / plasma concentration.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Vd is 70 L and clearance is 7 L/h. The half-life is about:","o":["0.7 h", "6.9 h", "10 h", "49 h"],"a":1,"ex":"t1/2 = 0.693 x Vd / CL = 0.693 x 10 = 6.9 h.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Which of these is NOT a renal process?","o":["Glomerular filtration", "Tubular secretion", "Biliary secretion", "Tubular reabsorption"],"a":2,"ex":"Biliary excretion is hepatic.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Probenecid prolongs the action of penicillin by:","o":["Increasing GFR", "Blocking tubular secretion", "Alkalinising the urine", "Inducing hepatic metabolism"],"a":1,"ex":"It competes for organic anion transporters in the proximal tubule.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"To enhance renal excretion of aspirin or phenobarbital, urine should be:","o":["Acidified", "Alkalinised", "Left neutral", "Concentrated"],"a":1,"ex":"Ion trapping: weak acids are more ionised in alkaline urine and are not reabsorbed.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Urinary acidification enhances excretion of:","o":["Aspirin", "Phenobarbital", "Amphetamine", "Methotrexate"],"a":2,"ex":"Weak bases are ionised and trapped in acid urine.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Enterohepatic circulation requires:","o":["Renal secretion, then reabsorption", "Biliary excretion, then reabsorption", "Hepatic induction, then metabolism", "Gastric trapping, then excretion"],"a":1,"ex":"Glucuronides are hydrolysed by gut bacteria and the free drug is reabsorbed, prolonging action (e.g., oestrogens, digoxin).","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"Which drug shows saturable elimination within the therapeutic range?","o":["Penicillin G", "Gentamicin", "Phenytoin", "Digoxin"],"a":2,"ex":"Enzymes saturate, so small dose rises give disproportionate level rises. Ethanol behaves similarly.","src":"CLI 414 topic bank — Pharmacokinetics"},
 {"q":"In first-order elimination:","o":["A constant fraction is eliminated per hour", "A constant amount is eliminated per hour", "Clearance falls as dose rises", "Half-life increases with dose"],"a":0,"ex":"Rate is proportional to concentration; half-life stays constant.","src":"CLI 414 topic bank — Pharmacokinetics"}
],

lb3: [
 {"q":"With a constant IV infusion, about 94% of the plateau concentration is reached after:","o":["1 half-life", "2 half-lives", "4 half-lives", "8 half-lives"],"a":2,"ex":"Fractions reached: 50%, 75%, 87.5%, 93.75% at 1 to 4 half-lives; about 97% at 5.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"The time needed to reach plateau in a continuous infusion is determined by:","o":["Infusion rate", "Elimination half-life", "Loading dose", "Bioavailability"],"a":1,"ex":"Plateau time depends only on t1/2; infusion rate sets the height of the plateau.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"An infusion of 10 mg/h in a patient with clearance 5 L/h gives a plateau of:","o":["0.5 mg/L", "2 mg/L", "5 mg/L", "50 mg/L"],"a":1,"ex":"Css = infusion rate / CL = 10 / 5 = 2 mg/L.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"Doubling a constant infusion rate has what effect?","o":["Css doubles; time to plateau unchanged", "Css doubles; time to plateau halves", "Css is unchanged; plateau comes sooner", "Css doubles; time to plateau doubles"],"a":0,"ex":"Css = rate / CL scales with rate; time to plateau depends on half-life only.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"A loading dose is most useful when a drug has:","o":["A long half-life and urgent need", "A very short half-life", "A tiny volume of distribution", "Complete first-pass loss"],"a":0,"ex":"Without it, steady state takes 4 to 5 half-lives (e.g., digoxin, amiodarone, phenytoin).","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"Vd 40 L, target concentration 5 mg/L, F = 1. The loading dose is:","o":["8 mg", "40 mg", "200 mg", "400 mg"],"a":2,"ex":"Loading dose = Vd x Ctarget / F = 40 x 5 = 200 mg.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"The loading dose depends mainly on:","o":["Clearance", "Volume of distribution", "Half-life", "Renal function"],"a":1,"ex":"It fills the distribution volume to the target level.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"The maintenance dose rate depends mainly on:","o":["Volume of distribution", "Protein binding", "Clearance", "Receptor affinity"],"a":2,"ex":"Maintenance rate = CL x Css / F; it replaces drug eliminated.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"CL 5 L/h, target Css 2 mg/L, F = 0.5. The oral maintenance dose rate is:","o":["5 mg/h", "10 mg/h", "20 mg/h", "40 mg/h"],"a":2,"ex":"Dose rate = CL x Css / F = 5 x 2 / 0.5 = 20 mg/h.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"In renal failure, the loading dose of a renally cleared drug such as gentamicin is:","o":["Usually unchanged", "Cut by half", "Raised by half", "Omitted entirely"],"a":0,"ex":"Vd is largely unchanged; only the maintenance dose or interval needs adjusting.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"If doses are given at an interval equal to the half-life, the accumulation factor is:","o":["1", "2", "4", "8"],"a":1,"ex":"Accumulation = 1 / (1 - e^-k.tau) = 1 / (1 - 0.5) = 2.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"If the dosing interval is twice the half-life, the accumulation factor is about:","o":["1.33", "2", "3", "4"],"a":0,"ex":"1 / (1 - 0.25) = 1.33.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"Fluctuation between peak and trough is reduced by:","o":["Smaller doses at shorter intervals", "Larger doses at longer intervals", "A larger loading dose", "Higher bioavailability"],"a":0,"ex":"The average level is unchanged but swings are smaller. Same logic favours extended-release products.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"Splitting the same total daily dose into more frequent smaller doses changes the average steady-state level:","o":["Not at all", "By doubling it", "By halving it", "By raising it slightly"],"a":0,"ex":"Cavg = F x Dose / (CL x tau); only total dose per day matters.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"500 mg every 12 h, F = 1, CL 5 L/h. The average steady-state concentration is:","o":["0.8 mg/L", "8.3 mg/L", "83 mg/L", "6.0 mg/L"],"a":1,"ex":"Cavg = 500 / (5 x 12) = 8.3 mg/L.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"A drug has t1/2 of 6 h. Its elimination rate constant is about:","o":["0.06 per h", "0.12 per h", "0.23 per h", "0.69 per h"],"a":1,"ex":"k = 0.693 / t1/2 = 0.693 / 6 = 0.12 per h.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"What fraction of drug remains after 3 half-lives?","o":["25%", "12.5%", "6.25%", "3%"],"a":1,"ex":"1/2 x 1/2 x 1/2 = 1/8 = 12.5%.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"A drug has t1/2 of 8 h. It is essentially cleared (about 97%) after:","o":["8 h", "16 h", "40 h", "80 h"],"a":2,"ex":"Five half-lives = 40 h.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"Plasma level falls from 80 to 20 mg/L in 12 h (first-order). The half-life is:","o":["3 h", "6 h", "12 h", "24 h"],"a":1,"ex":"Two half-lives passed (80 to 40 to 20), so t1/2 = 6 h.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"The Cockcroft-Gault estimate of creatinine clearance uses:","o":["Age, weight, sex and creatinine", "Age, height and serum urea", "Weight, urine volume and sodium", "Creatinine and haematocrit"],"a":0,"ex":"CrCl = (140 - age) x weight / (72 x creatinine), multiplied by 0.85 in women.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"A normal creatinine in a frail elderly woman can mislead because:","o":["Low muscle mass lowers creatinine output", "High muscle mass raises creatinine", "Tubular creatinine secretion rises", "Creatinine binds strongly to albumin"],"a":0,"ex":"GFR may be much lower than the creatinine suggests, so renally cleared drugs may accumulate.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"Once-daily gentamicin exploits:","o":["Concentration-dependent killing", "Time-dependent killing", "Absence of nephrotoxicity", "A very short half-life"],"a":0,"ex":"High peaks kill faster and a post-antibiotic effect persists; renal uptake saturates, reducing toxicity.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"Efficacy of penicillins correlates best with:","o":["Time above MIC", "Peak-to-MIC ratio", "Volume of distribution", "Urinary pH"],"a":0,"ex":"Beta-lactams are time-dependent, so frequent or prolonged dosing helps.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"The pharmacodynamic index used for vancomycin dosing is:","o":["Peak/MIC", "Time above MIC", "AUC/MIC", "Cmax alone"],"a":2,"ex":"An AUC/MIC of about 400 to 600 is the usual target.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"Digoxin needs a loading dose because of its:","o":["Rapid hepatic first pass", "Very low protein binding", "Large Vd and long half-life", "Short elimination half-life"],"a":2,"ex":"Vd is about 7 L/kg and t1/2 about 36 h, so steady state takes about a week.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"Digoxin levels should be sampled at least:","o":["30 min after the dose", "1 h after the dose", "Immediately after dosing", "6 h after the dose"],"a":3,"ex":"Earlier samples fall in the distribution phase and overestimate tissue effect.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"Phenytoin doses are raised in small steps because:","o":["Enzymes saturate at usual levels", "Its half-life is extremely short", "It is mostly cleared renally", "It has no protein binding"],"a":0,"ex":"Michaelis-Menten kinetics: small dose rises can cause disproportionate level rises.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"A steady-state lithium level is conventionally sampled:","o":["1 h post-dose", "12 h post-dose", "3 h post-dose", "6 h post-dose"],"a":1,"ex":"The 12 h level reflects trough; narrow therapeutic index requires monitoring.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"Which drug raises lithium levels?","o":["Acetazolamide", "Theophylline", "Sodium bicarbonate", "Hydrochlorothiazide"],"a":3,"ex":"Thiazides, ACE inhibitors and NSAIDs reduce lithium excretion. Acetazolamide, theophylline and bicarbonate increase it.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"Which change increases theophylline clearance?","o":["Heart failure", "Cirrhosis", "Cigarette smoking", "Ciprofloxacin co-treatment"],"a":2,"ex":"Smoking induces CYP1A2. Heart failure, cirrhosis and fluoroquinolones lower clearance.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"A hydrophilic drug such as gentamicin in an obese patient is dosed by:","o":["Actual body weight", "Ideal or adjusted weight", "Height alone", "Age alone"],"a":1,"ex":"Hydrophilic drugs distribute into lean mass and ECF, so actual weight overdoses.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"Cytotoxic drug doses are usually based on:","o":["Age", "Plasma volume", "Body surface area", "Height alone"],"a":2,"ex":"BSA correlates better with metabolic rate and cardiac output than weight does.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"Neonates have prolonged half-lives of many drugs because of:","o":["Immature liver and kidneys", "Higher albumin levels", "Faster glomerular filtration", "Stronger enzyme induction"],"a":0,"ex":"Glucuronidation and GFR mature over weeks to months.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"Dose reduction in the elderly is mostly due to:","o":["Increased gut absorption", "Reduced renal clearance", "Higher albumin", "Greater hepatic mass"],"a":1,"ex":"GFR falls with age; lean mass and albumin also fall.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"In cirrhosis, oral bioavailability of high-extraction drugs:","o":["Increases", "Decreases", "Is unchanged", "Falls to zero"],"a":0,"ex":"Reduced first-pass metabolism and portosystemic shunting raise exposure (propranolol, morphine).","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"Aminophylline contains 80% theophylline. To deliver 400 mg theophylline you need aminophylline:","o":["320 mg", "400 mg", "500 mg", "800 mg"],"a":2,"ex":"400 / 0.8 = 500 mg. Salt factor corrects for the active fraction.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"IV 100 mg is to be converted to oral for a drug with F = 0.25. The oral dose is:","o":["25 mg", "100 mg", "250 mg", "400 mg"],"a":3,"ex":"Oral dose = IV dose / F = 100 / 0.25 = 400 mg.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"A trough sample should be drawn:","o":["Just before the next dose", "One hour after the dose", "At peak absorption time", "30 min after infusion ends"],"a":0,"ex":"It reflects the lowest level in the interval.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"A peak gentamicin level is usually drawn:","o":["30 to 60 min post-infusion", "Just before next dose (trough)", "6 hours after the dose", "12 hours after the dose"],"a":0,"ex":"Sampling after distribution but near the peak assesses efficacy.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"Therapeutic drug monitoring is most valuable for drugs with:","o":["Easily measured clinical effect", "Wide safety margin", "Narrow therapeutic index", "Irreversible action"],"a":2,"ex":"Examples: digoxin, lithium, phenytoin, aminoglycosides, vancomycin, theophylline, ciclosporin.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"Therapeutic drug monitoring is LEAST useful for:","o":["Phenytoin", "Gentamicin", "Amlodipine", "Digoxin"],"a":2,"ex":"Effect is directly measurable (blood pressure) and the safety margin is wide.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"After an infusion at plateau is stopped, the level falls to about 25% after:","o":["1 half-life", "2 half-lives", "3 half-lives", "4 half-lives"],"a":1,"ex":"Two half-lives leave 25%.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"Halving the dosing interval while keeping the same dose per administration will:","o":["Halve the average Css", "Leave Css unchanged", "Quadruple the average Css", "Double the average Css"],"a":3,"ex":"Cavg = F x Dose / (CL x tau); halving tau doubles the dose rate.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"Time to steady state with repeated dosing is determined by:","o":["Dose size", "Dosing frequency", "Elimination half-life", "Bioavailability"],"a":2,"ex":"About 4 to 5 half-lives regardless of dose or interval.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"Half-life lengthens when:","o":["Clearance rises", "Volume of distribution falls", "Clearance falls", "Hepatic blood flow rises"],"a":2,"ex":"t1/2 = 0.693 x Vd / CL.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"Measured steady-state level is 4 mg/L on 200 mg/day; target is 8 mg/L (linear kinetics). The new dose is:","o":["300 mg/day", "400 mg/day", "600 mg/day", "800 mg/day"],"a":1,"ex":"New dose = old dose x target / measured = 200 x 8 / 4 = 400 mg/day.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"Doubling the dose of phenytoin near the therapeutic range will probably:","o":["Double the level exactly", "Halve the level", "Leave the level unchanged", "Raise it by more than double"],"a":3,"ex":"Saturable metabolism makes levels rise disproportionately.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"Warfarin's anticoagulant effect is delayed 2 to 3 days because:","o":["Slow gut absorption", "It is a prodrug needing activation", "Clotting factors must decay", "Very high protein binding"],"a":2,"ex":"Clotting factors II, VII, IX and X have half-lives of 6 to 60 h.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"In renal impairment, aminoglycosides are best adjusted by:","o":["Shortening the dosing interval", "Switching to oral dosing instead", "Raising each dose given", "Longer interval, checking troughs"],"a":3,"ex":"Reduced clearance prolongs half-life; trough monitoring guards against nephro- and ototoxicity.","src":"CLI 414 topic bank — Dosage Regimens"},
 {"q":"Pregnancy changes the clearance of many renally cleared drugs by:","o":["Lowering GFR", "Leaving it fixed", "Raising GFR", "Cutting Vd sharply"],"a":2,"ex":"GFR rises about 50%, and Vd increases with plasma volume.","src":"CLI 414 topic bank — Dosage Regimens"}
],

lb4: [
 {"q":"A receptor is best defined as a:","o":["Macromolecule binding drug, signalling", "Enzyme that breaks down the drug", "Plasma protein that carries drug", "Membrane pump removing the drug"],"a":0,"ex":"Receptors bind ligands with specificity and transduce a response; they are mostly proteins.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"An agonist is a ligand that:","o":["Binds and activates the receptor", "Binds without activating it", "Binds and lowers basal activity", "Binds a different site only"],"a":0,"ex":"An agonist has both affinity and intrinsic efficacy.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"Affinity describes the:","o":["Tendency to bind the receptor", "Ability to activate the receptor", "Concentration giving half effect", "Maximal effect obtainable"],"a":0,"ex":"Affinity is binding tendency; efficacy is activation after binding.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"Intrinsic efficacy is the:","o":["Ability to activate receptor", "Strength of binding to receptor", "Dose giving half-maximal effect", "Dose causing toxicity"],"a":0,"ex":"Efficacy distinguishes full agonists, partial agonists and antagonists (zero efficacy).","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"Kd is the concentration at which:","o":["Half the receptors are occupied", "Effect is at its maximum", "Half of animals have died", "Half of subjects respond"],"a":0,"ex":"Kd is the inverse of affinity: lower Kd means higher affinity.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"EC50 is the concentration that produces:","o":["50% receptor occupancy", "50% of the maximal effect", "Lethality in half of animals", "Toxicity in half of subjects"],"a":1,"ex":"With spare receptors, EC50 is lower than Kd.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"Buprenorphine at mu opioid receptors is a:","o":["Full agonist", "Competitive antagonist", "Partial agonist", "Inverse agonist"],"a":2,"ex":"Ceiling on respiratory depression, but can precipitate withdrawal in opioid-dependent patients.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"A partial agonist given with a full agonist at the same receptor acts as a:","o":["Additive agonist", "Functional antagonist", "Inverse agonist", "Allosteric potentiator"],"a":1,"ex":"It competes for receptors but has lower efficacy, so it reduces the maximal response.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"An inverse agonist:","o":["Lowers constitutive receptor activity", "Raises constitutive receptor activity", "Blocks without altering basal activity", "Fully mimics the natural agonist"],"a":0,"ex":"Seen with receptors that have basal signalling (e.g., some beta-blockers and H1 antihistamines).","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"A neutral antagonist:","o":["Blocks agonist and lowers basal tone", "Blocks agonist with no basal effect", "Blocks agonist and raises basal tone", "Weakly activates the receptor itself"],"a":1,"ex":"It occupies the receptor without changing constitutive activity.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"A competitive reversible antagonist causes:","o":["Lower Emax, curve not shifted", "Parallel right shift, same Emax", "Parallel left shift, same Emax", "Flattened curve, same EC50"],"a":1,"ex":"Overcome by more agonist: EC50 rises, Emax is preserved.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"Phenoxybenzamine, an irreversible antagonist, produces:","o":["Lower Emax, not surmountable", "Parallel rightward shift only", "Parallel leftward shift", "Unchanged response curve"],"a":0,"ex":"Covalent binding removes receptors, so extra agonist cannot restore the maximum once spare receptors are exhausted.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"The pA2 value measures:","o":["Antagonist affinity", "Agonist efficacy", "Agonist potency", "Drug half-life"],"a":0,"ex":"pA2 is the negative log of antagonist concentration that shifts the agonist curve two-fold (Schild analysis).","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"Adrenaline reversing histamine-induced bronchoconstriction is:","o":["Competitive antagonism", "Chemical antagonism", "Physiological antagonism", "Pharmacokinetic antagonism"],"a":2,"ex":"Two agonists act on different receptors with opposing effects.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"Which is an example of chemical antagonism?","o":["Naloxone and morphine", "Protamine and heparin", "Atropine and acetylcholine", "Flumazenil and diazepam"],"a":1,"ex":"Protamine (basic) binds heparin (acidic) directly; the others are receptor antagonism.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"Benzodiazepines act as:","o":["Allosteric GABA-A modulators", "Direct GABA-A agonists", "GABA-A channel blockers", "GABA-B receptor agonists"],"a":0,"ex":"They increase the frequency of chloride channel opening when GABA is bound.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"The nicotinic acetylcholine receptor is a:","o":["G-protein coupled receptor", "Ligand-gated ion channel", "Tyrosine kinase receptor", "Nuclear receptor"],"a":1,"ex":"Ligand-gated channels respond in milliseconds.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"Effects mediated by nuclear receptors typically take:","o":["Milliseconds", "Seconds", "Hours to days", "Under a second"],"a":2,"ex":"They alter gene transcription and protein synthesis.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"The insulin receptor is a:","o":["GPCR", "Ligand-gated channel", "Receptor tyrosine kinase", "Intracellular receptor"],"a":2,"ex":"Ligand binding triggers autophosphorylation and downstream signalling.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"Corticosteroid receptors are:","o":["Intracellular, alter transcription", "Surface GPCRs raising cAMP", "Surface ion channels, fast", "Surface kinase receptors"],"a":0,"ex":"Lipid-soluble ligands cross the membrane and the complex binds DNA response elements.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"Beta1 receptor signalling occurs through:","o":["Gi, lowering cAMP", "Gq, raising IP3", "Gs, raising cAMP", "Direct ion flux"],"a":2,"ex":"Gs stimulates adenylyl cyclase.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"Alpha2 receptor signalling occurs through:","o":["Gs, raising cAMP", "Gi, lowering cAMP", "Gq, raising IP3", "Opening of Na channels"],"a":1,"ex":"Gi inhibits adenylyl cyclase (also M2 and D2).","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"Muscarinic M3 receptor signalling occurs through:","o":["Gs, raising cAMP", "Gi, lowering cAMP", "Gq, activating PLC", "Tyrosine kinase pathway"],"a":2,"ex":"Gq (M1, M3, M5, alpha1, H1) gives IP3 and DAG.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"IP3 acts by:","o":["Activating protein kinase C directly", "Releasing Ca2+ from the ER", "Raising cAMP", "Opening membrane Na channels"],"a":1,"ex":"DAG activates PKC; IP3 mobilises stored calcium.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"cAMP exerts its effects mainly by activating:","o":["Protein kinase C", "Calcineurin", "Protein kinase A", "Protein kinase G"],"a":2,"ex":"PKA phosphorylates target proteins.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"Nitrates relax smooth muscle through:","o":["IP3 releasing calcium", "Inhibiting adenylyl cyclase", "NO activating guanylyl cyclase", "Opening potassium channels"],"a":2,"ex":"cGMP activates PKG, lowering intracellular calcium.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"Sildenafil acts by:","o":["Inhibiting PDE3, raising cAMP", "Inhibiting PDE5, raising cGMP", "Blocking alpha1 receptors", "Activating guanylyl cyclase"],"a":1,"ex":"It prolongs cGMP action; nitrates are contraindicated with it.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"Caffeine and theophylline act partly by:","o":["Activating beta2 receptors", "Blocking muscarinic receptors", "Blocking adenosine receptors", "Blocking H1 receptors"],"a":2,"ex":"They also inhibit phosphodiesterases.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"Beta-arrestin binding after receptor phosphorylation causes:","o":["Sensitisation", "Desensitisation", "Upregulation", "Spare receptor formation"],"a":1,"ex":"GRK phosphorylation recruits arrestin, uncoupling the receptor from G protein.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"Chronic salbutamol use leads to:","o":["Receptor downregulation and tolerance", "Receptor upregulation and supersensitivity", "No receptor change", "Increased drug metabolism"],"a":0,"ex":"Chronic agonist exposure reduces receptor number and response.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"Abrupt stopping of long-term propranolol can cause rebound tachycardia because of:","o":["Receptor downregulation", "Receptor upregulation", "Enzyme induction", "Pharmacokinetic tolerance"],"a":1,"ex":"Chronic blockade upregulates receptors; taper beta-blockers.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"Increased sensitivity of a denervated tissue to agonists is called:","o":["Tachyphylaxis", "Tolerance", "Denervation supersensitivity", "Desensitisation"],"a":2,"ex":"Receptor upregulation after loss of neurotransmitter.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"A rapidly diminishing response over minutes to repeated ephedrine doses is:","o":["Idiosyncrasy", "Tachyphylaxis", "Hypersensitivity", "Potentiation"],"a":1,"ex":"Depletion of releasable noradrenaline stores explains it.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"Spare receptors imply that:","o":["Full response at partial occupancy", "Full response needs full occupancy", "Drug acts at two receptors", "Receptors are all inactive"],"a":0,"ex":"EC50 is lower than Kd.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"Drugs A and B have equal Emax. EC50 of A is 1 mg and of B is 10 mg. Which is correct?","o":["A is more potent, equal efficacy", "B is more potent, equal efficacy", "A is more efficacious, equal potency", "Equal in potency and efficacy"],"a":0,"ex":"Potency reflects EC50 (lower is more potent); efficacy is Emax.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"Compared with hydrochlorothiazide, furosemide has greater:","o":["Efficacy (higher Emax)", "Potency (lower EC50)", "Affinity", "Oral bioavailability"],"a":0,"ex":"Loop diuretics produce a larger maximal diuresis.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"A quantal dose-response curve plots:","o":["Response magnitude in one subject", "Proportion responding against dose", "Plasma concentration over time", "Receptor occupancy against dose"],"a":1,"ex":"It is an all-or-none response across a population.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"ED50 on a quantal curve is the dose that:","o":["Is effective in 50% of subjects", "Gives half-maximal tissue response", "Is lethal to 50% of animals", "Occupies half the receptors"],"a":0,"ex":"TD50 and LD50 are defined analogously.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"Therapeutic index is calculated as:","o":["ED50 / TD50", "TD50 / ED50", "EC50 / Kd", "Emax / EC50"],"a":1,"ex":"TI = TD50 (or LD50) / ED50. Larger is safer.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"The certain safety factor is:","o":["LD1 / ED99", "LD50 / ED50", "ED50 / LD50", "ED99 / LD1"],"a":0,"ex":"It compares a barely lethal dose with a dose effective in nearly everyone.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"Which drug has a narrow therapeutic index?","o":["Amoxicillin", "Atorvastatin", "Digoxin", "Cetirizine"],"a":2,"ex":"Others: lithium, warfarin, phenytoin, theophylline, aminoglycosides.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"A steep dose-response curve means:","o":["A wide dose range for full response", "A narrow dose range for full response", "Low efficacy", "Low affinity"],"a":1,"ex":"Small dose changes move the response from minimal to maximal.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"A competitive antagonist changes agonist potency by:","o":["Increasing it", "Decreasing it", "Increasing efficacy", "Decreasing efficacy"],"a":1,"ex":"Higher agonist concentration is needed (EC50 rises).","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"A non-competitive antagonist:","o":["Decreases Emax", "Decreases EC50", "Increases Emax", "Leaves Emax unchanged"],"a":0,"ex":"Agonist cannot overcome the block.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"Overcoming a competitive antagonist requires:","o":["Lowering agonist concentration", "Raising agonist concentration", "Adding a non-competitive antagonist", "Giving enzyme inducers"],"a":1,"ex":"The block is surmountable.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"Which drug acts by enzyme inhibition?","o":["Salbutamol", "Atropine", "Captopril", "Nifedipine"],"a":2,"ex":"Captopril inhibits ACE. Others act at receptors or channels.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"Which drug acts on a transport protein?","o":["Propranolol", "Captopril", "Losartan", "Omeprazole"],"a":3,"ex":"Omeprazole inhibits the gastric H+/K+ ATPase.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"Nifedipine acts by:","o":["Blocking L-type Ca channels", "Blocking sodium channels", "Opening potassium channels", "Blocking beta receptors"],"a":0,"ex":"It relaxes arterial smooth muscle.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"As the dose of a drug is increased, receptor selectivity tends to:","o":["Rise", "Stay constant", "Fall", "Depend on half-life"],"a":2,"ex":"At higher doses, drugs bind additional receptor subtypes.","src":"CLI 414 topic bank — Pharmacodynamics"},
 {"q":"Most drug-receptor interactions involve:","o":["Strong covalent bonds", "Weak reversible bonds", "Peptide bonds", "Disulfide bridges"],"a":1,"ex":"Ionic, hydrogen and van der Waals bonds; covalent binding is rare (e.g., phenoxybenzamine, aspirin).","src":"CLI 414 topic bank — Pharmacodynamics"}
],

lb5: [
 {"q":"Polypharmacy means the:","o":["Concurrent use of many medicines", "Use of one drug at high dose", "Use of herbal products alone", "Prescribing by several doctors"],"a":0,"ex":"It raises the risk of interactions, ADRs and non-adherence, especially in the elderly.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Which is a pharmacokinetic interaction?","o":["Alcohol plus benzodiazepine sedation", "Antacid cutting tetracycline absorption", "Propranolol opposing salbutamol effect", "Aspirin adding to warfarin bleeding"],"a":1,"ex":"Chelation reduces absorption. The others are pharmacodynamic.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Synergism means that the combined effect:","o":["Exceeds the sum of each effect", "Equals the sum of each effect", "Is below the sum of each effect", "Is abolished by one drug"],"a":0,"ex":"Additive: 1 + 1 = 2. Synergistic: 1 + 1 > 2.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"A drug with no effect alone that enhances another drug's effect shows:","o":["Additive effect", "Potentiation", "Antagonism", "Tolerance"],"a":1,"ex":"Example: clavulanate with amoxicillin.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"The synergy of co-trimoxazole arises from:","o":["Sequential folate blockade", "Hepatic enzyme induction", "Albumin binding displacement", "Raised urinary pH"],"a":0,"ex":"Sulfamethoxazole blocks dihydropteroate synthase; trimethoprim blocks dihydrofolate reductase.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Clavulanic acid enhances amoxicillin by:","o":["Inducing CYP3A4", "Blocking tubular secretion", "Inhibiting beta-lactamase", "Raising gut absorption"],"a":2,"ex":"It protects the beta-lactam ring from bacterial enzymes.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Neural tube defects are associated with in-utero exposure to:","o":["Amoxicillin", "Valproate", "Metformin", "Salbutamol"],"a":1,"ex":"Also carbamazepine. Folic acid supplementation lowers risk.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Carbidopa improves levodopa therapy by:","o":["Blocking peripheral decarboxylation", "Blocking central dopamine receptors", "Inhibiting MAO-A", "Raising renal clearance"],"a":0,"ex":"More levodopa reaches the brain and peripheral nausea and hypotension fall.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Which is a CYP450 enzyme inducer?","o":["Ketoconazole", "Cimetidine", "Rifampicin", "Grapefruit juice"],"a":2,"ex":"Inducers: rifampicin, phenytoin, carbamazepine, phenobarbital, St John's wort, chronic alcohol.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Which pair are both enzyme inhibitors?","o":["Ketoconazole and erythromycin", "Rifampicin and phenytoin", "Carbamazepine and phenobarbital", "Smoking and chronic alcohol"],"a":0,"ex":"Others: cimetidine, ciprofloxacin, fluconazole, valproate, grapefruit juice.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Which drug most likely raises INR in a patient stable on warfarin?","o":["Fluconazole", "Rifampicin", "Carbamazepine", "Phenobarbital"],"a":0,"ex":"Fluconazole inhibits CYP2C9 (S-warfarin). The others induce metabolism.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Aspirin plus warfarin increases bleeding mainly through:","o":["Platelet block plus mucosal injury", "Raised warfarin clearance", "Reduced vitamin K absorption", "Hepatic enzyme induction"],"a":0,"ex":"Pharmacodynamic interaction; avoid unless clearly indicated.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Cholestyramine given with warfarin:","o":["Binds drug in gut, lowering INR", "Increases INR", "Induces CYP2C9", "Displaces drug from albumin"],"a":0,"ex":"Bile acid resins bind many drugs; separate dosing by 4 to 6 h.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Digoxin toxicity risk is increased by:","o":["Hyperkalaemia", "Hypokalaemia", "Hypernatraemia", "Hypocalcaemia"],"a":1,"ex":"Low K+ increases digoxin binding to Na/K ATPase. Loop and thiazide diuretics provoke it.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Sildenafil given with isosorbide dinitrate risks:","o":["Severe hypotension", "Hyperkalaemia", "Serotonin syndrome", "Bleeding"],"a":0,"ex":"Both raise cGMP; the combination is contraindicated.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Combining an SSRI with a MAO inhibitor risks:","o":["Neuroleptic malignant syndrome", "Serotonin syndrome", "Malignant hyperthermia", "Cholinergic crisis"],"a":1,"ex":"Allow a washout (about 2 weeks, 5 weeks after fluoxetine).","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"An ACE inhibitor combined with spironolactone risks:","o":["Hypokalaemia", "Hypernatraemia", "Hyperkalaemia", "Hypercalcaemia"],"a":2,"ex":"Both reduce potassium excretion.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Furosemide with gentamicin increases the risk of:","o":["Hepatotoxicity", "Pancreatitis", "Ototoxicity", "Hyperglycaemia"],"a":2,"ex":"Additive ear and kidney toxicity.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"NSAIDs increase methotrexate toxicity by:","o":["Reducing its renal excretion", "Inducing its metabolism", "Increasing gut absorption", "Raising albumin binding"],"a":0,"ex":"Reduced renal blood flow and tubular secretion; also seen with trimethoprim and penicillins.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Allopurinol increases azathioprine toxicity by inhibiting:","o":["Xanthine oxidase", "Dihydrofolate reductase", "CYP2D6", "Acetylcholinesterase"],"a":0,"ex":"6-mercaptopurine is inactivated by xanthine oxidase; reduce the dose to a quarter.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Clarithromycin with simvastatin may cause:","o":["Myopathy via CYP3A4 inhibition", "Failure via enzyme induction", "Failure via gut chelation", "Rebound via receptor upregulation"],"a":0,"ex":"Raised statin levels risk rhabdomyolysis.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Which herbal product induces CYP3A4 and P-glycoprotein?","o":["Ginger", "St John's wort", "Chamomile", "Peppermint"],"a":1,"ex":"It lowers levels of ciclosporin, oral contraceptives, warfarin and HIV drugs.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Pharmacogenetics is the study of:","o":["Inherited variation in drug response", "Drug effects on fetal genes", "Population drug consumption", "Drug effects on tumour DNA"],"a":0,"ex":"Pharmacogenomics extends this to the whole genome.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Slow acetylators are at increased risk of:","o":["Isoniazid neuropathy", "Succinylcholine apnoea", "Primaquine haemolysis", "Warfarin resistance"],"a":0,"ex":"NAT2 slow acetylation also causes hydralazine and procainamide lupus.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Primaquine or dapsone precipitating haemolysis suggests deficiency of:","o":["G6PD", "Pseudocholinesterase", "TPMT", "CYP2D6"],"a":0,"ex":"Oxidant stress in G6PD-deficient red cells; also rasburicase and nitrofurantoin.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Prolonged apnoea after succinylcholine suggests deficiency of:","o":["Plasma cholinesterase", "Acetylcholinesterase", "G6PD", "CYP2D6"],"a":0,"ex":"Butyrylcholinesterase variants delay hydrolysis.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Severe myelosuppression with azathioprine suggests low activity of:","o":["NAT2", "TPMT", "G6PD", "DPD"],"a":1,"ex":"Thiopurine methyltransferase; test before treatment.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Severe toxicity with fluorouracil suggests deficiency of:","o":["TPMT", "UGT1A1", "DPD", "CYP2D6"],"a":2,"ex":"Dihydropyrimidine dehydrogenase metabolises 5-FU.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Irinotecan-related neutropenia is linked to variants of:","o":["UGT1A1", "CYP2C9", "NAT2", "TPMT"],"a":0,"ex":"Reduced glucuronidation of the active metabolite SN-38.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Abacavir hypersensitivity is associated with:","o":["HLA-B*1502", "HLA-B*5701", "HLA-A*3101", "HLA-DR4"],"a":1,"ex":"Screen before starting abacavir.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Carbamazepine-induced SJS/TEN in people of Han Chinese ancestry is linked to:","o":["HLA-B*5701", "HLA-B*5801", "HLA-B*1502", "HLA-DQ2"],"a":2,"ex":"Screen in at-risk populations.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Severe cutaneous reactions to allopurinol are associated with:","o":["HLA-B*5801", "HLA-B*5701", "HLA-B*1502", "HLA-A*0201"],"a":0,"ex":"More frequent with renal impairment and high starting dose.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"A low warfarin dose requirement is linked to variants in:","o":["CYP2C9 and VKORC1", "CYP2D6 and NAT2", "TPMT and DPD", "CYP2E1 and UGT1A1"],"a":0,"ex":"Reduced warfarin metabolism and greater sensitivity.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Malignant hyperthermia after halothane or succinylcholine is linked to mutation of:","o":["RYR1", "G6PD", "NAT2", "CYP2D6"],"a":0,"ex":"Treat with dantrolene, which blocks the ryanodine receptor.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Which dietary factor reduces the effect of warfarin?","o":["Grapefruit juice", "Vitamin K-rich vegetables", "High-protein diet", "Dietary fibre"],"a":1,"ex":"Vitamin K opposes warfarin; keep intake steady.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Women generally have a larger Vd for lipophilic drugs because of:","o":["Higher body fat proportion", "Higher plasma volume", "Higher albumin level", "Faster glomerular filtration"],"a":0,"ex":"Also differences in CYP3A4, gastric emptying and body weight.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Elderly patients are more sensitive to benzodiazepines because of:","o":["Reduced clearance, brain sensitivity", "Faster hepatic metabolism", "Higher albumin levels", "Lower body fat proportion"],"a":0,"ex":"Fat increases with age, prolonging action of lipophilic drugs; falls and confusion result.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Fluoroquinolones are avoided in children mainly because of:","o":["Cartilage damage", "Teeth staining", "Ototoxicity", "Kernicterus"],"a":0,"ex":"Tetracyclines stain teeth; sulfonamides risk kernicterus in neonates.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Which drug is contraindicated in severe renal impairment because of lactic acidosis risk?","o":["Gliclazide", "Metformin", "Insulin", "Pioglitazone"],"a":1,"ex":"Metformin is renally cleared and accumulates.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Which is a Type A (augmented) ADR?","o":["Insulin-induced hypoglycaemia", "Penicillin anaphylaxis", "Halothane hepatitis", "SJS with carbamazepine in HLA-B*1502"],"a":0,"ex":"Type A: predictable, dose-related, pharmacological, common, low mortality.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Anaphylaxis to penicillin is classified as which type of ADR?","o":["Type A", "Type B", "Type C", "Type E"],"a":1,"ex":"Type B: bizarre, unpredictable, not dose-related (immune or idiosyncratic).","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Adrenal suppression with prolonged corticosteroids is which ADR type?","o":["Type A", "Type B", "Type C", "Type D"],"a":2,"ex":"Type C: chronic, related to cumulative dose or duration.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Teratogenicity is classified as a:","o":["Type A reaction", "Type B reaction", "Type D (delayed) reaction", "Type E reaction"],"a":2,"ex":"Type D: delayed effects, including carcinogenesis and teratogenesis.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Rebound hypertension after abrupt clonidine withdrawal is which ADR type?","o":["Type A", "Type B", "Type D", "Type E"],"a":3,"ex":"Type E: end-of-use reactions, also with beta-blockers and benzodiazepines.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Oral contraceptive failure caused by rifampicin is which ADR type?","o":["Type A", "Type C", "Type D", "Type F"],"a":3,"ex":"Type F: unexpected failure of therapy, often from an interaction.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Penicillin anaphylaxis is which Gell and Coombs hypersensitivity type?","o":["Type I", "Type II", "Type III", "Type IV"],"a":0,"ex":"IgE-mediated mast cell degranulation; treat with IM adrenaline.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Methyldopa-induced haemolytic anaemia is hypersensitivity type:","o":["Type I", "Type II", "Type III", "Type IV"],"a":1,"ex":"Antibody-mediated cytotoxicity against red cell antigens.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Allergic contact dermatitis from topical neomycin is hypersensitivity type:","o":["Type I", "Type II", "Type III", "Type IV"],"a":3,"ex":"Delayed T-cell mediated reaction.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Which drug class causes both nephrotoxicity and ototoxicity?","o":["Penicillins", "Macrolides", "Aminoglycosides", "Cephalosporins"],"a":2,"ex":"Dose and duration dependent; monitor levels and renal function.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"},
 {"q":"Which drug prolongs the QT interval and risks torsades de pointes?","o":["Amoxicillin", "Metformin", "Erythromycin", "Atenolol"],"a":2,"ex":"Others: amiodarone, sotalol, haloperidol, quinine, ondansetron.","src":"CLI 414 topic bank — Interactions, Pharmacogenetics & ADRs"}
],

lb6: [

 {"q":"Vesamicol blocks:","o":["The vesicular ACh transporter", "The choline reuptake transporter", "The SNARE fusion complex", "Postsynaptic nicotinic channels"],"a":0,"ex":"It prevents ACh storage in vesicles.","src":"CLI 414 topic bank — Cholinergic Pharmacology"},
 {"q":"Botulinum toxin acts by:","o":["Blocking nicotinic receptors", "Inhibiting AChE", "Cleaving SNARE proteins", "Blocking choline uptake"],"a":2,"ex":"It cleaves SNAP-25 or synaptobrevin, preventing vesicle fusion; used in dystonia and spasticity.","src":"CLI 414 topic bank — Cholinergic Pharmacology"},
 {"q":"Synaptic ACh action is terminated mainly by:","o":["Hydrolysis by AChE", "Reuptake of intact ACh", "Metabolism by COMT", "Diffusion into plasma"],"a":0,"ex":"Choline is recycled by the high-affinity transporter.","src":"CLI 414 topic bank — Cholinergic Pharmacology"},
 {"q":"Succinylcholine is chiefly broken down by:","o":["Plasma cholinesterase", "Junctional acetylcholinesterase", "Hepatic CYP3A4", "Renal excretion unchanged"],"a":0,"ex":"Deficiency prolongs paralysis.","src":"CLI 414 topic bank — Cholinergic Pharmacology"},
 {"q":"M2 receptors predominate in the:","o":["Heart", "Salivary glands", "Bronchial smooth muscle", "Iris sphincter"],"a":0,"ex":"M3 predominates in glands and smooth muscle.","src":"CLI 414 topic bank — Cholinergic Pharmacology"},
 {"q":"Muscarinic M3 receptor signalling occurs through:","o":["Gs, raising cAMP", "Gi, lowering cAMP", "Gq, activating PLC", "Tyrosine kinase pathway"],"a":2,"ex":"Gives IP3 and DAG, causing contraction and secretion.","src":"CLI 414 topic bank — Cholinergic Pharmacology"},
 {"q":"Vagal slowing of the heart through M2 involves:","o":["Opening K channels, lowering cAMP", "Closing K channels, raising cAMP", "Opening Ca channels, raising IP3", "Closing Cl channels, lowering IP3"],"a":0,"ex":"Hyperpolarisation of the SA node reduces rate.","src":"CLI 414 topic bank — Cholinergic Pharmacology"},
 {"q":"The receptor at the skeletal neuromuscular junction is:","o":["Nm", "Nn", "M1", "M3"],"a":0,"ex":"A ligand-gated cation channel.","src":"CLI 414 topic bank — Cholinergic Pharmacology"},

/* ---------- Build flattened, id-tagged question list ---------- */
function hashStr(s){
  let h = 5381;
  for(let i=0;i<s.length;i++){ h = ((h<<5)+h+s.charCodeAt(i))|0; }
  return (h>>>0).toString(36);
}
/* Identity of a question for de-duplication across categories */
function normKey(q){
  return (q.q+"|"+q.o.slice().sort().join("|")).toLowerCase().replace(/[^a-z0-9|]/g,"");
}
function mkQ(q, cat, i){
  /* key is stable for a given stem + option set, so per-question memory survives re-ordering */
  return Object.assign({}, q, {id:cat+"-"+i, cat:cat, key:cat+":"+hashStr(q.q+"#"+q.o.join("|"))});
}
let ALL = [];
const POOL = {};
CAT_ORDER.forEach(cat=>{
  POOL[cat] = (QUESTIONS[cat]||[]).map((q,i)=>mkQ(q,cat,i));
  POOL[cat].forEach(q=>ALL.push(q));
});

    if(typeof b.weak==="boolean") state.build.weak = b.weak;

function applyTheme(){

}

/* ---------- Local storage ----------
   pharmQuizHistory  : last attempt per category  {cat:{pct,date}}   (kept from the earlier version)
   pharmQuizMem      : per-question record        {key:[correct,attempts]}
   pharmQuizSessions : completed session log      [{d,title,c,n,p,t,k}]                              */
function lsGet(k, def){
  try{ const raw = localStorage.getItem(k); return raw ? JSON.parse(raw) : def; }catch(e){ return def; }
}
function lsSet(k, v){
  try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ /* storage unavailable: carry on without saving */ }
}

let MEM  = lsGet("pharmQuizMem", {});

if(!HIST || typeof HIST!=="object") HIST = {};
if(!MEM || typeof MEM!=="object") MEM = {};
