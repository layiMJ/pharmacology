<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CLI 414">
<meta name="theme-color" content="#0B6E6E">
<title>CLI 414 — Basic & Clinical Pharmacology Revision</title>

<style>
/* =========================================================
   Pen & paper notebook theme — CLI 414
   ========================================================= */
:root{
  --bg:#D4C4A8;
  --bg-deep:#C4B396;
  --paper:#F7F0E1;
  --paper-edge:#EDE4D0;
  --ink:#1C1612;
  --ink-soft:#4A4038;
  --ink-faint:#8A7B6A;
  --rule:#D9CCB4;
  --rule-strong:#C9B89A;
  --primary:#2C4A6E;
  --primary-dark:#1E3552;
  --primary-tint:#E4EAF1;
  --accent:#8B3A2A;
  --accent-tint:#F3E4DF;
  --success:#2F5D3A;
  --success-tint:#E3EDE5;
  --danger:#8B2E2E;
  --danger-tint:#F5E3E3;
  --line:#D0C2A8;
  --line-soft:#E8DFCC;
  --margin-red:#C45C5C;
  --c-gen:#4A5568;
  --c-pk:#2C4A6E;
  --c-pd:#2F5D3A;
  --c-chol:#5C4A7A;
  --c-adr:#8B5A2A;
  --c-auta:#8B2E2E;
  --c-nsaid:#3E5A6E;
  --c-mock:#1C1612;
  --radius-s:2px;
  --radius-m:3px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:var(--serif);
  --mono:"Courier New",Courier,monospace;
  --shadow-page:2px 3px 0 rgba(28,22,18,.08), 0 1px 3px rgba(28,22,18,.12);
  --shadow-lift:3px 5px 0 rgba(28,22,18,.1), 0 2px 6px rgba(28,22,18,.14);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{
  margin:0;
  background-color:var(--bg);
  color:var(--ink);
  font-family:var(--serif);
  -webkit-font-smoothing:antialiased;
  line-height:1.55;
}

/* Dark "desk lamp off" variant */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0A0A;
    --bg-deep:#000000;
    --paper:#141414;
    --paper-edge:#1A1A1A;
    --ink:#F5F5F5;
    --ink-soft:#C8C8C8;
    --ink-faint:#888888;
    --rule:#2A2A2A;
    --rule-strong:#3A3A3A;
    --primary:#E8E8E8;
    --primary-dark:#FFFFFF;
    --primary-tint:#222222;
    --accent:#FFFFFF;
    --accent-tint:#2A2A2A;
    --success:#D0D0D0;
    --success-tint:#1E1E1E;
    --danger:#A0A0A0;
    --danger-tint:#1A1A1A;
    --line:#2A2A2A;
    --line-soft:#1E1E1E;
    --margin-red:#B0B0B0;
    --c-gen:#B0B0B0;
    --c-pk:#D0D0D0;
    --c-pd:#C0C0C0;
    --c-chol:#A8A8A8;
    --c-adr:#BEBEBE;
    --c-auta:#9A9A9A;
    --c-nsaid:#B8B8B8;
    --c-mock:#F0F0F0;
    --shadow-page:2px 3px 0 rgba(0,0,0,.5), 0 1px 4px rgba(0,0,0,.4);
    --shadow-lift:3px 5px 0 rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
    --bg:#0A0A0A;
    --bg-deep:#000000;
    --paper:#141414;
    --paper-edge:#1A1A1A;
    --ink:#F5F5F5;
    --ink-soft:#C8C8C8;
    --ink-faint:#888888;
    --rule:#2A2A2A;
    --rule-strong:#3A3A3A;
    --primary:#E8E8E8;
    --primary-dark:#FFFFFF;
    --primary-tint:#222222;
    --accent:#FFFFFF;
    --accent-tint:#2A2A2A;
    --success:#D0D0D0;
    --success-tint:#1E1E1E;
    --danger:#A0A0A0;
    --danger-tint:#1A1A1A;
    --line:#2A2A2A;
    --line-soft:#1E1E1E;
    --margin-red:#B0B0B0;
    --c-gen:#B0B0B0;
    --c-pk:#D0D0D0;
    --c-pd:#C0C0C0;
    --c-chol:#A8A8A8;
    --c-adr:#BEBEBE;
    --c-auta:#9A9A9A;
    --c-nsaid:#B8B8B8;
    --c-mock:#F0F0F0;
    --shadow-page:2px 3px 0 rgba(0,0,0,.5), 0 1px 4px rgba(0,0,0,.4);
    --shadow-lift:3px 5px 0 rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.45);
}


@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .mock-card{
    background:#000000;color:#F5F5F5;border-color:#333;border-left-color:#FFF;
  }
  :root:not([data-theme="light"]) .mock-card h3{color:#FFF !important}
  :root:not([data-theme="light"]) .mock-card .card-meta,
  :root:not([data-theme="light"]) .mock-card p.desc,
  :root:not([data-theme="light"]) .mock-card .last-score{color:#B0B0B0 !important}
  :root:not([data-theme="light"]) .mock-card .qcount{background:rgba(255,255,255,.1);border-color:#444;color:#FFF !important}
  :root:not([data-theme="light"]) .mock-card .btn{background:#FFF;border-color:#FFF;color:#000}
  :root:not([data-theme="light"]) .mock-card .btn:hover{background:#E0E0E0;border-color:#E0E0E0;color:#000}
}
:root[data-theme="dark"] .mock-card{
  background:#000000;color:#F5F5F5;border-color:#333;border-left-color:#FFF;
}
:root[data-theme="dark"] .mock-card h3{color:#FFF !important}
:root[data-theme="dark"] .mock-card .card-meta,
:root[data-theme="dark"] .mock-card p.desc,
:root[data-theme="dark"] .mock-card .last-score{color:#B0B0B0 !important}
:root[data-theme="dark"] .mock-card .qcount{background:rgba(255,255,255,.1);border-color:#444;color:#FFF !important}
:root[data-theme="dark"] .mock-card .btn{background:#FFF;border-color:#FFF;color:#000}
:root[data-theme="dark"] .mock-card .btn:hover{background:#E0E0E0;border-color:#E0E0E0;color:#000}

h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;color:var(--ink)}
p{margin:0}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 56px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- Top bar — notebook header strip ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter:blur(6px);
  border-bottom:1px solid var(--rule-strong);
  padding-top:env(safe-area-inset-top,0px);
}
.topbar-inner{max-width:720px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;min-height:34px}
.brand{font-family:var(--serif);font-weight:700;font-size:16px;color:var(--ink);letter-spacing:.3px}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--ink-faint);letter-spacing:.02em;margin-top:1px}
.theme-btn{
  margin-left:auto;border:1px solid var(--ink-faint);background:var(--paper);color:var(--ink-soft);
  border-radius:2px;padding:5px 11px;font-size:12px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;line-height:1;
  box-shadow:1px 1px 0 rgba(28,22,18,.06);
}
.theme-btn:hover{border-color:var(--ink);color:var(--ink)}
.theme-btn .ico{font-size:13px;line-height:1}

/* ---------- Hero — title page of the notebook ---------- */
.hero{padding:28px 0 6px}
.hero-badge{
  display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);border-bottom:1.5px solid var(--accent);padding-bottom:2px;margin-bottom:12px;
  background:none;border-radius:0;
}
.hero h1{font-size:28px;line-height:1.2;max-width:18ch;font-weight:700;letter-spacing:-.01em}
.hero p.lede{margin-top:12px;color:var(--ink-soft);max-width:48ch;font-size:15px;line-height:1.6}

/* Lined progress panel */
.progress-panel{
  margin:22px 0 10px;background:var(--paper);border:1px solid var(--rule-strong);
  border-radius:var(--radius-m);padding:16px 16px 14px;
  box-shadow:var(--shadow-page);
}
.progress-panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.progress-panel-head h3{font-size:14px;font-weight:700;color:var(--ink);margin:0;letter-spacing:.04em;text-transform:uppercase}
.progress-panel-head .pct{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--accent)}
.progress-bar-track{
  height:10px;border-radius:1px;background:var(--line-soft);overflow:hidden;
  border:1px solid var(--rule-strong);
}
.progress-bar-fill{
  height:100%;border-radius:0;background:var(--ink);
  transition:width .4s ease;min-width:0;
}
.progress-meta{
  display:flex;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap;
  font-size:12.5px;color:var(--ink-faint);
}
.progress-meta b{color:var(--ink-soft);font-weight:600}
.progress-empty{font-size:13.5px;color:var(--ink-soft);margin:0;font-style:italic}
.progress-topics{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.progress-topic{display:flex;align-items:center;gap:10px}
.progress-topic .pt-name{flex:0 0 110px;font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress-topic .pt-bar{flex:1;height:6px;background:var(--line-soft);border-radius:1px;overflow:hidden;border:1px solid var(--rule)}
.progress-topic .pt-bar > i{display:block;height:100%;border-radius:0}
.progress-topic .pt-pct{flex:0 0 40px;text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--ink-faint)}

.stat-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0 22px}
@media (min-width:700px){
  .stat-row{grid-template-columns:repeat(4,1fr);gap:12px}
}
.stat{
  background:var(--paper);border:1px solid var(--rule-strong);border-radius:var(--radius-m);
  padding:12px 10px;text-align:center;box-shadow:var(--shadow-page);
}
.stat b{display:block;font-family:var(--mono);font-size:20px;color:var(--ink)}
.stat span{display:block;font-size:11px;color:var(--ink-faint);margin-top:3px;letter-spacing:.03em;text-transform:uppercase}

.pace-section{margin:18px 0 20px}
.pace-label{font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:8px;letter-spacing:.06em;text-transform:uppercase}
.pace-row{display:flex;gap:8px;flex-wrap:wrap}
.pace-btn{
  border:1px solid var(--rule-strong);background:var(--paper);color:var(--ink-soft);
  padding:7px 13px;border-radius:2px;font-size:13px;font-weight:600;
  box-shadow:1px 1px 0 rgba(28,22,18,.05);
}
.pace-btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

h2.section-title{
  font-size:13px;margin:28px 0 12px;display:flex;align-items:center;gap:12px;
  letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink-soft);
}
h2.section-title::after{content:"";flex:1;height:1px;background:var(--rule-strong);min-width:24px}

.cards{display:grid;gap:12px}
@media (min-width:700px){
  .cards{grid-template-columns:repeat(2,1fr);gap:14px}
}
.card{
  background:var(--paper);border:1px solid var(--rule-strong);border-radius:var(--radius-m);
  padding:15px 15px 13px;border-left:3px solid var(--cat-color, var(--ink));
  display:flex;flex-direction:column;gap:8px;
  box-shadow:var(--shadow-page);
  transition:transform .12s ease, box-shadow .12s ease;
}
.cards .card:hover{transform:translateY(-1px);box-shadow:var(--shadow-lift)}
@media (prefers-reduced-motion:reduce){.cards .card{transition:none}.cards .card:hover{transform:none}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card h3{font-size:16px;font-weight:700}
.card p.desc{color:var(--ink-soft);font-size:13.5px;line-height:1.5}
.card-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink-faint)}
.qcount{
  font-family:var(--mono);background:var(--line-soft);border:1px solid var(--rule);
  border-radius:2px;padding:2px 7px;font-size:11.5px;color:var(--ink-soft);white-space:nowrap;
}
.last-score{font-size:12px;color:var(--ink-faint);font-style:italic}
.card-actions{margin-top:4px}
.btn{
  border:1px solid var(--ink);border-radius:2px;padding:9px 15px;font-size:14px;font-weight:700;
  background:var(--ink);color:var(--paper);letter-spacing:.02em;
  box-shadow:2px 2px 0 rgba(28,22,18,.12);
}
.btn:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
.btn.ghost{background:var(--paper);border:1px solid var(--rule-strong);color:var(--ink);box-shadow:1px 1px 0 rgba(28,22,18,.06)}
.btn.ghost:hover{border-color:var(--ink);background:var(--paper-edge)}
.btn.block{width:100%}
.btn.small{padding:6px 11px;font-size:12.5px}
.btn.danger-o{background:transparent;border:1px solid var(--danger);color:var(--danger);box-shadow:none}

/* Mock exam — rubber-stamped cover */
.mock-card{
  background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-left:3px solid var(--accent);
  box-shadow:var(--shadow-lift);
}
.mock-card:hover{transform:translateY(-1px)}
.mock-card h3{color:var(--paper) !important}
.mock-card .card-meta,
.mock-card p.desc,
.mock-card .last-score{color:rgba(247,240,225,.78) !important}
.mock-card p.desc{opacity:1}
.mock-card .qcount{background:rgba(247,240,225,.12);border-color:rgba(247,240,225,.25);color:var(--paper) !important}
.mock-card .btn{background:var(--accent);border-color:var(--accent);color:#F7F0E1;font-weight:700}
.mock-card .btn:hover{background:#A34838;border-color:#A34838;color:#F7F0E1}

.footnote{margin-top:32px;padding-top:14px;border-top:1px dashed var(--rule-strong);color:var(--ink-faint);font-size:12.5px;line-height:1.65}
.footnote strong{color:var(--ink-soft)}

/* ---------- Quiz view — exam booklet page ---------- */
.quiz-topbar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule-strong);padding-top:env(safe-area-inset-top,0px);box-shadow:0 1px 0 var(--rule)}
.quiz-topbar-row{max-width:720px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:center;gap:10px}
.exit-btn{background:none;border:none;color:var(--ink-soft);font-size:20px;line-height:1;padding:4px 6px;border-radius:2px}
.exit-btn:hover{background:var(--line-soft);color:var(--ink)}
.cat-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-soft);min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.learn-chip,.exam-chip{flex:none;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:2px;padding:3px 8px;border:1px solid}
.learn-chip{background:var(--success-tint);color:var(--success);border-color:var(--success)}
.exam-chip{background:var(--accent-tint);color:var(--accent);border-color:var(--accent)}
.cat-dot{width:8px;height:8px;border-radius:50%;background:var(--cat-color,var(--primary));display:inline-block}
.qcounter{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ink-soft)}
.timer-row{max-width:720px;margin:0 auto;padding:6px 16px 10px;display:flex;align-items:center;gap:10px}
.timer{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--ink);min-width:52px}
.timer.warn{color:var(--accent)}
.timer.crit{color:var(--danger)}
.bar{flex:1;height:4px;border-radius:1px;background:var(--line-soft);overflow:hidden;border:1px solid var(--rule)}
.bar > i{display:block;height:100%;background:var(--ink);border-radius:0}
.time-bar > i{background:var(--ink)}
.time-bar.warn > i{background:var(--accent)}
.time-bar.crit > i{background:var(--danger)}
.palette-toggle{background:var(--paper);border:1px solid var(--rule-strong);border-radius:2px;font-size:11.5px;color:var(--ink-soft);padding:3px 8px;font-family:var(--mono)}

.palette{max-width:720px;margin:0 auto;padding:0 16px 8px;display:none;flex-wrap:wrap;gap:5px}
.palette.open{display:flex}
.pdot{
  width:28px;height:28px;border-radius:2px;border:1px solid var(--rule-strong);background:var(--paper);
  font-family:var(--mono);font-size:11px;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;
}
.pdot.answered{background:var(--primary-tint);border-color:var(--primary);color:var(--primary-dark)}
.pdot.flagged{box-shadow:inset 0 0 0 2px var(--accent)}
.pdot.current{border-color:var(--ink);border-width:2px}

.qcard{max-width:720px;margin:14px auto 0;padding:0 16px}
.qstem-box{
  background:var(--paper);border:1px solid var(--rule-strong);border-radius:var(--radius-m);
  padding:20px 18px 12px;box-shadow:var(--shadow-page);
  padding-left:18px;
}
.qsvg{margin:0 0 14px;display:block;width:100%;height:auto;background:var(--paper-edge);border:1px solid var(--rule);border-radius:2px;padding:8px 6px 4px}
.qsvg-wrap{margin:0 0 14px;background:var(--paper-edge);border:1px solid var(--rule);border-radius:2px;padding:10px 8px 6px}
.qsvg-wrap .qsvg{margin:0;border:none;padding:0;background:transparent}
.qsvg-cap{font-size:12px;color:var(--ink-faint);text-align:center;margin-top:2px;padding:0 8px 4px}
.qstem{font-size:16.5px;line-height:1.55;color:var(--ink)}
.qsrc{margin-top:12px;font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);letter-spacing:.02em}

.options{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.opt{
  display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
  background:var(--paper);border:1.5px solid var(--rule-strong);border-radius:2px;
  padding:11px 12px;font-size:14.5px;color:var(--ink);min-height:44px;
  box-shadow:1px 1px 0 rgba(28,22,18,.04);
  transition:border-color .1s ease, background .1s ease;
}
.opt:hover:not(.locked):not(:disabled){border-color:var(--ink);background:var(--paper-edge)}
.opt.picked{border-color:var(--primary);background:var(--primary-tint)}
.opt.picked .oletter{background:var(--primary);border-color:var(--primary);color:var(--paper)}
.opt .oletter{
  flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--rule-strong);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink-soft);
  background:var(--paper);
}
.opt.right{border-color:var(--success);background:var(--success-tint)}
.opt.right .oletter{background:var(--success);border-color:var(--success);color:#fff}
.opt.wrong{border-color:var(--danger);background:var(--danger-tint)}
.opt.wrong .oletter{background:var(--danger);border-color:var(--danger);color:#fff}
.opt.locked{cursor:default}
.opt:disabled{opacity:1}
.opt.dim{opacity:.5}
.options.compact{gap:6px}
.options.compact .opt{padding:8px 10px;font-size:13.5px;min-height:40px}

.fb-box{
  margin:12px 0 6px;border-radius:2px;padding:12px 14px;
  font-size:14px;line-height:1.55;color:var(--ink);
  border-left:3px solid var(--primary);background:var(--primary-tint);
  border-top:1px solid var(--rule);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
  animation:fb-in .2s ease;scroll-margin-top:96px;
}
.fb-box.ok{border-left-color:var(--success);background:var(--success-tint)}
.fb-box.no{border-left-color:var(--danger);background:var(--danger-tint)}
.fb-box b.fb-label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.fb-box.ok b.fb-label{color:var(--success)}
.fb-box.no b.fb-label{color:var(--danger)}
@keyframes fb-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fb-box{animation:none}}

.mode-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.mode-btn{
  border:1px solid var(--rule-strong);background:var(--paper);border-radius:2px;
  padding:6px 12px;font-size:12.5px;color:var(--ink-soft);
}
.mode-btn[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper);font-weight:600}

 src:"PQ Q45"},
{q:"Pharmacokinetic drug interactions occurring in the gastrointestinal tract can be due to all of the following EXCEPT:",
 o:["Alteration of gastric or intestinal pH","Multiplication of bacterial flora by a co-administered drug","Formation of chelates or complexes (e.g. tetracycline with calcium)","Changes in GIT motility altering transit time","Destruction of normal gut flora by antibiotics"], a:1,
 ex:"Antibiotics typically reduce, not multiply, gut bacterial flora \u2014 this is the classic mechanism behind reduced enterohepatic recycling of oral contraceptives during antibiotic therapy. pH changes, chelation, and altered motility are all genuine mechanisms of GIT drug interactions.",
 src:"PQ Q48 \u2014 options d\u2013e reconstructed from partial source"},
{q:"The loading dose of a drug is:",
 o:["A function of the drug's half-life","Given to end drug therapy","The dose required to produce toxicity","A function of the desired plasma concentration and volume of distribution","A dose that must be given at equal intervals"], a:3,
 ex:"Loading dose = (target plasma concentration \u00D7 Vd) / bioavailability. It is designed to rapidly achieve a therapeutic plasma concentration and doesn\u2019t depend on half-life the way a maintenance interval does.",
 src:"PQ Q61"},
{q:"The oral bioavailability of a drug is most directly reduced by:",
 o:["Its elimination half-life (t\u00BD)","Its elimination rate constant (Kel)","Its maximum plasma concentration (Cmax)","Its minimum plasma concentration (Cmin)","Extensive hepatic first-pass metabolism"], a:4,
 ex:"Bioavailability (F) is the fraction of an administered dose reaching systemic circulation unchanged. Drugs with high hepatic first-pass metabolism (e.g. propranolol, morphine) lose much of the dose before it ever reaches the bloodstream, sharply lowering oral F.",
 src:"PQ Q62"},
{q:"The apparent volume of distribution of a highly lipophilic drug is NOT directly influenced by:",
 o:["Lipid solubility of the drug","The route of drug administration","The drug's half-life","Tissue binding affinity","The patient's body composition (e.g. BMI)"], a:1,
 ex:"Vd reflects how extensively a drug distributes into tissue relative to plasma, governed by lipid solubility, tissue binding, and body composition. Half-life is actually a dependent variable (t\u00BD = 0.693 \u00D7 Vd / Clearance), and the route of administration doesn\u2019t change how the drug distributes once it\u2019s in the bloodstream.",
 src:"PQ Q63"},
{q:"Which of the following drug properties has NO effect on a drug's pharmacokinetic profile?",
 o:["Intrinsic activity (efficacy) at its receptor","Tissue binding affinity","pKa","Lipid solubility","Elimination half-life"], a:0,
 ex:"Intrinsic activity/efficacy is a pharmacodynamic property \u2014 it describes what the drug does once bound to its receptor, not how the body absorbs, distributes, metabolises, or excretes it.",
 src:"PQ Q64"},
{q:"A highly polar drug has an apparent volume of distribution of about 14 L in a 70 kg adult. This volume corresponds mainly to distribution into:",
 o:["Plasma and blood only","Plasma, blood, and interstitial fluid (extracellular fluid)","Total body water","Adipose tissue","Intracellular fluid only"], a:1,
 ex:"Roughly, plasma volume \u2248 3 L, extracellular fluid (plasma + interstitial fluid) \u2248 14 L, and total body water \u2248 42 L in a 70 kg adult. A Vd of ~14 L is the classic signature of a polar drug confined to the extracellular compartment because it cannot easily cross cell membranes.",
 src:"PQ Q65"},
{q:"'Ion trapping' of a weak acid or base drug:",
 o:["Occurs because pH is uniform across all body compartments","Increases the drug's intrinsic potency","Increases the drug's intrinsic efficacy","Can increase drug concentration within a particular tissue compartment","Always reduces the drug's efficacy"], a:3,
 ex:"Ion trapping arises from a pH DIFFERENCE between compartments: a weak acid or base becomes more ionised (and less able to cross back out) on the side where pH favours ionisation, concentrating the drug there \u2014 exploited clinically by alkalinising urine to trap and eliminate aspirin in overdose.",
 src:"PQ Q66"},
{q:"During multiple dosing, the average steady-state plasma concentration (Css) is influenced by all of the following EXCEPT:",
 o:["Bioavailability (F)","Elimination half-life (t\u00BD)","Clearance (CL)","Dosing interval (\u03C4)","Volume of distribution (Vd)"], a:4,
 ex:"Average Css = (F \u00D7 Dose) / (CL \u00D7 \u03C4) \u2014 Vd does not appear in this formula. Vd instead governs the SIZE of the peak-to-trough fluctuation around Css, not the average concentration itself.",
 src:"PQ Q67"},
{q:"All of the following are Phase I (functionalization) drug-metabolising reactions EXCEPT:",
 o:["N-dealkylation of theophylline","Aliphatic oxidation of phenobarbital","Hydrolysis of succinylcholine","Glucuronidation of acetaminophen","Reductive dehalogenation of halothane"], a:3,
 ex:"Glucuronidation is a Phase II (conjugation) reaction \u2014 it attaches a polar glucuronic-acid group to make the drug more water soluble for excretion. Oxidation, dealkylation, hydrolysis, and reductive reactions are all Phase I \u2018functionalization\u2019 reactions.",
 src:"PQ Q73"},
{q:"A drug with a very LARGE apparent volume of distribution is most likely to show:",
 o:["A high hepatic extraction ratio","Extensive penetration into tissues such as the blood\u2013brain and blood\u2013testis barriers","Extensive binding to plasma proteins","Distribution limited to total body water","Extensive binding to tissue constituents outside the plasma"], a:4,
 ex:"Extensive binding to tissue constituents (muscle, fat, other tissues) pulls the drug out of plasma, mathematically inflating the apparent Vd \u2014 sometimes far beyond real body volume (e.g. digoxin, chloroquine). Extensive plasma protein binding does the opposite, keeping Vd small.",
 src:"PQ Q74"},
{q:"Which statement about pharmacokinetics is NOT correct?",
 o:["It studies the biochemical mechanism by which a drug produces its effect","It describes the drug concentration\u2013time profile in the body","It involves absorption, distribution, metabolism, and excretion (ADME)","It allows determination of drug concentration at any time after administration"], a:0,
 ex:"Studying HOW a drug produces its effect at the molecular/receptor level is pharmacoDYNAMICS. Pharmacokinetics is about what the body does to the drug (ADME) and the resulting concentration\u2013time profile.",
 src:"PQ Q75"},
{q:"Which of the following does NOT directly affect drug absorption?",
 o:["The drug's pKa","pH at the site of absorption","Lipid solubility of the drug","The elimination rate constant (Kel)","None of the above is correct"], a:3,
 ex:"Kel describes how fast a drug is eliminated once it is in the body \u2014 it has nothing to do with how the drug gets into the body. pKa, local pH, and lipid solubility all determine how much of the drug is in its absorbable, un-ionised form.",
 src:"PQ Q77"},
{q:"Metabolism of a drug most commonly results in the drug becoming:",
 o:["More lipid soluble","More water soluble, and therefore more easily excreted","Pharmacologically more potent in every case","Impossible to excrete"], a:1,
 ex:"Most Phase I and Phase II reactions add or expose polar groups, converting lipophilic drugs into more water-soluble (and thus more renally excretable) metabolites. This is usually \u2014 though not always \u2014 an inactivation step; some drugs form active or even toxic metabolites.",
 src:"PQ Q95"},
{q:"The form of a drug most readily absorbed across biological membranes is the:",
 o:["Ionised form","Protein-bound form","Un-ionised (non-ionized) form","Glucuronidated form","Quaternary ammonium form"], a:2,
 ex:"Biological membranes are lipid bilayers, so the un-ionised, more lipid-soluble form of a weak acid or base crosses far more readily than the charged, water-soluble ionised form (per the pH-partition hypothesis).",
 src:"PQ Q96"},
{q:"Drugs with very large apparent volumes of distribution usually have:",
 o:["A high degree of plasma protein binding","High tissue affinity relative to plasma (e.g. chloroquine, digoxin, amiodarone)","A large first-pass effect if given orally","High renal and hepatic clearance in all cases","A characteristically short elimination half-life"], a:1,
 ex:"A large Vd reflects a drug's preference for tissue over plasma. Classic examples \u2014 chloroquine, digoxin, amiodarone \u2014 are extensively tissue-bound and tend to have LONG, not short, half-lives, since t\u00BD increases with Vd.",
 src:"PQ Q97"},
{q:"If a drug is 80% bound to plasma proteins or blood elements, what percentage circulates in the free (pharmacologically active) form?",
 o:["20%","40%","50%","80%","100%"], a:0,
 ex:"Only the unbound (free) fraction of a drug can cross membranes, reach its receptor, and be eliminated. If 80% is bound, the remaining 20% is free and active.",
 src:"PQ Q99"},
{q:"For a drug that follows first-order kinetics, the elimination half-life:",
 o:["Increases as plasma concentration increases","Is constant regardless of plasma concentration","Decreases as plasma concentration increases","Is undefined","Depends only on the dose given"], a:1,
 ex:"In first-order kinetics, a constant FRACTION of drug is eliminated per unit time, so t\u00BD stays constant across a wide range of concentrations \u2014 unlike zero-order kinetics (e.g. ethanol, high-dose phenytoin), where a constant AMOUNT is eliminated per unit time.",
 src:"Katzung & Trevor \u2014 Pharmacokinetics"},
{q:"Approximately how many half-lives are needed for a drug given by constant infusion (or repeated dosing) to reach steady-state plasma concentration?",
 o:["1\u20132 half-lives","2\u20133 half-lives","4\u20135 half-lives","8\u201310 half-lives","It never truly reaches steady state"], a:2,
 ex:"Plasma concentration rises toward steady state in an exponential fashion, reaching about 94\u201397% of Css after 4\u20135 half-lives \u2014 the standard clinical rule of thumb.",
 src:"Katzung & Trevor \u2014 Pharmacokinetics"},
{q:"Clearance is best defined as:",
 o:["The amount of drug remaining in the body at any time","The volume of plasma completely cleared of drug per unit time","The time taken for plasma concentration to fall by half","The total amount of drug excreted unchanged","The fraction of a dose reaching systemic circulation"], a:1,
 ex:"Clearance (CL) expresses elimination capacity as a volume of plasma cleared per unit time (e.g. mL/min), and is the key parameter used to design a maintenance dosing regimen.",
 src:"Katzung & Trevor \u2014 Pharmacokinetics"},
{q:"A drug given intravenously has a bioavailability (F) of:",
 o:["It depends on the dose given","0.5 (50%)","1.0 (100%)","It cannot be determined","It equals the drug's protein-binding fraction"], a:2,
 ex:"By definition, an IV dose enters the systemic circulation completely and immediately, so F = 1 (100%). Bioavailability of other routes is typically expressed relative to this IV reference.",
 src:"Katzung & Trevor \u2014 Pharmacokinetics"},
{q:"Which route of administration is most subject to a significant hepatic first-pass effect?",
 o:["Sublingual","Intravenous","Oral","Rectal (lower rectum)","Inhalational"], a:2,
 ex:"Drug absorbed from the stomach and small intestine drains via the hepatic portal vein straight through the liver before reaching systemic circulation, exposing it to first-pass metabolism. Sublingual, IV, and lower-rectal routes largely bypass this portal circulation.",
 src:"Katzung & Trevor \u2014 Pharmacokinetics"},
{q:"Renal excretion of a drug is increased by all of the following EXCEPT:",
 o:["Increasing the drug's water solubility","Decreasing plasma protein binding of the drug","Alkalinising the urine for a weak acid","Increasing tubular reabsorption of the drug","Increasing renal blood flow"], a:3,
 ex:"Increased tubular REABSORPTION pulls filtered drug back into the blood, reducing net excretion. Everything else listed enhances renal elimination.",
 src:"Katzung & Trevor \u2014 Pharmacokinetics"}
],

pd:[
{q:"Regarding drug affinity, which statement is correct?",
 o:["Affinity, together with efficacy, determines a drug's potency","Affinity is synonymous with efficacy","Affinity is inversely proportional to drug response in all cases","A and B are correct","None of the above"], a:0,
 ex:"Affinity (how tightly a drug binds its receptor) and efficacy (how well it activates the receptor once bound) together determine potency (reflected as EC50). Affinity is NOT the same as efficacy \u2014 a drug can bind tightly yet produce little effect, as with antagonists.",
 src:"PQ Q5"},
{q:"Digoxin has a 'narrow therapeutic index'. This means:",
 o:["It can safely be given without monitoring","It is an over-the-counter drug with high potency","It is contraindicated in heart failure","Its toxic dose is close to its therapeutic dose, so a high level can be life-threatening","It is especially well tolerated by elderly patients"], a:3,
 ex:"A narrow therapeutic index means the margin between an effective dose and a toxic dose is small, so digoxin requires careful dosing and, often, plasma-level monitoring \u2014 particularly important in the elderly, where toxicity risk is higher, not lower.",
 src:"PQ Q7"},
{q:"Evaluating the ratio between the benefit and risk of an unknown agent (e.g. TD50/ED50) is known as determining its:",
 o:["Bioequivalence","Bioavailability","Therapeutic index","Volume of distribution","Clearance"], a:2,
 ex:"The therapeutic index (TI = TD50/ED50, or LD50/ED50 in animal studies) quantifies the margin of safety between a dose producing toxicity and a dose producing the desired effect.",
 src:"PQ Q10"},
{q:"Desensitisation and tachyphylaxis (rapidly diminishing drug response with repeated dosing) may occur due to all of the following EXCEPT:",
 o:["Change in receptor conformation","Loss (down-regulation) of receptors","Exhaustion of mediator stores","Decreased metabolic degradation of the drug","Physiological/homeostatic adaptation"], a:3,
 ex:"Tolerance typically develops because of INCREASED metabolic degradation of the drug (among other mechanisms like receptor down-regulation or depleted mediators) \u2014 decreased degradation would, if anything, prolong drug effect, not blunt it.",
 src:"PQ Q16"},
{q:"A drug interaction is best defined as:",
 o:["An alteration in response to a drug caused by prior administration of another drug","The maintenance of one drug's effect by another","A modification of the effect of one drug (the 'object' drug) by another (the 'precipitant' drug)","A and C are both correct definitions","None of the above"], a:3,
 ex:"Both descriptions capture valid aspects of a drug interaction: a change in the expected response to a drug, in the presence of another drug acting as the \u2018precipitant\u2019 that modifies the \u2018object\u2019 drug's effect.",
 src:"PQ Q46"},
{q:"When two or more drugs are combined, the outcome may include:",
 o:["Loss of therapeutic effect","Increased toxicity","An unexpected increase in pharmacological activity (potentiation)","An additive effect","All of the above"], a:4,
 ex:"Combining drugs can produce any of these outcomes depending on mechanism \u2014 antagonism (loss of effect), toxicity, synergism/potentiation, or simple additive effects \u2014 so all are possible.",
 src:"PQ Q47"},
{q:"Regarding drug synergism, which statement is correct?",
 o:["Synergism never occurs between drugs of different classes","It could result in an additive effect","It could lead to potentiation of one drug's effect by another","Propranolol combined with nifedipine is a typical clinical example","All of the above, except the false first option"], a:4,
 ex:"Synergistic combinations can be additive or potentiating (greater than additive). Combining a beta-blocker (propranolol) with a calcium-channel blocker (nifedipine) is a classic example used clinically for enhanced blood pressure/anginal control.",
 src:"PQ Q49"},
{q:"Drug\u2013drug interactions can be minimised or prevented by all of the following EXCEPT:",
 o:["Monitoring therapy and adjusting doses accordingly","Monitoring blood levels of narrow-therapeutic-index drugs (e.g. digoxin)","Monitoring for early clinical signs of interaction","Deliberate encouragement of polypharmacy","Reviewing case reports and known interaction data"], a:3,
 ex:"Polypharmacy (using many drugs at once) INCREASES the risk of interactions rather than preventing them; minimising unnecessary polypharmacy is itself a key preventive strategy.",
 src:"PQ Q50"},
{q:"The major drug-receptor superfamilies include all of the following EXCEPT:",
 o:["Ligand-gated ion channels","A distinct 'calcium-channel-linked receptor' family","G protein-coupled receptors (GPCRs)","Enzyme-linked (catalytic) receptors","Intracellular (nuclear) receptors"], a:1,
 ex:"The four classical receptor superfamilies are ligand-gated ion channels, GPCRs, enzyme-linked receptors, and intracellular/nuclear receptors. There is no separate \u2018calcium-channel-linked receptor\u2019 family \u2014 voltage-gated calcium channels are a distinct pharmacological target, not one of the four superfamilies.",
 src:"PQ Q51"},
{q:"Which of the following statements is FALSE?",
 o:["Partial agonists produce less than the maximal effect even when all receptors are occupied","In the presence of a full agonist, a partial agonist can behave like a competitive inhibitor","Antagonists lack intrinsic activity","Agonists bind to and activate receptors to produce a response","Antagonists combine with receptors and activate them to produce a response"], a:4,
 ex:"By definition, an antagonist binds to the receptor but does NOT activate it \u2014 it blocks the receptor from being activated by agonists. Activating the receptor is exactly what distinguishes an agonist from an antagonist.",
 src:"PQ Q52"},
{q:"Regarding drug idiosyncrasy, which statement is FALSE?",
 o:["It is a qualitatively abnormal, usually harmful, drug response occurring in a small proportion of people","In many cases, an underlying genetic difference is responsible","It affects the whole population uniformly","It can be seen in both adults and children","G6PD deficiency causing haemolysis with certain drugs is a classic example"], a:2,
 ex:"Idiosyncratic reactions, by definition, occur only in a genetically susceptible SUBSET of the population, not uniformly across everyone \u2014 that is precisely what makes them idiosyncratic rather than a predictable, dose-related effect.",
 src:"PQ Q53"},
{q:"Agonists possess all of the following characteristics EXCEPT:",
 o:["Both affinity and efficacy for their receptor","Affinity only, with no efficacy","Intrinsic activity","The ability to bind and activate a receptor to produce a response","(Partial agonists may show) a submaximal effect"], a:1,
 ex:"\u2018Affinity only, with no efficacy\u2019 describes an ANTAGONIST, not an agonist. An agonist must have both affinity (to bind) and efficacy/intrinsic activity (to activate the receptor and produce a response).",
 src:"PQ Q54"},
{q:"On a log dose\u2013response plot, Drug 1's curve lies to the left of Drug 2's curve, but both drugs reach the same maximal effect (Emax). This means:",
 o:["Drug 2 is more potent than Drug 1","Drug 2 is more efficacious than Drug 1","Drug 1 has a higher affinity (lower EC50/KA) than Drug 2","Drug 1 is a partial agonist","None of the above"], a:2,
 ex:"A curve positioned further left reaches the same effect at a lower dose \u2014 i.e. higher affinity and greater potency. Equal maximal effects mean equal efficacy for both drugs; Drug 1 is actually the more potent one here, not Drug 2.",
 src:"PQ Q98", svg:"dr"},
{q:"An ADR that is predictable, dose-dependent, and results from an exaggeration of a drug's normal pharmacological action is classified as Type:",
 o:["Type A (Augmented)","Type B (Bizarre)","Type C (Chronic)","Type D (Delayed)","Type E (End-of-use)"], a:0,
 ex:"Type A reactions are an exaggeration of the drug's known pharmacology (e.g. hypoglycaemia from too much insulin) \u2014 common, dose-related, and usually predictable. Type B (bizarre/idiosyncratic) reactions are unpredictable and not dose-related, such as anaphylaxis.",
 src:"Katzung & Trevor \u2014 Adverse Drug Reactions"},
{q:"A partial agonist, given ALONE to a receptor system with no other ligand present, will:",
 o:["Produce no effect at all","Produce a submaximal effect, even at full receptor occupancy","Produce the same maximal effect as a full agonist","Act purely as an antagonist","Bind but never activate the receptor"], a:1,
 ex:"A partial agonist has lower intrinsic efficacy than a full agonist, so even when every receptor is occupied it cannot generate the full maximal response \u2014 but it is not inert; it produces a measurable, just submaximal, effect.",
 src:"Katzung & Trevor \u2014 Pharmacodynamics"},
{q:"Increasing the dose of a competitive antagonist in the presence of a fixed agonist concentration typically:",
 o:["Shifts the agonist's dose\u2013response curve to the right without lowering Emax","Lowers the agonist's maximal effect (Emax) without shifting the curve","Has no effect on the agonist's curve","Shifts the curve to the left","Converts the agonist into an antagonist"], a:0,
 ex:"A competitive (surmountable) antagonist competes reversibly for the same site, so raising the agonist concentration can still overcome it \u2014 the curve shifts rightward but the same Emax can still be reached. A non-competitive (insurmountable) antagonist instead reduces Emax.",
 src:"Katzung & Trevor \u2014 Pharmacodynamics"},
{q:"Which factor is LEAST likely to meaningfully modify an individual's response to a standard drug dose?",
 o:["Age (neonate vs elderly)","Renal or hepatic function","Genetic polymorphisms in drug-metabolising enzymes","The colour of the tablet coating","Concurrent disease states"], a:3,
 ex:"Age, organ function, genetics, and disease state all genuinely alter pharmacokinetics or pharmacodynamics. A tablet's coating colour has no pharmacological bearing on drug response, though it may affect adherence or perception.",
 src:"Katzung & Trevor \u2014 Factors Modifying Drug Action"},
{q:"An inverse agonist, acting at a receptor with constitutive (baseline) activity, will:",
 o:["Have no effect on baseline receptor activity","Produce the same effect as a full agonist","Reduce activity below the receptor's baseline (constitutive) level","Only bind but never influence the receptor","Always require a co-agonist to act"], a:2,
 ex:"Unlike a neutral antagonist (which simply blocks agonist binding without changing baseline signalling), an inverse agonist actively suppresses a receptor's constitutive activity, pushing the response below the unstimulated baseline.",
 src:"Katzung & Trevor \u2014 Pharmacodynamics"},
{q:"CYP2D6 'poor metabolisers' are genetically predisposed to:",
 o:["Faster than normal clearance of CYP2D6-substrate drugs","Higher plasma levels and increased toxicity risk from standard doses of CYP2D6-substrate drugs","No change in drug response at all","Enhanced pro-drug activation for all CYP2D6 substrates","Resistance to all drug toxicity"], a:1,
 ex:"Poor metabolisers have reduced CYP2D6 enzyme activity, so drugs cleared mainly by this pathway accumulate at standard doses, raising toxicity risk. Conversely, for pro-drugs that need CYP2D6 to become active (e.g. codeine \u2192 morphine), poor metabolisers get LESS therapeutic effect.",
 src:"Katzung & Trevor \u2014 Pharmacogenetics"}
],

chol:[
{q:"The muscarinic agonist pilocarpine is used clinically in the treatment of:",
 o:["Diabetes mellitus","Glaucoma","Asthma","Sinus bradycardia","Severe headache"], a:1,
 ex:"Pilocarpine causes contraction of the ciliary muscle and constriction of the pupil (miosis), which opens the trabecular meshwork drainage angle and lowers intraocular pressure \u2014 useful in glaucoma.",
 src:"PQ Q11"},
{q:"Cholinergic (muscarinic) stimulation produces all of the following EXCEPT:",
 o:["Drooling of saliva","Lacrimation","Blurred (near) vision","Mydriasis (pupil dilation)","Miosis (pupil constriction)"], a:3,
 ex:"Cholinergic stimulation causes miosis, not mydriasis \u2014 mydriasis is an ANTImuscarinic (or adrenergic) effect. Salivation, lacrimation, and blurred near-vision (from ciliary spasm) are classic muscarinic effects.",
 src:"PQ Q12"},
{q:"Storage of acetylcholine inside presynaptic vesicles is specifically inhibited by:",
 o:["Neostigmine","Botulinum toxin","Suxamethonium","Vesamicol","Hemicholinium"], a:3,
 ex:"Vesamicol blocks the vesicular acetylcholine transporter (VAChT), preventing ACh from being packaged and stored in synaptic vesicles after it has already been synthesised.",
 src:"PQ Q40"},
{q:"Release of acetylcholine from the presynaptic nerve terminal is blocked by:",
 o:["Neostigmine","Botulinum toxin","Suxamethonium","Vesamicol","Hemicholinium"], a:1,
 ex:"Botulinum toxin cleaves SNARE proteins required for vesicle docking and fusion with the presynaptic membrane, preventing calcium-dependent release of acetylcholine \u2014 the basis of both its therapeutic use and its toxicity.",
 src:"PQ Q41"},
{q:"The presynaptic choline transporter/carrier, which recycles choline for new acetylcholine synthesis, is inhibited by:",
 o:["Neostigmine","Botulinum toxin","Suxamethonium","Vesamicol","Hemicholinium"], a:4,
 ex:"Hemicholinium blocks the high-affinity choline transporter, starving the presynaptic terminal of choline needed to synthesise new acetylcholine.",
 src:"PQ Q43"},
{q:"The enzyme acetylcholinesterase, which breaks down synaptic acetylcholine, is inhibited by:",
 o:["Neostigmine","Botulinum toxin","Suxamethonium","Vesamicol","Hemicholinium"], a:0,
 ex:"Neostigmine is a reversible (carbamylating) acetylcholinesterase inhibitor, increasing the amount and duration of ACh available in the synapse \u2014 used, for example, to reverse non-depolarising neuromuscular block and treat myasthenia gravis.",
 src:"PQ Q44"},
{q:"Which drug blocks transmission at the neuromuscular junction by acting as a competitive nicotinic antagonist?",
 o:["Vesamicol","Hemicholinium","Botulinum toxin","Atracurium","Neostigmine"], a:3,
 ex:"Atracurium is a non-depolarising neuromuscular blocker that competitively blocks nicotinic (Nm) receptors at the motor end-plate, preventing depolarisation and causing flaccid paralysis.",
 src:"PQ Q68"},
{q:"Which drug facilitates cholinergic transmission by inhibiting acetylcholinesterase?",
 o:["Vesamicol","Hemicholinium","Botulinum toxin","Atracurium","Neostigmine"], a:4,
 ex:"Neostigmine inhibits acetylcholinesterase, increasing synaptic ACh availability and thereby enhancing cholinergic transmission.",
 src:"PQ Q69"},
{q:"Which drug prevents cholinergic vesicles from docking and fusing with the presynaptic membrane?",
 o:["Vesamicol","Hemicholinium","Botulinum toxin","Atracurium","Neostigmine"], a:2,
 ex:"Botulinum toxin cleaves SNARE proteins essential for vesicle docking/fusion, directly preventing acetylcholine release.",
 src:"PQ Q70"},
{q:"Which drug blocks the presynaptic choline transporter?",
 o:["Vesamicol","Hemicholinium","Botulinum toxin","Atracurium","Neostigmine"], a:1,
 ex:"Hemicholinium blocks choline re-uptake into the nerve terminal, limiting substrate available for new acetylcholine synthesis.",
 src:"PQ Q71"},
{q:"Which drug blocks the vesicular uptake of acetylcholine after it has already been synthesised in the cytoplasm?",
 o:["Vesamicol","Hemicholinium","Botulinum toxin","Atracurium","Neostigmine"], a:0,
 ex:"Vesamicol specifically inhibits the vesicular acetylcholine transporter (VAChT), so newly synthesised ACh cannot be packaged into storage vesicles.",
 src:"PQ Q72"},
{q:"Which is NOT a characteristic of depolarising neuromuscular block (e.g. with suxamethonium)?",
 o:["Combined use with halothane can trigger malignant hyperthermia in susceptible patients","Myasthenia gravis is relieved by suxamethonium","A 'Phase II' block can develop, resembling a non-depolarising block, with prolonged exposure","Tubocurarine can antagonise a Phase I depolarising block","Myalgia is a possible side effect"], a:1,
 ex:"Suxamethonium does not relieve myasthenia gravis \u2014 myasthenic patients are actually relatively RESISTANT to depolarising blockers and unusually sensitive to non-depolarising ones, due to reduced numbers of functional nicotinic receptors.",
 src:"PQ Q84"},
{q:"Neuromuscular blocking drugs are useful in all of the following EXCEPT:",
 o:["Severe tetanus (to control spasm)","Severe convulsions (to control muscular activity)","Surgical anaesthesia (muscle relaxation)","Myasthenia gravis","Electroconvulsive therapy (to prevent injury from muscle contraction)"], a:3,
 ex:"Myasthenia gravis is a disease of REDUCED neuromuscular transmission; giving a neuromuscular blocker would dangerously worsen weakness, not treat the disease \u2014 it's a contraindication, not an indication.",
 src:"PQ Q85"},
{q:"All of the following can impair release of acetylcholine at the skeletal neuromuscular junction EXCEPT:",
 o:["Aminoglycosides (e.g. gentamicin)","Hemicholinium","Botulinum toxin","Magnesium salts (excess Mg2+)","\u03B2-Bungarotoxin"], a:1,
 ex:"Hemicholinium blocks choline UPTAKE for new ACh synthesis, not the release of already-formed ACh. Aminoglycosides, magnesium excess, botulinum toxin, and \u03B2-bungarotoxin all impair the calcium-dependent release step itself.",
 src:"PQ Q87"},
{q:"Muscle paralysis induced by d-tubocurarine:",
 o:["Can be antagonised (reversed) by neostigmine","Is caused by prolonged depolarisation of the motor end-plate","Is prolonged when plasma cholinesterase activity is high","Is preceded by visible muscle fasciculations","Is irreversible once end-plate depolarisation occurs"], a:0,
 ex:"Tubocurarine is a competitive (non-depolarising) antagonist at nicotinic receptors. Because it competes reversibly with acetylcholine, raising synaptic ACh with an anticholinesterase like neostigmine can overcome the block.",
 src:"PQ Q88"},
{q:"A patient taking a drug that blocks muscarinic receptors will most likely experience:",
 o:["Diaphoresis (sweating)","Diarrhoea","Dry mouth","Miosis","Urinary incontinence"], a:2,
 ex:"Antimuscarinic drugs (like atropine) reduce secretions, producing dry mouth, and also cause urinary RETENTION (not incontinence), constipation (not diarrhoea), and mydriasis (not miosis).",
 src:"PQ Q91"},
{q:"Which drug irreversibly (non-competitively) inhibits acetylcholinesterase?",
 o:["Neostigmine","Pyridostigmine","Edrophonium","Physostigmine","Parathion"], a:4,
 ex:"Parathion is an organophosphate that phosphorylates acetylcholinesterase, forming a stable, essentially irreversible complex (unless reactivated early with pralidoxime). Neostigmine, pyridostigmine, physostigmine, and edrophonium are all reversible inhibitors.",
 src:"PQ Q92"},
{q:"Plasma (pseudo-)cholinesterase activity is decreased by all of the following EXCEPT:",
 o:["Neostigmine","Organophosphates","Edrophonium","Suxamethonium","Parathion"], a:3,
 ex:"Suxamethonium is a SUBSTRATE that is hydrolysed BY plasma cholinesterase \u2014 it doesn't inhibit the enzyme. The others are cholinesterase inhibitors that reduce enzyme activity.",
 src:"PQ Q93"},
{q:"Regarding suxamethonium (succinylcholine):",
 o:["It is a non-competitive antagonist of nicotinic receptors","It is relatively resistant to hydrolysis by acetylcholinesterase (the synaptic enzyme), instead being broken down mainly by plasma pseudocholinesterase","It is a competitive antagonist at nicotinic receptors","Its depolarising block is reversed by further depolarisation of the end-plate","Its action is reversed by physostigmine"], a:1,
 ex:"Suxamethonium is a depolarising nicotinic AGONIST (not an antagonist), hydrolysed mainly by plasma pseudo/butyrylcholinesterase rather than true synaptic acetylcholinesterase. Because it works by sustained depolarisation, anticholinesterases like physostigmine actually worsen, not reverse, its Phase I block.",
 src:"PQ Q94"},
{q:"M2 muscarinic receptors, found predominantly in cardiac tissue, act mainly through which mechanism?",
 o:["Gs protein, increasing cAMP","Gq protein, increasing IP3/DAG","Gi protein, decreasing cAMP and opening K+ channels to slow the heart","Direct ligand-gated ion-channel activity","Gt protein, activating phosphodiesterase"], a:2,
 ex:"Cardiac M2 receptors couple to Gi proteins, which inhibit adenylyl cyclase (lowering cAMP) and open potassium channels \u2014 both actions slow heart rate and reduce conduction, as seen with vagal stimulation.",
 src:"Katzung & Trevor \u2014 Cholinergic Receptors"},
{q:"Ganglionic transmission at both sympathetic and parasympathetic autonomic ganglia is mediated mainly through:",
 o:["Muscarinic (M1) receptors","Nicotinic Nn receptors","Nicotinic Nm receptors","Adrenergic alpha-1 receptors","Beta-2 receptors"], a:1,
 ex:"Fast synaptic transmission at autonomic ganglia (both divisions) uses neuronal nicotinic receptors (Nn), distinct from the muscle-type nicotinic receptor (Nm) at the skeletal neuromuscular junction.",
 src:"Katzung & Trevor \u2014 Autonomic Ganglia"},
{q:"Atropine poisoning classically produces a clinical picture often remembered as:",
 o:["'Wet as a fish, slow as a snail'","'Hot as a hare, blind as a bat, dry as a bone, red as a beet, mad as a hatter'","'Cold and clammy, needs some candy'","'Pinpoint pupils and pinpoint thinking'","'SLUDGE syndrome'"], a:1,
 ex:"Atropine's antimuscarinic effects produce hyperthermia, mydriasis/cycloplegia, dry mucous membranes, cutaneous vasodilation, and CNS excitation/delirium \u2014 contrasting with the cholinergic-excess \u2018SLUDGE\u2019 picture (salivation, lacrimation, urination, diarrhoea, GI upset, emesis).",
 src:"Katzung & Trevor \u2014 Antimuscarinic Drugs"},
{q:"Organophosphate insecticide poisoning is best treated with which combination?",
 o:["Neostigmine plus diazepam","Atropine plus pralidoxime (2-PAM)","Physostigmine plus naloxone","Edrophonium plus adrenaline","Suxamethonium plus atropine"], a:1,
 ex:"Atropine blocks the excess muscarinic effects of accumulated acetylcholine, while pralidoxime reactivates acetylcholinesterase by removing the phosphate group \u2014 most effective if given before the enzyme\u2013organophosphate bond \u2018ages\u2019 and becomes permanent.",
 src:"Katzung & Trevor \u2014 Cholinesterase Inhibitor Poisoning"},
{q:"The edrophonium (Tensilon) test, used historically to diagnose myasthenia gravis, works by:",
 o:["Blocking nicotinic receptors to worsen weakness diagnostically","Providing brief, short-acting acetylcholinesterase inhibition that transiently improves muscle strength","Paralysing the diaphragm to test respiratory reserve","Directly stimulating nicotinic receptors as a full agonist","Blocking neuromuscular transmission irreversibly"], a:1,
 ex:"Edrophonium is a very short-acting reversible acetylcholinesterase inhibitor. A brief, objective improvement in muscle strength after its administration supports a diagnosis of myasthenia gravis.",
 src:"Katzung & Trevor \u2014 Cholinergic Diagnostics"}
],

adr:[
{q:"Concerning the synthesis of noradrenaline:",
 o:["Dopamine-\u03B2-hydroxylase is the rate-limiting enzyme","Its immediate precursor is DOPA","The final step involves an oxidative reaction","Tyrosine hydroxylase is the enzyme that regulates the overall rate of synthesis","None of the above"], a:3,
 ex:"Tyrosine hydroxylase (converting tyrosine to DOPA) is the rate-limiting step of catecholamine synthesis, tightly regulated by feedback inhibition. Dopamine-\u03B2-hydroxylase converts dopamine to noradrenaline but isn't rate-limiting, and noradrenaline's immediate precursor is dopamine, not DOPA.",
 src:"PQ Q9"},
{q:"Concerning the main effects of \u03B2-adrenoceptors, which statement is correct?",
 o:["\u03B21 stimulation enhances vasodilation and relaxes visceral smooth muscle","\u03B2 stimulation inhibits insulin release from the pancreas","\u03B21 stimulation decreases cardiac rate and force of contraction","Propranolol is a good example of a non-selective \u03B2-antagonist used in hypertension/angina management","\u03B23 stimulation causes bronchoconstriction and glycogen synthesis"], a:3,
 ex:"Propranolol blocks both \u03B21 and \u03B22 receptors non-selectively, and is used clinically for hypertension, angina, and arrhythmias. Vasodilation/smooth-muscle relaxation and increased insulin release are \u03B22 effects; \u03B21 stimulation INCREASES heart rate and contractility; \u03B23 stimulation promotes lipolysis, not bronchoconstriction.",
 src:"PQ Q13"},
{q:"Which statement about sympatholytic drugs is correct?",
 o:["They mimic the action of sympathetic nerve stimulation","They act against parasympathetic nerve activity","They enhance noradrenaline release","Ephedrine is a typical example of a sympatholytic drug","None of the above statements is actually correct"], a:4,
 ex:"Sympatholytics (e.g. propranolol, prazosin, methyldopa) BLOCK or reduce sympathetic activity \u2014 they don't mimic it, don't specifically target the parasympathetic system, and don't enhance noradrenaline release. Ephedrine is actually a sympathoMIMETIC, so \u2014 as originally set \u2014 none of the printed statements is correct.",
 src:"PQ Q14 \u2014 source flags all listed options as incorrect"},
{q:"Which statement about sympathomimetic drugs is correct?",
 o:["They mimic the action of sympathetic nerve stimulation","Epinephrine (adrenaline) is an example","Their effect could, in some contexts, lead indirectly to acetylcholine release","They stimulate the release of noradrenaline (indirect-acting agents)","All of the above, though the ACh-release link is the least certain"], a:4,
 ex:"Sympathomimetics reproduce effects of sympathetic activation; epinephrine is the prototypical direct-acting agent, and indirect-acting agents (e.g. amphetamine, tyramine) work by provoking noradrenaline release from nerve terminals. The link to acetylcholine release is the weakest part of this composite answer.",
 src:"PQ Q15"},
{q:"Which statement about beta-adrenoceptor drugs and asthma is correct?",
 o:["A \u03B21-selective agonist is contraindicated in asthma","A non-selective \u03B2-antagonist (blocking \u03B22) is contraindicated in asthma","A \u03B22-selective agonist is contraindicated in asthma","A \u03B21-selective antagonist is always absolutely contraindicated in asthma","All of the above are correct"], a:1,
 ex:"\u03B22 receptors mediate bronchodilation, so blocking them (with a non-selective \u03B2-blocker like propranolol) can provoke dangerous bronchospasm in asthmatics. \u03B22 AGONISTS (like salbutamol) are actually used to TREAT asthma.",
 src:"PQ Q25 \u2014 stem reconstructed from partial source"},
{q:"Alpha-1 adrenoceptor stimulation in vascular smooth muscle typically causes:",
 o:["Vasodilation","Vasoconstriction","No change in vascular tone","Bronchodilation","Increased heart rate only"], a:1,
 ex:"\u03B11 receptors couple to Gq, raising intracellular calcium in vascular smooth muscle and causing vasoconstriction \u2014 the basis for using \u03B11 agonists like phenylephrine to raise blood pressure or as a nasal decongestant.",
 src:"Katzung & Trevor \u2014 Adrenergic Receptors"},
{q:"Presynaptic alpha-2 adrenoceptors normally function to:",
 o:["Increase further release of noradrenaline (positive feedback)","Provide negative-feedback inhibition of further noradrenaline release","Have no role in neurotransmitter regulation","Trigger acetylcholine release instead","Mediate vasoconstriction only"], a:1,
 ex:"Presynaptic \u03B12 receptors sense released noradrenaline and inhibit further release \u2014 a classic negative-feedback loop. Centrally acting \u03B12 agonists like clonidine exploit this to reduce sympathetic outflow and lower blood pressure.",
 src:"Katzung & Trevor \u2014 Adrenergic Receptors"},
{q:"Indirect-acting sympathomimetics such as amphetamine and tyramine primarily produce their effects by:",
 o:["Directly activating adrenoceptors like a catecholamine would","Displacing/provoking release of stored noradrenaline from nerve terminals","Inhibiting tyrosine hydroxylase","Blocking adrenoceptors","Increasing acetylcholinesterase activity"], a:1,
 ex:"Indirect-acting agents enter noradrenergic terminals and displace stored noradrenaline into the synapse rather than acting on the receptor themselves \u2014 also why they interact dangerously with MAO inhibitors.",
 src:"Katzung & Trevor \u2014 Sympathomimetics"},
{q:"A patient on a monoamine oxidase inhibitor (MAOI) who eats tyramine-rich food (aged cheese, cured meats) is at risk of:",
 o:["Profound hypotension","A hypertensive crisis due to excessive noradrenaline release","Bradycardia only","No significant interaction","Hypoglycaemia"], a:1,
 ex:"MAOIs prevent breakdown of intraneuronal noradrenaline. Tyramine, normally inactivated by gut/hepatic MAO, survives to trigger massive noradrenaline release from overloaded nerve terminals, precipitating a hypertensive crisis \u2014 the classic 'cheese reaction'.",
 src:"Katzung & Trevor \u2014 Sympathomimetics"},
{q:"Dopamine, given as an intravenous infusion, produces different effects by dose. At LOW infusion rates it predominantly:",
 o:["Causes generalized vasoconstriction via \u03B11 receptors","Stimulates D1 dopaminergic receptors, causing renal and mesenteric vasodilation","Only stimulates cardiac \u03B21 receptors","Has no vascular effect at any dose","Blocks noradrenaline release"], a:1,
 ex:"At low infusion rates, dopamine preferentially activates D1 receptors, dilating renal and splanchnic vasculature. At intermediate doses \u03B21 effects predominate, and at high doses \u03B11-mediated vasoconstriction takes over.",
 src:"Katzung & Trevor \u2014 Dopamine Pharmacology"},
{q:"Cardioselective beta-blockers (e.g. atenolol, metoprolol) are generally preferred over non-selective agents (e.g. propranolol) in patients with:",
 o:["Diabetes mellitus without lung disease","Co-existing asthma or COPD","Severe bradyarrhythmias","Uncontrolled hyperthyroidism only","No clinical difference exists between the two groups"], a:1,
 ex:"\u03B21-selective ('cardioselective') blockers spare \u03B22 receptors in the airway at usual doses, reducing \u2014 though not eliminating \u2014 the risk of bronchospasm compared with non-selective agents, important in reactive airway disease.",
 src:"Katzung & Trevor \u2014 Beta-Blockers"},
{q:"Alpha-1 blockers such as prazosin and tamsulosin are used clinically to treat:",
 o:["Asthma","Peptic ulcer disease","Hypertension and/or symptoms of benign prostatic hyperplasia (BPH)","Hyperthyroidism","Myasthenia gravis"], a:2,
 ex:"By relaxing vascular and prostatic/bladder-neck smooth muscle (\u03B11-mediated), these drugs lower blood pressure and ease urinary symptoms of BPH; tamsulosin's relative uroselectivity makes it favoured for BPH with less blood-pressure effect.",
 src:"Katzung & Trevor \u2014 Alpha-Blockers"}
],

auta:[
{q:"Which is NOT a characteristic of serotonin (5-hydroxytryptamine)?",
 o:["It contains an imidazole ring","It has a vasoconstrictor effect in many vascular beds","It is produced in large amounts by carcinoid tumour cells","It is found in some plant tissues and animal venoms","It is a biosynthetic precursor of melatonin"], a:0,
 ex:"Serotonin has an INDOLE ring, not an imidazole ring \u2014 imidazole is characteristic of histamine instead. All the other statements about serotonin are correct.",
 src:"PQ Q78"},
{q:"Buspirone, an anxiolytic drug, acts as a:",
 o:["5-HT1A receptor antagonist","5-HT1A receptor partial agonist","5-HT1B receptor antagonist","5-HT3 receptor agonist","5-HT2A receptor antagonist"], a:1,
 ex:"Buspirone is a 5-HT1A partial agonist, used as an anxiolytic with a lower sedation and dependence profile than benzodiazepines.",
 src:"PQ Q79"},
{q:"Sumatriptan, used to treat acute migraine, acts primarily as a:",
 o:["5-HT1A receptor antagonist","5-HT1A receptor partial agonist","5-HT1B/1D receptor antagonist","5-HT3 receptor agonist","None of the above is correct"], a:4,
 ex:"Sumatriptan is a 5-HT1B/1D receptor AGONIST (not antagonist), causing vasoconstriction of cranial blood vessels and reducing neurogenic inflammation to abort a migraine attack \u2014 so none of the printed antagonist/partial-agonist/5-HT3 options is correct.",
 src:"PQ Q80 \u2014 source flags none of the printed options as correct"},
{q:"Ondansetron, commonly used to prevent chemotherapy- and post-operative-induced vomiting, is a:",
 o:["5-HT1A receptor antagonist","5-HT1A receptor partial agonist","5-HT1B receptor antagonist","5-HT3 receptor antagonist","5-HT3 receptor agonist"], a:3,
 ex:"Ondansetron blocks 5-HT3 receptors both peripherally (vagal afferents in the gut) and centrally (chemoreceptor trigger zone), making it a first-line antiemetic.",
 src:"PQ Q81"},
{q:"Which is NOT a recognised pharmacological effect or association of histamine?",
 o:["Mediation of Type I (immediate) hypersensitivity reactions","Mediation of Type II (antibody-mediated cytotoxic) allergic reactions","Contraction of vascular endothelial cells, increasing capillary permeability","Contraction of bronchial smooth muscle (bronchoconstriction)","Promoting wakefulness via central H1 receptors"], a:1,
 ex:"Histamine is the principal mediator of TYPE I hypersensitivity (mast-cell/IgE mediated) reactions. Type II reactions involve antibody-mediated cell destruction and are not primarily histamine-driven.",
 src:"PQ Q82"},
{q:"H1 histamine receptors are found in all of the following EXCEPT:",
 o:["Brain","Vascular endothelium","Vascular smooth muscle","Mast cells","Gastric (parietal cell) mucosa"], a:4,
 ex:"Gastric parietal cells express H2 receptors, which mediate histamine-stimulated acid secretion (the target of H2-blockers like ranitidine), not H1 receptors.",
 src:"PQ Q86"},
{q:"The major clinical effects of H1-receptor activation are seen in tissues such as vascular endothelium and vascular smooth muscle, but NOT in:",
 o:["Vascular endothelium","Vascular smooth muscle","Bronchial smooth muscle","Sensory nerve endings (itch/pain)","Gastric parietal (acid-secreting) cells"], a:4,
 ex:"Gastric acid secretion is driven by H2, not H1, receptors on parietal cells. H1 receptors instead mediate the classic allergic/inflammatory picture \u2014 vasodilation and increased permeability, bronchoconstriction, itching, and pain at sensory nerve endings.",
 src:"PQ Q89 \u2014 options c\u2013e reconstructed from partial source"},
{q:"5-HT3 receptor antagonists ('-setrons', e.g. ondansetron) are usually used clinically as:",
 o:["Antidepressants","CNS stimulants","Antiemetics","Anxiolytics","Anticonvulsants"], a:2,
 ex:"By blocking 5-HT3 receptors in the gut and chemoreceptor trigger zone, these drugs are principally used as antiemetics, especially for chemotherapy- and post-operative-induced nausea and vomiting.",
 src:"PQ Q90"},
{q:"The enzyme cyclo-oxygenase (COX) converts arachidonic acid into:",
 o:["Leukotrienes","Prostaglandin endoperoxides (precursors of prostaglandins and thromboxanes)","Histamine","Serotonin","Bradykinin"], a:1,
 ex:"COX-1 and COX-2 convert arachidonic acid to prostaglandin G2/H2, the shared precursor of downstream prostaglandins (PGE2, PGI2) and thromboxane A2. Leukotrienes instead arise from the separate lipoxygenase (LOX) pathway.",
 src:"Katzung & Trevor \u2014 Autacoids (Eicosanoids)"},
{q:"Thromboxane A2 (TXA2), produced mainly by platelets, characteristically causes:",
 o:["Vasodilation and inhibition of platelet aggregation","Vasoconstriction and promotion of platelet aggregation","Bronchodilation only","Increased gastric mucus secretion only","No cardiovascular effect"], a:1,
 ex:"TXA2 promotes platelet aggregation and vasoconstriction, opposing endothelial prostacyclin (PGI2), which inhibits platelet aggregation and causes vasodilation \u2014 this balance is central to aspirin's antiplatelet action.",
 src:"Katzung & Trevor \u2014 Autacoids (Eicosanoids)"},
{q:"Misoprostol, a synthetic PGE1 analogue, is used clinically to:",
 o:["Treat hypertension only","Protect the gastric mucosa and reduce NSAID-induced ulceration; also used in obstetric care","Block histamine receptors","Treat asthma exacerbations","Inhibit platelet aggregation"], a:1,
 ex:"Misoprostol maintains protective mucosal blood flow and mucus/bicarbonate secretion, counteracting the ulcerogenic effect of NSAID-induced prostaglandin depletion; it also has a uterotonic effect used obstetrically.",
 src:"Katzung & Trevor \u2014 Autacoids (Eicosanoids)"},
{q:"Bradykinin, part of the kallikrein\u2013kinin system, contributes to the dry cough sometimes seen with which class of drugs?",
 o:["Beta-blockers","ACE inhibitors (e.g. lisinopril, enalapril)","Calcium-channel blockers","Thiazide diuretics","Statins"], a:1,
 ex:"ACE normally degrades bradykinin as well as converting angiotensin I to II. ACE inhibitors let bradykinin accumulate in the airway, thought to cause the characteristic dry, persistent cough in some patients.",
 src:"Katzung & Trevor \u2014 Peptide Autacoids"},
{q:"Angiotensin II, the principal effector peptide of the renin\u2013angiotensin system, causes:",
 o:["Vasodilation and increased renal sodium excretion","Potent vasoconstriction and stimulation of aldosterone release","Bronchodilation","Inhibition of thirst","Decreased sympathetic activity"], a:1,
 ex:"Angiotensin II is one of the body's most potent vasoconstrictors and stimulates aldosterone release from the adrenal cortex, promoting sodium and water retention \u2014 the target of ACE inhibitors/ARBs.",
 src:"Katzung & Trevor \u2014 Renin\u2013Angiotensin System"},
{q:"Histamine is synthesised from which amino acid, and stored mainly in which cells?",
 o:["Tyrosine; stored in adrenergic nerve terminals","Tryptophan; stored in enterochromaffin cells","Histidine; stored mainly in mast cells and basophils","Glutamate; stored in neurons only","Phenylalanine; stored in the liver"], a:2,
 ex:"Histidine decarboxylase converts histidine to histamine, which is stored in secretory granules chiefly within mast cells and basophils (and also enterochromaffin-like cells of the gastric mucosa).",
 src:"Katzung & Trevor \u2014 Histamine"},
{q:"H2-receptor antagonists such as ranitidine and cimetidine are used clinically mainly to:",
 o:["Treat allergic rhinitis","Reduce gastric acid secretion in peptic ulcer disease and GERD","Treat anaphylaxis as first-line therapy","Block bronchoconstriction in asthma","Act as antiemetics"], a:1,
 ex:"H2 receptors on gastric parietal cells mediate histamine-driven acid secretion; blocking them reduces basal and stimulated acid output, useful in peptic ulcer disease and reflux.",
 src:"Katzung & Trevor \u2014 Histamine Receptor Antagonists"},
{q:"'Serotonin syndrome', a potentially life-threatening state of excess serotonergic activity, is most classically precipitated by combining an SSRI with:",
 o:["A beta-blocker","A monoamine oxidase inhibitor (MAOI)","A loop diuretic","A statin","A proton pump inhibitor"], a:1,
 ex:"Combining an SSRI (which blocks serotonin reuptake) with an MAOI (which blocks serotonin breakdown) can cause dangerous serotonergic overactivity \u2014 agitation, hyperthermia, autonomic instability, and neuromuscular abnormalities (clonus, hyperreflexia).",
 src:"Katzung & Trevor \u2014 Serotonin Pharmacology"}
],

nsaid:[
{q:"Anabolic steroids are clinically (legitimately) used to:",
 o:["Increase strength and athletic performance","Treat debilitating and wasting conditions (e.g. cachexia, HIV wasting, severe burns)","Treat hormone-dependent metastatic cancer","Decrease itching (pruritus) of biliary obstruction","Treat acne in women"], a:1,
 ex:"Anabolic steroids have a legitimate role in treating catabolic/wasting states. Using them for athletic performance is abuse, not a medical indication; androgens typically WORSEN acne, and they aren't standard therapy for hormone-dependent cancers or cholestatic pruritus.",
 src:"PQ Q28"},
{q:"Side effects of anabolic steroid use include:",
 o:["Testicular atrophy","Gynaecomastia in men","Hirsutism (in women)","Sterility/infertility","All of the above"], a:4,
 ex:"Exogenous androgens suppress the hypothalamic\u2013pituitary\u2013gonadal axis (testicular atrophy, infertility), can be peripherally aromatised to oestrogen (gynaecomastia in men), and have virilising effects in women (hirsutism) \u2014 all recognised adverse effects.",
 src:"PQ Q29"},
{q:"Celecoxib is best classified as a:",
 o:["Non-selective NSAID","Selective COX-1 inhibitor","Selective COX-2 inhibitor","Selective COX-3 inhibitor","None of the above"], a:2,
 ex:"Celecoxib selectively inhibits COX-2 (the inducible, inflammation-associated isoform), sparing COX-1-mediated gastric mucosal protection \u2014 giving it a somewhat better GI safety profile than non-selective NSAIDs, though with cardiovascular trade-offs.",
 src:"PQ Q30"},
{q:"Pharmacological actions of NSAIDs include all of the following EXCEPT:",
 o:["Antipyretic effect","Analgesic effect","Anti-inflammatory effect","Antihypertensive effect"], a:3,
 ex:"NSAIDs inhibit prostaglandin synthesis, which can impair renal blood flow and sodium excretion \u2014 this tends to RAISE blood pressure and can blunt antihypertensive drugs, rather than lower it.",
 src:"PQ Q31"},
{q:"Regarding paracetamol (acetaminophen):",
 o:["It is a salicylate derivative","It has a weak analgesic effect","It has a strong analgesic effect","It has a weak anti-inflammatory effect","It has no antipyretic effect"], a:3,
 ex:"Paracetamol is a para-aminophenol derivative (not a salicylate), with good analgesic and antipyretic activity but only weak, clinically insignificant anti-inflammatory activity.",
 src:"PQ Q32"},
{q:"In the management of osteoporosis, which statement is TRUE?",
 o:["Calcium salts can only be given orally","Intramuscular calcium gluconate is preferred over intravenous because of tissue necrosis risk","Calcium gluconate and calcium lactate are preferred salts because they cause less local irritation","Hydroxyapatite is contraindicated","Calcium lactate is contraindicated in lactating mothers"], a:2,
 ex:"IM calcium salts risk causing tissue necrosis, so IV administration (when parenteral therapy is needed) is preferred, using gentler salts like calcium gluconate/lactate. Calcium can also be given IV, hydroxyapatite is a legitimate calcium source, and calcium lactate isn't contraindicated in lactation.",
 src:"PQ Q33"},
{q:"Regarding aspirin:",
 o:["It is not contraindicated in children","It has a clinically useful antiplatelet effect","It is the best choice in arthritis complicated by GI bleeding","It is used as an antihypertensive","It has general anaesthetic properties"], a:1,
 ex:"Low-dose aspirin irreversibly inhibits platelet COX-1/thromboxane A2 production, giving it a durable antiplatelet effect used in cardiovascular prophylaxis. It IS contraindicated in children (Reye's syndrome risk) and would be a poor choice with GI bleeding.",
 src:"PQ Q34"},
{q:"Antiresorptive agents (e.g. bisphosphonates, calcitonin) generally ______ serum Ca2+ and ______ osteoclast activity.",
 o:["Increase; enhance","Decrease; enhance","Increase; inhibit","Decrease; inhibit","Have no consistent effect on either"], a:3,
 ex:"Antiresorptive agents inhibit osteoclast-mediated bone resorption, which in turn lowers serum calcium \u2014 the combination is 'decrease, inhibit'.",
 src:"PQ Q35"},
{q:"Concerning antiresorptive agents, which statement is correct?",
 o:["Combination therapy has been proven clinically superior and is standard practice","Raloxifene is contraindicated in postmenopausal women","They act by increasing bone resorption","They typically produce a large, substantial gain in bone mineral density","They act by reducing overall bone remodelling/turnover"], a:4,
 ex:"Antiresorptive drugs slow the bone remodelling cycle by suppressing osteoclast activity. Raloxifene (a SERM) is actually USED in postmenopausal osteoporosis, and gains in bone mineral density with these agents tend to be modest, not dramatic.",
 src:"PQ Q36"},
{q:"Which of the following is NOT a bisphosphonate?",
 o:["Disodium etidronate","Sodium clodronate","Alendronate","Potassium citrate","Pamidronate"], a:3,
 ex:"Potassium citrate is a urinary alkalinising agent used in some renal stone regimens, not a bisphosphonate. Etidronate, clodronate, alendronate, and pamidronate are all bisphosphonates that inhibit osteoclast-mediated bone resorption.",
 src:"PQ Q37"},
{q:"Serum calcium homeostasis is regulated by all of the following EXCEPT:",
 o:["Parathyroid hormone (PTH)","Calcitonin","Salcatonin (salmon calcitonin)","Vitamin D (calcitriol)","Dietary calcium intake, indirectly, via absorption"], a:2,
 ex:"'Salcatonin' (salmon calcitonin) is a therapeutic DRUG formulation used to treat high bone turnover \u2014 not one of the body's own natural physiological regulators of calcium homeostasis, unlike endogenous PTH, calcitonin, and vitamin D.",
 src:"PQ Q38 \u2014 options d\u2013e reconstructed from partial source"},
{q:"Concomitant use of NSAIDs with all of the following should generally be avoided or used cautiously EXCEPT:",
 o:["Warfarin","ACE inhibitors","Riboflavin (vitamin B2)","Glucocorticoids","Sulfonylureas"], a:2,
 ex:"Riboflavin has no clinically significant interaction with NSAIDs. NSAIDs, by contrast, increase bleeding risk with warfarin, blunt the antihypertensive/renal effect of ACE inhibitors, raise GI ulcer risk with glucocorticoids, and can potentiate sulfonylurea-induced hypoglycaemia.",
 src:"PQ Q55"},
{q:"Aspirin belongs to which chemical class of NSAID?",
 o:["Salicylates","Enolic acid derivatives (oxicams)","Acetic acid derivatives","Fenamates (N-phenylanthranilates)","Propionic acid derivatives"], a:0,
 ex:"Aspirin (acetylsalicylic acid) is the prototype salicylate.",
 src:"PQ Q56"},
{q:"Piroxicam belongs to which chemical class of NSAID?",
 o:["Salicylates","Enolic acid derivatives (oxicams)","Acetic acid derivatives","Fenamates (N-phenylanthranilates)","Propionic acid derivatives"], a:1,
 ex:"Piroxicam is an oxicam, part of the enolic acid derivative class, notable for its long half-life allowing once-daily dosing.",
 src:"PQ Q57"},
{q:"Indomethacin belongs to which chemical class of NSAID?",
 o:["Salicylates","Enolic acid derivatives (oxicams)","Acetic acid derivatives (indole acetic acid)","Fenamates (N-phenylanthranilates)","Propionic acid derivatives"], a:2,
 ex:"Indomethacin is an indole acetic acid derivative, a potent NSAID with a relatively high rate of GI and CNS side effects.",
 src:"PQ Q58"},
{q:"Diclofenac belongs to which chemical class of NSAID?",
 o:["Salicylates","Enolic acid derivatives (oxicams)","Acetic acid derivatives (phenylacetic acid)","Fenamates (N-phenylanthranilates)","Propionic acid derivatives"], a:2,
 ex:"Diclofenac is a phenylacetic acid derivative, part of the broader acetic acid class of NSAIDs.",
 src:"PQ Q59"},
{q:"Ibuprofen belongs to which chemical class of NSAID?",
 o:["Salicylates","Enolic acid derivatives (oxicams)","Acetic acid derivatives","Fenamates (N-phenylanthranilates)","Propionic acid derivatives"], a:4,
 ex:"Ibuprofen is the prototype propionic acid derivative, alongside naproxen and ketoprofen.",
 src:"PQ Q60"},
{q:"Aspirin overdose (salicylism) classically presents with which acid\u2013base disturbance pattern?",
 o:["Pure respiratory acidosis","Pure metabolic alkalosis","Early respiratory alkalosis followed by a mixed picture with metabolic acidosis","Pure metabolic acidosis from the outset, with no respiratory component","No acid\u2013base disturbance occurs"], a:2,
 ex:"Salicylates directly stimulate the medullary respiratory centre, causing early hyperventilation and respiratory alkalosis; as toxicity progresses, accumulating organic acids produce a superimposed metabolic acidosis, giving a mixed picture.",
 src:"Katzung & Trevor \u2014 Salicylate Toxicity"},
{q:"The main mechanism by which NSAIDs cause gastric mucosal damage is:",
 o:["Direct caustic injury only, with no effect on prostaglandins","Inhibition of COX-1-derived prostaglandins that normally protect the gastric mucosa","Excess histamine release from mast cells","Blockade of H2 receptors","Stimulation of gastric acid secretion via muscarinic receptors"], a:1,
 ex:"COX-1-derived prostaglandins (especially PGE2 and PGI2) maintain gastric mucosal blood flow, mucus, and bicarbonate secretion. Non-selective NSAIDs deplete these protective prostaglandins, weakening mucosal defences.",
 src:"Katzung & Trevor \u2014 NSAID Gastrotoxicity"},
