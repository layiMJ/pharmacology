tensive brain trauma and multiple fractures. She complained of severe pain, and the attending physician planned to administer morphine. The physician knew that the dose should be carefully titrated because the entry of morphine into the patient’s central nervous system (CNS) was most likely higher than normal. Which of the following factors is most likely to have increased morphine entry into the CNS of this patient?","o":["The high first-pass effect of the drug","The brain trauma of the patient","The young age of the patient","The low clearance of the drug","The high ionization of the drug"],"a":1,"ex":"Brain trauma disrupts the blood–brain barrier and increases its permeability, so more morphine reaches the CNS. High ionization actually decreases CNS entry; first-pass effect and clearance are independent of distribution. BBB permeability is physiologically increased only in the fetus and newborn, not in a 22-year-old.","src":"Babbini & Thomas — Pharmacokinetics Q13"},{"q":"A 67-year-old woman recently diagnosed with atrial fibrillation started treatment with atenolol, 100 mg/d. With this dose, the percentage of atenolol bound to plasma proteins is about 5%. Which of the following would have been the bound percentage of atenolol if a dose of 50 mg/d had been administered to the same patient?","o":["2.5%","5%","10%","1.25%","2%"],"a":1,"ex":"Plasma-protein binding is a reversible first-order equilibrium ([free drug] + [protein] ⇌ [complex]), so a constant percentage of drug is bound, independent of dose (unless binding sites saturate). Halving the dose still leaves ~5% bound.","src":"Babbini & Thomas — Pharmacokinetics Q14"},{"q":"A 34-year-old man recently diagnosed with grand mal epilepsy started treatment with valproic acid, an antiseizure drug with a pKa of 5. What percentage of the drug was most likely lipid soluble in the patient’s duodenal lumen (assuming pH = 7 in the lumen)?","o":["1%","24%","50%","76%","99%"],"a":0,"ex":"For a weak acid, log(nonionized/ionized) = pKa − pH = 5 − 7 = −2, so nonionized/ionized = 1/100. About 99% is ionized and only ~1% is nonionized (lipid-soluble) in the duodenal lumen.","src":"Babbini & Thomas — Pharmacokinetics Q15"},{"q":"A 4-year-old boy suffering from acute lymphoblastic leukemia was about to receive an intrathecal injection of methotrexate, a drug that cannot cross the blood–brain barrier. Which of the following statements best explains why several drugs, including methotrexate, cannot easily enter the brain?","o":["Cerebrospinal fluid pressure is lower than cerebral perfusion pressure.","The pH of cerebrospinal fluid is lower than plasma pH.","Many drugs are bound to protein and cannot cross brain capillaries.","Endothelial cells of brain capillaries and choroid plexus have tight junctions.","Most drugs are completely ionized in blood."],"a":3,"ex":"The blood–brain barrier exists because brain-capillary endothelial cells (and choroid-plexus epithelium) are joined by tight junctions (occluding zonulae) and lack fenestrae, blocking paracellular passage of polar drugs such as methotrexate. Protein binding is an equilibrium and does not by itself prevent CNS entry; very few drugs are completely ionized in blood.","src":"Babbini & Thomas — Pharmacokinetics Q16"},{"q":"The ability of five different drugs (P, Q, R, S, and T) to cross the placenta was studied in laboratory animals. Which of the following drugs most likely crossed the placenta at the fastest rate?","o":["Drug P","Drug Q","Drug R","Drug S","Drug T"],"a":0,"ex":"Placental membranes behave like other cell membranes: high MW (>~1500 D), high protein binding, and ionization of larger molecules slow transfer. Drug P has a tiny MW (20 D) and is unbound; being fully ionized it is water-soluble and crosses rapidly by aqueous diffusion through aquaporins. Q is 99% protein-bound; R and T have high MW; S is large and mostly ionized, so it cannot use aqueous pores.","src":"Babbini & Thomas — Pharmacokinetics Q17","table":{"headers":["Drug","Molecular weight (daltons)","Protein bound in maternal plasma (%)","Ionized in maternal plasma (%)"],"rows":[["P","20","0","100"],["Q","250","99","50"],["R","4500","25","10"],["S","500","10","90"],["T","2000","15","30"]]}},{"q":"A 52-year-old woman suffering from rheumatoid arthritis started a treatment that included infliximab, a monoclonal antibody against tumor necrosis factor-α (TNF-α). The drug has a volume of distribution of about 3 L. Which of the following is most likely the main site of distribution of this drug?","o":["Fat tissue","Plasma","Extracellular fluids","Cell cytosol","Total body water"],"a":1,"ex":"Plasma volume is ~3 L in a 70-kg adult, so a Vd of ~3 L means the drug remains in plasma. Infliximab is a large monoclonal antibody that cannot leave the vascular compartment. Extracellular fluid is ~13 L, total body water ~42 L; fat or cytosol would give Vd > 42 L.","src":"Babbini & Thomas — Pharmacokinetics Q18"},{"q":"A 36-year-old woman recently diagnosed with trichomoniasis started a treatment with metronidazole. The drug has a hepatic clearance of 4.86 L/h and a renal clearance of 0.54 L/h. On the assumption that only the liver and kidney are involved in the elimination of this drug, what percentage of the administered drug will be eliminated by the liver?","o":["20%","40%","50%","60%","70%","90%"],"a":5,"ex":"Total clearance = 4.86 + 0.54 = 5.4 L/h. The hepatic fraction is 4.86/5.4 = 0.9, so 90% of the dose is eliminated by the liver.","src":"Babbini & Thomas — Pharmacokinetics Q19"},{"q":"The pharmacokinetic properties of five new drugs (P, Q, R, S, and T) were studied in laboratory animals. The drugs were given orally. Which of the following drugs most likely has the highest oral bioavailability?","o":["Drug P","Drug Q","Drug R","Drug S","Drug T"],"a":0,"ex":"Oral F is high when a large fraction reaches the portal vein and little is then extracted by the liver. Drug P has both the highest portal delivery (90%) and by far the lowest hepatic clearance (20 mL/min). Q has similar portal delivery but much higher hepatic clearance, and R, S, and T have lower portal delivery.","src":"Babbini & Thomas — Pharmacokinetics Q20","table":{"headers":["Drug","Percentage of drug reaching the portal vein","Hepatic clearance (mL/min)"],"rows":[["P","90","20"],["Q","86","1000"],["R","50","450"],["S","2","100"],["T","10","30"]]}},{"q":"When studied in healthy volunteers, the oral bioavailability of a new drug turned out to be 20%. Knowing that in this case the entire administered drug reached the portal circulation, which of the following will be the hepatic clearance (in mL/min) of the drug?","o":["500","800","1200","1500","2000"],"a":2,"ex":"If the entire oral dose reaches the portal vein, F = 1 − E. F = 0.20, so extraction ratio E = 0.80. Hepatic clearance = E × hepatic blood flow ≈ 0.8 × 1500 mL/min = 1200 mL/min.","src":"Babbini & Thomas — Pharmacokinetics Q21"},{"q":"A new drug was studied in a healthy volunteer during a phase 1 clinical trial. Urine and plasma samples were collected 1 hour after the intravenous administration of a test dose. Drug concentration was 40 mg/mL in urine and 1 mg/mL in plasma. The urine output of this subject was 1.44 L/d. Which of the following was most likely the renal clearance of the drug, in mL/min?","o":["40","30","20","50","60","10"],"a":0,"ex":"Urine flow = 1440 mL / 1440 min = 1 mL/min. CLr = (urine flow × urine concentration) / plasma concentration = (1 mL/min × 40 mg/mL) / 1 mg/mL = 40 mL/min.","src":"Babbini & Thomas — Pharmacokinetics Q22"},{"q":"A 10-mg dose of a new drug that follows first-order, one-compartment model kinetics was given intravenously to healthy subjects in a phase 1 clinical trial. The volume of distribution (Vd) of the drug turned out to be 80 L. Which of the following would have been the volume of distribution of the drug (in liters) if the administered dose were 20 mg?","o":["40","80","240","160","120"],"a":1,"ex":"Vd = Dose × F / Cp0. Doubling the dose doubles Cp0 in the same proportion, so Vd is independent of dose and remains 80 L.","src":"Babbini & Thomas — Pharmacokinetics Q23"},{"q":"A 45-year-old man suffering from epilepsy had been receiving carbamazepine, one tablet daily. The drug has a total clearance of 63 L/h and a hepatic clearance of 62 L/h. The man was recently diagnosed with a skin infection due to Mycobacterium marinum, and treatment with rifampin and ethambutol was started. Knowing that rifampin is a potent inducer of microsomal enzymes, which of the following changes most likely occurred to the pharmacokinetics of carbamazepine?","o":["The hepatic clearance of the drug decreased.","The first-pass loss of the drug decreased.","The renal clearance of the drug decreased.","The volume of distribution of the drug increased.","The half-life of the drug decreased."],"a":4,"ex":"Rifampin induces CYP enzymes, raising hepatic (and therefore total) clearance of carbamazepine, whose CL is almost entirely hepatic. Because t½ = 0.7 Vd / CL, half-life falls. First-pass loss actually increases with induction; Vd is unchanged.","src":"Babbini & Thomas — Pharmacokinetics Q24"},{"q":"A 59-year-old Japanese man with atrial fibrillation presented to his physician complaining of red urine. The man had been receiving a standard dose of warfarin, which is an anticoagulant drug biotransformed by CYP2C9 isozyme. Which of the following was the most likely cause of the patient’s disorder?","o":["Increased protein binding of warfarin","Decreased renal excretion of warfarin","Genetic polymorphism of CYP2C9","Decreased metabolism of CYP2C9","Increased CYP2C9 synthesis in a person of Asian origin"],"a":2,"ex":"CYP2C9 shows genetic polymorphism; more than 20% of Asians are poor metabolizers. Reduced warfarin clearance exaggerates anticoagulation and causes hematuria. Increased protein binding or increased CYP2C9 synthesis would decrease, not increase, warfarin effect; >95% of warfarin is metabolized, so renal excretion is not a clinically important source of variability.","src":"Babbini & Thomas — Pharmacokinetics Q25"},{"q":"The pharmacokinetics of a new drug was studied in laboratory animals. The drug was given orally, and the following results were obtained: percent reaching the portal circulation 40%; liver clearance negligible. Liver blood flow in the animal was 1000 mL/min. Which of the following would be the oral bioavailability of the drug?","o":["1.0","0.4","0.1","2.2","0.6","0.8"],"a":1,"ex":"With negligible hepatic clearance, every molecule that reaches the portal vein reaches the systemic circulation. Only 40% of the oral dose reaches the portal vein, so F = 0.4. Liver blood flow is not needed for the calculation.","src":"Babbini & Thomas — Pharmacokinetics Q26"},{"q":"A 35-year-old Caucasian man complained to his physician of tingling sensation in his limbs and noted that his arms sometimes felt heavy. The man, recently diagnosed with pulmonary tuberculosis, had been receiving isoniazid and rifampin for 2 months. He was diagnosed with peripheral neuropathy, a known adverse effect of isoniazid. Which of the following events most likely caused the patient’s symptoms and signs?","o":["Rifampin-induced inhibition of isoniazid metabolism","Worsening of the disease, despite the therapy","Allergic reaction to rifampin","Inherited deficiency of N-acetyltransferase","Allergic reaction to isoniazid"],"a":3,"ex":"Isoniazid is acetylated by N-acetyltransferase; about half of Caucasians are genetically slow acetylators and accumulate the drug, raising the risk of peripheral neuropathy. Rifampin induces (does not inhibit) microsomal enzymes; neither allergy nor treatment failure produces this neuropathy.","src":"Babbini & Thomas — Pharmacokinetics Q27"},{"q":"A 49-year-old obese man recently diagnosed with vasospastic angina started a treatment with nifedipine. The drug has a volume of distribution (Vd) of about 55 L in a 70-kg person, but in this obese patient, the Vd turned out to be 110 L. The standard loading dose of nifedipine for a patient weighing 70 kg is 30 mg. Which of the following should be the therapeutic loading dose administered to this patient (in mg) in order to achieve the same target concentration?","o":["20","40","60","90","120","150"],"a":2,"ex":"Loading dose = Vd × target Cp / F. This patient’s Vd is twice that of a 70-kg person, so the loading dose must be doubled from 30 mg to 60 mg to reach the same target concentration.","src":"Babbini & Thomas — Pharmacokinetics Q28"},{"q":"A 22-year-old man suffering from adult autism and violent behavior started a treatment that included buspirone, a drug with a large first-pass effect. Which of the following pharmacokinetic properties of the drug was most likely affected by this large first-pass effect?","o":["Volume of distribution","Oral bioavailability","Renal clearance","Sublingual bioavailability","Intramuscular bioavailability"],"a":1,"ex":"Extensive first-pass metabolism in gut wall and/or liver reduces the fraction of an oral dose that reaches the systemic circulation — i.e., oral bioavailability (buspirone F ≈ 5%). Vd and renal clearance are independent of absorption; sublingual and intramuscular routes bypass first-pass.","src":"Babbini & Thomas — Pharmacokinetics Q29"},{"q":"A 47-year-old man recently diagnosed with systolic heart failure started a treatment that included furosemide. The drug has a total clearance of about 136 mL/min, and about 66% of the drug is excreted as such in the urine. On the assumption that, in this case, only the liver and kidneys are involved in drug elimination, which of the following was most likely the renal clearance of furosemide (in mL/min)?","o":["90","70","110","25","81","16"],"a":0,"ex":"If 66% of the drug is excreted unchanged, renal clearance is 66% of total clearance: 0.66 × 136 ≈ 90 mL/min.","src":"Babbini & Thomas — Pharmacokinetics Q30"},{"q":"The pharmacokinetics of a new drug that followed first-order, one-compartment model kinetics was studied in a healthy volunteer. A 20-mg dose was given intravenously. The plasma concentration of the drug turned out to be 2 mg/L initially and 1 mg/L 2 hours later. Which of the following was most likely the total clearance of the drug (in L/h)?","o":["2.5","8.4","5.5","6.7","3.5","4.9"],"a":4,"ex":"Concentration halves in 2 hours, so t½ = 2 h. Vd = Dose / Cp0 = 20 mg / 2 mg/L = 10 L. CL = 0.7 × Vd / t½ = 0.7 × 10 L / 2 h = 3.5 L/h.","src":"Babbini & Thomas — Pharmacokinetics Q31"},{"q":"The pharmacokinetic properties of five new drugs (P, Q, R, S, and T) were studied in laboratory animals. A 100-mg dose of each drug was administered intravenously to the same animal on five separate occasions. The plasma concentration–time curves for each drug are depicted in the figure below. Which of the following drugs has the largest volume of distribution?","o":["Drug P","Drug Q","Drug R","Drug S","Drug T"],"a":4,"ex":"Vd = Dose / Cp0. With equal IV doses, the drug with the lowest theoretical plasma concentration at time 0 (lowest y-intercept on the log-linear plot) has the largest Vd — drug T.","src":"Babbini & Thomas — Pharmacokinetics Q32","svg":"pk32"},{"q":"The pharmacokinetics of a new drug was studied in healthy volunteers. It was found that the drug followed first-order, one-compartment model kinetics and had a volume of distribution of 100 L. After the oral administration of 200 mg, the theoretical plasma concentration at time 0 turned out to be 1 mg/L. Which of the following was most likely the oral bioavailability of the drug?","o":["0.1","0.5","0.8","1.0","2.3","1.6"],"a":1,"ex":"Vd = Dose × F / Cp0, so F = (Vd × Cp0) / Dose = (100 L × 1 mg/L) / 200 mg = 0.5. Bioavailability cannot exceed 1.","src":"Babbini & Thomas — Pharmacokinetics Q33"},{"q":"A 32-year-old male cocaine addict was brought unconscious to the emergency department. A friend stated that the man had intravenously self-injected an unknown dose of cocaine 2 hours earlier. An immediate lab analysis indicated that the plasma level of cocaine was 0.75 mg/L. Cocaine has a volume of distribution of about 130 L and a half-life of about 1 hour. Which of the following was most likely the injected dose of cocaine (in mg)?","o":["250","390","420","315","180","115"],"a":1,"ex":"Two hours = 2 half-lives, so current Cp is 1/4 of Cp0. Cp0 = 0.75 × 4 = 3 mg/L. Dose = Cp0 × Vd = 3 mg/L × 130 L = 390 mg.","src":"Babbini & Thomas — Pharmacokinetics Q34"},{"q":"A 23-year-old healthy male volunteer received an intravenous dose of 2 mg of a new drug during a clinical trial. The drug followed a first-order, one-compartment model kinetics and had a volume of distribution of 10 L. After 6 hours the plasma concentration of the drug was 50 µg/L. Which of the following was most likely the half-life of the drug (in hours)?","o":["1","2","3","4","5","6"],"a":2,"ex":"Cp0 = Dose / Vd = 2000 µg / 10 L = 200 µg/L. Concentration is 100 µg/L after one half-life and 50 µg/L after two half-lives. That 50 µg/L is measured at 6 hours, so t½ = 3 hours.","src":"Babbini & Thomas — Pharmacokinetics Q35"},{"q":"The figure below depicts the plasma concentration–time curves for four drugs (W, X, Y, and Z) given by IV infusion to the same laboratory animal on four separate occasions. Which of the following drugs has the shortest half-life?","o":["Drug W","Drug X","Drug Y","Drug Z"],"a":1,"ex":"During a constant IV infusion, 50% of Css is reached after one half-life. Drug X reaches half its Css (~15 of ~30 mg/mL) in about 1 hour, whereas W, Y, and Z each take about 2 hours, so X has the shortest t½.","src":"Babbini & Thomas — Pharmacokinetics Q36","svg":"pk36"},{"q":"The pharmacokinetics of a new drug was studied in a healthy volunteer. The drug was given by intravenous infusion at a rate of 30 mg/h. The plasma concentration–time curve of the drug is depicted below. Which of the following is most likely the total clearance of the drug (in L/h)?","o":["4","6","2","10","14","16"],"a":3,"ex":"At steady state, infusion rate = Css × CL. From the graph Css ≈ 3 mg/L, so CL = 30 mg/h / 3 mg/L = 10 L/h.","src":"Babbini & Thomas — Pharmacokinetics Q37","svg":"pk37"},{"q":"The pharmacokinetics of a new drug following zero-order kinetics was studied in a healthy volunteer. Three hours after the intravenous administration of a test dose, the plasma concentration of the drug was 8 mg/L, and 1 hour later it was 7 mg/L. Which of the following was most likely the plasma concentration of the drug (in mg/L) immediately after drug administration?","o":["9","32","11","16","64","5"],"a":2,"ex":"Zero-order elimination removes a constant amount per unit time: here 1 mg/L per hour (8 → 7 between hours 3 and 4). Working backward 3 hours from 8 mg/L gives 11 mg/L immediately after administration.","src":"Babbini & Thomas — Pharmacokinetics Q38"},{"q":"The figure below depicts the concentration–time curve of a new drug after a single intravenous dose of 20 mg was administered to a laboratory animal. Which of the following drugs does the new agent most resemble?","o":["Atropine","Propranolol","Ethanol","Phenylephrine","Clonidine","Dobutamine"],"a":2,"ex":"A straight-line (arithmetic) C–t plot means a constant amount is eliminated per unit time — zero-order kinetics. Ethanol, salicylate, and phenytoin are the classic zero-order drugs; atropine, propranolol, phenylephrine, clonidine, and dobutamine follow first-order kinetics.","src":"Babbini & Thomas — Pharmacokinetics Q39","svg":"pk39"},{"q":"The pharmacokinetics of a new drug was studied in a healthy volunteer. The drug followed first-order, one-compartment model kinetics and had a half-life of 3 hours. An intravenous infusion of the drug was started at 8:00 a.m. A blood sample taken at 2:00 p.m. of the same day showed a plasma drug concentration of 60 µg/mL. Which of the following was most likely the plasma concentration of that drug (in µg/mL) at the steady state?","o":["100","60","80","30","40","120"],"a":2,"ex":"From 8:00 a.m. to 2:00 p.m. is 6 hours = 2 half-lives, at which 75% of Css has been reached. 60 µg/mL = 0.75 × Css, so Css = 60 / 0.75 = 80 µg/mL.","src":"Babbini & Thomas — Pharmacokinetics Q40"}],

b_pd: [{"q":"A 68-year-old man recently diagnosed with atrial fibrillation started therapy with atenolol, a β-receptor blocker. Which of the following changes most likely occurred in cardiac myocytes during the first 2 weeks of therapy?","o":["Spare β receptors became activated.","The G-protein number decreased.","The β-receptor number increased.","Most β receptors became phosphorylated.","The ability to respond to intracellular cyclic adenosine monophosphate (cAMP) declined."],"a":2,"ex":"Chronic blockade of a receptor typically increases receptor number (upregulation). Spare receptors are not recruited by blockade; G-protein synthesis is not under β-receptor control; phosphorylation desensitizes receptors after repeated activation, not after blockade; and β-blockade affects cAMP synthesis, not the cell’s ability to respond to cAMP already formed.","src":"Babbini & Thomas — Pharmacodynamics Q1"},{"q":"A new drug was tested in an in vitro system. It was found that only one enantiomer of the racemic pair bound substantially to a specific receptor, whereas the other enantiomer showed negligible binding. Which of the following terms best defines this property?","o":["Intrinsic activity","Affinity","Stereoselectivity","Potency","Variability","Maximal efficacy"],"a":2,"ex":"Stereoselectivity is the receptor property of binding one enantiomer of a racemic pair far more than the other. Affinity is binding strength regardless of chirality; intrinsic activity and maximal efficacy describe activation after binding; potency is the dose needed for a given effect.","src":"Babbini & Thomas — Pharmacodynamics Q2"},{"q":"A 14-year-old girl suffering from seasonal rhinitis started a therapy with loratadine, a drug that binds to H1 histamine receptors. Which of the following terms describes a characteristic of loratadine binding to the H1 receptor?","o":["Intrinsic activity","Potency","Maximal efficacy","Affinity","Receptor activation"],"a":3,"ex":"Affinity is the tendency of a drug to bind its receptor (occupation theory / law of mass action). Intrinsic activity, receptor activation, potency, and maximal efficacy describe what happens after binding or the size of the resulting effect, not the binding step itself.","src":"Babbini & Thomas — Pharmacodynamics Q3"},{"q":"Two new drugs were tested in laboratory animals. Which of the following drug parameters was most likely recorded to estimate the relative potency of both drugs?","o":["The therapeutic index of both drugs","The maximal responses produced by each drug","The graded log dose–response curve of both drugs","The volume of distribution of both drugs","The clearance of both drugs"],"a":2,"ex":"Potency is the dose needed to produce a given effect and is read from a graded log dose–response curve (dose on the x-axis at a chosen effect). Maximal response is efficacy, not potency; therapeutic index mixes efficacy and toxicity; Vd and clearance are pharmacokinetic, not pharmacodynamic, variables.","src":"Babbini & Thomas — Pharmacodynamics Q4"},{"q":"A 65-year-old man suffering from osteoarthritis has been taking naproxen, 500 mg daily for 1 month. The drug was effective, but the patient suffered from nausea and heartburn. The physician decided to try another nonsteroidal antiinflammatory drug (NSAID) and prescribed celecoxib, a drug ~5 times more potent than naproxen, with negligible gastrointestinal side effects. Which of the following would be the most appropriate daily dose of celecoxib (in mg) to prescribe to the patient?","o":["50","1000","10","25","100","75"],"a":4,"ex":"Because naproxen was therapeutically effective, an equieffective dose of celecoxib should be started. Celecoxib is ~5 times more potent, so 500 mg ÷ 5 = 100 mg daily is the matching dose.","src":"Babbini & Thomas — Pharmacodynamics Q5"},{"q":"A 2-year-old boy was admitted to the emergency department after a generalized tonic-clonic seizure. His mother reported that the boy apparently ingested several tablets of propranolol, a β-blocker, which he had found in his father’s dresser drawer. Vital signs on admission were blood pressure 85/50 mm Hg, heart rate 40 beats per minute (bpm), respiratory rate 20/min. The boy received an intramuscular injection of glucagon, a hormone that activates glucagon receptors in the heart, causing a significant increase in heart contractility. Which of the following terms best defines the antagonism between glucagon and β-blockers?","o":["Chemical","Functional","Competitive","Pharmacokinetic","Pharmacological"],"a":1,"ex":"Functional (physiologic) antagonism occurs when two drugs act on different receptors to produce opposite effects on the same physiologic function. Glucagon increases cardiac contractility via glucagon receptors, opposing the β1-blockade of propranolol; it does not compete at the β receptor or inactivate the drug chemically.","src":"Babbini & Thomas — Pharmacodynamics Q6"},{"q":"The effect of a new autonomic drug was tested on a healthy volunteer during a clinical trial. The subject was treated with saline or with the drug, and cardiac rate was recorded at rest or after exercise. Which of the following terms best defines the tested drug?","o":["Noncompetitive antagonist","Competitive antagonist","Partial agonist","Physiologic antagonist","Full agonist","Chemical antagonist"],"a":2,"ex":"A partial agonist produces a submaximal effect when it occupies all receptors and, in the presence of a full agonist, acts as an agonist when endogenous agonist is low but as an antagonist when it is high. At rest (low norepinephrine) the drug slightly raises heart rate; after exercise (high norepinephrine) it lowers heart rate — the signature of a partial β1 agonist.","src":"Babbini & Thomas — Pharmacodynamics Q7","table":{"headers":["Treatment","At rest (bpm)","After exercise (bpm)"],"rows":[["Saline","70","150"],["Drug","85","100"]]}},{"q":"A 65-year-old woman suffering from atrial fibrillation had been taking a drug to treat this condition for 6 months. The drug had no intrinsic activity and bound reversibly to β1 receptors. Which of the following terms best defines this drug?","o":["Partial agonist","Functional antagonist","Inverse agonist","Noncompetitive antagonist","Competitive antagonist","Full agonist"],"a":4,"ex":"A drug that binds a receptor but has no intrinsic activity is an antagonist. Reversible binding defines competitive (surmountable) antagonism. Partial and full agonists have intrinsic activity; noncompetitive antagonists bind irreversibly or at an allosteric site.","src":"Babbini & Thomas — Pharmacodynamics Q8"},{"q":"A new β-blocker was tested in healthy volunteers. The cumulative frequency distribution of subjects showing a decrease of 10 bpm in the heart rate was plotted against the log dose. Which of the following drug parameters can be determined from this cumulative frequency distribution?","o":["Receptor affinity","Median effective dose","Therapeutic index","Therapeutic window","Maximal efficacy"],"a":1,"ex":"A plot of cumulative percent of responders versus log dose is a quantal dose–response curve, from which the median effective dose (ED50 — the dose producing the defined effect in 50% of subjects) is read. Affinity needs a binding plot; therapeutic index/window need a second (toxicity) curve; maximal efficacy is read from a graded, not quantal, curve.","src":"Babbini & Thomas — Pharmacodynamics Q9"},{"q":"In an in vitro log dose–response plot, curve X is the control sigmoidal curve of a full α1 agonist on contraction of vascular smooth muscle, reaching 100% maximum effect. Alternative curves: P is a parallel leftward shift of X (same max); Q, R, and S are right-shifted with progressively reduced maxima (~70%, ~40%, ~20%); T is a parallel rightward shift of X that still reaches 100% maximum effect. Which curve best depicts the log dose–response curve of that agonist when a fixed dose of a competitive α1 antagonist is given concomitantly?","o":["Curve P","Curve Q","Curve R","Curve S","Curve T"],"a":4,"ex":"A competitive antagonist decreases the apparent affinity of the agonist, producing a parallel rightward shift of the log dose–response curve without reducing Emax (the antagonism is surmountable if enough agonist is added). That pattern is curve T.","src":"Babbini & Thomas — Pharmacodynamics Q10"},{"q":"Five in vitro log dose–response curves (P, Q, R, S, T) are shown. Drug P (leftmost) and drug R (parallel to P, to its right) both reach 100% maximum effect with the same slope. Drug S also reaches 100% but with a shallower, non-parallel slope. Drugs Q and T plateau below 100% (~70% and ~40%). Which pair of drugs can fully activate the same receptors?","o":["Drugs P and Q","Drugs P and R","Drugs P and S","Drugs Q and T","Drugs Q and S","Drugs R and S"],"a":1,"ex":"Full agonists at the same receptor produce parallel log dose–response curves that reach the same Emax; P and R match that pattern. Q and T are partial agonists (lower Emax). S reaches 100% but is not parallel, so it most likely acts through a different receptor.","src":"Babbini & Thomas — Pharmacodynamics Q11"},{"q":"Five in vitro log dose–response curves of drugs (P, Q, R, S, and T) acting on the same receptor are shown as roughly parallel sigmoids; from left to right they are P, Q, R, S, and T (T is furthest right). Which of the following drugs has the highest ED50?","o":["Drug P","Drug Q","Drug R","Drug S","Drug T"],"a":4,"ex":"On a graded log dose–response curve, ED50 is the dose producing 50% of that drug’s maximum effect. The furthest-right curve has the highest ED50; that is drug T.","src":"Babbini & Thomas — Pharmacodynamics Q12"},{"q":"A 65-year-old woman who had been admitted to the hospital with a myocardial infarction developed ventricular tachycardia and received an intravenous injection of lidocaine. Her cardiologist knew that the dose given must be within the range of doses that have a high probability of therapeutic success. Which of the following terms best defines this range?","o":["Intrinsic activity","Efficacy","Potency","Therapeutic index","Therapeutic window","Response variability"],"a":4,"ex":"The therapeutic window is the interval between the minimum therapeutic dose (or concentration) and the minimum toxic dose (or concentration) — the range with a high probability of therapeutic success. Therapeutic index is a single ratio (e.g. TD50/ED50), not a range of doses.","src":"Babbini & Thomas — Pharmacodynamics Q13"},{"q":"A 67-year-old man suffering from terminal cancer started analgesic treatment with an opioid drug. Knowing that tolerance to opioids is pronounced, which of the following drug parameters was most likely increased after a few days of treatment?","o":["Maximal efficacy","Median effective dose","Therapeutic index","Potency","Half-life"],"a":1,"ex":"Tolerance is decreased responsiveness, so a larger dose is needed to produce the same effect in 50% of subjects — ED50 increases and potency falls. Maximal efficacy may still be reachable at higher doses; therapeutic index typically falls or is unchanged; half-life would decrease if metabolic (pharmacokinetic) tolerance were the mechanism.","src":"Babbini & Thomas — Pharmacodynamics Q14"},{"q":"A 17-year-old girl started smoking 1 month ago, and now she is smoking 5 to 10 cigarettes daily. She has noticed that the first cigarette of the day often causes mild tachycardia, which does not usually occur with the following cigarettes. Which of the following terms best defines this tolerance pattern?","o":["Cross-tolerance","Tachyphylaxis","Pharmacokinetic tolerance","Innate tolerance","Sensitization"],"a":1,"ex":"Tachyphylaxis is tolerance that appears (and reverses) rapidly — here, overnight recovery of nicotine’s tachycardic effect, then rapid re-tolerance with subsequent cigarettes. Cross-tolerance is shared with related drugs; innate tolerance is genetic and present on first exposure; sensitization is an increasing, not decreasing, response.","src":"Babbini & Thomas — Pharmacodynamics Q15"},{"q":"A 64-year-old man with terminal cancer had been suffering from continuous pain and started treatment with morphine. After a few days of treatment, the initial dose was no longer effective, and the physician gradually increased the dose, knowing that pharmacodynamic tolerance most likely had occurred. Which of the following best explains the mechanism of tolerance in this patient?","o":["Accelerated morphine metabolism","Increased affinity of receptors to morphine","Decreased binding of morphine to plasma proteins","Decreased morphine receptor density","Decreased concentration of morphine in the brain"],"a":3,"ex":"Pharmacodynamic tolerance is decreased responsiveness despite an unchanged concentration at the site of action; the most common mechanism is receptor downregulation (decreased density). Accelerated metabolism or lower brain levels would be pharmacokinetic tolerance; increased affinity or less plasma binding would enhance, not blunt, morphine’s effect.","src":"Babbini & Thomas — Pharmacodynamics Q16"},{"q":"A 17-year-old boy drank increasing amounts of alcohol when attending parties. He noticed that lately he was able to better tolerate alcohol effects and asked his physician the reason for this. The physician said that pharmacodynamic tolerance had probably occurred. Which of the following actions most likely mediated this tolerance?","o":["Decreased concentration of the drug at the site of action","Homeostatic adaptive changes that counteract the drug effect","Decreased bioavailability of the drug","Increased biotransformation of the drug","Increased number of drug receptors"],"a":1,"ex":"Pharmacodynamic tolerance occurs even when drug concentration at the site of action is unchanged. For ethanol, homeostatic CNS adaptive changes that counteract intoxication are especially important (effects are greater on the rising than the falling limb of the concentration curve). Decreased concentration, bioavailability, or increased biotransformation are pharmacokinetic mechanisms; receptor number, if anything, would decrease.","src":"Babbini & Thomas — Pharmacodynamics Q17"},{"q":"A 46-year-old woman complained to her physician that the sedative effect of the drug she was taking had increased substantially. The woman, who was suffering from generalized anxiety disorder, had been taking diazepam, one tablet daily. A few days earlier, she had started taking cimetidine to treat her heartburn. Cimetidine is an inhibitor of the cytochrome P-450 system in the liver. Which of the following terms best defines this cimetidine–diazepam interaction?","o":["Additive effect","Potentiation","Synergism","Sensitization","Reverse tolerance"],"a":1,"ex":"Potentiation occurs when one drug enhances another’s effect but lacks that effect itself. Cimetidine is not sedative but raises diazepam levels by inhibiting CYP-mediated metabolism, amplifying sedation. Additive/synergistic interactions require both drugs to share the effect; sensitization/reverse tolerance describe increasing response with chronic dosing of the same drug.","src":"Babbini & Thomas — Pharmacodynamics Q18"},{"q":"A 45-year-old woman recently diagnosed with a urinary tract infection started therapy with a trimethoprim–sulfamethoxazole combination. Both trimethoprim and sulfamethoxazole are bacteriostatic drugs when given alone. However, a bactericidal effect is obtained when the two drugs are given in combination. Which of the following terms best defines this drug interaction?","o":["Additive effect","Potentiation","Synergism","Reverse tolerance","Sensitization"],"a":2,"ex":"Synergism is a combined response greater than the sum of the individual responses. Each drug alone is bacteriostatic; together they are bactericidal — more than additive static activity. Potentiation requires one agent to lack the effect when given alone.","src":"Babbini & Thomas — Pharmacodynamics Q19"},{"q":"A 2-year-old girl was rushed to the emergency department after ingesting several tablets of a medication containing iron. An emergency treatment was started that included the intravenous administration of deferoxamine. This drug is able to combine with iron in plasma to form an inactive complex and therefore to antagonize iron effects. Which of the following terms best defines this antagonism?","o":["Competitive","Noncompetitive","Functional","Chemical","Pharmacokinetic"],"a":3,"ex":"Chemical antagonism occurs when one drug binds the other chemically and inactivates it (here, deferoxamine chelates iron). It does not act at receptors (competitive/noncompetitive/functional) or by altering iron’s ADME (pharmacokinetic antagonism).","src":"Babbini & Thomas — Pharmacodynamics Q20"},{"q":"A new drug was tested in an in vitro system. The relationship between the concentration of the drug and the association and dissociation of the drug–receptor complex was evaluated. Which of the following factors regulates this relationship?","o":["The pharmacological response","The volume of distribution of the drug","The total clearance of the drug","The law of mass action","The rate of signal transduction"],"a":3,"ex":"Association and dissociation of a drug–receptor complex are governed by the law of mass action: occupancy rises with drug concentration and with affinity. Pharmacologic response and transduction follow occupancy; Vd and clearance are pharmacokinetic parameters and do not regulate binding.","src":"Babbini & Thomas — Pharmacodynamics Q21"},{"q":"An 83-year-old woman suffering from overflow urinary incontinence started a therapy with a cholinergic drug that was able to relieve leaking. Which of the following best defines the molecular event initiated by drug–receptor binding and ending with the therapeutic effect in this patient?","o":["Receptor upregulation","Drug efficacy","Signal transduction pathway","Drug–receptor interaction","Drug potency"],"a":2,"ex":"The signal transduction pathway is the molecular cascade from receptor binding to the measurable pharmacologic effect (ion channels, G proteins, second messengers, kinases). Drug–receptor interaction is only the first step; efficacy and potency describe magnitude and dose-requirement of the effect, not the pathway itself.","src":"Babbini & Thomas — Pharmacodynamics Q22"},{"q":"A 9-year-old boy suffering from mild asthma used a β2 agonist “as needed” by inhalation. Which of the following was most likely the immediate consequence of the activation of β2 receptors?","o":["Opening of ligand-gated K+ channels","Increased synthesis of cAMP","Decreased synthesis of cAMP","Conformational change of a G protein","Phosphorylation of a G protein"],"a":3,"ex":"β2 receptors are metabotropic (Gs-coupled). The immediate event after agonist binding is a conformational change in the associated G protein, releasing a GTP-α subunit. Increased cAMP and channel effects are later consequences of that G-protein activation; the G protein itself is not phosphorylated as the first step.","src":"Babbini & Thomas — Pharmacodynamics Q23"},{"q":"A 57-year-old man who was in the hospital after a surgical procedure complained of a severe abdominal pain. The physician decided to start analgesic treatment with an opioid. The drugs he was considering were morphine (10 mg IM) and buprenorphine (0.3 mg IM). Morphine is a full agonist at mu (μ) opioid receptors, whereas buprenorphine is a partial agonist at the same receptors. The above-mentioned doses of the two drugs are equieffective. Which of the following pairs of statements correctly defines the potency and efficacy of morphine and buprenorphine?","o":["Morphine is more potent. Buprenorphine is more effective.","Morphine is more potent. Buprenorphine is less effective.","Morphine is less potent. Buprenorphine is more effective.","Morphine is less potent. Buprenorphine is less effective."],"a":3,"ex":"Potency is the dose needed for a given effect: 10 mg morphine matches 0.3 mg buprenorphine, so morphine is less potent. Efficacy is maximal effect: a partial agonist (buprenorphine) has lower maximal efficacy than a full agonist (morphine) at the same receptor.","src":"Babbini & Thomas — Pharmacodynamics Q24"},{"q":"A series of new β agonists was tested in laboratory animals. Heart rate was measured after treatment with different doses of each drug. Which of the following drugs was the most potent?","o":["Drug A","Drug B","Drug C","Drug D","Drug E"],"a":0,"ex":"Potency is the dose needed for a given effect, so the lowest ED50 is the most potent drug — here drug A (2 mg). Potency is independent of efficacy; drug A actually produces the smallest maximal heart-rate increase.","src":"Babbini & Thomas — Pharmacodynamics Q25","table":{"headers":["Drug","ED50 (mg)","Maximal increase in heart rate (bpm)"],"rows":[["A","2","+15"],["B","10","+22"],["C","15","+30"],["D","5","+40"],["E","20","+55"]]}},{"q":"Two new diuretics were tested in healthy volunteers. They were given singly or together on separate occasions. Which of the following terms best defines the type of drug–drug interaction that has occurred?","o":["Synergism","Potentiation","Additive","Functional antagonism","Pharmacokinetic antagonism"],"a":2,"ex":"The combined urine output (8 L) equals the sum of the individual responses (5 L + 3 L). When the combination equals the sum of the separate effects, the interaction is additive. Synergism would exceed 8 L; potentiation requires one drug to lack the effect alone.","src":"Babbini & Thomas — Pharmacodynamics Q26","table":{"headers":["Drug","Dose (mg)","Daily urine output (L)"],"rows":[["A","20","5"],["B","5","3"],["A + B","20 (A) + 5 (B)","8"]]}},{"q":"A 45-year-old woman recently diagnosed with lupus erythematosus started a treatment with a synthetic steroid. Which of the following is the most likely time lapse expected between receptor activation and therapeutic response?","o":["Few milliseconds","Few seconds","Few minutes","One or 2 hours","Several hours or days"],"a":4,"ex":"Steroids act on nuclear receptors to regulate gene transcription and protein synthesis. That genomic mechanism produces a lag of hours to days between receptor activation and the therapeutic effect — far slower than ion-channel or GPCR responses.","src":"Babbini & Thomas — Pharmacodynamics Q27"},{"q":"The figure depicts in vitro log dose–response curves of different drugs acting on the same receptor. The curves are sigmoidal; drug P is furthest left (most potent / highest affinity), followed by Q, R, S, and T (furthest right). Which of the drugs has the highest affinity for the receptor?","o":["Drug P","Drug Q","Drug R","Drug S","Drug T"],"a":0,"ex":"For drugs acting on the same receptor, affinity is directly proportional to potency. The leftmost curve (lowest EC50) is the most potent and therefore has the highest affinity — drug P.","src":"Babbini & Thomas — Pharmacodynamics Q28"},{"q":"Some new drugs acting on the same receptor were studied in laboratory animals. On a constitutive-activity plot: drug Y raises activity above baseline (agonist), drug X lowers it below baseline (inverse agonist), and drug Z does not change baseline activity but antagonizes both X and Y (antagonist). It was found that drug X decreased the constitutive level of activity of the receptor, drug Y increased it, and drug Z antagonized the effects of both X and Y. Which of the following terms best defines drug X?","o":["Competitive antagonist","Partial agonist","Inverse agonist","Irreversible antagonist","Full agonist"],"a":2,"ex":"Some receptors have constitutive (ligand-independent) activity. A ligand that decreases that baseline activity is an inverse agonist (drug X). An agonist increases constitutive activity (Y); a neutral antagonist leaves baseline unchanged but blocks both agonists and inverse agonists (Z).","src":"Babbini & Thomas — Pharmacodynamics Q29"},{"q":"A clinical trial was conducted by orally administering a new analgesic drug to a group of patients suffering from arthritic pain. One hour after administration, the patients were questioned about pain relief, and a sample of blood was collected from each patient to measure plasma drug levels. Pain relief generally correlated well with plasma levels, but three patients whose plasma levels were equal to zero reported good pain relief. Which of the following is the most likely explanation of the analgesic effect of the drug in those three patients?","o":["High bioavailability of the drug","Small volume of distribution of the drug","Very low clearance of the drug","Poor patient compliance","Placebo effect"],"a":4,"ex":"A plasma level of zero 1 hour after dosing makes a pharmacologic drug effect extremely unlikely, so the reported analgesia is a placebo (psychological) effect. High bioavailability, small Vd, or low clearance would produce measurable plasma levels; poor compliance cannot explain a good pharmacologic effect.","src":"Babbini & Thomas — Pharmacodynamics Q30"}],

b_ae: [{"q":"A 23-year-old woman complained to her physician that the diphenhydramine she used to prevent motion sickness when traveling by boat was effective in preventing vomiting but caused drowsiness and dry mouth. Which of the following terms best explains the underlying cause of these drug-related adverse effects?","o":["Genetic predisposition","Nonspecific cytotoxicity","Drug–receptor interaction","Immunologic response","Preexisting pathology"],"a":2,"ex":"These are classic side effects of a therapeutic dose: drowsiness from central H1-receptor blockade and dry mouth from peripheral muscarinic blockade. Side effects of this type result from drug–receptor interaction, not from allergy, idiosyncrasy, cytotoxicity, or preexisting disease.","src":"Babbini & Thomas — Adverse Effects Q1"},{"q":"Five new anticonvulsant drugs (P, Q, R, S, and T) were tested in laboratory animals. It was found that all of the drugs had approximately the same lethal dose that produces death in 50% of subjects (LD50). The median effective dose of each drug is reported below. Which of the drugs most likely has the highest risk of overdose toxicity?","o":["Drug P","Drug Q","Drug R","Drug S","Drug T"],"a":4,"ex":"Overdose-toxicity risk is estimated from the therapeutic index (LD50/ED50). With LD50 the same for all five drugs, the highest ED50 yields the lowest TI and therefore the greatest overdose risk — drug T (ED50 50 mg).","src":"Babbini & Thomas — Adverse Effects Q2","table":{"headers":["Drug","Median effective dose (mg)"],"rows":[["P","3"],["Q","10"],["R","24"],["S","35"],["T","50"]]}},{"q":"A 51-year-old man reported to his physician that in the morning he noticed his urine was cloudy and red. The man had been taking an oral anticoagulant for 3 weeks to treat a deep venous thrombosis. If the patient’s symptoms were caused by the anticoagulant, which of the following adverse drug reactions was most likely involved?","o":["Overdose toxicity","Autoimmune reaction","Idiosyncratic reaction","Pseudoallergic reaction","Immediate allergic reaction"],"a":0,"ex":"Bleeding (here hematuria) is an exaggeration of the anticoagulant’s pharmacologic action and indicates a dose that is too high for that patient — overdose toxicity. It is dose-related, not allergic, idiosyncratic, or pseudoallergic.","src":"Babbini & Thomas — Adverse Effects Q3"},{"q":"A 23-year-old woman scheduled for surgical dilation and curettage was anesthetized with thiopental. Shortly after recovery from the anesthesia, the woman had generalized seizures followed by a deep coma. Further information given by her husband indicated that the patient’s mother had suffered from acute intermittent porphyria. If the coma was caused by thiopental, which of the following drug reactions was most likely involved?","o":["Type II allergic reaction","Delayed allergic reaction","Idiosyncratic reaction","Pseudoallergic reaction","Overdose toxicity"],"a":2,"ex":"Barbiturate-triggered acute porphyria in genetically susceptible people is a classic idiosyncratic reaction. These patients have a heme-pathway enzyme deficiency; barbiturates induce CYP450, consume heme, derepress ALA synthase, and porphyrin intermediates accumulate. Family history is the key risk marker.","src":"Babbini & Thomas — Adverse Effects Q4"},{"q":"A 28-year-old woman who had had a mitral valve replacement for rheumatic heart disease 2 years ago had her suspected pregnancy confirmed by a positive pregnancy test. Her current medications include the anticoagulant warfarin (U.S. Food and Drug Administration [FDA] category for teratogenic risk D) and amoxicillin (FDA category B). Which of the following would be the best course of action to be implemented by her family physician?","o":["Stop all medications throughout pregnancy","Suspend warfarin for the first trimester of pregnancy","Replace warfarin with heparin and continue amoxicillin","Continue warfarin and replace amoxicillin with penicillin G","Reduce the dose of warfarin and continue amoxicillin"],"a":2,"ex":"Warfarin is teratogenic (category D) in all trimesters and must be replaced. Heparin does not cross the placenta (large molecule) and is the anticoagulant of choice in pregnancy; prosthetic-valve patients cannot stop anticoagulation. All penicillins are considered safe, so amoxicillin can continue. Dose reduction of warfarin does not eliminate fetal risk.","src":"Babbini & Thomas — Adverse Effects Q5"},{"q":"Five new antihypertensive drugs were tested in healthy volunteers. All of the drugs were found to be equally effective in controlling hypertension. The minimum effective plasma concentrations and the minimum toxic plasma concentrations were determined for each drug. Which of the drugs has the highest probability of therapeutic success?","o":["Drug P","Drug Q","Drug R","Drug S","Drug T"],"a":1,"ex":"Probability of therapeutic success tracks the therapeutic window, quantified as the ratio of minimum toxic to minimum effective concentration (a form of therapeutic index). Drug Q has TI = 10/1 = 10, versus 4 (P), 2 (R), 5 (S), and 4 (T), so Q has the widest relative window.","src":"Babbini & Thomas — Adverse Effects Q6","table":{"headers":["Drug","Minimum effective (mg/L)","Minimum toxic (mg/L)"],"rows":[["P","5","20"],["Q","1","10"],["R","30","60"],["S","0.6","3"],["T","20","80"]]}},{"q":"A 32-year-old African American man who worked as a Peace Corps volunteer in Ghana presented with weakness, fatigue, yellowing of his skin and sclera, and slight fever. He recently was given chloroquine as a prophylaxis for malaria. Laboratory findings confirmed the diagnosis of hemolytic anemia likely due to chloroquine treatment. This patient’s disease was most likely mediated by genetic polymorphism of which of the following enzymes?","o":["N-acetyltransferase","Glucose-6-phosphate dehydrogenase","Reduced form of nicotinamide adenine dinucleotide (NADH)–methemoglobin reductase","Pseudocholinesterase","Glucuronosyltransferase"],"a":1,"ex":"Oxidant drugs such as chloroquine precipitate hemolysis in G6PD deficiency, an X-linked trait fully expressed in males and common in African American men. Low G6PD impairs NADPH generation needed to detoxify peroxides in erythrocytes. NADH–methemoglobin reductase deficiency causes methemoglobinemia, not hemolysis.","src":"Babbini & Thomas — Adverse Effects Q7"},{"q":"A 61-year-old woman complained to her physician of a burning sensation when she urinated. Past history of the patient was significant for serious hypersensitivity to sulfa drugs. Urinalysis revealed abundant gram-negative bacteria, and a sensitivity test showed that they were sensitive to amikacin, piperacillin, trimethoprim-sulfamethoxazole, ciprofloxacin, and ceftriaxone. A diagnosis of urinary tract infection was made, and an antibiotic therapy was prescribed. Which of the following antibiotics should be avoided in this patient?","o":["Trimethoprim-sulfamethoxazole","Piperacillin","Amikacin","Ciprofloxacin","Ceftriaxone"],"a":0,"ex":"Prior serious sulfa hypersensitivity means any sulfonamide-containing agent should be avoided because of cross-sensitivity. Trimethoprim–sulfamethoxazole contains sulfamethoxazole; the other listed antibiotics do not.","src":"Babbini & Thomas — Adverse Effects Q8"},{"q":"A new hypnotic drug was tested in laboratory animals. It was found that the ED50 for inducing sleep was 2 mg/kg. Which of the following best explains the meaning of that dose?","o":["The mean dose able to elicit sleep induction","The dose with a 50% probability of causing sleep","The dose that elicits sleep in 50% of animals","The mean dose with a good probability of sleep induction","The dose that elicits a median therapeutic sleep response in most animals"],"a":2,"ex":"By definition, ED50 (median effective dose) is the dose that produces a specified response — here sleep — in 50% of the individuals who receive it.","src":"Babbini & Thomas — Adverse Effects Q9"},{"q":"A newborn boy whose mother had epilepsy presented with microcephaly, a broad nasal bridge, short nose, cleft palate, and hypoplasia of the distal phalanges. Drugs used by the mother during pregnancy included phenytoin for seizures, methyldopa for pregnancy-induced hypertension, and erythromycin for an upper respiratory infection during the first trimester. During the delivery, the woman was treated with diazepam and had epidural anesthesia with lidocaine. Which of the drugs taken by the mother most likely caused the baby’s presenting syndrome?","o":["Methyldopa","Phenytoin","Erythromycin","Lidocaine","Diazepam"],"a":1,"ex":"This malformation pattern is fetal phenytoin (fetal hydantoin) syndrome, linked to first-generation anticonvulsants used in pregnancy. Methyldopa and erythromycin are considered relatively safe; diazepam and lidocaine were given only at delivery and could not have caused congenital malformations.","src":"Babbini & Thomas — Adverse Effects Q10"},{"q":"A 75-year-old woman complained to her physician of increased need to urinate during the night. The woman had been receiving gentamicin for 2 months to treat a urinary tract infection. Lab tests revealed a serum creatinine level of 5 mg/dL (normal 0.5–1.2 mg/dL). Serum gentamicin concentration obtained just before the last dose was 9 mg/dL (normal < 2 mg/dL). The patient was most likely suffering from which of the following adverse drug reactions?","o":["Type II allergic reaction","Type III allergic reaction","Idiosyncratic reaction","Pseudoallergic reaction","Overdose toxicity"],"a":4,"ex":"Very high creatinine indicates renal failure; nocturia is an early concentrating defect. Aminoglycosides cause dose-dependent tubular (brush-border) toxicity, and the trough gentamicin level is far above the therapeutic range, so this is overdose toxicity rather than allergy or idiosyncrasy.","src":"Babbini & Thomas — Adverse Effects Q11"},{"q":"A 34-year-old man was admitted to the hospital because of sudden onset of fever (102.2°F, 39.0°C), oliguria, and a skin rash. The man had been receiving ampicillin for primary syphilis. Laboratory findings showed eosinophiluria, proteinuria, and increased serum levels of urea nitrogen and creatinine. A diagnosis of drug-induced tubulointerstitial nephritis was made. Which of the following adverse drug reactions best explains the disease of this patient?","o":["Overdose toxicity","Tachyphylactic reaction","Idiosyncratic reaction","Allergic reaction","Pseudoallergic reaction"],"a":3,"ex":"Fever, rash, and eosinophiluria point to an immune mechanism. Drug-induced tubulointerstitial nephritis is typically a type II allergic reaction; penicillins are the most frequent culprits. Recognition matters because the injury is often reversible if the drug is stopped.","src":"Babbini & Thomas — Adverse Effects Q12"},{"q":"A 15-year-old boy was admitted to the hospital with fever (103.1°F, 39.5°C), a morbilliform skin eruption, lymphadenopathy, angioedema, and arthralgia. The boy had been receiving ampicillin for a pulmonary infection for 2 weeks. Lab data revealed elevated circulating immune complexes. Which of the following adverse drug reactions best explains the patient’s disorder?","o":["Overdose toxicity","Anaphylactoid reaction","Idiosyncratic reaction","Autoimmune reaction","Serum sickness"],"a":4,"ex":"Fever, morbilliform rash, angioedema, arthralgia, and circulating immune complexes after penicillin exposure define serum sickness, a type III (immune-complex) allergic reaction. Penicillins are classic causative agents.","src":"Babbini & Thomas — Adverse Effects Q13"},{"q":"A 69-year-old man presented to the hospital with a skin eruption over his neck, arms, and legs. The patient reported that he was diagnosed with senile pruritus 3 week earlier, and he had been applying a topical doxepin cream to relieve itching. Physical examination revealed red, swollen skin covered with blisters, and a patch test confirmed that the skin eruption was due to doxepin. Which of the following adverse drug reactions best explains the patient’s disorder?","o":["Type I allergic reaction","Type II allergic reaction","Idiosyncratic reaction","Pseudoallergic reaction","Type IV allergic reaction"],"a":4,"ex":"Topical doxepin commonly causes contact dermatitis, the typical manifestation of type IV (cell-mediated) allergy. History of local exposure plus a positive patch test distinguishes it from immediate, cytotoxic, idiosyncratic, and pseudoallergic reactions.","src":"Babbini & Thomas — Adverse Effects Q14"},{"q":"A 38-year-old woman went to her physician because of a bluish discoloration of her lips. Medical history was significant for an inherited deficiency of the reduced form of nicotinamide adenine dinucleotide (NADH)–methemoglobin reductase. One week earlier, she had started therapy with trimethoprim-sulfamethoxazole to treat a urinary tract infection. Physical examination showed cyanosis of the oral mucosa, and a blood test revealed a high level of methemoglobinemia. The physician suspected that sulfamethoxazole was the cause of the patient’s cyanosis. Which of the following adverse drug reactions best explains the patient’s disorder?","o":["Type I allergic reaction","Type IV allergic reaction","Idiosyncratic reaction","Pseudoallergic reaction","Overdose toxicity"],"a":2,"ex":"This is a genetically determined abnormal response to sulfonamide — an idiosyncratic reaction. Patients lacking NADH–methemoglobin reductase cannot reduce methemoglobin to hemoglobin and are especially prone to drug-induced methemoglobinemia (sulfonamides, some local anesthetics, nitrites, primaquine, dapsone).","src":"Babbini & Thomas — Adverse Effects Q15"},{"q":"A 32-year-old woman complained to her physician of urticaria. Three days earlier, the woman had started therapy with amoxicillin for infectious tonsillitis. The physician suspected an allergic reaction to the drug. Which of the following was most likely the main determinant of that drug reaction?","o":["Dose of the drug","Chemical structure of the drug","Oral bioavailability of the drug","Genetic pedigree of the patient","Liver and kidney functions of the patient"],"a":1,"ex":"The chemical structure of a drug is the major determinant of how often it causes allergy (some structures almost never sensitize; others do so readily). Allergic reactions are generally not dose-dependent; genetic pedigree matters more for idiosyncrasy; organ function matters for overdose toxicity.","src":"Babbini & Thomas — Adverse Effects Q16"},{"q":"An 85-year-old woman was admitted to the hospital with an infected decubitus ulcer. Cultures revealed Staphylococcus aureus that was sensitive to some β-lactam antibiotics, namely, oxacillin, cephalexin, and imipenem. Which of the following would be the first procedure to undertake in order to minimize the risk of an allergic reaction to these antibiotics?","o":["Start the therapy with a very small dose","Perform a skin sensitivity test","Pretreat the patient with an antiallergic drug","Use another β-lactam antibiotic active against S. aureus","Get a detailed drug history"],"a":4,"ex":"A detailed personal and family drug-allergy history is the first step: prior exposure, structurally related drugs, and the nature/severity of any reaction. A small dose does not prevent allergy; skin testing comes after history; switching within the same chemical class does not avoid cross-sensitivity; premedication does not reliably prevent unknown hypersensitivity.","src":"Babbini & Thomas — Adverse Effects Q17"},{"q":"A 32-year-old pregnant woman was found to have a red blood cell count of 3.2 × 10⁶/mm³ (normal 3.5–5.5 × 10⁶) and a positive direct Coombs test during a regular clinic visit. The woman had started a treatment with methyldopa 4 months earlier because of stage 1 hypertension. Which of the following mechanisms most likely mediated the drug-induced reaction of this patient?","o":["Deficiency of the reduced form of nicotinamide adenine dinucleotide (NADH)–methemoglobin reductase","Production of autoantibodies against red blood cells","Drug-induced deficiency of folic acid","Drug-induced bone marrow suppression","Deficiency of glucose-6-phosphate dehydrogenase"],"a":1,"ex":"A positive Coombs test plus anemia after months of methyldopa indicates autoimmune (type II) hemolytic anemia: the drug induces IgG autoantibodies against red cells. Coombs positivity is common with chronic methyldopa; frank hemolysis is less frequent and usually remits after the drug is stopped.","src":"Babbini & Thomas — Adverse Effects Q18"},{"q":"A 64-year-old man was hospitalized for treatment of Staphylococcus aureus bacteremia and was given an intravenous infusion of vancomycin. A few minutes later he developed symptoms of an anaphylactic-like reaction. The patient was not aware of previous exposure to vancomycin, and a search for antibodies to the suspected drug was negative. Which of the following types of drug reaction was most likely experienced by the patient?","o":["Type I allergic reaction","Autoimmune reaction","Genetically mediated reaction","Pseudoallergic reaction","Overdose toxicity"],"a":3,"ex":"An anaphylaxis-like picture without prior exposure and without detectable antibodies is a pseudoallergic (anaphylactoid) reaction, caused by direct, non-immune release of allergic mediators — the classic “red-man” reaction to rapid vancomycin infusion.","src":"Babbini & Thomas — Adverse Effects Q19"},{"q":"A 43-year-old man had to undergo surgery to remove a biliary calculus. The anesthesiologist chose to supplement the anesthesia with succinylcholine, a paralyzing agent that has a rapid onset and a short duration of action. In this patient, however, the drug-induced paralysis lasted several hours, necessitating the anesthesiologist to continue the anesthesia and continue artificial respiration. Which of the following adverse drug reactions best explains the patient’s disorder?","o":["Type II allergic reaction","Immediate allergic reaction","Idiosyncratic reaction","Pseudoallergic reaction","Overdose toxicity"],"a":2,"ex":"Prolonged paralysis after succinylcholine is a classic idiosyncratic reaction due to a genetically abnormal plasma cholinesterase (butyrylcholinesterase) that metabolizes the drug far more slowly, so neuromuscular block may last hours instead of minutes.","src":"Babbini & Thomas — Adverse Effects Q20"}],

b_ans: [{"q":"Match the effect with the receptor whose activation produces it: Mydriasis","o":["α1 adrenergic","α2 adrenergic","β1 adrenergic","β2 adrenergic","β3 adrenergic","D1 dopaminergic","D2 dopaminergic","M2 cholinergic","M3 cholinergic","Nm cholinergic","Nn cholinergic"],"a":0,"ex":"Mydriasis is produced by α1-mediated contraction of the radial dilator muscle of the iris.","src":"Babbini & Thomas — Autonomic Introduction Q1"},{"q":"Match the effect with the receptor whose activation produces it: Increased gluconeogenesis","o":["α1 adrenergic","α2 adrenergic","β1 adrenergic","β2 adrenergic","β3 adrenergic","D1 dopaminergic","D2 dopaminergic","M2 cholinergic","M3 cholinergic","Nm cholinergic","Nn cholinergic"],"a":3,"ex":"Hepatic gluconeogenesis is increased by activation of β2 adrenergic receptors on hepatocytes.","src":"Babbini & Thomas — Autonomic Introduction Q2"},{"q":"Match the effect with the receptor whose activation produces it: Selective dilation of renal vessels","o":["α1 adrenergic","α2 adrenergic","β1 adrenergic","β2 adrenergic","β3 adrenergic","D1 dopaminergic","D2 dopaminergic","M2 cholinergic","M3 cholinergic","Nm cholinergic","Nn cholinergic"],"a":5,"ex":"D1 dopaminergic receptors on renal (and mesenteric) vascular smooth muscle mediate selective vasodilation of those beds.","src":"Babbini & Thomas — Autonomic Introduction Q3"},{"q":"Match the effect with the receptor whose activation produces it: Constriction of bladder internal sphincter","o":["α1 adrenergic","α2 adrenergic","β1 adrenergic","β2 adrenergic","β3 adrenergic","D1 dopaminergic","D2 dopaminergic","M2 cholinergic","M3 cholinergic","Nm cholinergic","Nn cholinergic"],"a":0,"ex":"The internal urethral sphincter contracts via α1 receptors; this is why α1 agonists can cause urinary retention, especially in prostatic hyperplasia.","src":"Babbini & Thomas — Autonomic Introduction Q4"},{"q":"Match the effect with the receptor whose activation produces it: Decreased atrioventricular conduction","o":["α1 adrenergic","α2 adrenergic","β1 adrenergic","β2 adrenergic","β3 adrenergic","D1 dopaminergic","D2 dopaminergic","M2 cholinergic","M3 cholinergic","Nm cholinergic","Nn cholinergic"],"a":7,"ex":"Cardiac M2 receptors (vagus) slow AV nodal conduction. β1 activation would do the opposite.","src":"Babbini & Thomas — Autonomic Introduction Q5"},{"q":"A 2.1-kg (4.6-lb) baby boy was born at 34 weeks gestation by vaginal delivery. One hour after birth, the baby appeared hypothermic and lethargic. Apgar scores were low, and blood pressure was 55/35 mm Hg. Lab tests revealed that the newborn had a genetic dopamine β-hydroxylase deficiency. Lab tests would have also shown which of the following results?","o":["Very low plasma levels of norepinephrine","Very low plasma levels of dopamine","High plasma levels of epinephrine","High urinary levels of normetanephrine","Low urinary levels of homovanillic acid"],"a":0,"ex":"Dopamine β-hydroxylase converts dopamine to norepinephrine, so its absence collapses plasma NE (and therefore epinephrine and the NE metabolite normetanephrine). Dopamine and its metabolite homovanillic acid accumulate, so they are high, not low.","src":"Babbini & Thomas — Autonomic Introduction Q6"},{"q":"A 43-year-old man recently diagnosed with pheochromocytoma (an adrenal gland tumor) started a treatment with a drug that can cause a pronounced decrease in norepinephrine and epinephrine by blocking the first rate-limiting step in catecholamine biosynthesis. Which of the following enzymes was most likely inhibited by the drug?","o":["Aromatic L-amino acid decarboxylase","Dopamine-β-hydroxylase","Tyrosine hydroxylase","Phenylethanolamine-N-methyltransferase","Monoamine oxidase"],"a":2,"ex":"Tyrosine hydroxylase (tyrosine → DOPA) is the rate-limiting step in catecholamine biosynthesis; inhibiting it (e.g. with metyrosine) sharply reduces NE and epinephrine. The other enzymes act later in the pathway or in catabolism.","src":"Babbini & Thomas — Autonomic Introduction Q7"},{"q":"A 14-year-old boy with type 1 diabetes noticed symptoms of palpitations, inward trembling, sweating, hunger, weakness, and nervousness just after his participation in a basketball game. His medication included twice-daily injections of insulin. Most of the boy’s symptoms likely resulted from increased firing of which of the following neurons?","o":["Somatic motor neurons","Pyramidal neurons","Preganglionic parasympathetic neurons","Preganglionic sympathetic neurons","Postganglionic parasympathetic neurons"],"a":3,"ex":"Exercise-induced hypoglycemia triggers a sympathetic discharge: increased firing of preganglionic sympathetic neurons, which then drive postganglionic sympathetic nerves and adrenal epinephrine release. The listed warning symptoms are that catecholamine surge. Somatic, pyramidal, and parasympathetic neurons are not the pathway.","src":"Babbini & Thomas — Autonomic Introduction Q8"},{"q":"A 55-year-old woman suffering from postural hypotension started a treatment with an α1-adrenergic drug. Which of the following is a body site where autonomic receptors are primarily α1 adrenergic?","o":["Bronchial muscle","Sphincter muscle of the iris","Atrioventricular node","Purkinje fibers","Skin vessels"],"a":4,"ex":"α1 receptors predominate in skin, GI, and genitourinary vessels. Bronchial muscle is mainly M3/β2; the iris sphincter is M3; AV node is M2/β1; Purkinje fibers are mainly β1.","src":"Babbini & Thomas — Autonomic Introduction Q9"},{"q":"A 24-year-old woman admitted to the hospital after a car accident was diagnosed with neurogenic shock due to a spinal cord injury. An emergency treatment was started that included the administration of norepinephrine. Which of the following expected effects of the drug was most likely mediated by the activation of peripheral postsynaptic β1 receptors?","o":["Bronchodilation","Uterine relaxation","Increased liver gluconeogenesis","Increased renin secretion","Decreased insulin secretion","Increased sweating of the palms of the hands"],"a":3,"ex":"Juxtaglomerular β1 receptors increase renin secretion. Bronchodilation, uterine relaxation, and hepatic gluconeogenesis are mainly β2; decreased insulin secretion is α2; palmar sweating is α1 (and sympathetic cholinergic for eccrine glands).","src":"Babbini & Thomas — Autonomic Introduction Q10"},{"q":"A 28-year-old woman presented to the emergency department with breathing difficulty and increasing swelling of her face, eyes, lips, and tongue. An hour earlier she had received an intramuscular injection of ampicillin to treat acute pharyngitis. A diagnosis of anaphylactic reaction was made, and an intramuscular injection of epinephrine was given. Which of the following expected effects of the drug was most likely mediated by the activation of peripheral postsynaptic α2 receptors?","o":["Mydriasis","Decreased secretion of insulin","Increased secretion of renin","Constriction of skin vessels","Increased heart rate","Dilation of skeletal muscle vessels"],"a":1,"ex":"Pancreatic α2 receptors inhibit insulin release, contributing to epinephrine’s hyperglycemic effect. Mydriasis and cutaneous vasoconstriction are α1; renin and heart rate are β1; skeletal-muscle vasodilation is β2.","src":"Babbini & Thomas — Autonomic Introduction Q11"},{"q":"A new autonomic drug was administered locally in the conjunctival sac of a healthy volunteer. Twenty minutes later, measurement of several eye parameters gave the following results. Which of the following pairs of receptors did the drug most likely activate?","o":["α1 and α2 adrenergic","α2 and β2 adrenergic","Nn and Nm cholinergic","M2 and M3 cholinergic","β1 and β2 adrenergic"],"a":0,"ex":"Mild mydriasis with unchanged lens curvature means α1 contraction of the radial iris muscle (not M3 block/activation, which would also change accommodation). Lower intraocular pressure from receptor activation (not blockade) is α2-mediated suppression of aqueous production. β2 activation would increase aqueous production; nicotinic or muscarinic activation would miosis and increase lens curvature.","src":"Babbini & Thomas — Autonomic Introduction Q12","table":{"headers":["Parameter","Before drug","After drug"],"rows":[["Pupillary diameter (mm)","3.0","3.5"],["Lens curvature","Normal","Normal"],["Intraocular pressure (mm Hg)","20","15"]]}},{"q":"The cardiovascular effects of a new autonomic drug that does not cross the blood–brain barrier were evaluated in a healthy volunteer. The drug was administered intravenously. Which of the following receptors did the drug most likely activate?","o":["α1 adrenergic","β2 adrenergic","D1 dopaminergic","M2 cholinergic","β1 adrenergic"],"a":0,"ex":"Parallel rise in systolic and diastolic pressure means increased TPR (α1 vasoconstriction). The slower heart rate is reflex vagal bradycardia from the baroreceptors, not a direct cardiac action. β2 or D1 would drop diastolic pressure; M2 would drop systolic pressure via reduced CO; β1 would raise, not lower, heart rate.","src":"Babbini & Thomas — Autonomic Introduction Q13","table":{"headers":["Parameter","Control","Drug X"],"rows":[["Systolic BP (mm Hg)","120","130"],["Diastolic BP (mm Hg)","80","100"],["Heart rate (bpm)","70","60"]]}},{"q":"A 62-year-old man suffering from postural hypotension started therapy with a drug that selectively activates α1 receptors. Which of the following postreceptor mechanisms most likely mediated the therapeutic effect of the drug in this patient?","o":["Decreased synthesis of inositol triphosphate (IP3) and diacylglycerol (DAG)","Increased activation of phospholipase C","Opening of ligand-gated K+ channels","Blockade of voltage-gated Ca2+ channels","Increased synthesis of cyclic guanosine monophosphate (cGMP)"],"a":1,"ex":"α1 receptors couple through Gq to phospholipase C, generating IP3 and DAG and raising intracellular Ca2+, which contracts vascular smooth muscle and raises blood pressure. IP3/DAG synthesis is increased, not decreased; opening K+ channels or blocking Ca2+ channels would relax, not constrict, vessels; cGMP is the NO/natriuretic-peptide pathway.","src":"Babbini & Thomas — Autonomic Introduction Q14"},{"q":"The cardiovascular effects of a new autonomic drug that does not cross the blood–brain barrier were evaluated in a healthy male volunteer. The drug was administered intravenously. Which of the following pairs of receptors were most likely activated by the drug?","o":["α1 and α2 adrenergic","α1 and β1 adrenergic","Nm and Nn cholinergic","M2 and M3 cholinergic","β1 and β2 adrenergic"],"a":4,"ex":"Systolic pressure rose (β1 inotropy/CO) while diastolic pressure fell (β2 vasodilation), widening pulse pressure, and heart rate rose sharply (direct β1/β2 plus reflex tachycardia from the fall in mean pressure: 90 → 80 mm Hg). Pure α stimulation would raise diastolic pressure and reflex-slow the heart; muscarinic activation would slow the heart and not raise systolic pressure.","src":"Babbini & Thomas — Autonomic Introduction Q15","table":{"headers":["Parameter","Control","Drug"],"rows":[["Systolic BP (mm Hg)","120","130"],["Diastolic BP (mm Hg)","75","55"],["Heart rate (bpm)","70","115"]]}},{"q":"The bronchial effects of a new alpha-beta agonist that does not cross the blood–brain barrier were studied in laboratory animals. It was found that the drug caused relaxation of bronchiolar smooth muscle. The activation of which of the following pairs of adrenoceptors most likely mediated the effect of the drug?","o":["β2 postsynaptic and α2 presynaptic","β1 presynaptic and α1 postsynaptic","α2 postsynaptic and β3 postsynaptic","α1 presynaptic and β2 presynaptic","β1 postsynaptic and α2 presynaptic"],"a":0,"ex":"Bronchodilation is produced directly by postsynaptic β2 receptors on airway smooth muscle and indirectly by presynaptic α2 receptors on cholinergic terminals that inhibit acetylcholine release.","src":"Babbini & Thomas — Autonomic Introduction Q16"},{"q":"The metabolic effects of a new autonomic drug were studied in laboratory animals, with the following results: liver gluconeogenesis increased; renin secretion unaffected; plasma K+ decreased; degranulation of mast cells inhibited; lipolysis in fat cells increased. Which of the following pairs of receptors were most likely activated by the drug?","o":["α1 and β1","β2 and β3","β1 and β2","M3 and β3","M2 and M3","α1 and M2"],"a":1,"ex":"β2 activation increases hepatic gluconeogenesis, drives K+ into skeletal muscle (lowering plasma K+), and stabilizes mast cells. β3 activation in adipocytes increases lipolysis. Unchanged renin rules out β1.","src":"Babbini & Thomas — Autonomic Introduction Q17"},{"q":"A new autonomic drug was administered locally in the conjunctival sac of a healthy volunteer during a phase 1 clinical trial. Twenty minutes later, pupillary diameter was decreased, lens curvature was increased, and intraocular pressure was decreased. Which of the following receptors did the drug most likely activate?","o":["α1","α2","Nm","M3","β2"],"a":3,"ex":"M3 receptors on the iris sphincter produce miosis; M3 receptors on ciliary muscle increase lens curvature (accommodation) and open trabecular pores, increasing aqueous outflow and lowering IOP. α1 would dilate the pupil; α2 lowers IOP without changing pupil or lens; Nm acts only on extraocular skeletal muscle; β2 relaxes ciliary muscle.","src":"Babbini & Thomas — Autonomic Introduction Q18"},{"q":"A 54-year-old woman complained to her physician of palpitations, dry mouth, blurred vision, and constipation. The woman had a long history of endogenous depression and had recently started a new antidepressant therapy. The patient’s symptoms most likely resulted from a blockade of which of the following pairs of receptors?","o":["α1 and α2","α1 and β1","M2 and M3","β1 and β2","Nm and β2"],"a":2,"ex":"Tricyclics such as amitriptyline block muscarinic receptors. M2 block in the heart causes palpitations; M3 block causes dry mouth, blurred vision (cycloplegia), and constipation. The other receptor pairs do not produce this anticholinergic cluster.","src":"Babbini & Thomas — Autonomic Introduction Q19"},{"q":"A 35-year-old farmer was brought to the emergency department with severe abdominal cramps and vomiting. He reported that he was working in the field with an organophosphate pesticide. The physician observed all of the typical symptoms of acetylcholine excess. Which of the following symptoms of the patient were most likely due to the activation of nicotinic Nm receptors only?","o":["Salivation, decreased blood pressure","Difficulty in breathing, miosis","Diarrhea, sweating","Bradycardia, urinary urgency","Diplopia, difficulty in swallowing"],"a":4,"ex":"Nm receptors exist only at the motor end-plate. Persistent ACh at Nm produces depolarization block of skeletal muscle — diplopia (extraocular muscles) and dysphagia (pharyngeal striated muscle). All of the other listed signs are muscarinic.","src":"Babbini & Thomas — Autonomic Introduction Q20"}],
