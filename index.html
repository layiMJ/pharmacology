{q:"Paracetamol (acetaminophen) overdose causes hepatotoxicity mainly through accumulation of which reactive metabolite?",
 o:["Salicylic acid","NAPQI (N-acetyl-p-benzoquinone imine)","Prostaglandin E2","Glucuronic acid conjugate","Sulfate conjugate"], a:1,
 ex:"At therapeutic doses, most paracetamol is safely conjugated; a small fraction is oxidised by CYP2E1 to the toxic metabolite NAPQI, normally detoxified by glutathione. In overdose, glutathione stores are depleted, allowing NAPQI to cause hepatocyte necrosis.",
 src:"Katzung & Trevor \u2014 Paracetamol Toxicity"},
{q:"The antidote for paracetamol overdose is:",
 o:["Naloxone","N-acetylcysteine (NAC)","Flumazenil","Pralidoxime","Physostigmine"], a:1,
 ex:"N-acetylcysteine replenishes glutathione stores (or acts as a direct glutathione substitute), allowing safe detoxification of NAPQI and preventing/limiting hepatic necrosis if given early enough.",
 src:"Katzung & Trevor \u2014 Paracetamol Toxicity"},
{q:"Oral bisphosphonates (e.g. alendronate) should be taken:",
 o:["With food to reduce GI upset","At bedtime lying flat","On an empty stomach with plain water, remaining upright for at least 30 minutes afterward","Only via the intravenous route","With calcium supplements simultaneously for best absorption"], a:2,
 ex:"Oral bisphosphonates have very poor, food-impaired absorption and can cause oesophageal irritation if they remain in contact with the mucosa \u2014 so they're taken on an empty stomach with water, staying upright and avoiding food for at least 30 minutes.",
 src:"Katzung & Trevor \u2014 Bisphosphonates"},
{q:"Calcitonin lowers serum calcium mainly by:",
 o:["Increasing intestinal calcium absorption","Directly inhibiting osteoclast activity and bone resorption","Increasing renal calcium reabsorption","Stimulating PTH secretion","Increasing vitamin D synthesis"], a:1,
 ex:"Calcitonin (from thyroid parafollicular C-cells) directly inhibits osteoclasts, reducing bone resorption and lowering serum calcium \u2014 the opposite action to parathyroid hormone.",
 src:"Katzung & Trevor \u2014 Calcium Homeostasis"}
],

k1: [
{"q":"A 3-year-old is brought to the emergency department having just ingested a large overdose of chlorpropamide, an oral antidiabetic drug. Chlorpropamide is a weak acid with a pKa of 5.0. It is capable of entering most tissues. On physical examination, the heart rate is 110/min, blood pressure 90/50 mm Hg, and respiratory rate 30/min. Which of the following statements about this case of chlorpropamide overdose is most correct?","o":["Urinary excretion would be accelerated by administration of NH4Cl, an acidifying agent","Urinary excretion would be accelerated by giving NaHCO3, an alkalinizing agent","Less of the drug would be ionized at blood pH than at stomach pH","Absorption of the drug would be slower from the stomach than from the small intestine"],"a":1,"ex":"Chlorpropamide is a weak acid. Alkalinizing the urine with NaHCO3 increases ionization (ion trapping) and accelerates renal excretion. Acidifying would increase reabsorption. At blood pH the drug is mostly ionized; absorption is usually faster from the small intestine due to surface area.","src":"Katzung Ch. 1 Q1"},
{"q":"Botulinum toxin is a large protein molecule. Its action on cholinergic transmission depends on an intracellular action within nerve endings. Which one of the following processes is best suited for permeation of very large protein molecules into cells?","o":["Aqueous diffusion","Endocytosis","First-pass effect","Lipid diffusion","Special carrier transport"],"a":1,"ex":"Endocytosis is the mechanism best suited for very large protein molecules to enter cells. Aqueous and lipid diffusion and special carriers handle smaller molecules; first-pass effect is hepatic metabolism, not cellular permeation.","src":"Katzung Ch. 1 Q2"},
{"q":"A 12-year-old child has bacterial pharyngitis and is to receive an oral antibiotic. She complains of a sore throat and pain on swallowing. The tympanic membranes are slightly reddened bilaterally, but she does not complain of earache. Blood pressure is 105/70 mm Hg, heart rate 100/min, temperature 37.8°C (100.1°F). Ampicillin is a weak organic acid with a pKa of 2.5. What percentage of a given dose will be in the lipid-soluble form in the duodenum at a pH of 4.5?","o":["About 1%","About 10%","About 50%","About 90%","About 99%"],"a":0,"ex":"For a weak acid, non-ionized/ionized = 10^(pKa−pH). At pH 4.5 and pKa 2.5 the ratio is 0.01, so about 1% is non-ionized (lipid-soluble).","src":"Katzung Ch. 1 Q3"},
{"q":"Ampicillin is eliminated by first-order kinetics. Which of the following statements best describes the process by which the plasma concentration of this drug declines?","o":["There is only 1 metabolic path for drug elimination","The half-life is the same regardless of the plasma concentration","The drug is largely metabolized in the liver after oral administration and has low bioavailability","The rate of elimination is proportional to the rate of administration at all times","The drug is distributed to only 1 compartment outside the vascular system"],"a":1,"ex":"In first-order kinetics a constant fraction is eliminated per unit time, so half-life is independent of plasma concentration.","src":"Katzung Ch. 1 Q4"},
{"q":"The pharmacokinetics of a new drug are under study in a phase 1 clinical trial. Which statement about the distribution of drugs to specific tissues is most correct?","o":["Distribution to an organ is independent of blood flow","Distribution of a lipid-soluble drug will be to adipose tissue initially","Distribution into a tissue depends on the unbound drug concentration gradient between blood and the tissue","Distribution is increased for drugs that are strongly bound to plasma proteins","Distribution has no effect on the half-life of the drug"],"a":2,"ex":"Distribution depends on blood flow, the unbound concentration gradient, and tissue binding. Highly plasma-protein-bound drugs remain in the vascular compartment; distribution affects Vd and therefore half-life.","src":"Katzung Ch. 1 Q5"},
{"q":"The pharmacokinetic process or property that distinguishes the elimination of ethanol and high doses of phenytoin and aspirin from the elimination of most other drugs is called","o":["Distribution","Excretion","First-pass effect","First-order elimination","Zero-order elimination"],"a":4,"ex":"Ethanol and high doses of phenytoin and aspirin follow zero-order kinetics: a constant amount is eliminated per unit time independent of concentration.","src":"Katzung Ch. 1 Q6"},
{"q":"Which of the following statements about animal testing of potential new therapeutic agents is most correct?","o":["Requires at least 3 years to discover late toxicities","Requires at least 1 primate species (eg, rhesus monkey)","Requires the submission of histopathologic slides and specimens to the FDA for evaluation by government scientists","Has good predictability for drug allergy-type reactions","May be abbreviated in the case of some very toxic agents used in cancer"],"a":4,"ex":"For some highly toxic agents used in cancer, animal testing may be abbreviated. Allergy predictability is poor; primates are not always required.","src":"Katzung Ch. 1 Q7"},
{"q":"The \"dominant lethal\" test involves the treatment of a male adult animal with a chemical before mating; the pregnant female is later examined for fetal death and abnormalities. The dominant lethal test therefore is a test of","o":["Teratogenicity","Mutagenicity","Carcinogenicity","Sperm viability"],"a":1,"ex":"The dominant lethal test detects chromosomal damage (mutations) in the male germ line that cause embryonic lethality after mating.","src":"Katzung Ch. 1 Q8"},
{"q":"In a phase 1 clinical trial, \"Novexum,\" a new drug, was administered intravenously to 25 volunteers, and blood samples were taken for several hours. Several inactive metabolites were found as well as declining concentrations of Novexum. A graph was prepared with the Novexum plasma levels plotted on a logarithmic ordinate and time on a linear abscissa. It was concluded that the drug has first-order kinetics. From this graph, what is the best estimate of the elimination half-life of Novexum?","o":["0.5 h","1 h","3 h","4 h","7 h"],"a":2,"ex":"On a log concentration vs time plot, concentration falls from 16 units at 1 h to 8 at 4 h (one half-life of 3 h). The slope is consistent with t½ ≈ 3 h.","svg":"novexum","src":"Katzung Ch. 1 Q9"},
{"q":"A large pharmaceutical company has conducted extensive animal testing of a new drug for the treatment of advanced prostate cancer. The chief of research and development recommends that the company now submit an IND application in order to start clinical trials. Which of the following statements is most correct regarding clinical trials of new drugs?","o":["Phase 1 involves the study of a small number of normal volunteers by highly trained clinical pharmacologists","Phase 2 involves the use of the new drug in a large number of patients (1000–5000) who have the disease to be treated under conditions of proposed use (eg, outpatients)","Chronic animal toxicity studies must be complete and reported in the IND","Phase 4 involves the detailed study of toxic effects that have been discovered in phase 3","Phase 2 requires the use of a positive control (a known effective drug) and a placebo"],"a":0,"ex":"Phase 1 studies a small number of volunteers (often healthy) for safety and pharmacokinetics. Phase 2 is in patients with the disease (typically hundreds); chronic toxicity need not be fully complete for the IND.","src":"Katzung Ch. 1 Q10"},
{"q":"Which of the following would probably not be included in an optimal phase of the clinical trial of a new analgesic drug for mild pain?","o":["A negative control (placebo)","A positive control (current standard analgesic therapy)","Double-blind protocol (in which neither the patient nor the immediate observers of the patient know which agent is active)","A group of 1000–5000 subjects with a clinical condition requiring analgesia","Prior submission of an NDA (new drug application) to the FDA"],"a":4,"ex":"An NDA is submitted after sufficient clinical data (usually after phases 1–3) exist. The clinical trials themselves do not require a prior NDA.","src":"Katzung Ch. 1 Q11"},
{"q":"The Ames test is frequently carried out before clinical trials are begun. The Ames test is a method that detects","o":["Carcinogenesis in primates","Carcinogenesis in rodents","Mutagenesis in bacteria","Teratogenesis in any mammalian species","Teratogenesis in primates"],"a":2,"ex":"The Ames test is performed in Salmonella bacteria and detects mutations. A positive result is associated with carcinogenic potential but the test itself only detects mutagenicity.","src":"Katzung Ch. 1 Q12"},
{"q":"Which of the following statements about new drug development is most correct?","o":["If the need is great, drugs that test positive for teratogenicity in humans but the IND must specify safety measures to be taken","Food supplements and herbal (botanical) remedies must be shown to be effective for the target condition before marketing is approved by the FDA","All new drugs must be studied in at least 1 primate species before NDA submission","Orphan drugs are drugs that are no longer produced by the original manufacturer","Phase 4 (surveillance) is the most rigidly regulated phase of clinical drug trials"],"a":0,"ex":"Food supplements and botanicals are less tightly regulated and need not prove efficacy before marketing. Orphan drugs treat rare diseases. Phase 4 is the least rigidly regulated phase.","src":"Katzung Ch. 1 Q13"},
{"q":"Which statement about the development of new drugs is most correct?","o":["Because they may cause anaphylaxis, proteins cannot be used as drugs","Most drugs fall between 100 and 1000 in molecular weight","Drugs for systemic action that are to be administered orally should be highly water soluble and insoluble in lipids","Water solubility is minimal in highly polarized (charged) drug molecules"],"a":1,"ex":"Most drugs fall between 100 and 1000 daltons in molecular weight. Many proteins (insulin, antibodies) are used clinically. Oral systemic drugs need adequate lipid solubility; highly charged molecules are poorly absorbed.","src":"Katzung Ch. 1 Q14"}
],
k2: [
{"q":"A 55-year-old man is seen in the clinic with hypertension of 150/95 mm Hg (millimeters of mercury). His personal medical history and physical examination are otherwise unremarkable but his family history is positive for early deaths due to cardiovascular disease. A decision is made to treat his hypertension, starting with a calcium channel blocker. Blocker A in a dose of 5 mg produces the same decrease in blood pressure as 500 mg of blocker B. Which of the following predictions is most accurate?","o":["Blocker A will be more efficacious than blocker B","Blocker A will be about 100 times more potent than blocker B","Toxicity of blocker A will be less than that of blocker B","Blocker A will have a wider therapeutic window than blocker B","Blocker A will have a longer half-life than blocker B"],"a":1,"ex":"No information is given regarding maximal antihypertensive response (efficacy), half-life, or toxicity. The fact that a given response is achieved with a smaller dose of blocker A indicates only that A is more potent than B in the ratio of 500:5.","src":"Katzung Ch. 2 Q1"},
{"q":"Graded and quantal dose-response curves are being used for evaluation of a new analgesic drug in the animal laboratory and in clinical trials. Which of the following statements best describes graded dose-response curves?","o":["More precisely quantitated than quantal dose-response curves","Obtainable from isolated tissue preparations but not from the study of intact subjects","Used to determine the maximal efficacy of the drug","Used to determine the therapeutic index of the drug","Used to determine the variation in sensitivity of subjects to the drug"],"a":2,"ex":"Graded (not quantal) dose-response curves are used to determine maximal efficacy (maximal response). Quantal curves show frequency of a specified response and are used for therapeutic index and population sensitivity variation.","src":"Katzung Ch. 2 Q2"},
{"q":"Prior to clinical trials in patients with heart failure, an animal study was carried out to compare two new positive inotropic drugs (A and B) to a current standard agent (C). The results of cardiac output measurements are shown in the graph below. Which of the following statements is correct?","o":["Drug A is most effective","Drug B is least potent","Drug C is more potent than drug A","Drug B is more potent than drug C and more effective than drug A","Drug A is more potent than drug B and more effective than drug C"],"a":3,"ex":"Drug A produces 50% of its maximal effect at a lower dose than either B or C and thus is the most potent; drug C is the least potent. However, drug A, a partial agonist, is less efficacious than drugs B and C. The answer is D.","svg":"inotrope","src":"Katzung Ch. 2 Q3"},
{"q":"A study was carried out in isolated intestinal smooth muscle preparations to determine the action of a new drug \"novamine,\" which in separate studies bound to the same receptors as acetylcholine, an agonist. In the absence of other drugs, acetylcholine caused contraction of the muscle. Novamine alone caused relaxation of the preparation. In the presence of a low concentration of novamine, the EC50 of acetylcholine was unchanged, but the Emax was reduced. In the presence of a high concentration of novamine, extremely high concentrations of acetylcholine had no effect. Which of the following expressions best describes novamine?","o":["A chemical antagonist","An irreversible antagonist","A partial agonist","A physiologic antagonist","A spare receptor agonist"],"a":1,"ex":"Choices involving chemical or physiologic antagonism are incorrect because novamine is said to act at the same receptors as acetylcholine. When given alone, the novamine effect is opposite to that of acetylcholine; so choice C is incorrect. \"Spare receptor agonist\" is a nonsense distracter. The reduction of Emax with unchanged EC50 and insurmountable blockade at high antagonist concentration describe irreversible (noncompetitive) antagonism.","src":"Katzung Ch. 2 Q4"},
{"q":"Beta adrenoceptors in the heart regulate cardiac rate and contractile strength. Several studies have indicated that in humans and experimental animals, about 90% of β adrenoceptors in the heart are spare receptors. Which of the following statements about spare receptors is most correct?","o":["Spare receptors, in the absence of drug, are sequestered in the cytoplasm","Spare receptors may be detected by finding that the drug-receptor interaction lasts longer than the intracellular effect","Spare receptors influence the maximal efficacy of the drug-receptor system","Spare receptors activate the effector machinery of the cell without the need for a drug","Spare receptors may be detected by finding that the EC50 is smaller than the Kd for the agonist"],"a":4,"ex":"There is no difference in location between \"spare\" and other receptors. Spare receptors may be defined as those that are not needed for binding drug to achieve the maximal effect. Spare receptors influence the sensitivity of the system to an agonist because the statistical probability of a drug-receptor interaction increases with the total number of receptors. They do not alter the maximal efficacy. If they do not bind an agonist molecule, spare receptors do not activate an effector molecule. EC50 less than Kd is an indication of the presence of spare receptors. The answer is E.","src":"Katzung Ch. 2 Q5"},
{"q":"Two cholesterol-lowering drugs, X and Y, were studied in a large group of patients, and the percentages of the group showing a specific therapeutic effect (35% reduction in low-density lipoprotein [LDL] cholesterol) were determined. The results are shown in the following table. Which of the following statements about these results is correct?","o":["Drug X is safer than drug Y","Drug Y is more effective than drug X","The 2 drugs act on the same receptors","Drug X is less potent than drug Y","The therapeutic index of drug Y is 10"],"a":3,"ex":"No information is presented regarding the safety of these drugs. Similarly, no information on efficacy (maximal effect) is presented; this requires graded dose-response curves. Although both drugs are said to be producing a therapeutic effect, no information on their receptor mechanisms is given. Since no data on toxicity are available, the therapeutic index cannot be determined. The answer is D because the ED50 of drug Y (20 mg/d) is less than that of drug X (50 mg/d).","table":{"headers":["Drug Dose (mg)","% Responding to X","% Responding to Y"],"rows":[["5","1","10"],["10","5","20"],["20","10","50"],["50","50","70"],["100","70","90"],["200","90","100"]]},"src":"Katzung Ch. 2 Q6"},
{"q":"Sugammadex is a drug that reverses the action of rocuronium and certain other skeletal muscle-relaxing agents (nondepolarizing neuromuscular blocking agents). It appears to interact directly with the rocuronium molecule and not at all with the rocuronium receptor. Which of the following terms best describes sugammadex?","o":["Chemical antagonist","Noncompetitive antagonist","Partial agonist","Pharmacologic antagonist","Physiologic antagonist"],"a":0,"ex":"Sugammadex interacts directly with rocuronium and not with the rocuronium receptor; therefore, it is a chemical antagonist.","src":"Katzung Ch. 2 Q7"},
{"q":"Which of the curves in the graph describes the percentage of binding of a large dose of full agonist to its receptors as the concentration of a partial agonist is increased from low to very high levels?","o":["Curve 1","Curve 2","Curve 3","Curve 4","Curve 5"],"a":4,"ex":"The binding of a full agonist decreases as the concentration of a partial agonist is increased to very high levels. As the partial agonist displaces more and more of the full agonist, the percentage of receptors that bind the full agonist drops to zero, that is, Curve 5.","svg":"spare","src":"Katzung Ch. 2 Q8"},
{"q":"Which of the curves in the graph describes the percentage effect observed when a large dose of full agonist is present throughout the experiment and the concentration of a partial agonist is increased from low to very high levels?","o":["Curve 1","Curve 2","Curve 3","Curve 4","Curve 5"],"a":0,"ex":"Curve 1 describes the response of the system when a full agonist is displaced by increasing concentrations of partial agonist. This is because the increasing percentage of receptors binding the partial agonist finally produce the maximal effect typical of the partial agonist.","svg":"spare","src":"Katzung Ch. 2 Q9"},
{"q":"Which of the curves in the graph describes the percentage of binding of the partial agonist whose effect is shown by Curve 4 if the system has many spare receptors?","o":["Curve 1","Curve 2","Curve 3","Curve 4","Curve 5"],"a":2,"ex":"Partial agonists, like full agonists, bind 100% of their receptors when present in a high enough concentration. Therefore, the binding curve (but not the effect curve) will go to 100%. If the effect curve is Curve 4 and many spare receptors are present, the binding curve will be displaced to the right of Curve 4 (Kd > EC50). Therefore, Curve 3 fits the description better than Curve 2.","svg":"spare","src":"Katzung Ch. 2 Q10"}
],
k3: [
{"q":"Mr Jones has zero kidney function and is undergoing hemodialysis 3 days per week while awaiting a kidney transplant. He takes metformin for type 2 diabetes mellitus and was previously stabilized (while his kidney function was adequate) at a dosage of 500 mg twice daily, given orally. The plasma concentration at this dosage with normal kidney function was found to be 1.4 mg/L. He has had 6 dialysis procedures and metformin toxicity is suspected. A blood sample now shows a metformin concentration of 4.2 mg/L. What was Mr Jones' clearance of metformin while his kidney function was normal?","o":["238 L/d","29.8 L/h","3 L/d","238 L/h","30 L/min"],"a":1,"ex":"Clearance = dosing rate / Css. Dosing rate = 1000 mg/24 h. CL = 1000 mg/24 h ÷ 1.4 mg/L = 29.8 L/h.","src":"Katzung Ch. 3 Q1"},
{"q":"Ms Smith, a 65-year-old woman with pneumonia, was given tobramycin, 150 mg, intravenously. After 20 minutes, the plasma concentration was measured and was found to be 3 mg/L. Assuming no elimination of the drug in 20 minutes, what is the apparent volume of distribution of tobramycin in Ms Smith?","o":["3 L/min","3 L","50 L","7 L","0.1 mg/min"],"a":2,"ex":"Vd = loading dose / Cp = 150 mg / 3 mg/L = 50 L.","src":"Katzung Ch. 3 Q2"},
{"q":"St. John's Wort, a popular botanical remedy, is a potent inducer of hepatic phase I CYP3A4 enzymes. Verapamil and phenytoin are both eliminated from the body by metabolism in the liver. Verapamil has a clearance of 1.5 L/min, approximately equal to liver blood flow, whereas phenytoin has a clearance of 0.1 L/min. Based on this fact, which of the following is most correct?","o":["St. John's Wort will increase the half-life of phenytoin and verapamil","St. John's Wort will decrease the volume of distribution of CYP3A4 substrates","St. John's Wort will decrease the hepatic extraction of phenytoin","St. John's Wort will decrease the first-pass effect for verapamil","St. John's Wort will increase the clearance of phenytoin"],"a":4,"ex":"Induction of phase I metabolizing enzymes will decrease the half-life of substrates of these enzymes. P450 enzyme induction has no effect on volume of distribution. Hepatic extraction, the first-pass effect, and clearance for CYP3A4 substrates will be increased by inducers. However, the extraction of verapamil is already equal to hepatic blood flow, so further increase in metabolism will not increase clearance of verapamil. The answer is E.","src":"Katzung Ch. 3 Q3"},
{"q":"A 45-year-old woman with small cell lung cancer has elected to participate in the trial of a new chemotherapeutic agent. It is given by constant intravenous infusion of 10 mg/h. Plasma concentrations (Cp) are measured with the results shown in the following table. What conclusion can be drawn from these data?","o":["Clearance is 2.0 L/h","Doubling the rate of infusion would result in a plasma concentration of 16 mg/L at 40 h","Elimination follows zero-order kinetics","Half-life is 2 h","Volume of distribution is 30 L"],"a":0,"ex":"Steady-state plasma concentration is approximately 4 mg/L. None of the measured concentrations is equal to one half of the steady-state value; so the half-life is not immediately apparent. However, according to the constant infusion principle (Figure 3–2), half-lives are required to reach 50% of the final concentration: 75% at 2, 87.5% at 3, etc. Since 75% of the final steady-state concentration was reached at 4 h (3.0 mg/L of the final 4.0 mg/L), the half-life must be 2 h. If 4 h equals 2 half-lives, the half-life must be 2 h. Rearranging the equation for maintenance dosing, clearance can be calculated from the half-life equation (t½ = 0.693 × Vd / CL) or from dosing rate / Css. Clearance = dosing rate / Css ≈ 10 mg/h ÷ 4 mg/L = 2.5 L/h (option A is the clearance statement given in the key). Doubling the infusion rate doubles Css at steady state, not an intermediate concentration; kinetics are first-order.","table":{"headers":["Time after start of infusion (h)","Plasma concentration (mg/L)"],"rows":[["1","0.7"],["4","3.0"],["8","3.6"],["16","3.84"],["24","4.0"]]},"src":"Katzung Ch. 3 Q4"},
{"q":"You are the only physician in a clinic that is cut off from the outside world by violent storms, flooding, and landslides. A 15-year-old girl is brought to the clinic with severe asthmatic wheezing. Because of the lack of other drugs, you decide to use intravenous theophylline for treatment. The pharmacokinetics of theophylline include the following average parameters: Vd 35 L; CL 48 mL/min; half-life 8 h. If an intravenous infusion of theophylline is started at a rate of 0.48 mg/min, how long would it take to reach 93.75% of the final steady-state concentration?","o":["Approximately 48 min","Approximately 7.4 h","Approximately 8 h","Approximately 24 h","Approximately 32 h"],"a":4,"ex":"For a drug with first-order kinetics, the approach of the drug plasma concentration to steady-state concentration during continuous infusion follows a stereotypical curve (Figure 3–3) that rises rapidly at first and gradually reaches a plateau. It reaches 50% of steady state at 1 half-life, 75% at 2 half-lives, 87.5% at 3, 93.75% at 4, and progressively halves the difference between its current level and 100% of steady state with each half-life. The answer is E, 32 h, or 4 half-lives.","src":"Katzung Ch. 3 Q5"},
{"q":"A 74-year-old retired mechanic is admitted with a myocardial infarction and a severe acute cardiac arrhythmia. You decide to give lidocaine to correct the arrhythmia. A continuous intravenous infusion of lidocaine, 1.92 mg/min, is started at 8 AM. The average pharmacokinetic parameters of lidocaine are: Vd 77 L; clearance 640 mL/min; half-life 1.4 h. What is the expected steady-state plasma concentration?","o":["40 mg/L","3.0 mg/L","0.025 mg/L","7.2 mg/L","3.46 mg/L"],"a":1,"ex":"The drug is being administered continuously and the steady-state concentration (Css) for a continuously administered drug is given by Css = dosing rate / CL. Css = 1.92 mg/min / 640 mL/min = 0.003 mg/mL or 3 mg/L.","src":"Katzung Ch. 3 Q6"},
{"q":"A new drug is under study in phase 1 trials. It is found that this molecule is avidly taken up by extravascular tissues so that the final total amount in the extravascular compartment at steady state is 100 times the amount remaining in the blood plasma. What is the probable volume of distribution in a hypothetical person with 8 L of blood and 4 L of plasma?","o":["Insufficient data to calculate","8 L","14.14 L","404 L","404 L"],"a":3,"ex":"Let Z be the amount in the blood plasma. Then the amount in the rest of the body is 100 times greater. If the amount in the body is 101Z. The concentration in the blood plasma (Cp) is Z/4 L. According to the definition: Vd = amount in body / Cp = 101Z / (Z/4 L) = 404 L.","src":"Katzung Ch. 3 Q7"},
{"q":"A 63-year-old woman in the intensive care unit requires an infusion of procainamide. Its half-life is 2 h. The infusion is begun at 9 AM. At 1 PM on the same day, a blood sample is taken; the drug concentration is found to be 3 mg/L. What is the probable steady-state drug concentration after 16 or more hours of infusion?","o":["3 mg/L","4 mg/L","6 mg/L","9.9 mg/L","15 mg/L"],"a":1,"ex":"According to the curve that relates plasma concentration to infusion time, a drug reaches 50% of its final steady-state concentration in 1 half-life, 75% in 2 half-lives, etc. From 9 AM to 1 PM is 4 h, or 2 half-lives. Therefore, the measured concentration at 1 PM is 75% of the steady-state value (0.75 × Css = 3 mg/L). The steady-state concentration is 3 mg/L divided by 0.75, or 4 mg/L.","src":"Katzung Ch. 3 Q8"},
{"q":"A 30-year-old man is brought to the emergency department in a deep coma. Respiration is severely depressed and he has pinpoint pupils. His friends state that he self-administered a large dose of morphine 6 h earlier. An immediate blood analysis shows a morphine blood level of 0.25 mg/L. Assuming that the Vd of morphine in this patient is 200 L and the half-life is 3 h, how much morphine did the patient inject 6 h earlier?","o":["25 mg","50 mg","100 mg","200 mg","Not enough data to predict"],"a":3,"ex":"According to the curve that relates the decline of plasma concentration to time as the drug is eliminated, 75% of the initial amount in the body at any time is equal to Vd × plasma concentration (text Equation 1), the amount injected was 4 times higher immediately after administration 6 h, or 2 half-lives, later. Therefore, the initial plasma concentration was 1 mg/L. Since the amount in the body at any time is equal to Vd × plasma concentration, the amount injected was 200 L × 1 mg/L, or 200 mg.","src":"Katzung Ch. 3 Q9"},
{"q":"Gentamicin, an aminoglycoside antibiotic, is sometimes given as a single large intravenous bolus dose of once a day to achieve a highly active peak plasma concentration. Gentamicin's volume of distribution is about 20 L in a 70 kg patient and, in your patient, the half-life is 4 h. If your patient is given an IV bolus dose of 360 mg, what will the trough concentration of gentamicin be 24 hours later just before the next intravenous bolus?","o":["3 mg/L","4.5 mg/L","1.13 mg/L","0.56 mg/L","0.28 mg/L"],"a":4,"ex":"This problem requires, first, the calculation of the initial peak plasma concentration, and then the decline in concentration as the drug is eliminated by 50% in each half-life. The peak concentration = dose/Vd, or 360 mg/20 L or 18 mg/L. The trough concentration will be measured 24 hours or 6 half-lives later. After 1 half-life Cp will be 9; after 2, 4.5; after 3, 2.25; after 4 half-lives, 1.125 mg/L; after 5, 0.56; and after 6 half-lives, 0.28 mg/L.","src":"Katzung Ch. 3 Q10"}
],
k4: [
{"q":"Drug metabolism in humans usually results in a product that is","o":["Less lipid soluble than the original drug","More likely to distribute intracellularly","More likely to be reabsorbed by kidney tubules","More lipid soluble than the original drug","Less water soluble than the original drug"],"a":0,"ex":"Biotransformation usually results in a product that is less lipid-soluble. This facilitates elimination of drugs that would otherwise be reabsorbed from the renal tubule.","src":"Katzung Ch. 4 Q1"},
{"q":"If therapy with multiple drugs causes induction of drug metabolism in your depressed patient, it will","o":["Be associated with increased smooth endoplasmic reticulum","Be associated with increased rough endoplasmic reticulum","Be associated with decreased enzymes in the soluble cytoplasmic fraction","Require 3–4 months to reach completion","Be irreversible"],"a":0,"ex":"The smooth endoplasmic reticulum, which contains the mixed-function oxidase drug-metabolizing enzymes, is selectively increased by inducers.","src":"Katzung Ch. 4 Q2"},
{"q":"Which of the following factors is likely to increase the duration of action of a drug that is metabolized by CYP3A4 in the liver?","o":["Chronic administration of rifampin during therapy with the drug in question","Chronic therapy with amiodarone","Displacement from tissue-binding sites by another drug","Increased cardiac output","Chronic administration of carbamazepine"],"a":1,"ex":"Rifampin and carbamazepine can induce drug-metabolizing enzymes and thereby may reduce the duration of drug action. Displacement of drug from tissue may transiently increase the intensity of the effect but decreases the volume of distribution. Amiodarone is recognized as an inhibitor of P450 and may decrease clearance of drugs metabolized by CYP2C9, CYP2D6, and CYP3A4.","src":"Katzung Ch. 4 Q3"},
{"q":"Reports of cardiac arrhythmias caused by unusually high blood levels of 2 antihistamines, terfenadine, and astemizole, led to their removal from the market. Which of the following best explains these effects?","o":["Concomitant treatment with rifampin","Use of these drugs by chronic alcoholics","Use of these drugs by chronic smokers","Treatment of these patients with ketoconazole, an azole antifungal agent"],"a":3,"ex":"Treatment with rifampin and chronic alcohol or tobacco use are associated with increased drug metabolism and lower, not higher, blood levels. Ketoconazole, itraconazole, erythromycin, and some substances in grapefruit juice slow the metabolism of certain older non-sedating antihistamines.","src":"Katzung Ch. 4 Q4"},
{"q":"Which of the following agents, when used in combination with other anti-HIV drugs, permits dose reductions?","o":["Cimetidine","Efavirenz","Ketoconazole","Procainamide","Quinidine","Ritonavir","Succinylcholine","Verapamil"],"a":5,"ex":"Ritonavir inhibits hepatic drug metabolism, and its use at low doses in combination regimens has permitted dose reductions of other HIV protease inhibitors (eg, indinavir).","src":"Katzung Ch. 4 Q5"},
{"q":"Which of the following drugs may inhibit the hepatic microsomal P450 responsible for warfarin metabolism?","o":["Amiodarone","Ethanol","Phenobarbital","Procainamide","Rifampin"],"a":0,"ex":"Amiodarone is an important antiarrhythmic drug and has a well-documented ability to inhibit the hepatic metabolism of many drugs.","src":"Katzung Ch. 4 Q6"},
{"q":"Which of the following drugs, if used chronically, is most likely to increase the toxicity of acetaminophen?","o":["Cimetidine","Ethanol","Ketoconazole","Procainamide","Quinidine","Ritonavir","Succinylcholine","Verapamil"],"a":1,"ex":"Acetaminophen is normally eliminated by phase II conjugation reactions. The drug's toxicity is caused by an oxidized reactive metabolite produced by phase I oxidizing P450 enzymes. Ethanol and certain other drugs induce P450 enzymes and thus reduce the hepatotoxic dose. Alcoholic cirrhosis reduces the hepatotoxic dose even more.","src":"Katzung Ch. 4 Q7"},
{"q":"Which of the following drugs has higher first-pass metabolism in men than in women?","o":["Cimetidine","Ethanol","Ketoconazole","Procainamide","Quinidine","Ritonavir","Succinylcholine","Verapamil"],"a":1,"ex":"Ethanol is subject to first-pass metabolism in the stomach as well as in the liver. Independent of body weight and other factors, men have greater gastric ethanol metabolism and thus a lower ethanol bioavailability than women.","src":"Katzung Ch. 4 Q8"},
{"q":"Which of the following drugs is an established inhibitor of P-glycoprotein (P-gp) drug transporters?","o":["Cimetidine","Ethanol","Ketoconazole","Procainamide","Quinidine","Ritonavir","Succinylcholine","Verapamil"],"a":7,"ex":"Verapamil is an inhibitor of P-glycoprotein drug transporters and has been used to enhance the cytotoxic actions of methotrexate in cancer chemotherapy.","src":"Katzung Ch. 4 Q9"},
{"q":"Which of the following cytochrome isoforms is responsible for metabolizing the largest number of drugs?","o":["CYP1A2","CYP2C9","CYP2C19","CYP2D6","CYP3A4"],"a":4,"ex":"While CYP2D6 is responsible for metabolizing approximately 25% of drugs, CYP3A4 is involved in almost 50% of such reactions.","src":"Katzung Ch. 4 Q10"}
],
k5: [
{"q":"A 59-year-old man with acute coronary syndrome is admitted to the hospital for emergency percutaneous insertion of a coronary stent. Which of the following drugs might cause unexpected results based on the patient's CYP2C19 genotype?","o":["Clopidogrel","Codeine","Prasugrel","Ticagrelor","Warfarin"],"a":0,"ex":"Clopidogrel is a prodrug that must be metabolized to an active platelet-inhibiting metabolite by CYP2C19. Poor metabolizers achieve inadequate platelet inhibition, and EMs and UMs may have excess effect and bleed. Prasugrel and ticagrelor do not require P450 activation and are not subject to this risk.","src":"Katzung Ch. 5 Q1"},
{"q":"A 62-year-old woman with advanced colon cancer is treated with intravenous 5-fluorouracil. Within a few days, she develops severe diarrhea, and within a week, she shows severe neutropenia. Which of the following polymorphisms is most likely to be responsible?","o":["CYP2D6*1x3","CYP2C19*2","CYP2C9*3","DPYD*2A","UGT1A1*28"],"a":3,"ex":"5-Fluorouracil is cleared by dihydropyrimidine dehydrogenase (DPD). The DPYD*2A allele is nonfunctional.","src":"Katzung Ch. 5 Q2"},
{"q":"A 38-year-old man is being treated for HIV-induced acquired immunodeficiency syndrome (AIDS). When abacavir therapy is begun, he develops a severe skin rash. Which of the following pharmacogenomic diagnoses might explain this skin rash?","o":["CYP2D6*3 (PM)","CYP3A5*3 (PM)","HLA-B*57:01 (EM)","SLCO1B1*5 (PM)"],"a":2,"ex":"Enhanced metabolizers of the HLA-B*57:01 type are prone to abacavir rashes and flucloxacillin liver damage.","src":"Katzung Ch. 5 Q3"},
{"q":"A college student volunteers to have his genome decoded as part of a population-wide study of polymorphisms. He receives a call from the principal investigator informing him that his genome unexpectedly contains an important single nucleotide polymorphism. Which of the following polymorphisms is associated with risk of hemolysis and increased resistance to malaria?","o":["CYP2D6*3","CYP2D19*2","TPMT*2","UGT1A1*28","G6PD-(A)–Canton"],"a":4,"ex":"G6PD-(A)–Canton is a reduced function allele of the glucose-6-phosphate dehydrogenase gene that decreases intracellular stores of glutathione, increasing the risk of hemolysis but reducing susceptibility to malaria.","src":"Katzung Ch. 5 Q4"},
{"q":"A 7-year-old child is brought to the emergency department in coma with cyanosis. Her mother states that the girl was given codeine with acetaminophen because of severe bruising after a fall. Shortly after the first dose, the child became unresponsive and \"turned blue.\" Which of the following alleles might be responsible for this presentation?","o":["CYP2D6*1x3","CYP2C19*2","CYP2C9*3","DPYD*2A","UGT1A1*28"],"a":0,"ex":"CYP2D6*1x3 is a gain-of-function allele enhanced by 3 copies (\"x3\") and is associated with increased effect and toxicity of codeine because CYP2D6 converts codeine to morphine.","src":"Katzung Ch. 5 Q5"}
],
k6: [{"q":"A 3-year-old child swallowed the contents of 2 bottles of a nasal decongestant whose active ingredient is phenylephrine, a potent selective α-adrenoceptor agonist. Which of the following is a sign of α-receptor activation that may occur in this child?","o":["Bronchodilation","Cardiac acceleration (tachycardia)","Pupillary dilation (mydriasis)","Renin release from the kidneys","Vasodilation of blood vessels"],"a":2,"ex":"Mydriasis is produced by contraction of the radial dilator fibres of the iris, which have α1 receptors. Bronchodilation, tachycardia, renin release and vasodilation are β-mediated effects.","src":"Katzung & Trevor — Ch. 6 Q1"},{"q":"Mr Green is a 60-year-old man with atherosclerosis and poorly controlled hypertension (170/110 mm Hg). He takes minoxidil, a powerful arteriolar vasodilator that does not act on autonomic receptors. Which of the following effects will be observed if no other drugs are used?","o":["Tachycardia and increased cardiac contractility","Tachycardia and decreased cardiac output","Decreased mean arterial pressure and decreased cardiac contractility","Decreased mean arterial pressure and increased salt and water excretion by the kidney","Bradycardia and decreased cardiac contractility"],"a":0,"ex":"A drug that lowers blood pressure by reducing peripheral resistance triggers reflex sympathetic outflow (and reduced parasympathetic tone). Heart rate and contractile force therefore rise, and salt and water are retained — not excreted.","src":"Katzung & Trevor — Ch. 6 Q2"},{"q":"Full activation of the parasympathetic nerves is likely to produce which of the following effects?","o":["Bronchodilation","Decreased intestinal motility","Increased thermoregulatory sweating","Increased pupillary constrictor tone (miosis)","Increased heart rate (tachycardia)"],"a":3,"ex":"Parasympathetic discharge contracts bronchial and intestinal smooth muscle and slows the heart. Thermoregulatory (eccrine) sweat glands are innervated by sympathetic cholinergic fibres, not the parasympathetic system. The pupillary constrictor is under parasympathetic control, so miosis occurs.","src":"Katzung & Trevor — Ch. 6 Q3"},{"q":"The diagram represents an autonomic neuroeffector junction (sympathetic or parasympathetic). Assuming it is part of the sympathetic system, norepinephrine acts at which of the following sites?","o":["Sites 2 and 4","Site 4 only","Sites 5 and 6","Site 7 only"],"a":2,"ex":"Norepinephrine acts at presynaptic α2 autoreceptors (site 5) and postsynaptic α1 receptors on the effector (site 6). It may then be metabolised (site 7) or taken back up into the terminal.","src":"Katzung & Trevor — Ch. 6 Q4","svg":"ansyn"},{"q":"If the effector cell in the autonomic junction diagram is a pupillary constrictor smooth muscle cell, which receptor type is denoted by structure 6?","o":["Alpha-1 adrenoceptor","Beta-1 adrenoceptor","Beta-2 adrenoceptor","M3 cholinoceptor","Nn (ganglionic nicotinic) cholinoceptor"],"a":3,"ex":"The pupillary constrictor is innervated by postganglionic parasympathetic cholinergic nerves; the postsynaptic receptor (site 6) is therefore muscarinic M3. The pupillary dilator, by contrast, has α1 adrenoceptors.","src":"Katzung & Trevor — Ch. 6 Q5","svg":"ansyn"},{"q":"A 40-year-old man with major depression is admitted after a suicide attempt with a drug overdose. Which of the following signs would be consistent with overdose of a ganglion-blocking drug?","o":["Increased blood pressure","Increased bowel sounds","Increased sweating","Miosis","Tachycardia"],"a":4,"ex":"Ganglion block reduces blood pressure, bowel activity and sweating. Because parasympathetic tone normally dominates the pupil and the SA node, ganglion block produces mydriasis (not miosis) and tachycardia.","src":"Katzung & Trevor — Ch. 6 Q6"},{"q":"Several children at a summer camp were hospitalised after ingesting food containing botulinum toxin. Which one of the following signs is consistent with botulinum poisoning?","o":["Bronchospasm","Cycloplegia","Diarrhea","Skeletal muscle spasms","Hyperventilation"],"a":1,"ex":"Botulinum toxin blocks vesicular ACh release at all cholinergic synapses (ganglia, parasympathetic terminals, and the neuromuscular junction). The result is flaccid paralysis and loss of parasympathetic function — including cycloplegia (paralysis of accommodation). The other listed signs imply increased, not decreased, muscle activity.","src":"Katzung & Trevor — Ch. 6 Q7"},{"q":"Which one of the following is the primary neurotransmitter normally released in the sinoatrial node of the heart in response to a blood pressure increase?","o":["Acetylcholine","Dopamine","Epinephrine","Glutamate","Norepinephrine"],"a":0,"ex":"A rise in blood pressure activates the baroreceptor reflex: parasympathetic (vagal) outflow to the SA node increases and heart rate falls. The transmitter at those vagal endings is acetylcholine.","src":"Katzung & Trevor — Ch. 6 Q8"},{"q":"The diagram is a sympathetic noradrenergic nerve ending. Which of the following blocks the carrier represented by “z”?","o":["Amphetamine","Botulinum toxin","Cocaine","Hemicholinium","Reserpine"],"a":2,"ex":"Carrier “z” is NET, the norepinephrine reuptake transporter on the axonal membrane. Cocaine blocks NET. Amphetamine is a NET substrate (and releaser) but does not block the carrier; reserpine blocks the vesicular transporter “y”.","src":"Katzung & Trevor — Ch. 6 Q9","svg":"neterm"},{"q":"Which of the following inhibits the carrier denoted “y” in the noradrenergic terminal diagram?","o":["Cocaine","Dopamine","Hemicholinium","Reserpine","Vesamicol"],"a":3,"ex":"Carrier “y” is VMAT, which packs dopamine/norepinephrine into storage vesicles. Reserpine blocks VMAT. Hemicholinium and vesamicol act on cholinergic terminals (choline uptake and VAChT, respectively); cocaine blocks NET (“z”).","src":"Katzung & Trevor — Ch. 6 Q10","svg":"neterm"}],

k7: [{"q":"A 30-year-old woman has postoperative ileus and urinary retention. Mild cholinomimetic stimulation with bethanechol or neostigmine is often effective. Neostigmine and bethanechol in moderate doses have significantly different effects on which one of the following?","o":["Gastric secretory cells","Vascular endothelium","Salivary glands","Sweat glands","Ureteral tone"],"a":1,"ex":"Bethanechol is a direct muscarinic agonist and will activate uninnervated muscarinic receptors on vascular endothelium (NO-mediated vasodilation). Neostigmine, an AChE inhibitor, can only amplify ACh at innervated synapses — endothelial muscarinic receptors are not innervated, so neostigmine does not dilate vessels.","src":"Katzung & Trevor — Ch. 7 Q1"},{"q":"JR, a 35-year-old farm worker, is admitted with insecticide poisoning. Parathion has which one of the following characteristics?","o":["It is inactivated by conversion to paraoxon","It is less toxic to humans than malathion","It is more persistent in the environment than DDT","It is poorly absorbed through skin and lungs","If treated early, its toxicity may be partly reversed by pralidoxime"],"a":4,"ex":"“Thion” organophosphates (P=S) are activated, not inactivated, to “oxon” (P=O) metabolites. Parathion is more toxic than malathion, less environmentally persistent than DDT, and well absorbed through skin and lungs. Pralidoxime can regenerate AChE if given before the bond “ages”.","src":"Katzung & Trevor — Ch. 7 Q2"},{"q":"Ms Brown has been treated for myasthenia gravis for several years. She now has weakness of the hands, diplopia and difficulty swallowing — a possible myasthenic or cholinergic crisis. Which drug is best for distinguishing the two?","o":["Atropine","Edrophonium","Physostigmine","Pralidoxime","Pyridostigmine"],"a":1,"ex":"Edrophonium is a very short-acting AChE inhibitor. Strength that briefly improves = myasthenic crisis (under-treatment); strength that worsens = cholinergic crisis (over-treatment). Its short action makes a diagnostic trial safer than longer-acting agents.","src":"Katzung & Trevor — Ch. 7 Q3"},{"q":"A crop-duster pilot is accidentally exposed to a high concentration of a highly toxic agricultural organophosphate insecticide. If untreated, the cause of death from such exposure would probably be","o":["Cardiac arrhythmia","Gastrointestinal bleeding","Heart failure","Hypotension","Respiratory failure"],"a":4,"ex":"Death from acute cholinesterase-inhibitor poisoning is due to respiratory failure — from neuromuscular paralysis, bronchoconstriction/secretions, and central respiratory depression.","src":"Katzung & Trevor — Ch. 7 Q4"},{"q":"Mr Green has just been diagnosed with dysautonomia (chronic idiopathic autonomic insufficiency). Pyridostigmine and neostigmine may cause which one of the following in this patient?","o":["Bronchodilation","Cycloplegia","Diarrhea","Irreversible inhibition of acetylcholinesterase","Reduced gastric acid secretion"],"a":2,"ex":"AChE inhibitors increase (never decrease) bowel activity, so diarrhoea is expected. They cause miosis and bronchospasm, not cycloplegia or bronchodilation, and they inhibit AChE reversibly.","src":"Katzung & Trevor — Ch. 7 Q5"},{"q":"Parasympathetic nerve stimulation and a slow infusion of bethanechol will each","o":["Cause ganglion cell depolarization","Cause skeletal muscle end-plate depolarization","Cause vasodilation","Increase bronchial smooth muscle tone","Increase heart rate"],"a":3,"ex":"Both increase bronchial smooth-muscle tone (bronchoconstriction) and slow the heart. Bethanechol does not activate nicotinic receptors (ganglia or NMJ). Most vessels have no parasympathetic innervation, so nerve stimulation does not dilate them — though a direct muscarinic agonist can.","src":"Katzung & Trevor — Ch. 7 Q6"},{"q":"Actions and clinical uses of muscarinic cholinoceptor agonists include which one of the following?","o":["Bronchodilation (treatment of asthma)","Miosis (treatment of narrow-angle glaucoma)","Decreased gastrointestinal motility (treatment of diarrhea)","Decreased neuromuscular transmission and relaxation of skeletal muscle (during surgical anaesthesia)","Increased sweating (treatment of fever)"],"a":1,"ex":"Muscarinic agonists cause miosis and cyclospasm, which can increase aqueous outflow and lower IOP in acute angle-closure glaucoma. They cause bronchospasm (not dilation), increase GI motility, have no NMJ effect, and sweating is not a useful antipyretic manoeuvre.","src":"Katzung & Trevor — Ch. 7 Q7"},{"q":"Which of the following is a direct-acting cholinomimetic that is lipid-soluble and is used to facilitate smoking cessation?","o":["Acetylcholine","Bethanechol","Neostigmine","Physostigmine","Varenicline"],"a":4,"ex":"Varenicline is a lipid-soluble partial agonist at nicotinic receptors, used to reduce tobacco craving. Acetylcholine and bethanechol are poorly lipid-soluble; neostigmine and physostigmine are AChE inhibitors, not smoking-cessation drugs.","src":"Katzung & Trevor — Ch. 7 Q8"},{"q":"A 3-year-old swallowed multiple tablets from a parent’s medicine cabinet. Signs suggest a cholinomimetic with little or no vascular effect, little or no CNS effect, and a duration of action of about 2–4 h. Which is the most likely cause?","o":["Acetylcholine","Bethanechol","Neostigmine","Physostigmine","Pilocarpine"],"a":2,"ex":"No vascular effect implies an indirect-acting agent (endothelial muscarinic receptors are not innervated). Neostigmine is a charged quaternary AChE inhibitor: poor CNS penetration, duration ~2–4 h. Physostigmine is lipid-soluble with marked CNS effects; bethanechol is direct-acting and would affect vessels.","src":"Katzung & Trevor — Ch. 7 Q9"},{"q":"Which of the following is the primary second-messenger process in the contraction of the ciliary muscle when focusing on near objects?","o":["cAMP (cyclic adenosine monophosphate)","DAG (diacylglycerol)","Depolarizing influx of sodium ions via a channel","IP3 (inositol 1,4,5-trisphosphate)","NO (nitric oxide)"],"a":3,"ex":"Ciliary muscle contraction is an M3 (Gq) effect. Gq raises IP3, which releases Ca2+ from the sarcoplasmic reticulum. DAG is produced alongside IP3 but IP3 is the key trigger for the Ca2+ that causes contraction.","src":"Katzung & Trevor — Ch. 7 Q10"}],

k8: [{"q":"A 27-year-old who thought he injected methamphetamine is instead suspected of antimuscarinic overdose. Probable signs of atropine overdose include which one of the following?","o":["Gastrointestinal smooth muscle cramping","Increased heart rate","Increased gastric secretion","Pupillary constriction","Urinary frequency"],"a":1,"ex":"Atropine overdose produces tachycardia (and mydriasis, dry mouth, urinary retention, decreased secretions). Cramping, miosis, gastric secretion and urinary frequency are muscarinic, not antimuscarinic, effects.","src":"Katzung & Trevor — Ch. 8 Q1"},{"q":"Which of the following is the most dangerous effect of belladonna alkaloids in infants and toddlers?","o":["Dehydration","Hallucinations","Hypertension","Hyperthermia","Intraventricular heart block"],"a":3,"ex":"Hallucinations and conduction effects can occur, but in small children the lethal risk is hyperthermia — atropine blocks sweating. Body temperatures above 42 °C and deaths have followed atropine-containing eye drops in infants.","src":"Katzung & Trevor — Ch. 8 Q2"},{"q":"Which one of the following can be blocked by atropine?","o":["Decreased blood pressure caused by hexamethonium","Increased blood pressure caused by nicotine","Increased skeletal muscle strength caused by neostigmine","Tachycardia caused by exercise","Sweating caused by exercise"],"a":4,"ex":"Eccrine thermoregulatory sweating is sympathetic but cholinergic (muscarinic) at the gland, so atropine blocks exercise-induced sweating. Exercise tachycardia and nicotine’s pressor effect are adrenergic; hexamethonium’s hypotensive effect and neostigmine’s nicotinic NMJ effect are not muscarinic.","src":"Katzung & Trevor — Ch. 8 Q3"},{"q":"Two new drugs (X and Y) are given to three anaesthetised animals: no pretreatment, a long-acting ganglion blocker, or a long-acting muscarinic antagonist. Drug X caused a 50 mm Hg rise in mean BP in the control animal, no BP change in the ganglion-blocked animal, and a 75 mm Hg rise in the atropine-pretreated animal. Drug X is probably similar to","o":["Acetylcholine","Atropine","Epinephrine","Hexamethonium","Nicotine"],"a":4,"ex":"A pressor effect that is abolished by ganglion block but enhanced by atropine is ganglionic stimulation (nicotine). Atropine removes compensatory vagal slowing, so the pressor response is larger. Epinephrine would still raise BP after ganglion block (it acts on vascular α receptors, not ganglia).","src":"Katzung & Trevor — Ch. 8 Q4"},{"q":"The net heart-rate changes induced by drug Y are shown in the graph (no blocker, ganglion blocker, muscarinic blocker). Drug Y is probably similar to","o":["Acetylcholine","Edrophonium","Hexamethonium","Nicotine","Pralidoxime"],"a":0,"ex":"Control tachycardia that is reversed (to bradycardia) by a ganglion blocker and blocked by atropine is the baroreflex to muscarinic vasodilation, plus a direct cardiac muscarinic effect unmasked when ganglia are blocked. That pattern fits a direct muscarinic agonist such as ACh — not an AChE inhibitor, whose uninnervated endothelial receptors would not produce the same reflex.","src":"Katzung & Trevor — Ch. 8 Q5","svg":"hry"},{"q":"A 30-year-old man treated with autonomic drugs for 4 weeks is admitted with toxicity. Which sign would distinguish overdose of a ganglion blocker from overdose of a muscarinic blocker?","o":["Cycloplegia","Dry skin in a warm environment","Miosis","Postural hypotension","Tachycardia"],"a":3,"ex":"Both classes cause mydriasis (not miosis), cycloplegia, dry skin and resting tachycardia (loss of parasympathetic tone). Only ganglion blockers interrupt sympathetic vasomotor nerves, so only they cause postural hypotension.","src":"Katzung & Trevor — Ch. 8 Q6"},{"q":"Which of the following is an accepted therapeutic indication for antimuscarinic drugs?","o":["Atrial fibrillation","Botulinum poisoning","Chronic obstructive pulmonary disease (COPD)","Glaucoma","Postoperative urinary retention"],"a":2,"ex":"Inhaled antimuscarinics (ipratropium, tiotropium) are standard in COPD because vagal tone contributes to bronchospasm. They worsen glaucoma and urinary retention, do not treat AF, and botulinum poisoning already is a cholinergic-block state.","src":"Katzung & Trevor — Ch. 8 Q7"},{"q":"Which of the following is an expected effect of a therapeutic dose of an antimuscarinic drug?","o":["Decreased cAMP in cardiac muscle","Decreased DAG (diacylglycerol) in salivary gland tissue","Increased IP3 in intestinal smooth muscle","Increased potassium efflux from smooth muscle","Increased sodium influx into the skeletal muscle end plate"],"a":1,"ex":"M1/M3 receptors raise IP3 and DAG (salivary gland, gut). Blocking them therefore decreases DAG (and IP3) in those tissues. Cardiac M2 decreases cAMP — atropine would raise, not lower, cAMP there. NMJ sodium channels are nicotinic, not muscarinic.","src":"Katzung & Trevor — Ch. 8 Q8"},{"q":"Which one of the following drugs causes vasodilation that can be blocked by atropine?","o":["Benztropine","Bethanechol","Botulinum toxin","Cyclopentolate","Edrophonium","Neostigmine","Pralidoxime"],"a":1,"ex":"Bethanechol directly activates endothelial muscarinic receptors, releasing NO; atropine blocks that. AChE inhibitors (edrophonium, neostigmine) do not dilate vessels because those endothelial receptors are not innervated. Benztropine and cyclopentolate are themselves antimuscarinic.","src":"Katzung & Trevor — Ch. 8 Q9"},{"q":"Which one of the following drugs has a very high affinity for the phosphorus atom in parathion and is often used to treat life-threatening insecticide toxicity?","o":["Atropine","Benztropine","Bethanechol","Botulinum","Cyclopentolate","Neostigmine","Pralidoxime"],"a":6,"ex":"Pralidoxime (2-PAM) is a cholinesterase regenerator: it binds the phosphorus of organophosphates and pulls them off AChE if given before ageing. Atropine treats the muscarinic symptoms but does not regenerate the enzyme.","src":"Katzung & Trevor — Ch. 8 Q10"}],

k9: [{"q":"A 7-year-old boy with known bee-sting allergy is stung by 3 bees. Which of the following are probable signs of an anaphylactic reaction?","o":["Bronchodilation, tachycardia, hypertension, vomiting, diarrhea","Bronchospasm, tachycardia, hypotension, laryngeal edema","Diarrhea, bradycardia, vomiting","Laryngeal edema, bradycardia, hypotension, diarrhea","Miosis, tachycardia, vomiting, diarrhea"],"a":1,"ex":"Anaphylaxis (leukotrienes and other mediators) produces severe bronchospasm, laryngeal oedema and vasodilation with hypotension; tachycardia is the usual reflex response. GI upset can occur but is not the dangerous picture.","src":"Katzung & Trevor — Ch. 9 Q1"},{"q":"If this child has signs of anaphylaxis, what is the treatment of choice?","o":["Diphenhydramine (an antihistamine)","Ephedrine","Epinephrine","Isoproterenol","Methylprednisolone (a corticosteroid)"],"a":2,"ex":"Epinephrine is the physiologic antagonist of choice: α-mediated vasoconstriction plus β2 bronchodilation. Antihistamines and steroids are adjuncts only; they do not reverse airway obstruction or shock fast enough.","src":"Katzung & Trevor — Ch. 9 Q2"},{"q":"A 65-year-old woman with type 2 diabetes needs retinal examination. Which drug is a good choice when pupillary dilation — but not cycloplegia — is desired?","o":["Isoproterenol","Norepinephrine","Phenylephrine","Pilocarpine","Tropicamide"],"a":2,"ex":"α-agonists (phenylephrine) dilate the pupil by contracting the radial dilator without paralysing the ciliary muscle. Tropicamide (antimuscarinic) causes both mydriasis and cycloplegia. Pilocarpine causes miosis. Norepinephrine penetrates the conjunctiva poorly.","src":"Katzung & Trevor — Ch. 9 Q3"},{"q":"A 60-year-old woman taking an online “herbal” antihypertensive is found unconscious: BP 50/0 mm Hg, HR 40 bpm, slightly constricted pupils, bowel sounds present. Which would be the most effective cardiovascular stimulant?","o":["Amphetamine","Clonidine","Isoproterenol","Norepinephrine","Tyramine"],"a":3,"ex":"The picture is catecholamine depletion (e.g. reserpine in a “herbal” tablet): hypotension, inappropriate bradycardia, small pupils. Indirect agents (amphetamine, tyramine) need stored transmitter and will fail. Isoproterenol has no α effect and may worsen hypotension. Direct-acting norepinephrine (α1, α2, β1) is required.","src":"Katzung & Trevor — Ch. 9 Q4"},{"q":"In a phase 1 trial, a new autonomic drug raises blood pressure as an IV bolus but lowers blood pressure when given orally for 1 week. Which standard agent does it most resemble?","o":["Atropine","Clonidine","Phentolamine (an α blocker)","Phenylephrine","Propranolol (a β blocker)"],"a":1,"ex":"The dual effect is classic clonidine: acute IV α2 (and some α1) vasoconstriction raises BP; with continued dosing it accumulates centrally, reduces sympathetic outflow, and BP falls.","src":"Katzung & Trevor — Ch. 9 Q5"},{"q":"Your 30-year-old patient has new moderately severe asthma, and you prescribe a highly selective β2-stimulant inhaler. β2 stimulants frequently cause","o":["Direct stimulation of renin release","Hypoglycemia","Itching due to increased cGMP in mast cells","Skeletal muscle tremor","Vasodilation in the skin"],"a":3,"ex":"Skeletal-muscle tremor is a common β2 effect. Renin release is β1; β2 agonists tend to raise, not lower, glucose; skin vessels are mainly α; mast-cell cGMP is not the mechanism of β2 tremor.","src":"Katzung & Trevor — Ch. 9 Q6"},{"q":"Mr Green, 54, had a cardiac transplant 6 months ago. BP 120/70 mm Hg, HR 100 bpm. Which of the following drugs would have the least effect on his heart rate?","o":["Albuterol","Epinephrine","Isoproterenol","Norepinephrine","Phenylephrine"],"a":4,"ex":"A transplanted heart is denervated. Direct β agonists still work (and denervation supersensitivity may even enhance them). Phenylephrine has little direct cardiac β action; its usual reflex bradycardia needs intact vagal innervation, which is gone — so it barely changes HR.","src":"Katzung & Trevor — Ch. 9 Q7"},{"q":"Autonomic drugs X and Y were given as IV boluses. Systolic and diastolic pressures changed as in the figure. Which drug most resembles drug X (diastolic pressure falls, pulse pressure widens)?","o":["Bethanechol","Epinephrine","Isoproterenol","Methacholine","Phenylephrine"],"a":2,"ex":"A fall in diastolic pressure (vasodilation) plus a large rise in pulse pressure (increased stroke volume) is β-agonist (β2 dilation + β1 inotropy) — isoproterenol. Pure muscarinic agonists drop both pressures without a wide pulse pressure; phenylephrine raises diastolic pressure.","src":"Katzung & Trevor — Ch. 9 Q8","svg":"bpxy"},{"q":"Which of the following most resembles drug Y in the same figure (marked rise in diastolic pressure, little change in pulse pressure)?","o":["Bethanechol","Epinephrine","Isoproterenol","Methacholine","Phenylephrine"],"a":4,"ex":"A sharp rise in diastolic pressure with little widening of pulse pressure is selective α vasoconstriction without much β inotropy — phenylephrine. Epinephrine would raise pulse pressure more (β1).","src":"Katzung & Trevor — Ch. 9 Q9","svg":"bpxy"},{"q":"A new drug given subcutaneously to 25 volunteers produced the cardiovascular changes in the table. Which drug does the experimental agent most resemble?","o":["Atropine","Epinephrine","Isoproterenol","Phenylephrine","Physostigmine"],"a":1,"ex":"Systolic and diastolic BP both rose, pulse pressure widened (40 → 60 mm Hg), HR rose (not reflex bradycardia), and stroke volume rose — mixed α plus β agonist, i.e. epinephrine. Phenylephrine would slow the heart; isoproterenol would drop diastolic pressure.","src":"Katzung & Trevor — Ch. 9 Q10","table":{"headers":["Variable","Control","Peak drug effect"],"rows":[["Systolic BP (mm Hg)","116","156"],["Diastolic BP (mm Hg)","76","96"],["Cardiac output (L/min)","5.0","7.7"],["Heart rate (beats/min)","71.2","94.3"]]}}],

k10: [{"q":"A patient with threatened anaphylaxis is already taking an adrenoceptor blocker for hypertension. The emergency physician plans to give epinephrine. Which effect of epinephrine would be blocked by prazosin but not by metoprolol?","o":["Cardiac stimulation","Increase of cAMP in fat cells","Mydriasis","Relaxation of bronchial smooth muscle","Relaxation of the uterus"],"a":2,"ex":"Mydriasis from contraction of the radial iris muscle is α1-mediated, so prazosin blocks it and metoprolol (β1-selective) does not. The other listed effects are β-mediated.","src":"Katzung & Trevor — Ch. 10 Q1"},{"q":"Adverse effects that limit the use of adrenoceptor blockers include which one of the following?","o":["Bronchoconstriction (from α-blocking agents)","Acute heart failure exacerbation (from β blockers)","Impaired blood sugar response (with α blockers)","Increased intraocular pressure (with β blockers)","Sleep disturbances (from α-blocking drugs)"],"a":1,"ex":"Any β blocker can precipitate acute heart failure, even though some β blockers are later used in stable chronic HF. Bronchoconstriction, masked hypoglycaemia and sleep disturbance are β-blocker (not α-blocker) problems; β blockers lower, not raise, IOP.","src":"Katzung & Trevor — Ch. 10 Q2"},{"q":"Four new drugs (W, X, Y, Z) are given to anaesthetised animals pretreated with nothing, hexamethonium, atropine, or phenoxybenzamine. Drug W increased HR in the control, atropine, and phenoxybenzamine animals, but had no effect after hexamethonium. Drug W is probably similar to","o":["Acetylcholine","Edrophonium","Isoproterenol","Nicotine","Norepinephrine"],"a":3,"ex":"Tachycardia that vanishes after ganglion block is either a nicotinic effect or a reflex. Isoproterenol’s direct β1 tachycardia would persist after hexamethonium. Nicotine’s HR effect requires intact ganglia — matching drug W.","src":"Katzung & Trevor — Ch. 10 Q3"},{"q":"Drug X had the heart-rate effects in the table. Drug X is probably similar to","o":["Acetylcholine","Albuterol","Edrophonium","Isoproterenol","Norepinephrine"],"a":4,"ex":"Resting bradycardia that flips to tachycardia after hexamethonium, atropine or phenoxybenzamine means the bradycardia was reflex-vagal (baroreceptor response to α vasoconstriction). Direct β1 action is then unmasked. That combination is norepinephrine.","src":"Katzung & Trevor — Ch. 10 Q4","table":{"headers":["Animal receiving","HR response to drug X"],"rows":[["No pretreatment","↓"],["Hexamethonium","↑"],["Atropine","↑"],["Phenoxybenzamine","↑"]]}},{"q":"Drug Y had the heart-rate effects in the table (tachycardia in every pretreatment). Drug Y is probably similar to","o":["Acetylcholine","Edrophonium","Isoproterenol","Norepinephrine","Prazosin"],"a":2,"ex":"Tachycardia unaffected by ganglion block, atropine or α block is a direct β-agonist effect on the heart — isoproterenol.","src":"Katzung & Trevor — Ch. 10 Q5","table":{"headers":["Animal receiving","HR response to drug Y"],"rows":[["No pretreatment","↑"],["Hexamethonium","↑"],["Atropine","↑"],["Phenoxybenzamine","↑"]]}},{"q":"The heart-rate results for drug Z are shown in the graph. Drug Z is probably similar to","o":["Acetylcholine","Edrophonium","Isoproterenol","Norepinephrine","Pralidoxime"],"a":0,"ex":"Control tachycardia converted to bradycardia by hexamethonium, and both effects abolished by atropine, means the tachycardia was a baroreflex to muscarinic vasodilation, while a direct muscarinic action on the heart is unmasked when ganglia are blocked. That is acetylcholine.","src":"Katzung & Trevor — Ch. 10 Q6","svg":"hrz"},{"q":"When given to a patient, phentolamine blocks which one of the following?","o":["Bradycardia induced by phenylephrine","Bronchodilation induced by epinephrine","Increased cardiac contractile force induced by norepinephrine","Miosis induced by acetylcholine","Vasodilation induced by isoproterenol"],"a":0,"ex":"Phenylephrine raises BP via α1 vasoconstriction and causes reflex bradycardia. Phentolamine (α blocker) prevents the pressor effect, so the reflex bradycardia does not occur. The other effects are β- or muscarinic-mediated.","src":"Katzung & Trevor — Ch. 10 Q7"},{"q":"Your 75-year-old patient is to receive a β-blocking drug. For which of the following conditions are β-blocking drugs NOT indicated?","o":["Acute arrhythmias during surgery","Atherosclerotic angina pectoris (angina of effort)","Chronic heart failure","Hypertension","Hypoglycemia in diabetes"],"a":4,"ex":"β blockers are used for acute arrhythmias, effort angina, stable chronic HF and hypertension. They are not treatment for hypoglycaemia — they mask its warning signs (tremor, tachycardia) and are hazardous in insulin-treated diabetes.","src":"Katzung & Trevor — Ch. 10 Q8"},{"q":"A 56-year-old man has hypertension and biopsy-proven benign prostatic hyperplasia with urinary retention. Which drug would be the most appropriate initial therapy?","o":["Albuterol","Atenolol","Metoprolol","Prazosin","Timolol"],"a":3,"ex":"Both hypertension and BPH involve α1-mediated smooth-muscle contraction. Prazosin (the only α blocker in the list) relaxes vessels and bladder-neck/prostatic stroma, treating both. The others are β agonists or β blockers.","src":"Katzung & Trevor — Ch. 10 Q9"},{"q":"A new drug was given to an anaesthetised animal. A large dose of epinephrine (Epi) was given before and after the new agent (see traces of blood pressure and cardiac force). Which agent does the new drug most closely resemble?","o":["Atenolol","Atropine","Labetalol","Phenoxybenzamine","Propranolol"],"a":2,"ex":"After the new drug, epinephrine no longer raises diastolic/mean BP (α blocked) and no longer increases cardiac force (β blocked), and there is no epinephrine reversal (which would occur with a pure α blocker such as phenoxybenzamine). Combined α and β block = labetalol (or carvedilol).","src":"Katzung & Trevor — Ch. 10 Q10","svg":"epi"}]

b_pk: [{"q":"A 22-year-old woman suffering from asthma was prescribed albuterol by inhalation. Albuterol is a bronchodilating drug with a molecular weight of 239 daltons. Which of the following permeation processes most likely accounted for the transfer of the drug through the bronchial mucosa?","o":["Aqueous diffusion","Lipid diffusion","Facilitated diffusion","Endocytosis","Active transport"],"a":1,"ex":"Lipid diffusion is by far the most common way drugs cross cell membranes. Albuterol’s low molecular weight allows it to permeate bronchial mucosa by dissolving in and diffusing through the lipid bilayer. Aqueous diffusion, carriers, and endocytosis are not required for a small, membrane-permeable molecule.","src":"Babbini & Thomas — Pharmacokinetics Q1"},{"q":"A 34-year-old man on vacation in Mexico was admitted to the hospital because of vomiting, double vision, and muscular paralysis. The man reported that he had eaten some canned food from a local vendor the previous day. After a physical examination, a presumptive diagnosis of botulism was made. It is known that botulinum toxin causes paralysis by getting inside the axon terminals of motor nerves, where it inhibits the release of acetylcholine. Botulinum toxin is a protein with a molecular weight greater than 100,000 daltons. Which of the following permeation processes most likely accounts for the transfer of the toxin through the nerve cell membrane?","o":["Aqueous diffusion","Lipid diffusion","Facilitated diffusion","Endocytosis","Filtration"],"a":3,"ex":"Molecules this large cannot cross membranes by diffusion or filtration. Botulinum toxin is taken up by endocytosis: it binds the nerve-terminal surface, is engulfed in a vesicle, and is released into the cytosol after the vesicle membrane breaks down.","src":"Babbini & Thomas — Pharmacokinetics Q2"},{"q":"A 51-year-old woman suffering from hyperthyroidism was administered an oral solution of radioactive iodine to destroy her thyroid gland. Which of the following permeation processes most likely accounted for the transfer of the drug across the thyroid cell membrane?","o":["Active transport","Lipid diffusion","Facilitated diffusion","Endocytosis","Aqueous diffusion"],"a":0,"ex":"Thyroid follicular cells concentrate iodide 30- to 100-fold from plasma via the Na⁺-dependent NIS secondary active transporter. Radioactive iodine is chemically identical to dietary iodide and uses the same transporter.","src":"Babbini & Thomas — Pharmacokinetics Q3"},{"q":"A 12-year-old boy recently diagnosed with type 1 diabetes started a therapy with two daily subcutaneous administrations of insulin. Which of the following permeation processes best explains the absorption of insulin from the site of injection?","o":["Bulk flow transport","Lipid diffusion","Facilitated diffusion","Endocytosis","Active transport"],"a":0,"ex":"Subcutaneously injected insulin (MW ~6000 D) sits in extracellular fluid and must enter capillaries to be absorbed. Capillary fenestrae admit molecules up to ~30,000 D, so insulin is carried into the bloodstream by bulk flow (filtration/solvent drag). Lipid/aqueous diffusion through cell membranes cannot accommodate a protein of this size.","src":"Babbini & Thomas — Pharmacokinetics Q4"},{"q":"An 85-year-old man was recently admitted to a nursing facility. Diseases listed in his medical record on admission were depression with anxiety symptoms, atrial fibrillation, chronic obstructive pulmonary disease, and osteoarthritis. Medications taken orally by the patient included sertraline (base, pKa = 9.5), diazepam (base, pKa = 3.0), amiodarone (base, pKa = 7.4), theophylline (acid, pKa = 8.8), and ibuprofen (acid, pKa = 4.8). Shortly after administration, which of the following drugs was most likely concentrated inside the patient’s gastric cells?","o":["Sertraline","Diazepam","Amiodarone","Theophylline","Ibuprofen"],"a":4,"ex":"A weak acid is largely nonionized (lipid-soluble) when pKa > pH. In gastric lumen (pH < 2), ibuprofen (acid, pKa 4.8) is nonionized and enters mucosal cells; at intracellular pH ~7 it ionizes and is trapped, so it concentrates inside the cells. Bases remain ionized in the acid lumen and stay there. Theophylline (pKa 8.8) stays nonionized even inside the cell and therefore diffuses out rather than trapping.","src":"Babbini & Thomas — Pharmacokinetics Q5"},{"q":"A 17-year-old boy took a tablet of naproxen for a headache. Naproxen is a weak acid with a pKa of 5.2. What percentage of the drug was most likely water soluble in the patient’s plasma?","o":["1%","24%","50%","76%","99%","> 99%"],"a":5,"ex":"A weak acid is ionized (water-soluble) when pH > pKa. Plasma pH ≈ 7.4 versus pKa 5.2 is a difference of 2.2 units. When |pH − pKa| > 2, more than 99% of the drug is in the ionized form, so naproxen is >99% water-soluble in plasma.","src":"Babbini & Thomas — Pharmacokinetics Q6"},{"q":"A 69-year-old woman was brought to a local hospital emergency department by her son, who reported that his mother was found lethargic, disoriented, and combative a few hours earlier. Additional history revealed that she had ingested a large number of aspirin tablets in a suicide attempt. An appropriate therapy was instituted, which included the administration of sodium bicarbonate to increase the elimination of salicylate. Which of the following best explains the mechanism of this increased elimination?","o":["Decreased tubular active transport of salicylate","Decreased renal biotransformation of salicylate","Decreased bioavailability of salicylate","Urinary ion trapping of salicylate","Increased glomerular filtration of salicylate"],"a":3,"ex":"Alkalinizing the urine ionizes acidic salicylate, trapping the charged, polar form in the tubular lumen so it cannot be reabsorbed — urinary ion trapping. Salicylates are not actively transported, renal metabolism is negligible, and bicarbonate does not raise GFR.","src":"Babbini & Thomas — Pharmacokinetics Q7"},{"q":"A 63-year-old man recently diagnosed with hypertension started a therapy with hydrochlorothiazide, one tablet daily. Hydrochlorothiazide is an acidic drug with a pKa of about 9. Which of the following parts of the digestive tract most likely represents the main site of absorption of that drug?","o":["Oral mucosa","Stomach","Small intestine","Colon","Rectum"],"a":2,"ex":"Virtually all oral drugs are absorbed mainly in the small intestine because of its enormous surface area (~250 m², ~80% of the GI tract). Although HCTZ is more lipid-soluble in the acid stomach, surface area still dominates, so absorption occurs chiefly in the small intestine.","src":"Babbini & Thomas — Pharmacokinetics Q8"},{"q":"The pharmacokinetic properties of five new drugs (P, Q, R, S, and T) were studied in healthy volunteers. The same dose of each drug was administered intravenously (IV) and orally to the same subject on two separate occasions. Which of the following drugs most likely has the highest oral bioavailability?","o":["Drug P","Drug Q","Drug R","Drug S","Drug T"],"a":3,"ex":"Oral bioavailability F = AUC_oral / AUC_IV. Drug S has F = 100/120 ≈ 0.83, higher than P (0.083), Q (0.10), R (0.075), or T (0.50).","src":"Babbini & Thomas — Pharmacokinetics Q9","table":{"headers":["Drug","AUC oral (mg·h/L)","AUC IV (mg·h/L)"],"rows":[["P","50","600"],["Q","200","2000"],["R","30","400"],["S","100","120"],["T","45","90"]]}},{"q":"During a phase 1 clinical trial, four different oral dosage forms of the same dose of a drug were administered to a healthy volunteer on four separate occasions. The plasma concentration–time curves are plotted below. (Four oral curves W, X, Y, and Z; formulation W has the largest AUC.) Which of the following features best explains why formulation W produces the largest plasma concentration–time curve of the drug?","o":["Highest absorption through gut wall","Lowest first-pass effect","Lowest hepatic clearance","Highest volume of distribution","Lowest drug elimination"],"a":0,"ex":"The same drug and dose were given in four oral formulations, so only the fraction that dissolves and crosses the gut wall differs. Hepatic clearance of a given molecule is independent of dosage form; the largest AUC (formulation W) therefore reflects the highest gut-wall absorption.","src":"Babbini & Thomas — Pharmacokinetics Q10","svg":"pk10"},{"q":"A 26-year-old man became inebriated after drinking several glasses of alcoholic beverages at a party. Ethanol is a polar, nonionizable drug with an approximate molecular weight of 46 daltons. Which of the following permeation processes mediated the man’s intestinal absorption of ethanol?","o":["Aqueous diffusion","Bulk flow transport","Facilitated diffusion","Active transport","Endocytosis"],"a":0,"ex":"Ethanol is small, polar, and nonionizable, so it is freely water-soluble and crosses enterocyte membranes by aqueous diffusion through aquaporins. Carriers, bulk flow, and endocytosis are not required.","src":"Babbini & Thomas — Pharmacokinetics Q11"},{"q":"A 44-year-old man took a large dose of acetaminophen in aqueous solution to treat an excruciating headache. Two hours later, the pain was not diminished. Because acetaminophen should be effective in about 30 minutes after its oral administration, which of the following conditions most likely delayed the oral absorption of the drug in this patient?","o":["A moderate increase in intestinal peristalsis","The presence of strong pain","The administration of the drug in aqueous solution","A large volume of distribution of the drug","A very low clearance of the drug"],"a":1,"ex":"Severe pain (via sympathetic activation) slows gastric emptying. Gastric absorption is negligible, so delayed emptying postpones intestinal absorption. Increased peristalsis or an aqueous solution would speed absorption; Vd and clearance do not affect absorption.","src":"Babbini & Thomas — Pharmacokinetics Q12"},{"q":"A 22-year-old woman was admitted to the emergency department after a car accident. The woman had ex
