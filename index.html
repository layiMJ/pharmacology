b_adr: [{"q":"Match each adrenergic drug with the appropriate description: An α2-selective adrenoceptor agonist","o":["Albuterol","Apraclonidine","Cocaine","Dextroamphetamine","Dobutamine","Dopamine","Epinephrine","Isoproterenol","Methyldopa","Norepinephrine","Phenylephrine","Salmeterol"],"a":1,"ex":"Apraclonidine is a selective α2 agonist used topically in glaucoma to reduce aqueous humor production.","src":"Babbini & Thomas — Adrenergic Drugs Q1"},{"q":"Match each adrenergic drug with the appropriate description: A long-acting β2-selective adrenoceptor agonist","o":["Albuterol","Apraclonidine","Cocaine","Dextroamphetamine","Dobutamine","Dopamine","Epinephrine","Isoproterenol","Methyldopa","Norepinephrine","Phenylephrine","Salmeterol"],"a":11,"ex":"Salmeterol is a long-acting β2-selective agonist (LABA) used in persistent asthma; albuterol is the short-acting counterpart.","src":"Babbini & Thomas — Adrenergic Drugs Q2"},{"q":"Match each adrenergic drug with the appropriate description: An indirect-acting adrenergic agent sometimes used as an antihypertensive","o":["Albuterol","Apraclonidine","Cocaine","Dextroamphetamine","Dobutamine","Dopamine","Epinephrine","Isoproterenol","Methyldopa","Norepinephrine","Phenylephrine","Salmeterol"],"a":8,"ex":"Methyldopa is taken up into adrenergic terminals and converted to α-methylnorepinephrine, a central α2 agonist that lowers sympathetic outflow — an indirect-acting antihypertensive. Cocaine and amphetamine are also indirect but raise, not lower, blood pressure.","src":"Babbini & Thomas — Adrenergic Drugs Q3"},{"q":"Match each adrenergic drug with the appropriate description: A nonselective β-adrenoceptor agonist","o":["Albuterol","Apraclonidine","Cocaine","Dextroamphetamine","Dobutamine","Dopamine","Epinephrine","Isoproterenol","Methyldopa","Norepinephrine","Phenylephrine","Salmeterol"],"a":7,"ex":"Isoproterenol is the prototype nonselective β (β1 and β2) agonist. Dobutamine is relatively β1-selective; albuterol and salmeterol are β2-selective.","src":"Babbini & Thomas — Adrenergic Drugs Q4"},{"q":"Match each adrenergic drug with the appropriate description: A selective α1-adrenoceptor agonist","o":["Albuterol","Apraclonidine","Cocaine","Dextroamphetamine","Dobutamine","Dopamine","Epinephrine","Isoproterenol","Methyldopa","Norepinephrine","Phenylephrine","Salmeterol"],"a":10,"ex":"Phenylephrine is a selective α1 agonist used as a nasal decongestant, mydriatic, and vasopressor.","src":"Babbini & Thomas — Adrenergic Drugs Q5"},{"q":"A 75-year-old woman, hospitalized for breast cancer, was found unconscious in her bed by a nurse. A diagnosis of cardiac arrest was made, and cardiopulmonary resuscitation was started without success. The electrocardiogram showed that the patient was in asystole. An intracardiac injection of epinephrine was given. Which of the following postreceptor mechanisms most likely mediated the effect of epinephrine on cardiac contractility in this patient?","o":["Opening of ligand-gated K+ channels","Opening of ligand-gated Na+ channels","Activation of phospholipase C","Activation of phospholipase A2","Activation of adenylyl cyclase"],"a":4,"ex":"Cardiac effects of epinephrine are β1/β2, which stimulate Gs–adenylyl cyclase and raise cAMP. Ligand-gated K+ channels are M2; ligand-gated Na+ channels are nicotinic; PLC is α1/M3.","src":"Babbini & Thomas — Adrenergic Drugs Q6"},{"q":"A 35-year-old man was admitted to the hospital following a car accident, and a blood transfusion was started. A few minutes later, he complained of nausea and pruritus and developed dyspnea with audible wheezing. His skin was mottled and cold, heart rate was 120 bpm, and blood pressure fell to 80/40 mm Hg. An intramuscular injection of epinephrine was given. Which of the following actions of the drug most likely contributed to its therapeutic efficacy in this patient?","o":["Increased glycogenolysis","β2 receptor–mediated vasodilation","Stimulation of platelet aggregation","Inhibition of insulin secretion","Inhibition of mast cell degranulation","Stimulation of eicosanoid biosynthesis"],"a":4,"ex":"This is acute anaphylaxis (transfusion reaction). A key useful action of epinephrine is β2-mediated stabilization of mast cells, which stops further mediator release. Glycogenolysis, insulin suppression, and platelet aggregation do not treat shock or bronchospasm; β2 vasodilation would worsen hypotension.","src":"Babbini & Thomas — Adrenergic Drugs Q7"},{"q":"A 34-year-old woman was at the dentist for an endodontic procedure. Before starting the procedure, the dentist injected a solution of lidocaine plus epinephrine near the tooth in order to provide local anesthesia. The epinephrine-induced increased duration of the lidocaine effect was most likely mediated by the activation of which of the following adrenoceptors?","o":["β1","β2","β3","α1","α2"],"a":3,"ex":"Epinephrine prolongs local anesthesia by α1-mediated vasoconstriction, which keeps the anesthetic at the injection site and slows systemic absorption.","src":"Babbini & Thomas — Adrenergic Drugs Q8"},{"q":"A 51-year-old man was admitted to the coronary care unit with a diagnosis of myocardial infarction. Two hours later, he developed ventricular fibrillation and was defibrillated immediately, but without success. Cardiopulmonary resuscitation (CPR) was started, and two additional shocks were given at a higher energy, but the patient remained unresponsive. At this time a bolus of intravenous epinephrine was given, while continuing the CPR. Which of the following receptor actions of the drug best describes the rationale for adding epinephrine in this setting?","o":["α1 receptor–mediated vasoconstriction","β2 receptor–mediated vasodilation","β2 receptor–mediated increase in cardiac contractility","β1 receptor–mediated increase in renin secretion","β2 receptor–mediated bronchodilation"],"a":0,"ex":"During CPR, epinephrine’s main benefit is α1 vasoconstriction: it raises aortic diastolic pressure, prevents arterial collapse, and redistributes the limited output toward brain and coronaries. In arrest there is no arteriolar tone, so β2 vasodilation does not occur. β1 coarsening of VF and stimulation of asystolic contraction are secondary.","src":"Babbini & Thomas — Adrenergic Drugs Q9"},{"q":"A 60-year-old man hospitalized following a myocardial infarction showed a pronounced decrease in blood pressure and urine output 2 hours after the admission. A diagnosis of cardiogenic shock was made, and an emergency therapy was started. An adrenergic drug with both direct and indirect actions was given by intravenous infusion. Which of the following drugs fitting this profile would be appropriate for the patient?","o":["Dopamine","Norepinephrine","Isoproterenol","Dobutamine","Phenylephrine"],"a":0,"ex":"Dopamine is mixed-acting: it directly activates D, β, and α receptors and also releases neuronal norepinephrine. The other listed agents are direct agonists only. Low-to-intermediate-dose dopamine is used in cardiogenic shock for inotropy plus renal vasodilation.","src":"Babbini & Thomas — Adrenergic Drugs Q10"},{"q":"A new autonomic drug that does not enter the brain was given intravenously to healthy volunteers in a phase 1 clinical trial. Which of the following drugs does the new agent most resemble?","o":["Dobutamine","Epinephrine","Isoproterenol","Norepinephrine","Phenylephrine","Propranolol"],"a":3,"ex":"Parallel rise in systolic and diastolic BP with reflex bradycardia means a vasoconstrictor without β2 dilation (NE or phenylephrine). Stroke volume rose substantially (CO/HR: 5.5/70 → 5.1/51, ~79 → 100 mL) and ejection fraction rose (60 → 75%), so contractility increased — that is β1 activity, i.e. norepinephrine, not phenylephrine. Dobutamine, epinephrine, and isoproterenol would raise CO; propranolol would lower EF.","src":"Babbini & Thomas — Adrenergic Drugs Q11","table":{"headers":["Parameter","Control","Peak drug effect"],"rows":[["Systolic BP (mm Hg)","125","145"],["Diastolic BP (mm Hg)","75","95"],["Heart rate (bpm)","70","51"],["Cardiac output (L/min)","5.5","5.1"],["Ejection fraction (%)","60","75"]]}},{"q":"A 54-year-old man was about to receive local anesthesia before a tooth extraction. One year ago the patient underwent an episode of ventricular fibrillation that was successfully treated with electrical cardioversion. The dentist decided to avoid a local anesthesia with epinephrine because the patient was especially at risk of which of the following drug-induced adverse effects?","o":["Cerebral hemorrhage","Nausea and vomiting","Pulmonary edema","Ventricular tachycardia","Hyperglycemia"],"a":3,"ex":"Epinephrine can provoke ventricular arrhythmias. A prior episode of VF puts this patient at high risk of ventricular tachycardia/fibrillation if epinephrine is added to the local anesthetic. The other adverse effects are possible but he has no specific risk factors for them.","src":"Babbini & Thomas — Adrenergic Drugs Q12"},{"q":"A 43-year-old man was brought to the emergency room following a car accident. He received an infiltration of a local anesthetic around a skin wound in preparation for suturing. A few minutes later, the man appeared flushed and complained of difficulty breathing. Blood pressure was 90/50 mm Hg, heart rate 92 bpm. Chest auscultation revealed restrictive air flow and stridor. An injection of epinephrine was given. Which of the following actions most likely contributed to the therapeutic efficacy of the drug in the patient’s disorder?","o":["Antagonism of histamine effects on the heart","Antagonism of bradykinin effects on skeletal muscle vessels","Antagonism of leukotriene effects on the respiratory system","Activation of α1 receptors on bronchial muscles","Activation of β2 receptors on lung vessels","Activation of α2 receptors on platelets"],"a":2,"ex":"This is anaphylaxis to the local anesthetic. Leukotrienes are the dominant bronchoconstrictors; epinephrine is a functional antagonist via β2-mediated bronchodilation (and it also inhibits further mediator release). It does not usefully antagonize histamine on the heart or bradykinin on skeletal-muscle vessels; bronchial muscle has no α1 receptors; pulmonary β2 vasodilation would worsen V/Q matching.","src":"Babbini & Thomas — Adrenergic Drugs Q13"},{"q":"A 16-year-old girl was treated topically with eye drops during a routine ophthalmoscopic examination. After 15 minutes, the ophthalmologist measured an increase in pupillary diameter with negligible changes in lens curvature and intraocular pressure. Which of the following drugs was most likely administered to the patient?","o":["Phenylephrine","Timolol","Acetylcholine","Apraclonidine","Epinephrine"],"a":0,"ex":"Selective α1 agonists (phenylephrine) dilate the pupil by contracting the radial iris muscle and do not activate M3, α2, or β2, so accommodation and IOP are essentially unchanged. Timolol, apraclonidine, and epinephrine all alter IOP; acetylcholine would miosis and increase lens curvature.","src":"Babbini & Thomas — Adrenergic Drugs Q14"},{"q":"A 15-year-old boy suffering from asthma routinely self-administered albuterol through a metered-dose inhaler. Which of the following actions most likely contributed to the therapeutic efficacy of the drug in the patient’s disorder?","o":["Increased microvascular permeability","Decreased bronchial secretions","Release of histamine from mast cells","Increased residual respiratory volume","Increased mucociliary clearance"],"a":4,"ex":"β2 agonists increase mucociliary clearance, decrease (not increase) microvascular permeability, increase (not decrease) bronchial secretions of useful watery mucus, and prevent (not cause) mast-cell histamine release. Residual volume falls, not rises, in treated asthmatics.","src":"Babbini & Thomas — Adrenergic Drugs Q15"},{"q":"A new autonomic drug that does not enter the brain was given intravenously to healthy volunteers in a phase 1 clinical trial. Which of the following drugs does the new agent most resemble?","o":["Dobutamine","Epinephrine","Isoproterenol","Norepinephrine","Phenylephrine"],"a":4,"ex":"Parallel rise in systolic and diastolic BP with reflex bradycardia indicates a pure vasoconstrictor. Stroke volume rose only slightly (5/70 = 71 mL → 4.5/58 = 78 mL) and ejection fraction was unchanged, so contractility did not increase — phenylephrine (α1 only), not norepinephrine (which has β1 inotropy and would raise EF).","src":"Babbini & Thomas — Adrenergic Drugs Q16","table":{"headers":["Parameter","Control","Peak drug effect"],"rows":[["Systolic BP (mm Hg)","125","145"],["Diastolic BP (mm Hg)","75","95"],["Heart rate (bpm)","70","58"],["Cardiac output (L/min)","5","4.5"],["Ejection fraction (%)","60","60"]]}},{"q":"A 72-year-old man suffering from prostatic hyperplasia complained to his physician that he had increased difficulty and pain in voiding his bladder. The patient had been taking an over-the-counter oral nasal decongestant for 3 days because of an annoying common cold. Which of the following drugs most likely contributed to his dysuria?","o":["Albuterol","Phenylephrine","Clonidine","Norepinephrine","Dopamine","Salmeterol"],"a":1,"ex":"Oral phenylephrine is a common OTC decongestant. Systemic α1 activation contracts the bladder internal sphincter and can precipitate urinary retention in men with prostatic hyperplasia. The other listed drugs are not used as nasal decongestants.","src":"Babbini & Thomas — Adrenergic Drugs Q17"},{"q":"A 65-year-old woman suffering from open-angle glaucoma was prescribed a treatment regimen that included apraclonidine eye drops. Which of the following actions on aqueous humor most likely mediated the therapeutic effect of the drug in the patient’s disease?","o":["Increased outflow through the Schlemm canal","Decreased production by the trabecular meshwork","Increased outflow through the uveoscleral route","Decreased production by eye vessel constriction","Decreased production by the ciliary epithelium"],"a":4,"ex":"Apraclonidine is a selective α2 agonist; α2 receptors on ciliary epithelium decrease aqueous production. (β receptors on the same cells increase production, which is why topical β-blockers also work.) The trabecular meshwork does not produce aqueous humor.","src":"Babbini & Thomas — Adrenergic Drugs Q18"},{"q":"A 57-year-old homeless alcoholic man was brought to the hospital by the police, who had found him lying on a sidewalk. Physical examination showed clear signs of alcohol withdrawal. Therapy was started that included clonidine. Which of the following best explains the most likely mechanism of action of clonidine in this patient?","o":["Decreased central sympathetic outflow","Activation of peripheral α1 receptors","Decreased central parasympathetic outflow","Activation of peripheral α2 receptors","Blockade of α receptors on the tractus solitarius","Blockade of α receptors on the locus ceruleus"],"a":0,"ex":"Alcohol (and opioid) withdrawal features a surge of locus ceruleus firing. Clonidine activates central presynaptic α2 receptors, reducing sympathetic outflow and damping that surge. Peripheral α effects appear only at high doses; clonidine increases, not decreases, central parasympathetic tone and activates rather than blocks α2 receptors.","src":"Babbini & Thomas — Adrenergic Drugs Q19"},{"q":"A 7-year-old girl recently diagnosed with persistent asthma started treatment with inhaled albuterol “as needed.” Which of the following adverse effects was most likely to occur during the therapy?","o":["Atrioventricular block","Restlessness","Sleepiness","Postural hypotension","Ventricular tachycardia"],"a":1,"ex":"Restlessness and anxiety occur in 10–20% of children on inhaled β2 agonists; CNS excitation (even seizures at toxic doses) is typical. β2 activation facilitates AV conduction (block is unlikely), causes insomnia rather than sleepiness, and rarely produces postural hypotension or VT.","src":"Babbini & Thomas — Adrenergic Drugs Q20"},{"q":"A 52-year-old woman suffering from severe bronchial asthma was recently diagnosed with open-angle glaucoma. An appropriate local therapy was prescribed. Which of the following drugs most likely would be included in the glaucoma treatment of this patient?","o":["Carbachol","Epinephrine","Propranolol","Pilocarpine","Timolol"],"a":1,"ex":"Topical epinephrine lowers IOP (α2-mediated fall in aqueous production plus increased uveoscleral outflow) and does not provoke bronchospasm. Carbachol, pilocarpine, propranolol, and timolol can be absorbed via the nasolacrimal system and are contraindicated in severe asthma.","src":"Babbini & Thomas — Adrenergic Drugs Q21"},{"q":"A 33-year-old man was brought to the emergency room after a car accident. Upon admission, the patient was lucid but completely paralyzed, with loss of all sensation and reflex activity below the thorax. Vital signs were blood pressure 80/40 mm Hg, heart rate 42 bpm, respirations 36/min. A preliminary diagnosis of spinal shock, due to spinal cord injury, was made, and an intravenous infusion of an appropriate drug was started. Which of the following drugs was most likely administered?","o":["Isoproterenol","Clonidine","Norepinephrine","Albuterol","Salmeterol"],"a":2,"ex":"Neurogenic (distributive) shock is loss of sympathetic arteriolar tone. An α1 agonist such as norepinephrine restores vascular resistance. Isoproterenol, clonidine, albuterol, and salmeterol lack useful α1 vasoconstriction and would not raise TPR.","src":"Babbini & Thomas — Adrenergic Drugs Q22"},{"q":"The cardiovascular effects of a new autonomic drug that does not cross the blood–brain barrier were evaluated in a healthy male volunteer. The drug was administered intravenously. Which of the following drugs does the new agent most resemble?","o":["Albuterol","Cocaine","Isoproterenol","Norepinephrine","Phenylephrine"],"a":2,"ex":"Mean BP fell despite a rise in CO, so TPR fell. EF rose (60 → 80%), so contractility rose. That combination is a nonselective β agonist (β1 inotropy + β2 vasodilation) — isoproterenol. Albuterol (β2-selective) would drop TPR and cause reflex tachycardia but would barely change EF. NE and phenylephrine raise BP; cocaine is a mixed indirect pressor.","src":"Babbini & Thomas — Adrenergic Drugs Q23","table":{"headers":["Parameter","Control","Peak drug effect"],"rows":[["Mean BP (mm Hg)","90","80"],["Heart rate (bpm)","70","110"],["Cardiac output (L/min)","5.5","6.5"],["Ejection fraction (%)","60","80"]]}},{"q":"A 51-year-old man received an intravenous infusion of isoproterenol at the conclusion of heart transplant surgery. Which of the following actions most likely occurred a few minutes after the start of the infusion?","o":["Stimulation of renin secretion","Inhibition of insulin release","Increased total peripheral resistance","Reflex tachycardia","Stimulation of platelet aggregation"],"a":0,"ex":"Isoproterenol activates all β receptors. Juxtaglomerular β1 stimulation releases renin. Pancreatic β2 actually increases insulin; vascular β2 decreases (not increases) TPR; platelet aggregation is α2 (isoproterenol has no α activity). The transplanted heart is denervated, so reflex tachycardia cannot occur — only direct β tachycardia.","src":"Babbini & Thomas — Adrenergic Drugs Q24"},{"q":"A 34-year-old man was brought to the emergency room with a gunshot wound to the abdomen. External blood loss and internal hemorrhage were significant, and he was anxious and disoriented. On examination, his skin was pale and cool, pulse was thready at 130 bpm, blood pressure was 80/70 mm Hg, and respiration was shallow with a rate of 30 breaths/min. The first appropriate therapeutic intervention in this patient would have been an intravenous infusion of which of the following agents?","o":["Norepinephrine","Epinephrine","Dobutamine","Isotonic saline","Dopamine","Isoproterenol"],"a":3,"ex":"This is hypovolemic (hemorrhagic) shock. The first intervention is volume: isotonic crystalloid (or colloid). Pressors are for distributive or cardiogenic shock once filling is adequate; isoproterenol is contraindicated in shock.","src":"Babbini & Thomas — Adrenergic Drugs Q25"},{"q":"A 53-year-old man was brought to the emergency department after suffering crushing substernal pain for the past hour. Vital signs on admission were blood pressure 88/50, pulse 115 bpm, respirations 30/min. Further exams led to the diagnosis of cardiogenic shock due to myocardial infarction, and therapy was started that included an intravenous infusion of an appropriate drug. Which of the following molecular actions most likely mediated the therapeutic effectiveness of the drug in this patient?","o":["Activation of phospholipase A2","Increased synthesis of inositol triphosphate (IP3) and diacylglycerol (DAG)","Increased synthesis of cyclic adenosine monophosphate (cAMP)","Increased synthesis of cyclic guanosine monophosphate (cGMP)","Opening of ligand-gated Na+ channels","Opening of ligand-gated K+ channels"],"a":2,"ex":"Cardiogenic shock is treated with a rapid inotrope — dobutamine or dopamine — whose benefit is β1-mediated increase in cAMP (and thus contractility/cardiac output).","src":"Babbini & Thomas — Adrenergic Drugs Q26"},{"q":"A 25-year-old healthy male volunteer received an intravenous infusion of a new drug in a phase 1 clinical trial. It was found that the drug causes an increase in cardiac contractility, a slight increase in heart rate, and no major changes or a decrease in systemic vascular resistance. Which of the following drugs does the new agent most resemble?","o":["Phenylephrine","Norepinephrine","Isoproterenol","Epinephrine","Dobutamine"],"a":4,"ex":"Dobutamine is a relatively selective β1 agonist: it raises contractility while heart rate rises only modestly, and net TPR is unchanged or slightly decreased (weak β2 dilation balancing weak α1 constriction). Phenylephrine and NE raise TPR; isoproterenol and epinephrine cause larger HR and TPR swings.","src":"Babbini & Thomas — Adrenergic Drugs Q27"},{"q":"A 58-year-old man became confused and disoriented 5 days after he underwent surgery to remove necrotic bowel tissue. Physical findings were high fever (103°F, 39.4°C), blood pressure 90/50 mm Hg, pulse 130 bpm, respirations 30/min. Pertinent lab values were PaCO2 30 mm Hg (normal 33–45), HCO3− 18 mEq/L (normal 22–28), serum pH 7.31, WBC 22,000 cells/mm³. Arterial and pulmonary artery catheters were inserted, revealing a cardiac output of 6 L/min and a pronounced decrease of systemic vascular resistance. Fluid therapy was initiated, but 1 hour later mean blood pressure was still 60 mm Hg. An intravenous infusion of an appropriate drug was started. Which of the following drugs was most likely administered?","o":["Isoproterenol","Epinephrine","Norepinephrine","Albuterol","Clonidine"],"a":2,"ex":"Fever, leukocytosis, hypotension, high CO, and very low SVR after bowel surgery = septic (vasodilatory) shock with lactic acidosis. After fluids, a vasopressor is needed; when SVR is profoundly low, norepinephrine is superior to dopamine. Isoproterenol, epinephrine (net β2 dilation at some doses), albuterol, and clonidine would further lower SVR.","src":"Babbini & Thomas — Adrenergic Drugs Q28"},{"q":"A 13-year-old girl with mild persistent allergic asthma started a treatment that included an inhaled bronchodilator “as needed.” A drug with which of the following mechanisms of action would be most appropriate for this patient’s inhaler?","o":["Blockade of α1 adrenoceptors","Blockade of M2 cholinergic receptors","Activation of β2 adrenoceptors","Activation of H1 histamine receptors","Activation of leukotriene receptors","Blockade of Nm cholinergic receptors"],"a":2,"ex":"All asthmatics should have a short-acting β2 agonist (e.g. albuterol) for rescue. Antimuscarinics (ipratropium) are less effective as monotherapy; H1 or leukotriene-receptor activation and α1 or Nm blockade would not bronchodilate usefully.","src":"Babbini & Thomas — Adrenergic Drugs Q29"},{"q":"A 42-year-old woman complained to her physician of tremors, muscle cramping, palpitations, and anxiety. The woman, who was recently diagnosed with severe bronchial asthma, had started an appropriate therapy 2 weeks earlier. Which of the following drugs most likely caused the patient’s symptoms?","o":["Isoproterenol","Salmeterol","Propranolol","Dobutamine","Prazosin"],"a":1,"ex":"Inhaled long-acting β2 agonists (salmeterol) are first-line add-on therapy in severe asthma. Tremor (up to 40%), anxiety (~20%), palpitations (~10%), and cramps from β2-driven hypokalemia (Na/K-ATPase) are classic. Isoproterenol can cause the same picture but is rarely used; propranolol, dobutamine, and prazosin are not asthma drugs (and propranolol is contraindicated).","src":"Babbini & Thomas — Adrenergic Drugs Q30"},{"q":"A 16-year-old male snorted cocaine for the first time at a party. A few minutes later he felt euphoric, and friends noted that his pupils were dilated. Which of the following molecular actions most likely mediated the mydriasis?","o":["Inhibition of monoamine oxidase A","Blockade of α2 receptors in sympathetic terminals","Inhibition of norepinephrine reuptake into sympathetic terminals","Stimulation of epinephrine release from adrenal medulla","Stimulation of norepinephrine release from sympathetic terminals"],"a":2,"ex":"Cocaine blocks NET (neuronal reuptake of NE) in both CNS and periphery. Extra synaptic NE on iris α1 receptors produces mydriasis. Cocaine is not an MAO inhibitor, α2 blocker, or vesicular releaser (those last two are closer to amphetamine).","src":"Babbini & Thomas — Adrenergic Drugs Q31"},{"q":"A 41-year-old man presented to the clinic complaining of an impairment in his ability to voluntarily raise his left eyelid. Physical examination showed miosis, ptosis, flushed facial skin, and loss of sweating over the left side of the face. Further exams led to the diagnosis of Horner syndrome. To determine the site of the autonomic lesion, a hydroxyamphetamine solution was instilled into the conjunctival sac of the left eye. A few minutes later, mydriasis was observed. The physician correctly concluded that there was a localized lesion in which of the following nervous structures?","o":["Preganglionic sympathetic nerves innervating the face","Postganglionic sympathetic nerves innervating the face","Preganglionic parasympathetic nerves innervating the face","Postganglionic parasympathetic nerves innervating the face"],"a":0,"ex":"Horner syndrome is interruption of ipsilateral cervical sympathetics (ptosis, miosis, anhidrosis, vasodilation). Hydroxyamphetamine releases NE from intact postganglionic terminals; the resulting mydriasis proves those terminals are intact, so the lesion is preganglionic. A postganglionic lesion would give little or no mydriasis. Parasympathetic lesions produce a different picture (mydriasis without ptosis/anhidrosis).","src":"Babbini & Thomas — Adrenergic Drugs Q32"},{"q":"A 37-year-old man was admitted to the hospital after a work accident. An admitting diagnosis of spinal cord injury was made, and emergency therapy was initiated, which included the intravenous infusion of a low dose of dopamine. Which of the following effects of the drug were most likely mediated by the activation of dopamine D1 receptors?","o":["Increased diuresis","Nausea and vomiting","Constriction of skin vessels","Increased heart rate","Increased stroke volume"],"a":0,"ex":"Low-dose dopamine dilates renal vessels and inhibits proximal Na+ reabsorption via D1 receptors, increasing diuresis. Nausea/vomiting is high-dose D2 (area postrema); cutaneous vasoconstriction is α; tachycardia and increased stroke volume are β1 (intermediate dose).","src":"Babbini & Thomas — Adrenergic Drugs Q33"},{"q":"A 46-year-old woman admitted to the hospital with the presumptive diagnosis of septic shock was given emergency therapy. The treatment included an adrenergic drug that can decrease total peripheral resistance at lower doses and can increase it at higher doses. Which of the following drugs was most likely administered?","o":["Norepinephrine","Albuterol","Isoproterenol","Dobutamine","Phenylephrine","Dopamine"],"a":5,"ex":"Low-dose dopamine lowers TPR via D1 (renal/mesenteric) dilation; high-dose dopamine activates α receptors and releases NE, so vasoconstriction overrides and TPR rises. NE and phenylephrine only constrict; albuterol and isoproterenol only dilate; dobutamine has negligible net TPR effect.","src":"Babbini & Thomas — Adrenergic Drugs Q34"},{"q":"A 51-year-old patient suffering from postural hypotension was admitted to the hospital for evaluation. A tyramine infusion did not raise the blood pressure, whereas a very small dose of norepinephrine caused a large, transient elevation of blood pressure. These results would suggest a degeneration of which of the following nervous structures?","o":["Postganglionic sympathetic neurons","Preganglionic sympathetic neurons","Postganglionic parasympathetic neurons","Preganglionic parasympathetic neurons","Medulla oblongata"],"a":0,"ex":"Parenteral tyramine acts by releasing stored neuronal NE. No pressor response means those stores are gone (degenerated postganglionic sympathetic terminals — pure autonomic failure). Supersensitivity to injected NE (denervation upregulation) confirms the same lesion. A preganglionic or central lesion would leave postganglionic terminals intact, so tyramine would still raise BP.","src":"Babbini & Thomas — Adrenergic Drugs Q35"},{"q":"A 47-year-old woman suffering from postmenopausal hot flashes tried different drugs with little success. Her physician decided to try another drug that decreases the release of norepinephrine from adrenergic nerve terminals. Which of the following drugs was most likely prescribed?","o":["Prazosin","Clonidine","Albuterol","Isoproterenol","Labetalol"],"a":1,"ex":"Clonidine activates presynaptic α2 receptors, reducing NE release from adrenergic terminals, and is sometimes used (second-line) for hot flashes. The other listed drugs do not activate α2 receptors.","src":"Babbini & Thomas — Adrenergic Drugs Q36"},{"q":"A 48-year-old woman suffering from lupus erythematosus was admitted to the hospital because of severe muscle weakness. Pertinent laboratory data on admission were K+ 7.9 mEq/L, creatinine 5 mg/dL, BUN 60 mg/dL. An electrocardiogram (ECG) revealed increased PR intervals and widened QRS complexes. Insulin with dextrose was given intravenously to reduce the high potassium level. Another drug was also given because it has an additive effect with insulin in decreasing serum potassium. Which of the following drugs was most likely administered?","o":["Phenylephrine","Albuterol","Clonidine","Isoproterenol","Epinephrine","Dobutamine"],"a":1,"ex":"Renal failure with ECG changes needs emergency K+ shift into cells. Insulin and β2 agonists both drive K+ intracellularly via Na/K-ATPase; albuterol is the β2 agonist used for this. Phenylephrine, clonidine, and dobutamine do not lower K+; isoproterenol and epinephrine can, but their other actions make them unsuitable.","src":"Babbini & Thomas — Adrenergic Drugs Q37"},{"q":"A 35-year-old woman was admitted to the emergency department because of dyspnea, generalized itching, and swelling of the lips, eyelids, and tongue. The symptoms started a few minutes after an intramuscular (IM) injection of a vaccine. An appropriate therapy was started, which included an IM injection of epinephrine. Which of the following expected effects of the drug were most likely mediated by activation of β2 adrenoceptors?","o":["Inhibition of insulin release","Skin vasoconstriction","Mydriasis","Contraction of the bladder sphincter","Increased glycogenolysis"],"a":4,"ex":"β2 → cAMP → protein kinase A → glycogen breakdown. Inhibition of insulin release is α2; cutaneous vasoconstriction, mydriasis, and internal-sphincter contraction are α1.","src":"Babbini & Thomas — Adrenergic Drugs Q38"},{"q":"An intravenous injection of drug X was given to a laboratory animal before and after the administration of atropine, and the heart rate was recorded. The figure shows that drug X alone decreased heart rate; after atropine pretreatment, the same dose of drug X increased heart rate. Which of the following drugs was most likely drug X?","o":["Epinephrine","Norepinephrine","Prazosin","Albuterol","Isoproterenol","Dobutamine"],"a":1,"ex":"Bradycardia that reverses to tachycardia after atropine is reflex-vagal (baroreceptor response to α1 vasoconstriction). Norepinephrine is the listed drug whose reflex vagal slowing outruns its direct β1 tachycardia; atropine unmasks that direct tachycardia. Epinephrine, isoproterenol, albuterol, and dobutamine raise HR even before atropine; prazosin does not raise it.","src":"Babbini & Thomas — Adrenergic Drugs Q39"},{"q":"A 43-year-old woman was in the emergency department for the treatment of shock due to spinal trauma. Despite fluid therapy, she was still hypotensive (80/50 mm Hg) and tachycardic (125 bpm). An intravenous infusion of norepinephrine was started, and a few minutes later the blood pressure was 120/85 mm Hg, and the heart rate decreased to 85 bpm. Which of the following actions best explains the drug-induced decrease of heart rate in this patient?","o":["Activation of cardiac β2 receptors","Decreased firing rate of vagal neurons","Increased firing rate of aortic baroreceptors","Activation of cardiac α2 autoreceptors","Decreased firing rate of carotid chemoreceptors"],"a":2,"ex":"NE raises BP via α1 vasoconstriction. Carotid-sinus and aortic-arch baroreceptors fire more, the NTS drives vagal motor neurons, and if that vagal burst is strong enough it overcomes NE’s direct β1 tachycardia — reflex bradycardia. Cardiac β2 activation or reduced vagal firing would raise HR; α2 autoreceptors are not the main mechanism; chemoreceptor unloading would also raise, not lower, HR.","src":"Babbini & Thomas — Adrenergic Drugs Q40"}],

b_antiadr: [{"q":"This drug is a partial agonist at β1 and β2 receptors.","o":["Atenolol","Esmolol","Metyrosine","Phenoxybenzamine","Pindolol","Propranolol","Sotalol","Tamsulosin","Timolol"],"a":4,"ex":"Pindolol is a nonselective β-blocker with intrinsic sympathomimetic activity: it is a partial agonist at both β1 and β2 receptors.","src":"Babbini & Thomas — Antiadrenergic Drugs Q1"},{"q":"This drug is a selective β1 antagonist frequently used for the chronic treatment of atrial fibrillation.","o":["Atenolol","Esmolol","Metyrosine","Phenoxybenzamine","Pindolol","Propranolol","Sotalol","Tamsulosin","Timolol"],"a":0,"ex":"Atenolol is a cardioselective β1 antagonist used chronically for rate control in atrial fibrillation. Esmolol is also β1-selective but is ultrashort-acting and given intravenously, not for chronic oral therapy.","src":"Babbini & Thomas — Antiadrenergic Drugs Q2"},{"q":"This drug is a β-blocker that can also block potassium channels.","o":["Atenolol","Esmolol","Metyrosine","Phenoxybenzamine","Pindolol","Propranolol","Sotalol","Tamsulosin","Timolol"],"a":6,"ex":"Sotalol is a nonselective β-blocker that also blocks cardiac potassium channels (class III antiarrhythmic action), prolonging the action potential.","src":"Babbini & Thomas — Antiadrenergic Drugs Q3"},{"q":"This drug is frequently used in the treatment of prostatic hyperplasia.","o":["Atenolol","Esmolol","Metyrosine","Phenoxybenzamine","Pindolol","Propranolol","Sotalol","Tamsulosin","Timolol"],"a":7,"ex":"Tamsulosin is a selective α1A antagonist that relaxes prostatic and bladder-neck smooth muscle, improving urine flow in benign prostatic hyperplasia.","src":"Babbini & Thomas — Antiadrenergic Drugs Q4"},{"q":"This drug is sometimes given in cardiovascular emergencies by intravenous infusion because of its extremely short half-life.","o":["Atenolol","Esmolol","Metyrosine","Phenoxybenzamine","Pindolol","Propranolol","Sotalol","Tamsulosin","Timolol"],"a":1,"ex":"Esmolol is a β1-selective antagonist hydrolyzed by erythrocyte esterases. Its ultrashort half-life (~9 minutes) makes it suitable for intravenous infusion in cardiovascular emergencies.","src":"Babbini & Thomas — Antiadrenergic Drugs Q5"},{"q":"A 25-year-old man complained to his physician of painful erection and impaired ejaculation during intercourse. Three weeks earlier, he had been diagnosed with Raynaud disease and had started an appropriate therapy. A drug with which of the following mechanisms of action most likely caused the patient’s symptoms?","o":["β2-receptor blockade","M3-receptor activation","β1-receptor blockade","α2-receptor activation","α1-receptor blockade","Nm-receptor activation"],"a":4,"ex":"Vasospasm in Raynaud disease is treated with a vasodilator, often an α1 antagonist such as prazosin. During ejaculation, sympathetic activation of α1 receptors on the vas deferens and prostate capsule propels semen into the urethra. Blocking those α1 receptors therefore impairs ejaculation (and can cause painful erection/priapism-like symptoms).","src":"Babbini & Thomas — Antiadrenergic Drugs Q6"},{"q":"Phenoxybenzamine was given to rats during a laboratory experiment. Which of the following sets of effects most likely occurred after treatment?","o":["↓ firing of carotid baroreceptors; ↑ cardiac contractility; ↑ cardiac rate","↑ firing of carotid baroreceptors; ↑ cardiac contractility; ↓ cardiac rate","↑ firing of carotid baroreceptors; ↓ cardiac contractility; ↑ cardiac rate","↓ firing of carotid baroreceptors; ↑ cardiac contractility; ↓ cardiac rate","↓ firing of carotid baroreceptors; ↓ cardiac contractility; ↓ cardiac rate"],"a":0,"ex":"Phenoxybenzamine is a nonselective α-adrenergic blocker. α1 blockade causes peripheral vasodilation and a fall in blood pressure, which decreases carotid baroreceptor firing. Reduced baroreceptor discharge withdraws vagal tone and increases sympathetic outflow to the heart, so cardiac contractility and heart rate rise.","src":"Babbini & Thomas — Antiadrenergic Drugs Q7"},{"q":"A 51-year-old man, recently diagnosed with pheochromocytoma, was scheduled for surgery to remove the tumor. One week before surgery, phenoxybenzamine was prescribed. Which of the following actions most likely mediated the therapeutic effect of the drug in the patient’s disease?","o":["Decreased peripheral vascular resistance","Increased cardiac output","Decreased epinephrine release from the adrenal medulla","Increased heart rate","Decreased firing from the vasomotor center"],"a":0,"ex":"Phenoxybenzamine is a nonselective α antagonist used preoperatively (and in inoperable/metastatic cases) in pheochromocytoma. By blocking α1 receptors it decreases peripheral vascular resistance and thereby counters the tumor’s hypertension. Increased cardiac output and heart rate are unwanted reflex effects. α2 blockade actually increases, rather than decreases, adrenal epinephrine release, and an α2 antagonist would increase (not decrease) vasomotor-center firing.","src":"Babbini & Thomas — Antiadrenergic Drugs Q8"},{"q":"A 58-year-old man complained to his physician of weakness, drowsiness, dizziness, and palpitations. He was recently diagnosed with bladder obstruction due to benign prostatic hyperplasia and had been taking a drug for 2 weeks. Which of the following drugs most likely caused the patient’s symptoms?","o":["Bethanechol","Tamsulosin","Propranolol","Flutamide","Albuterol","Phenylephrine"],"a":1,"ex":"Tamsulosin is a selective α1 antagonist used for bladder obstruction due to prostatic hyperplasia. Fatigue, sleepiness, and dizziness are common and relate to drug-induced hypotension; palpitations reflect reflex tachycardia from vasodilation. Flutamide is an androgen-receptor blocker used in prostatic disease but does not cause this symptom cluster. The other listed drugs are not used for prostatic hyperplasia.","src":"Babbini & Thomas — Antiadrenergic Drugs Q9"},{"q":"A 28-year-old woman presented to the outpatient clinic with a 5-day history of left hand and arm pain. She noted that the fingers of her left hand became cold and somewhat blue, especially when exposed to cold. Physical examination showed that the patient’s extremities had appropriate sensation. When her hands were placed in cold water, several white splotches appeared, and tingling was felt in the hands. Which of the following drugs would be appropriate to treat the patient’s disorder?","o":["Neostigmine","Propranolol","Prazosin","Clonidine","Phenylephrine"],"a":2,"ex":"The history (cold-triggered digital pallor then cyanosis in a young woman, with preserved sensation) is Raynaud disease. Local cold or anything that raises sympathetic outflow can trigger vasospasm. By blocking vascular α1 receptors, prazosin reduces vasospastic episodes. There is no rationale for neostigmine, propranolol, clonidine, or phenylephrine in this setting.","src":"Babbini & Thomas — Antiadrenergic Drugs Q10"},{"q":"A 64-year-old woman, recently diagnosed with open-angle glaucoma, started a topical therapy with timolol and apraclonidine. Which of the following was the most likely site of action of both drugs?","o":["Ciliary muscle","Uveoscleral vessels","Conjunctival vessels","Ciliary epithelium","Retinal vessels","Schlemm canal"],"a":3,"ex":"Open-angle glaucoma is treated by lowering aqueous humor volume, either by decreasing production or increasing outflow. Aqueous humor is made by the ciliary epithelium under dual control: β receptors increase production and α2 receptors decrease it. Timolol (β blockade) and apraclonidine (α2 agonism) therefore both act at the ciliary epithelium to reduce aqueous production.","src":"Babbini & Thomas — Antiadrenergic Drugs Q11"},{"q":"A 22-year-old man was admitted to the hospital for evaluation of a faint systolic murmur and an unusual electrocardiogram reading. After clinical and lab evaluation, a diagnosis of hypertrophic cardiomyopathy was made, and propranolol was prescribed. Which of the following actions most likely contributed to the therapeutic efficacy of the drug in the patient’s disease?","o":["Decreased renin secretion","Increased duration of diastole","Blockade of an abnormal pacemaker","Decreased ejection fraction","Coronary vasodilation"],"a":1,"ex":"In hypertrophic cardiomyopathy the stiff, noncompliant ventricle resists diastolic filling. β-blockers slow the heart rate, lengthening diastole and allowing more complete filling; they also reduce contractility, which increases ventricular compliance. Decreased renin, pacemaker blockade, and reduced ejection fraction can occur with propranolol but do not explain efficacy here. Propranolol causes coronary vasoconstriction (less contractility plus β2-blockade), not vasodilation.","src":"Babbini & Thomas — Antiadrenergic Drugs Q12"},{"q":"A new autonomic drug was tested in a healthy volunteer. The man was treated with saline or with the drug, under resting or exercise conditions. His heart rate was measured in both conditions (see table). To which of the following drug classes did the tested drug most likely belong?","o":["Beta adrenoceptor blockers","Cholinergic agonists","Cholinergic antagonists","Ganglionic blockers","Alpha-1 adrenoceptor blockers"],"a":0,"ex":"β-blocker effects on heart rate are much more pronounced when sympathetic tone is high. Resting heart rate barely fell (70 → 68 bpm), but the exercise-induced tachycardia was markedly blunted (150 → 80 bpm). A cholinergic agonist would slow the resting heart more (parasympathetic tone already predominates at rest). Cholinergic antagonists, ganglionic blockers, and α1 blockers tend to raise resting heart rate.","src":"Babbini & Thomas — Antiadrenergic Drugs Q13","table":{"headers":["Condition","Saline (bpm)","Drug (bpm)"],"rows":[["Resting","70","68"],["Exercise","150","80"]]}},{"q":"A 58-year-old man recently diagnosed with exertional angina started treatment with atenolol. Which of the following cardiovascular parameters was most likely decreased in this patient?","o":["End-systolic volume","Ventricular ejection time","Cardiac ejection fraction","End-diastolic volume","Venous tone"],"a":2,"ex":"Atenolol blocks β1 receptors and therefore decreases cardiac contractility. Ejection fraction (stroke volume/end-diastolic volume) is the best index of contractility and falls. End-systolic and end-diastolic volumes actually increase when contractility falls; β-blockers increase ventricular ejection time; venous tone (mainly α1-dependent) is minimally affected.","src":"Babbini & Thomas — Antiadrenergic Drugs Q14"},{"q":"A 57-year-old woman recently diagnosed with open-angle glaucoma started treatment with timolol eye drops. Which of the following sets of effects most likely occurred shortly after the administration of the drug? (+ = increased; − = decreased; 0 = negligible effect)","o":["↑ pupillary diameter; ↓ lens curvature; 0 intraocular pressure","0 pupillary diameter; 0 lens curvature; ↓ intraocular pressure","↑ pupillary diameter; 0 lens curvature; ↓ intraocular pressure","0 pupillary diameter; ↑ lens curvature; 0 intraocular pressure","↓ pupillary diameter; 0 lens curvature; ↑ intraocular pressure"],"a":1,"ex":"β-blockers decrease aqueous humor production by blocking β receptors in the ciliary epithelium, so intraocular pressure falls within about 30 minutes. They have negligible effects on pupillary diameter (M3 sphincter / α1 radial muscle) and on lens curvature (M3 ciliary muscle).","src":"Babbini & Thomas — Antiadrenergic Drugs Q15","table":{"headers":["","Pupillary diameter","Lens curvature","Intraocular pressure"],"rows":[["A","+","−","0"],["B","0","0","−"],["C","+","0","−"],["D","0","+","0"],["E","−","0","+"]]}},{"q":"Propranolol was given by intramuscular injection to several dogs during a laboratory experiment. One hour later, each dog received a different autonomic drug, and the effects of that drug were recorded. Which of the following drug-induced effects was most likely best counteracted by propranolol pretreatment?","o":["Isoproterenol-induced hyperglycemia","Nicotine-induced decrease in skin blood flow","Norepinephrine-induced reflex bradycardia","Phenylephrine-induced mydriasis","Pilocarpine-induced contraction of bronchial muscle"],"a":0,"ex":"Isoproterenol-induced hyperglycemia is largely β2-mediated gluconeogenesis and glycogenolysis, so propranolol (which blocks β2 receptors) antagonizes it. Nicotine-induced cutaneous vasoconstriction is α1-mediated; norepinephrine reflex bradycardia is M2-mediated (and propranolol itself slows the heart); phenylephrine mydriasis is α1-mediated; pilocarpine bronchoconstriction is M3-mediated (and propranolol itself can constrict bronchi).","src":"Babbini & Thomas — Antiadrenergic Drugs Q16"},{"q":"A new drug was studied in laboratory animals. Epinephrine was given either alone or after administration of the new drug X. Selected plasma values were then recorded (see table). Which of the following drugs did the new agent most resemble?","o":["Albuterol","Timolol","Atenolol","Atropine","Propranolol","Prazosin"],"a":2,"ex":"Drug X abolished epinephrine-induced renin release (β1-mediated) but did not antagonize epinephrine-induced hyperglycemia (partly β2-mediated glycogenolysis). That pattern is a selective β1 blocker such as atenolol. Timolol and propranolol are nonselective and would blunt both effects. Albuterol, atropine, and prazosin would antagonize neither.","src":"Babbini & Thomas — Antiadrenergic Drugs Q17","table":{"headers":["Parameter","Epinephrine alone","Epinephrine after drug X"],"rows":[["Renin (mU/L)","250","70"],["Blood glucose (mg/dL)","160","155"]]}},{"q":"A 44-year-old man who had been suffering from migraine for 3 months complained to his physician that his migraine attacks were effectively aborted by sumatriptan, but they were not reduced in frequency. The physician decided to start a treatment to reduce the frequency of attacks and chose propranolol as the initial agent. Which of the following pairs of adverse effects would be expected to be most likely during the first days of therapy?","o":["Postural hypotension and fainting","Palpitations and flushing","Impairment of far vision and photophobia","Insomnia and nightmares","Severe constipation and gastroesophageal reflux"],"a":3,"ex":"Propranolol is first-line for migraine prophylaxis. Lipophilic β-blockers concentrate in the brain and can cause insomnia, vivid dreams, and nightmares (up to ~5% of patients). They do not cause postural hypotension (preload and the baroreflex remain intact), palpitations/flushing, cycloplegia/mydriasis, or severe constipation/GERD; diarrhea is the more typical gut effect.","src":"Babbini & Thomas — Antiadrenergic Drugs Q18"},{"q":"A 42-year-old man came to the clinic for a follow-up visit 2 months after being diagnosed with essential hypertension. Therapy with propranolol and hydrochlorothiazide was started at the time of diagnosis. His blood pressure remained poorly controlled, and he admitted he had been taking the pills only once in a while because of a disturbing adverse effect. Which of the following was most likely the effect mentioned by the patient?","o":["Palpitations","Sexual dysfunction","Migraine headache","Tremor","Anginal pain"],"a":1,"ex":"β-blockers can cause dose-related sexual dysfunction (erectile problems, decreased libido, anorgasmia), which is more frequent when a diuretic is coadministered. Palpitations, migraine, tremor, and anginal pain are generally relieved, not caused, by β-blockers.","src":"Babbini & Thomas — Antiadrenergic Drugs Q19"},{"q":"A 47-year-old man who had been suffering from diabetes for 10 years was admitted to the hospital following a myocardial infarction. He was discharged 10 days later with a postdischarge therapy that included atenolol. The patient was instructed to monitor his blood glucose level carefully for both hyper- and hypoglycemia after the drug was initiated. Which of the following statements about atenolol best explains the reason for glucose monitoring?","o":["It can dangerously increase blood sugar levels.","It can blunt some symptoms of hypoglycemia.","It can increase insulin secretion.","It can impair lipid metabolism.","It decreases renin release."],"a":1,"ex":"Historically diabetes was a relative contraindication to β-blockade because of effects on insulin release and blunting of hypoglycemia-associated tachycardia. After MI, however, β-blockers reduce mortality ~30–35%, so they are given with careful glucose monitoring: they can mask tachycardia, an important warning sign of hypoglycemia. Selective β1 blockers such as atenolol do not meaningfully raise blood sugar via β2-blockade of insulin secretion; they decrease, not increase, insulin secretion; lipid and renin effects do not explain the monitoring advice.","src":"Babbini & Thomas — Antiadrenergic Drugs Q20"},{"q":"A 57-year-old woman was discharged from the hospital after an acute myocardial infarction. The woman had been suffering from mild seasonal asthma for 15 years. Her postdischarge therapy included atenolol, one tablet daily. Which of the following was the most likely rationale behind prescribing atenolol to this patient?","o":["It can counteract pulmonary vasoconstriction.","It blocks β1 adrenoceptors only.","It has antiinflammatory effects in asthmatics.","It can block pulmonary α adrenoceptors.","It has an intermediate half-life (about 6 hours)."],"a":1,"ex":"β-blockers are usually avoided in asthma because β2 blockade can constrict bronchi, but they are first-line after MI. With only mild intermittent asthma, a cardioselective agent such as atenolol is a rational choice: at therapeutic doses β2 blockade is negligible (selectivity may be lost at higher doses). The other listed properties are either untrue or not the reason for choosing a selective agent in an asthmatic.","src":"Babbini & Thomas — Antiadrenergic Drugs Q21"},{"q":"A 47-year-old man was diagnosed with benign prostatic hyperplasia. Surgical ablation of the prostate was contraindicated, and a drug suitable for the treatment of the patient’s impaired bladder emptying was prescribed. Which of the following molecular actions most likely contributed to the therapeutic effect of that drug in the patient’s disease?","o":["Decreased blood flow in prostatic vessels","Relaxation of prostate capsule","Relaxation of the detrusor muscle","Decreased systemic blood pressure","Decreased diuresis"],"a":1,"ex":"A selective α1 antagonist (prazosin, tamsulosin, etc.) is first-line for impaired bladder emptying in BPH. Blocking α1 receptors relaxes the prostate capsule and the internal urethral sphincter, improving urine flow. Vascular α1 blockade would increase, not decrease, prostatic blood flow. The detrusor is mainly parasympathetic. Any fall in blood pressure is not the therapeutic mechanism, and α1 antagonists have negligible effects on diuresis.","src":"Babbini & Thomas — Antiadrenergic Drugs Q22"},{"q":"A 25-year-old man complained to his physician of a fine, slow tremor of the hands elicited by performing skilled acts. The patient noticed that the tremor was getting worse, especially when he felt tense and anxious. Medical history showed that the patient’s father had a similar symptom. Neurologic examination of the patient was unremarkable. A preliminary diagnosis was made, and a therapy was prescribed. Which of the following drugs would be appropriate for this patient?","o":["Prazosin","Clonidine","Albuterol","Physostigmine","Propranolol"],"a":4,"ex":"The picture (action tremor of skilled movements, worse with anxiety, autosomal-dominant family history, normal neurologic exam) is benign essential tremor. Nonselective β-blockers such as propranolol are effective; the mechanism is uncertain but may involve blocking β2-mediated Ca2+ sequestration and enhanced muscle-spindle discharge. The other listed drugs are not useful in essential tremor.","src":"Babbini & Thomas — Antiadrenergic Drugs Q23"},{"q":"A 31-year-old man was brought to the emergency department after the police found him shouting and acting irrationally in the street. The man admitted that for the past few hours he had been using amphetamines that he had obtained from a new dealer. He was agitated and anxious and exhibited psychotic behavior. Vital signs were blood pressure 230/150 mm Hg, heart rate 160 bpm, respirations 20/min. An emergency therapy was started, and the patient was treated with intravenous diazepam, but 30 minutes later his blood pressure was still 210/130. Which of the following pairs of drugs would be appropriate to include in the patient’s treatment at this time?","o":["Phentolamine followed by propranolol","Phenoxybenzamine followed by esmolol","Metyrosine followed by neostigmine","Bethanechol followed by phenylephrine","Clonidine followed by albuterol"],"a":0,"ex":"Amphetamine poisoning is managed first with benzodiazepines. If sedation fails to control blood pressure, both α and β blockade are needed because amphetamines release norepinephrine onto both receptor types. A parenteral α-blocker (phentolamine) or a vasodilator must be given first; a β-blocker is then added to control tachyarrhythmias. Phenoxybenzamine is irreversible, very long-acting, and not available parenterally, so it is unsuitable in an emergency. The other pairs cannot antagonize norepinephrine’s effects.","src":"Babbini & Thomas — Antiadrenergic Drugs Q24"},{"q":"A 57-year-old alcoholic man with liver cirrhosis was admitted to the intensive care unit with a 2-week history of intermittent melena. Esophagoscopy revealed three chains of large varices in the lower esophagus with signs of recent bleeding. An appropriate treatment was performed that included a drug aimed at reducing the portal pressure. Which of the following drugs was most likely given?","o":["Albuterol","Propranolol","Methyldopa","Clonidine","Prazosin"],"a":1,"ex":"In cirrhosis, arteriovenous anastomoses transmit hepatic arterial pressure into the portal vein, producing portal hypertension and esophageal varices. Blocking hepatic vascular β2 receptors constricts those arterial vessels and lowers the pressure transmitted into the portal vein. Albuterol would do the opposite. Methyldopa, clonidine, and prazosin lower systemic pressure but have unpredictable effects on hepatic arterial perfusion pressure.","src":"Babbini & Thomas — Antiadrenergic Drugs Q25"},{"q":"A 51-year-old woman presented to the clinic with a 1-month history of palpitations, insomnia, nervousness, fatigue, diarrhea, and heat intolerance. The physical examination revealed hyperreflexia, lid lag, and mild tremor. Vital signs were blood pressure 160/60, heart rate 95 bpm. Which of the following drugs was most likely appropriately included in the therapeutic management of this patient?","o":["Albuterol","Propranolol","Labetalol","Prazosin","Phenoxybenzamine"],"a":1,"ex":"The picture is hyperthyroidism (wide pulse pressure, lid lag, tremor, heat intolerance). Besides antithyroid drugs/radioiodine, β-blockers rapidly relieve nervousness, palpitations, heat intolerance, tremor, and hypertension driven by sympathetic overactivity; propranolol is the drug of choice. Albuterol, labetalol, prazosin, and phenoxybenzamine can further lower the already-low diastolic pressure and are contraindicated.","src":"Babbini & Thomas — Antiadrenergic Drugs Q26"},{"q":"A 32-year-old man complained to his physician that he felt anxious and tense. History revealed that he was a musician and had to give an important piano concert that evening. The physician told the patient that he was suffering from performance anxiety and prescribed a drug to be taken 2 hours before the performance. Which of the following drugs was most likely prescribed?","o":["Diazepam","Propranolol","Fluoxetine","Venlafaxine","Buspirone"],"a":1,"ex":"β-blockers treat nongeneralized social (performance) phobia by blocking norepinephrine’s peripheral effects (palpitation, tremor, blushing); even agents that do not cross the blood–brain barrier work. They are often used by musicians. Benzodiazepines can impair performance; SSRIs/SNRIs and buspirone take days to weeks to work and are not suitable for a same-day concert.","src":"Babbini & Thomas — Antiadrenergic Drugs Q27"},{"q":"A 65-year-old man, recently diagnosed with prostatic hyperplasia, started treatment with prazosin, one tablet daily. Which of the following adverse effects would be most likely to occur during the first days of therapy?","o":["Mydriasis","Impaired micturition","Pale and cold skin","Bronchoconstriction","Postural hypotension"],"a":4,"ex":"Postural hypotension is common with α1 antagonists such as prazosin, especially in the first days of therapy, because α1 blockade prevents the vasoconstriction of the baroreceptor reflex on standing. α1 blockade in the iris radial muscle causes miosis, not mydriasis; micturition is facilitated; skin vessels dilate (red/warm, not pale/cold); bronchoconstriction is a β2-blockade effect.","src":"Babbini & Thomas — Antiadrenergic Drugs Q28"},{"q":"A 44-year-old woman suffering from open-angle glaucoma had been receiving topical timolol for 3 months. The disease was well controlled, and the treatment stopped the progression of optic nerve damage. Which of the following molecular actions most likely mediated the therapeutic efficacy of the drug in the patient’s disease?","o":["Opening of ligand-gated K+ channels","Increased synthesis of diacylglycerol (DAG)","Decreased synthesis of cyclic guanosine monophosphate (cGMP)","Decreased activity of adenylate cyclase","Increased synthesis of tyrosine kinase","Opening of ligand-gated Na+ channels"],"a":3,"ex":"Timolol is a nonselective β-blocker. All β receptors raise cAMP via adenylate cyclase; blocking them therefore decreases adenylate cyclase activity (and aqueous humor production by the ciliary epithelium).","src":"Babbini & Thomas — Antiadrenergic Drugs Q29"},{"q":"A 33-year-old man recently diagnosed with pheochromocytoma was scheduled for surgery. The week before the operation he received a treatment with a drug that acts by decreasing catecholamine biosynthesis. Which of the following drugs was most likely administered?","o":["Phenoxybenzamine","Propranolol","Metyrosine","Dexamethasone","Levothyroxine"],"a":2,"ex":"Metyrosine inhibits tyrosine hydroxylase, the rate-limiting enzyme that hydroxylates tyrosine to DOPA, and can cut catecholamine stores by up to ~70%. Its only therapeutic use is short-term preoperative management of pheochromocytoma, or long-term treatment of inoperable malignant pheochromocytoma.","src":"Babbini & Thomas — Antiadrenergic Drugs Q30"}],

b_chol: [{"q":"Inhibition of cholinesterases by this drug is very short (2–10 minutes).","o":["Acetylcholine","Bethanechol","Carbachol","Donepezil","Edrophonium","Muscarine","Neostigmine","Parathion","Pilocarpine","Pralidoxime","Physostigmine"],"a":4,"ex":"Edrophonium is a reversible, noncovalent acetylcholinesterase inhibitor whose effect lasts only 2–10 minutes, which is why it was used in the Tensilon test.","src":"Babbini & Thomas — Cholinergic Drugs Q1"},{"q":"This drug can inhibit cholinesterases equally well in the periphery as in the central nervous system.","o":["Acetylcholine","Bethanechol","Carbachol","Donepezil","Edrophonium","Muscarine","Neostigmine","Parathion","Pilocarpine","Pralidoxime","Physostigmine"],"a":10,"ex":"Physostigmine is a tertiary amine and therefore crosses the blood–brain barrier, inhibiting cholinesterase in both the periphery and the CNS. Quaternary agents such as neostigmine and edrophonium do not enter the brain.","src":"Babbini & Thomas — Cholinergic Drugs Q2"},{"q":"This compound can be absorbed effectively through the intact skin.","o":["Acetylcholine","Bethanechol","Carbachol","Donepezil","Edrophonium","Muscarine","Neostigmine","Parathion","Pilocarpine","Pralidoxime","Physostigmine"],"a":7,"ex":"Parathion is a highly lipid-soluble organophosphate insecticide that is absorbed effectively through intact skin (as well as by inhalation and ingestion).","src":"Babbini & Thomas — Cholinergic Drugs Q3"},{"q":"This drug is able to regenerate cholinesterases blocked by organophosphates.","o":["Acetylcholine","Bethanechol","Carbachol","Donepezil","Edrophonium","Muscarine","Neostigmine","Parathion","Pilocarpine","Pralidoxime","Physostigmine"],"a":9,"ex":"Pralidoxime (2-PAM) is a cholinesterase regenerator: it removes the phosphate group from acetylcholinesterase before the bond “ages,” restoring enzyme activity after organophosphate poisoning.","src":"Babbini & Thomas — Cholinergic Drugs Q4"},{"q":"This drug can inhibit cholinesterases and directly activate Nm cholinergic receptors.","o":["Acetylcholine","Bethanechol","Carbachol","Donepezil","Edrophonium","Muscarine","Neostigmine","Parathion","Pilocarpine","Pralidoxime","Physostigmine"],"a":6,"ex":"Neostigmine both inhibits acetylcholinesterase and directly stimulates nicotinic muscular (Nm) receptors at the motor end-plate, contributing to its usefulness in myasthenia gravis and in reversing nondepolarizing neuromuscular blockade.","src":"Babbini & Thomas — Cholinergic Drugs Q5"},{"q":"A new autonomic drug was given intravenously to dogs during a laboratory experiment. It was found that the drug was able to increase cholinergic transmission in both the peripheral and central nervous systems. Which of the following drugs does the new agent most resemble?","o":["Acetylcholine","Carbachol","Bethanechol","Neostigmine","Physostigmine"],"a":4,"ex":"To increase central cholinergic transmission the drug must reach brain acetylcholine receptors. Physostigmine, a tertiary anticholinesterase, crosses the blood–brain barrier; the resulting rise in CNS acetylcholine accounts for increased central transmission. Acetylcholine, carbachol, bethanechol, and neostigmine cross the blood–brain barrier poorly.","src":"Babbini & Thomas — Cholinergic Drugs Q6"},{"q":"A 62-year-old man suffering from open-angle glaucoma underwent ocular surgery for canaloplasty. Before the operation, the ophthalmologist instilled a few drops of carbachol in the conjunctival sac. Which of the following anatomical structures represents the primary site of action of the drug in this patient?","o":["Ganglionic neurons","Ciliary muscle","Lens","Radial muscle of the iris","Brainstem"],"a":1,"ex":"Topical carbachol lowers intraocular pressure by increasing aqueous outflow. Although it can activate muscarinic and Nn receptors, drug placed in the conjunctival sac reaches the ciliary muscle but not the ciliary ganglion (posterior orbit). M3 activation contracts the ciliary muscle, opening trabecular meshwork. The lens and the radial iris muscle lack Nn and M3 receptors mediating this effect.","src":"Babbini & Thomas — Cholinergic Drugs Q7"},{"q":"A 51-year-old diabetic woman presented to the emergency room with severe ocular pain and redness, decreased vision, colored halos, and nausea and vomiting. Ophthalmoscopy revealed anterior chamber inflammation, and tonometry measured an intraocular pressure of 48 mm Hg in the right eye (normal 10–20 mm Hg). A diagnosis of an acute glaucoma attack was made, and two drugs were instilled in the conjunctival sac. Another drug was given by the same route 15 minutes later. Which of the following three drugs were most likely administered?","o":["Timolol, apraclonidine, and pilocarpine","Homatropine, carbachol, and timolol","Scopolamine, dorzolamide, and phenylephrine","Homatropine, carbachol, and dorzolamide","Prazosin, physostigmine, and mannitol"],"a":0,"ex":"An acute glaucoma attack (usually acute angle-closure) is an emergency. Aqueous production is cut immediately with a topical β-blocker (timolol) plus an α2 agonist (apraclonidine); pilocarpine is then given to increase outflow (cholinergics alone are generally ineffective when IOP > 40 mm Hg). Homatropine and scopolamine are contraindicated because mydriasis can further close the angle. Prazosin is ineffective; mannitol is given intravenously, not topically, and only if first-line treatment fails.","src":"Babbini & Thomas — Cholinergic Drugs Q8"},{"q":"A 62-year-old woman had no bowel movements 4 days after surgery to remove a colon cancer. A diagnosis of adynamic ileus was made, and an intramuscular injection of neostigmine was given. The activation of which of the following pairs of receptors most likely mediated the therapeutic effect of the drug in the patient’s disorder?","o":["Nm and M2 cholinergic","Nn and M3 cholinergic","β2 adrenergic and M3 cholinergic","β2 adrenergic and Nn cholinergic","Nn cholinergic and α1 adrenergic","Nm cholinergic and α1 adrenergic"],"a":1,"ex":"Neostigmine, a reversible cholinesterase inhibitor, is sometimes used to restore smooth-muscle activity in adynamic ileus (or bladder atony). Raised acetylcholine activates nicotinic neuronal (Nn) receptors on parasympathetic ganglia and muscarinic M3 receptors on gut smooth muscle, increasing motility.","src":"Babbini & Thomas — Cholinergic Drugs Q9"},{"q":"A 74-year-old man complained to his physician of memory impairment that had worsened over the past 2 months. He also reported that he had increasing difficulty in recognizing familiar objects and in planning everyday activities such as shopping. Physical examination revealed no neurologic deficits, but the man performed very poorly in the Folstein Mini-Mental Status Exam. Donepezil was prescribed. Which of the following molecular mechanisms most likely mediated the therapeutic effect of the drug in the patient’s disease?","o":["Inhibition of norepinephrine reuptake","Stimulation of norepinephrine release","Blockade of nicotinic neuronal receptors","Inhibition of cholinesterase","Blockade of muscarinic M1 receptors","Inhibition of choline acetyltransferase"],"a":3,"ex":"The cognitive picture and Mini-Mental Status Exam indicate early Alzheimer disease. Brain acetylcholine is reduced in AD; cholinesterase inhibitors modestly slow cognitive decline. Donepezil selectively inhibits CNS cholinesterase with less effect on peripheral enzyme.","src":"Babbini & Thomas — Cholinergic Drugs Q10"},{"q":"A 71-year-old man suffering from myasthenia gravis was admitted to the hospital for evaluation. His therapy included neostigmine, three tablets daily. It was found that the patient had a slow heart rate (46 bpm), which the physician thought was related to neostigmine therapy. Which of the following molecular mechanisms most likely mediated this adverse effect of the drug?","o":["Opening of ligand-gated K+ channels","Opening of voltage-gated Na+ channels","Increased synthesis of inositol triphosphate (IP3) and diacylglycerol (DAG)","Opening of ligand-gated Ca2+ channels","Increased synthesis of adenylyl cyclase"],"a":0,"ex":"By inhibiting cholinesterase, neostigmine increases acetylcholine at cardiac synapses. Activation of M2 receptors (abundant in SA node, atrium, and AV node) opens acetylcholine-sensitive K+ channels, hyperpolarizing SA and AV fibers and producing negative chronotropic and dromotropic effects (bradycardia).","src":"Babbini & Thomas — Cholinergic Drugs Q11"},{"q":"A 67-year-old woman suffering from glaucoma underwent trabeculectomy, a surgical procedure to remove part of the trabecular meshwork of the eye. Before the operation, the ophthalmologist instilled a few drops of pilocarpine in the conjunctival sac. Which of the following sets of effects most likely occurred shortly after the administration of the drug? (+ = increased; − = decreased; 0 = negligible effect)","o":["0 pupillary diameter; 0 lens curvature; ↓ ocular pressure","↓ pupillary diameter; ↑ lens curvature; ↓ ocular pressure","↑ pupillary diameter; 0 lens curvature; 0 ocular pressure","↑ pupillary diameter; 0 lens curvature; ↓ ocular pressure","↑ pupillary diameter; ↓ lens curvature; ↑ ocular pressure"],"a":1,"ex":"Pilocarpine is a muscarinic agonist. M3 activation contracts the iris sphincter (miosis, ↓ pupillary diameter) and the ciliary muscle (↑ lens curvature). Ciliary contraction opens trabecular meshwork pores, facilitating aqueous outflow into Schlemm’s canal and lowering ocular pressure.","src":"Babbini & Thomas — Cholinergic Drugs Q12","table":{"headers":["","Pupillary diameter","Lens curvature","Ocular pressure"],"rows":[["A","0","0","−"],["B","−","+","−"],["C","+","0","0"],["D","+","0","−"],["E","+","−","+"]]}},{"q":"A 79-year-old female resident of a nursing home was recently diagnosed with urinary overflow incontinence due to an atonic bladder, and a treatment with bethanechol was prescribed. Which of the following actions most likely mediated the therapeutic effectiveness of the drug in the patient’s disorder?","o":["Increased bladder sphincter tone","Decreased ureteral peristalsis","Decreased compliance of the bladder","Decreased diuresis","Increased tone of the bladder trigone"],"a":2,"ex":"Overflow incontinence occurs when the weight of urine in a distended bladder overcomes outlet resistance; here it is due to an atonic bladder. Bethanechol, an M3-selective cholinergic agonist, contracts the detrusor so that bladder distensibility (compliance) falls and voiding improves. M3 activation actually decreases sphincter/trigone tone and increases ureteral peristalsis; bethanechol does not affect renal diuresis.","src":"Babbini & Thomas — Cholinergic Drugs Q13"},{"q":"A 58-year-old woman with a long history of depression was brought to the emergency department with vomiting, urinary incontinence, profuse salivation, cold sweat, rapid and irregular pulse, tachypnea, and mental confusion. She admitted attempting suicide by ingesting several tablets found in her husband’s bureau drawer. Soon after admission, the woman experienced a tonic-clonic seizure. Which of the following drugs most likely caused the patient’s poisoning?","o":["Clonidine","Scopolamine","Nicotine","Bethanechol","Neostigmine"],"a":2,"ex":"The mixed parasympathetic (vomiting, incontinence, salivation), sympathetic (cold sweat, rapid irregular pulse from adrenal epinephrine via Nn receptors), and central (confusion, seizure) picture is nicotine poisoning, here likely from smoking-cessation lozenges. Scopolamine would cause the opposite (antimuscarinic) picture. Bethanechol would produce only muscarinic effects. Neostigmine can mimic many nicotinic/muscarinic signs but barely enters the CNS, so seizures would be minimal. Clonidine does not cause this cluster.","src":"Babbini & Thomas — Cholinergic Drugs Q14"},{"q":"A 65-year-old man suffering from open-angle glaucoma had been receiving several drugs over the past 6 months, but the control of intraocular pressure proved inadequate. The ophthalmologist decided to add a drug and prescribed echothiophate. Which of the following actions most likely mediated the therapeutic effect of echothiophate in the patient’s disease?","o":["Contraction of the radial muscle of the iris","Contraction of the sphincter of the iris","Decreased production of aqueous humor","Dilation of the episcleral venous plexus","Dilation of retinal vessels","Contraction of the ciliary muscle"],"a":5,"ex":"When standard glaucoma therapy fails, a topical irreversible cholinesterase inhibitor such as echothiophate may be added. Locally increased acetylcholine activates M3 receptors on the ciliary muscle; contraction opens trabecular meshwork and Schlemm’s canal, increasing aqueous outflow and lowering IOP. Iris-sphincter contraction (miosis) has negligible effect on IOP; acetylcholine does not contract the radial muscle, decrease aqueous production, or dilate episcleral/retinal vessels.","src":"Babbini & Thomas — Cholinergic Drugs Q15"},{"q":"A 49-year-old farmer came to the emergency department complaining of blurred vision, nausea, and painful muscle contractions in his legs. He said the symptoms started soon after coming in from his soybean field. The attending physician appropriately administered pralidoxime intravenously soon after the man arrived. An agent from which of the following drug classes most likely caused the patient’s symptoms?","o":["Adrenergic antagonists","Carbamates","Cholinergic antagonists","Organophosphates","Alcohols"],"a":3,"ex":"Field exposure plus cholinergic/nicotinic symptoms indicate insecticide poisoning. Pralidoxime regenerates organophosphate-phosphorylated acetylcholinesterase and is useless (even dangerous) in carbamate poisoning; that the physician gave it means the culprit was an organophosphate.","src":"Babbini & Thomas — Cholinergic Drugs Q16"},{"q":"A 41-year-old man was brought to the emergency department because of severe vomiting and diarrhea that started about 1 hour after a meal. The patient showed profuse salivation, lacrimation, and wheezing. His skin was moist, and his pupils were miotic. Skeletal muscle movements were normal. Blood pressure was 80/50 mm Hg, pulse 46 bpm. Poisoning of this patient was most likely due to which of the following agents?","o":["Muscarine-containing mushrooms","Nicotine-containing insecticide","Organophosphate-containing insecticide","Atropine-containing mushrooms","Carbamate-containing insecticide"],"a":0,"ex":"Onset within an hour of a meal plus a purely muscarinic picture (SLUDGE, miosis, bradycardia, hypotension) with normal skeletal muscle is muscarine poisoning (Inocybe/Clitocybe mushrooms). Nicotine would add early hypertension/tachycardia then collapse plus depolarizing muscle paralysis. Organophosphates and carbamates add nicotinic neuromuscular effects. Atropine-containing mushrooms produce the opposite, antimuscarinic picture.","src":"Babbini & Thomas — Cholinergic Drugs Q17"},{"q":"A 61-year-old man complained to his physician of brow ache, difficulty with far vision, and problems seeing in dim light. The man had a long history of open-angle glaucoma. One month earlier, he had changed his ophthalmic medication. Which of the following was most likely his new drug?","o":["Pilocarpine","Timolol","Apraclonidine","Epinephrine","Phenylephrine","Neostigmine"],"a":0,"ex":"Pilocarpine activates M3 receptors on the ciliary muscle (cyclospasm → increased lens curvature → eye accommodated for near vision, so far vision is difficult) and on the iris sphincter (miosis → impaired vision in dim light); ciliary spasm also causes brow ache. Timolol and apraclonidine have negligible effects on accommodation. Epinephrine/phenylephrine cause mydriasis, which would help, not impair, dim-light vision. Neostigmine could mimic pilocarpine but is not used for glaucoma.","src":"Babbini & Thomas — Cholinergic Drugs Q18"},{"q":"A 64-year-old man, recently diagnosed with myasthenia gravis, started treatment with neostigmine. Which of the following adverse effects would be most likely in this patient?","o":["Mydriasis","Constipation","Overflow incontinence","Sialorrhea","Near vision impairment"],"a":3,"ex":"Neostigmine raises acetylcholine at all cholinergic synapses and therefore produces muscarinic side effects, especially gastrointestinal (including sialorrhea). It causes miosis (not mydriasis), increased gut motility (not constipation), detrusor contraction (not overflow incontinence), and cyclospasm that favors near, not far, vision.","src":"Babbini & Thomas — Cholinergic Drugs Q19"},{"q":"A 63-year-old woman underwent a total hysterectomy to remove a uterine leiomyoma. General anesthesia was induced with thiopental sodium, maintained with halothane and nitrous oxide, and supplemented with tubocurarine. Which of the following drugs did the patient most likely receive after the operation to reverse the skeletal muscle paralysis?","o":["Physostigmine","Edrophonium","Neostigmine","Bethanechol","Pralidoxime"],"a":2,"ex":"Reversible cholinesterase inhibitors reverse nondepolarizing (Nm-competitive) block such as tubocurarine by raising end-plate acetylcholine. Neostigmine is preferred because it does not enter the brain. Physostigmine crosses the blood–brain barrier; edrophonium’s half-life is only 1–10 minutes; bethanechol and pralidoxime do not act at Nm receptors.","src":"Babbini & Thomas — Cholinergic Drugs Q20"},{"q":"A 74-year-old man with a long history of type 2 diabetes complained to his physician of difficult urination. Further examination led to the diagnosis of a disorder, and treatment with bethanechol improved the symptoms. Which of the following was most likely the patient’s disorder?","o":["Prostatic hyperplasia","Impaired diuresis","Detrusor hyperreflexia","Neurogenic atony of the bladder","Urinary tract infection"],"a":3,"ex":"Improvement with bethanechol implies overflow incontinence from an acontractile bladder. Neurogenic atony is common in diabetic neuropathy; M3 activation
